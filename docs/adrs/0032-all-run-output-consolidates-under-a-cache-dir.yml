id: ADR-0032
slug: all-run-output-consolidates-under-a-cache-dir
plan_id: null
title: All run output consolidates under `.xharness_eval_cache/`, and the report is one combine step
description: every writer owns a unique path and one combine step aggregates, as pytest-cov does
status: accepted
accepted_on: '2026-08-27'
last_changed_on: '2026-08-27'
group: storage
tags:
- storage
lens: |-
  Give every parallel writer a path of its own, and aggregate in one combine step.
  Run output belongs in a git-ignored cache root, never in the source tree it measures.
provenance: |-
  The shared `history.jsonl` was the one file two parallel writers could contend on, which is exactly the problem pytest-cov solves with suffix files.
enforced_in:
- src/pytest_xharness_eval/model/layout.py
