id: ADR-0018
slug: fixtures-directory-and-metrics-history
title: Fixtures live under evals/fixtures/, and every live cell appends to a metrics history
status: accepted
status_note: |-
  accepted, 2026-08-21; revised the same day: `history.jsonl` lives under `captured/` and is not version-controlled. Refines [0004](0004-workspace-is-a-plain-copy.md)
  and [0016](0016-results-travel-on-the-test-report.md).
accepted_on: '2026-08-21'
last_changed_on: '2026-08-21'
