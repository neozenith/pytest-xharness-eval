id: ADR-0030
slug: price-rows-live-in-the-pytest-config
plan_id: null
title: Project price rows live in the pytest config, not in a prices.toml beside it
description: the second config file has to argue harder than the first, and prices state the published unit
status: accepted
accepted_on: '2026-08-24'
last_changed_on: '2026-08-24'
group: pricing
tags:
- pricing
- storage
lens: |-
  The second file a tool asks a project to maintain should have to argue for itself harder than the first.
  State prices in the unit the price tag uses.
provenance: |-
  0026 had already moved skill-ignore rules out of a dotfile on the same grounds, and price rows were the same shape left over.
  There was a unit trap inside: rows were USD per token, while every provider publishes USD per million tokens.
enforced_in:
- src/pytest_xharness_eval/derive/pricing.py
- src/pytest_xharness_eval/plugin/options.py (validated at configure time)
- README.md (the ini key tables)
