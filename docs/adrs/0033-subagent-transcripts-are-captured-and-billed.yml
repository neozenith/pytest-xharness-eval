lens: |-
  Every thread the agent spawned is part of the run.
  Capture its transcript and bill its tokens, or the verdict rests on a fraction of what actually happened.
provenance: |-
  A discovery session's real bill was ~1.5-2x what the report said, because the tokens the spawned threads spent were invisible to the ledger.
