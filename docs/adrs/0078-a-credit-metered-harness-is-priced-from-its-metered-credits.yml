body:
  context: |-
      Kiro CLI bills a subscription in credits, not tokens.
      Its V3 engine writes `$KIRO_HOME/sessions/<workspace>/<session>/messages.jsonl`, where `<workspace>` is the first 16 hex digits of the SHA-256 of the workspace path.
      Each prompt turn closes with a `usage_summary` record carrying `promptTurnSummaries[].usage` in the unit `credit`, the turn's `requestIds` and its elapsed time.
      No record carries a provider token count.
      Kiro sends its per-request token counts to telemetry only, and its profiling opt-in estimates tokens from characters.
      The server applies each model's credit multiplier before it reports a turn's credits, and `kiro-cli chat --list-models` publishes that multiplier.
      Kiro sells add-on credits at a published USD price per credit.
      Every price row so far states USD per million tokens, and `check_run_is_real` fails a run that billed zero tokens.
      A Kiro run would therefore fail as empty, or be priced as zero, which ADR 0007 forbids.
  decision: |-
      `Usage` gains `credits`: the metered credits a call billed, zero for a token-metered harness.
      A price row may state `credit`, in USD per credit, instead of the per-million-token tiers.
      A row states token tiers, a credit rate, or both; it never states neither.
      A run's credits price at its row's credit rate, and its tokens at its row's token tiers.
      Usage in a unit the row does not price stops pricing with a `PricingError`, and never prices as zero.
      `check_run_is_real` accepts a run that billed tokens or metered credits, and still fails one that did neither.
      An adapter records only the unit its log carries: a Kiro adapter writes credits and leaves every token tier zero.
      It never derives tokens from characters, context percentages or credits.
      Where a dialect meters per turn rather than per request, the adapter folds one `Call` per metered turn.
      It reports the run's request count in its reported usage, and never divides a turn's credits across its requests.
      A credit-only row states no output rate, so the output-rate limit of ADR 0058 cannot judge it.
      A credit-metered harness's models therefore stay out of the plugin-default matrix.
      They run only when a case or the project names them.
  consequences: |-
      Kiro can be added as a harness through the existing class and registry, priced from a dated record at the published per-credit rate.
      Token-derived metrics (tokens per second, cache share, context tokens) are absent for a credit-metered run rather than estimated.
      The report shows credits and cost for such a run, and leaves its token views empty.
      A per-credit rate depends on the plan.
      The bundled record states the published add-on rate.
      A project on another plan overrides it with an `xharness_prices` line.
      A future Kiro release that persists token counts makes token tiers available without revisiting this decision, because a row may state both.
