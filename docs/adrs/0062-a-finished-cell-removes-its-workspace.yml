id: ADR-0062
slug: a-finished-cell-removes-its-workspace
title: A finished cell removes its workspace, and a project can keep them for inspection
status: accepted
status_note: |-
  accepted, 2026-10-07.
  Refines [0004](0004-workspace-is-a-plain-copy.md) (a workspace is a plain copy of the fixture tree) and [0032](0032-all-run-output-consolidates-under-a-cache-dir.md) (all run output consolidates under a cache dir) with when a workspace is removed.
accepted_on: '2026-10-07'
last_changed_on: '2026-10-07'
group: storage
tags:
