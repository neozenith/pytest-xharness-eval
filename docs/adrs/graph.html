hed there"}}, {"data": {"id": "ADR-0045-extends-ADR-0012", "source": "ADR-0045", "target": "ADR-0012", "label": "extends", "relation": "extends", "note": "the record's status line says \"delivers\"; the \"primitives pending\""}}, {"data": {"id": "ADR-0045-extends-ADR-0013", "source": "ADR-0045", "target": "ADR-0013", "label": "extends", "relation": "extends", "note": "the record's status line says \"delivers\"; the \"helper pending\""}}, {"data": {"id": "ADR-0045-extends-ADR-0039", "source": "ADR-0045", "target": "ADR-0039", "label": "extends", "relation": "extends", "note": "the record's status line says \"refines\"; with a sixth layer"}}, {"data": {"id": "ADR-0046-extends-ADR-0012", "source": "ADR-0046", "target": "ADR-0012", "label": "extends", "relation": "extends", "note": "the record's status line says \"refines\""}}, {"data": {"id": "ADR-0046-extends-ADR-0018", "source": "ADR-0046", "target": "ADR-0018", "label": "extends", "relation": "extends", "note": "the record's status line says \"refines\""}}, {"data": {"id": "ADR-0046-extends-ADR-0045", "source": "ADR-0046", "target": "ADR-0045", "label": "extends", "relation": "extends", "note": "the record's status line says \"refines\""}}, {"data": {"id": "ADR-0047-extends-ADR-0032", "source": "ADR-0047", "target": "ADR-0032", "label": "extends", "relation": "extends", "note": "the record's status line says \"refines\"; generated output has one owner"}}, {"data": {"id": "ADR-0047-superseded_by-ADR-0048", "source": "ADR-0047", "target": "ADR-0048", "label": "superseded by", "relation": "superseded_by", "note": "the verbatim `body` and the loosened optional fields are replaced by the strict record; the authored-YAML arrangement stands"}}, {"data": {"id": "ADR-0048-supersedes-ADR-0047", "source": "ADR-0048", "target": "ADR-0047", "label": "supersedes", "relation": "supersedes", "note": "replaces the verbatim `body` and the four loosened optional fields; the authored-YAML arrangement and the relation vocabulary stand"} <script id="record-data" type="application/json">{"ADR-0001": {"file": "0001-ship-as-a-pytest-plugin.md", "title": "Ship as a pytest plugin with per-skill opt-in evals", "status": "accepted", "description": "pytest already owns discovery, selection and reporting, so the harness is a plugin", "markdown": "> **Lens**: When a capability already lives in pytest, reuse it; add a plugin option only when pytest has no equivalent.\n\n## Relates to\n\n- Superseded by [ADR-0014](0014-register-through-the-pytest11-entry-point.md) (the in-repository package location named in the Decision is superseded; the choice of a pytest plugin over a standalone CLI stands)\n\n## Problem\n\n### Symptom\n\nThe brief asked for a lightweight, portable harness that runs both agent CLIs headlessly, across a model matrix, with fixtures, goldens, and custom verifiers.\n\n### Pain point\n\nA standalone CLI would re-implement discovery, selection, and reporting that pytest already provides.\n\n## Decision\n\n### The lens\n\n- **Given**: The surrounding toolchain and test conventions were Python-first, with `uv` already the package manager in use.\n- **We prefer**: A custom pytest plugin, over a standalone argparse CLI, TypeScript with bun, or Go.\n  The CLI would have been a second surface to keep in step.\n  Neither TypeScript nor Go had test conventions to lean on for a pytest-shaped matrix.\n- **Because**: pytest already provides the discovery, selection and reporting a standalone CLI would have had to re-implement.\n- **Unless**: pytest has no equivalent for the capability, in which case a plugin option is added for it.\n\n### In practice\n\n- The harness is a custom pytest plugin, first housed as a package inside the repository whose skills it evaluated.\n- It supplies shared fixtures and extends collection to find eval structures under `skills/<skill>/evals/`.\n  A skill opts in by adopting that layout and nothing else.\n\n## Consequences\n\n### Pros\n\n- Bare pytest mechanics work unmodified: path arguments target one skill, `-k` and node ids select cells, the terminal report is pytest's.\n\n### Cons\n\n- The harness inherits pytest's collection rules, which forced ADR 0008 and ADR 0009.\n"}, "ADR-0002": {"file": "0002-every-cell-invokes-the-real-cli.md", "title": "Every eval cell always invokes the real CLI", "status": "accepted", "description": "no replay tier and no --live flag; a cell that did not spawn an agent has measured nothing", "markdown": "> **Lens**: Never let a cell report a verdict without a real session log behind it.\n> If a run cannot be real, fail the cell; do not fake it.\n\n## Relates to\n\n- See also [ADR-0014](0014-register-through-the-pytest11-entry-point.md) (inside this package the boundary is the `pragma: no cover` on every function that spawns a CLI)\n\n## Problem\n\n### Symptom\n\nTwo project rules appeared to conflict: tests never mock, and paid agent runs are never a dependency of the free `ci` target.\n\n### Pain point\n\nA record-and-replay tier was the first idea for reconciling them, which would have let a cell report a verdict with no real agent behind it.\n\n## Decision\n\n### The lens\n\n- **Given**: A cell's only worthwhile signal is what a real agent CLI actually did.\n- **We prefer**: Always spawning the real `claude` or `codex` process and always paying for it.\n  That is preferred over a replay layer, a recorded-fixture tier, or a `--live` flag.\n- **Because**: The rules reconcile by scoping rather than by recording: unit tests are free and mock-free, evals are paid and mock-free.\n- **Unless**: never\n\n### In practice\n\n- There is no replay layer, no recorded-fixture tier, and no `--live` flag.\n  A cell always runs the real `claude` or `codex` process and always costs money.\n- The eval suite is a declared exception to the `ci` rule, recorded as a carve-out in the consuming project's rules.\n  The free `ci` target covers only `test_*.py` unit tests.\n\n## Consequences\n\n### Pros\n\n- The only signal the harness produces is real agent behaviour; a cell that did not invoke an agent has measured nothing.\n- The rules are reconciled by scoping, not by recording: unit tests are free and mock-free, evals are paid and mock-free.\n\n### Cons\n\n- Every sweep spends money, so the matrix became an explicit spend dial (ADR 0010).\n"}, "ADR-0003": {"file": "0003-runresult-is-a-stdlib-dataclass.md", "title": "RunResult is a stdlib dataclass serialised to JSON", "status": "accepted", "description": "a committed JSON Schema is the parity contract, so the plugin needs no validation library", "markdown": "> **Lens**: Prefer a committed schema over a validation library; a schema is diffable and language-neutral, and it costs nothing at runtime.\n\n## Problem\n\n### Symptom\n\nTwo adapters produce one record.\nWithout a shared contract their shapes drift and parity becomes an assertion nobody can check.\n\n### Pain point\n\nPydantic would validate but adds a dependency to a harness whose brief is minimal.\n\n## Decision\n\n### The lens\n\n- **Given**: The harness's brief is minimal, so every runtime dependency has to earn its place.\n- **We prefer**: A `dataclasses.dataclass` serialised to flat JSON with a committed `runresult.schema.json`, over a validation library such as Pydantic.\n- **Because**: A committed schema is diffable and language-neutral, and it costs nothing at runtime.\n- **Unless**: never\n\n### In practice\n\n- `RunResult` is a `dataclasses.dataclass` serialised to flat JSON, with a committed `runresult.schema.json` that both adapters validate against.\n\n## Consequences\n\n### Pros\n\n- The plugin has no runtime dependency beyond pytest.\n- The schema is the single source of truth for parity.\n\n### Cons\n\n- Until the schema file ships, parity rests on both adapters returning the same dataclass.\n  The type checker enforces that, but a mismatched JSON artefact would not reveal it.\n"}, "ADR-0004": {"file": "0004-workspace-is-a-plain-copy.md", "title": "A workspace is a plain copy of the fixture tree, with no git context", "status": "accepted", "description": "no git init and no worktree, so diff-reading skills stay out of scope until the seam is used", "markdown": "> **Lens**: Do not give a workspace capabilities no in-scope skill reads.\n> Add them at the workspace seam when a skill that needs them enters scope.\n\n## Relates to\n\n- Superseded by [ADR-0014](0014-register-through-the-pytest11-entry-point.md) (the project `tmp/` location is now the `xharness_workdir` ini key, default `tmp/evals`)\n\n## Problem\n\n### Symptom\n\nSeveral skills a consuming project may want to evaluate reason about diffs and history.\n\n### Pain point\n\nGiving every workspace a git repository costs setup time and forces fixtures to be committed subtrees.\n\n## Decision\n\n### The lens\n\n- **Given**: The user ruled git-dependent skills out of scope for this iteration.\n- **We prefer**: `shutil.copytree` of the fixture into the project `tmp/`, discarded and rebuilt per cell, over a `git init` or a worktree per workspace.\n- **Because**: No in-scope skill reads git history, so the setup cost and the committed-subtree constraint would buy nothing.\n- **Unless**: a skill that needs git enters scope, at which point the `workspace` fixture is the seam where a git strategy is added.\n\n### In practice\n\n- Each cell's workspace is `shutil.copytree` of the fixture into the project `tmp/`, discarded and rebuilt per cell.\n  No `git init`, no worktree.\n- A case that needs git must fail loudly rather than run in a git-less workspace and report a score.\n\n## Consequences\n\n### Pros\n\n- Materialisation is fast and trivially resettable, and keeps run artefacts under the project's `tmp/`.\n- The `workspace` fixture is the seam where a git strategy is added later, without a rewrite.\n\n### Cons\n\n- Code-review, change-walkthrough, refactoring and similar diff-reading skills cannot be evaluated yet.\n"}, "ADR-0005": {"file": "0005-private-codex-home-per-run.md", "title": "A private per-run CODEX_HOME, seeded with the credential files", "status": "accepted", "description": "isolating the whole state store makes log correlation structural instead of a race", "markdown": "> **Lens**: When a tool offers no identity lever, isolate its whole state store so only one artefact can exist.\n> Never search for the newest one.\n\n## Problem\n\n### Symptom\n\n`codex exec` has no caller-chosen session id.\nRollouts land under `$CODEX_HOME/sessions/YYYY/MM/DD/`.\n\n### Pain point\n\nPicking the newest file by modification time races any concurrent Codex session, which is exactly the grading-the-wrong-transcript failure this harness exists to prevent.\n\n## Decision\n\n### The lens\n\n- **Given**: `CODEX_HOME` is the one lever that relocates the whole Codex state store.\n- **We prefer**: A private per-run `CODEX_HOME` seeded with the credential files, over newest-by-mtime (races) or the stdout id alone (depends on flush order).\n- **Because**: Exactly one rollout can then exist under that directory, so correlation is structural rather than inferred.\n- **Unless**: never\n\n### In practice\n\n- Each Codex cell runs with `CODEX_HOME` pointed at a private directory into which the harness first copies `auth.json` and `.credentials.json` from the real home.\n- The `session_meta` id in the rollout is the cell's session id.\n\n## Consequences\n\n### Pros\n\n- One mechanism serves three needs: log correlation, ambient-config isolation, and the skill-injection path (`$CODEX_HOME/skills`).\n\n### Cons\n\n- The accepted risk is that `CODEX_HOME` is also the credential store; the first live run proved seeding works.\n"}, "ADR-0006": {"file": "0006-local-price-table-is-authoritative.md", "title": "A local prices.toml is authoritative, with an optional upstream seed", "status": "accepted", "description": "an upstream feed fills the table but is never the thing the harness reads", "markdown": "> **Lens**: Keep the price table owned, not generated.\n> An upstream is a convenience for filling it, never the thing the harness reads.\n\n## Relates to\n\n- Extended by [ADR-0014](0014-register-through-the-pytest11-entry-point.md) (the table is now bundled inside the package and layered with the consumer's optional `xharness_prices` file)\n- Superseded by [ADR-0030](0030-price-rows-live-in-the-pytest-config.md) (the project-level override moved from a rootdir `prices.toml` into `xharness_prices` ini lines; the bundled table is unchanged)\n\n## Problem\n\n### Symptom\n\nNeither CLI's session log carries cost, and Codex reports none anywhere.\n\n### Pain point\n\nThe LiteLLM feed carries per-token input, output, cache-read, and cache-write rates for Anthropic models.\nIts coverage of Codex's aliased model names (for example `gpt-5.6-sol`) is unconfirmed, so a generated table would silently lose rows.\n\n## Decision\n\n### The lens\n\n- **Given**: An upstream feed's coverage of one provider's aliased names cannot be relied on.\n- **We prefer**: A committed `prices.toml` as the single authority for rates, over reading an upstream feed directly at run time.\n- **Because**: A table the repository owns cannot lose a row to an upstream rename, and the upstream stays useful for filling it.\n- **Unless**: never\n\n### In practice\n\n- A `--seed-prices` command will populate and refresh rows from upstream.\n  It never overwrites a row marked as a local override, and it reports every model it could not match.\n\n## Consequences\n\n### Pros\n\n- Claude rates can be refreshed from a real upstream.\n- Relative comparison across cells stays robust regardless of absolute rate drift.\n\n### Cons\n\n- Codex aliases stay hand-entered.\n- Until the seed command exists, every row is maintained by hand, and absolute USD figures lag provider changes.\n"}, "ADR-0007": {"file": "0007-unpriced-model-aborts-before-spend.md", "title": "An unpriced model aborts at matrix expansion and never prices as zero", "status": "accepted", "description": "price coverage is checked before the first paid call, and the failure names the fix", "markdown": "> **Lens**: Validate anything that gates spend before the first paid call, and make the failure name the fix.\n\n## Problem\n\n### Symptom\n\nA model missing from the price table could be priced at zero with a warning, recorded as `null`, or treated as an error.\n\n### Pain point\n\nZero makes an expensive sweep look free; `null` pushes the obligation onto every consumer of the report.\n\n## Decision\n\n### The lens\n\n- **Given**: The check that gates spend can run at matrix expansion, before any cell runs.\n- **We prefer**: Stopping the sweep with the model named, over pricing it at zero with a warning or recording it as `null`.\n- **Because**: The failure lands before money is spent, so failing loud costs nothing here.\n- **Unless**: never\n\n### In practice\n\n- Price coverage is validated when the matrix expands, before any cell runs.\n  An unpriced model stops the sweep with the model named.\n- `--dry-run` surfaces the same gap without spending.\n\n## Consequences\n\n### Pros\n\n- The failure lands before money is spent, so fail-loud costs nothing here.\n\n### Cons\n\n- A new model blocks a sweep until a row is added, which is the intended friction.\n"}, "ADR-0008": {"file": "0008-evals-are-eval-prefixed-modules.md", "title": "Evals are `eval_*.py` modules collected by a directory-scoped hook", "status": "accepted", "description": "a scoped collect hook keeps paid cells away from an ordinary unit-test run", "markdown": "> **Lens**: Separate paid work from free work by collection scope and name, never by a skip marker that exits green.\n\n## Relates to\n\n- Extended by [ADR-0016](0016-results-travel-on-the-test-report.md) (the record's status line says \"refined by\"; the `eval_` prefix also applies to case functions)\n- Extended by [ADR-0014](0014-register-through-the-pytest11-entry-point.md) (the `skills/` root is now the `xharness_skills_dir` ini key)\n\n## Problem\n\n### Symptom\n\nPaid eval cells must never be triggered by an ordinary unit-test run.\n\n### Pain point\n\npytest's `python_files` option is a single rootdir-level setting, so changing it to `eval_*.py` would stop `test_*.py` collecting across the whole repository.\n\n## Decision\n\n### The lens\n\n- **Given**: A plugin may add its own `pytest_collect_file` hook and scope it to a path shape.\n- **We prefer**: A directory-scoped `pytest_collect_file` hook over an `eval_*.py` value for `python_files`, and over a skip marker that exits green.\n- **Because**: It separates paid cells from unit tests by name and by scope, leaving `python_files` at its default for the rest of the repository.\n- **Unless**: never\n\n### In practice\n\n- An eval case is a Python module named `eval_*.py` under `skills/<skill>/evals/`, beside its `fixture/` and `captured/` directories.\n- The plugin collects it through its own `pytest_collect_file` hook scoped to that path shape.\n  `python_files` is left at its default.\n\n## Consequences\n\n### Pros\n\n- The `eval_*` prefix separates paid cells from unit tests by name.\n- Because a case is an executable module, custom verifiers are ordinary functions and need no second mechanism (ADR 0013).\n- A directory that matches the layout but defines no case fails collection loudly rather than contributing zero cells.\n\n### Cons\n\n- The harness owns a collection rule of its own, which must keep step with pytest's (the inheritance ADR 0001 accepted).\n"}, "ADR-0009": {"file": "0009-register-via-rootdir-conftest.md", "title": "Register the plugin from the rootdir conftest.py", "status": "superseded", "description": "the rootdir conftest is the one place pytest honours `pytest_plugins` for an uninstalled package", "markdown": "> **Lens**: Test a registration mechanism under both `python -m pytest` and the console script before adopting it; the two differ in what is importable.\n\n## Relates to\n\n- Superseded by [ADR-0014](0014-register-through-the-pytest11-entry-point.md) (superseded on 2026-08-21, the day it was accepted; kept because its Lens still applies to any uninstalled plugin)\n\n## Problem\n\n### Symptom\n\nA `conftest.py` inside the plugin's own package directory cannot hook collection under `skills/*/evals/`: conftest hooks apply only to their own subtree.\n\n### Pain point\n\n`addopts = -p <package>.plugin` was tried next.\nVerified 2026-08-21, it is invocation-dependent for an uninstalled package.\n`python -m pytest` puts the cwd on `sys.path`, so it works.\nThe bare `pytest` console script does not, and it fails with `ImportError: No module named '<package>'`.\n\n## Decision\n\n### The lens\n\n- **Given**: Since pytest 7 the rootdir conftest is the one place `pytest_plugins` is honoured.\n- **We prefer**: A one-line repository-root `conftest.py` declaring `pytest_plugins = [\"<package>.plugin\"]`, over `addopts = -p <package>.plugin` or a conftest inside the package directory.\n- **Because**: Importing that file is what puts the root on `sys.path`, so it works under every invocation.\n- **Unless**: the plugin ships as an installed distribution, in which case a `pytest11` entry point registers the same module.\n\n### In practice\n\n- The eventual target is a PyPI package registering the same module through a `pytest11` entry point.\n\n## Consequences\n\n### Pros\n\n- The package keeps an importable, package-shaped layout so extraction later is a packaging change.\n\n### Cons\n\n- One file lives outside the plugin package.\n- `pytest.ini` carries only a comment explaining why it does not register the plugin.\n"}, "ADR-0010": {"file": "0010-matrix-options-and-dry-run.md", "title": "Global default matrix, per-case override, and --model / --cli / --dry-run", "status": "accepted", "description": "the matrix is the spend dial, so it is exposed as options rather than hidden behind -k", "markdown": "> **Lens**: Expose spend controls as explicit, discoverable options; never make the cost of a run depend on remembering a substring.\n\n## Relates to\n\n- Extended by [ADR-0015](0015-harness-is-the-axis-and-the-project-owns-the-matrix.md) (`--cli` is `--harness`, and a project-scope `xharness_matrix` sits between the case and the plugin default)\n\n## Problem\n\n### Symptom\n\nEvery cell is paid (ADR 0002), so the matrix is the spend dial.\n\n### Pain point\n\n`-k` string matching against node ids can narrow a run but cannot price one in advance, and hides the cost control behind a substring.\n\n## Decision\n\n### The lens\n\n- **Given**: pytest has no equivalent for pricing a sweep before it runs.\n- **We prefer**: Three explicit plugin options, over narrowing a run with `-k` alone.\n- **Because**: A sweep can then be priced before it is paid for.\n  The control is discoverable in `--help`, rather than remembered as a substring.\n- **Unless**: never\n\n### In practice\n\n- A default matrix lives in `matrix.py`; a case may override it.\n- The plugin adds three options: `--model` and `--cli` narrow the sweep, and `--dry-run` enumerates the cells that would run, with estimated USD, without invoking anything.\n\n## Consequences\n\n### Pros\n\n- Widening the repository-wide sweep is a single edit.\n- A sweep can be priced before it is paid for, which stock pytest cannot do.\n\n### Cons\n\n- The plugin owns three options beyond stock pytest, against the spirit of ADR 0001; each exists because pytest has no equivalent.\n"}, "ADR-0011": {"file": "0011-inject-skill-through-each-cli-path.md", "title": "The skill under test loads through each CLI's own skill path", "status": "accepted", "description": "the eval exercises skill loading, not skill text pasted into a prompt", "markdown": "> **Lens**: Evaluate a deliverable through the loading path its real users take; a shortcut that bypasses loading changes what is being measured.\n\n## Problem\n\n### Symptom\n\nThe deliverable being evaluated is a skill.\nInlining its body into the prompt would grade a prompt while still attributing the score to the skill.\n\n### Pain point\n\nCopying it into the workspace as `.claude/skills/` only takes effect when settings sources are loaded, which fights the isolation goal.\n\n## Decision\n\n### The lens\n\n- **Given**: Each CLI already has a skill path its real users' skills travel.\n- **We prefer**: Injection through each CLI's own skill path.\n  That is preferred over inlining the skill body into the prompt, or copying it into the workspace as `.claude/skills/`.\n- **Because**: Only the real loading path measures skill loading rather than skill text.\n- **Unless**: never\n\n### In practice\n\n- Claude receives the skill directory through `--add-dir`; Codex loads it from `$CODEX_HOME/skills/<skill>`.\n  Two mechanisms, each the path a real user's skill travels.\n\n## Consequences\n\n### Pros\n\n- The eval exercises skill loading, not just skill text.\n\n### Cons\n\n- Two injection paths must be kept in step in `runner.py`.\n"}, "ADR-0012": {"file": "0012-grading-is-composable-not-prescribed.md", "title": "Grading semantics are not prescribed; the plugin supplies primitives", "status": "accepted", "description": "case authors get composable primitives, and the only house rule is that no check passes silently", "markdown": "> **Lens**: Give case authors tools, not a policy; enforce only that no check can silently pass.\n\n## Problem\n\n### Symptom\n\nAgent prose is non-deterministic, so byte-exact comparison of transcripts always fails, while loosening comparison too far produces a grader that cannot fail.\n\n### Pain point\n\nWhat counts as a correct run differs per skill and is not knowable up front, so any mandated semantic would be wrong for some skill.\n\n## Decision\n\n### The lens\n\n- **Given**: A case is an ordinary Python function, so it can compose whatever checks it needs.\n- **We prefer**: A curated set of grading primitives composed with plain `assert`, over a single mandated comparison semantic or a house LLM judge.\n- **Because**: New primitives can then be added without touching existing cases.\n  No case is forced into a semantic that does not suit its skill.\n- **Unless**: a check cannot evaluate, in which case it raises; it never passes.\n\n### In practice\n\n- A case is an ordinary function that composes checks with plain `assert` over the `RunResult` and the workspace.\n- The plugin's set of grading primitives is curated over time.\n  An LLM judge may join it later as one optional primitive, never as the house rule.\n\n## Consequences\n\n### Pros\n\n- New primitives are added without touching existing cases.\n- The one invariant that survives: a check that cannot evaluate raises; it never passes.\n\n### Cons\n\n- Today only plain assertions are shipped; the reference case shows the intended layering.\n  Golden-tree and projection primitives are not yet built.\n"}, "ADR-0013": {"file": "0013-verifiers-are-python-beside-the-case.md", "title": "Custom verifiers are Python modules beside the case", "status": "accepted", "description": "import is the extension mechanism, so there is no registry, DSL or new file format", "markdown": "> **Lens**: When extensibility is the goal, prefer the host language's own import mechanism over a plug-in registry.\n\n## Problem\n\n### Symptom\n\nSkills need checks the plugin did not anticipate.\n\n### Pain point\n\nA shell command per verifier is portable but loses structured detail on failure.\nDeclarative assertions in a manifest only cover checks anticipated when the schema was written.\n\n## Decision\n\n### The lens\n\n- **Given**: A case is already an executable Python module (ADR 0008), so it can import.\n- **We prefer**: A plain Python callable imported by the case module, over a shell command per verifier or declarative assertions in a manifest.\n- **Because**: Extensibility then uses a mechanism every Python developer already knows.\n- **Unless**: never\n\n### In practice\n\n- A verifier lives in `skills/<skill>/evals/`, is versioned with the cases that use it, and is imported by the case module like any other code.\n- A verifier that fails to import fails the case loudly.\n\n## Consequences\n\n### Pros\n\n- Extensibility uses a mechanism every Python developer already knows.\n- No registry, no DSL, no new file format.\n\n### Cons\n\n- Until a dedicated import helper exists, a case imports its verifiers directly.\n"}, "ADR-0014": {"file": "0014-register-through-the-pytest11-entry-point.md", "title": "Register through the pytest11 entry point of an extracted package", "status": "accepted", "description": "installing the package is the whole registration, and every location becomes an ini key", "markdown": "> **Lens**: When a plugin leaves its birthplace, every path it derived from `__file__` becomes a rootdir-relative option, and the registration becomes the entry point.\n\n## Relates to\n\n- Supersedes [ADR-0009](0009-register-via-rootdir-conftest.md) (the record's status line says \"supersedes\")\n- Extended by [ADR-0017](0017-distributed-through-pypi-with-trusted-publishing.md) (distribution moved from an editable path dependency to PyPI)\n- Extended by [ADR-0026](0026-skill-ignore-lives-in-the-pytest-config.md) (the per-skill `.skillignore`, the one location read outside the ini keys, is gone)\n\n## Problem\n\n### Symptom\n\nThe harness began as an uninstalled package inside the repository whose skills it evaluated, registered by a rootdir `conftest.py` (ADR 0009).\n\n### Pain point\n\nThat made the plugin and the evals it runs one undifferentiated change set.\nIt also tied three paths to `__file__`.\nThose were the skills root found by walking up the tree, the `tmp/evals` work directory, and the `report.json` path inside the package.\n\n## Decision\n\n### The lens\n\n- **Given**: Installing a distribution is enough for pytest to discover a `pytest11` entry point, under every invocation.\n- **We prefer**: Its own distribution registered through a `pytest11` entry point, over a rootdir `conftest.py` in the consuming repository.\n- **Because**: Installing the package is then the whole registration, and the plugin can be reviewed and released apart from the evals it runs.\n- **Unless**: never\n\n### In practice\n\n- The plugin is its own distribution, `pytest-xharness-eval`, with the module `pytest_xharness_eval`.\n  Its `pyproject.toml` declares `[project.entry-points.pytest11] xharness_eval = \"pytest_xharness_eval.plugin\"`, and installing the package is the whole registration.\n  During development the consuming repository installs it as an editable path dependency.\n- Every location the plugin needs is an ini key resolved against pytest's `rootpath`.\n  They are `xharness_skills_dir` (default `skills`), `xharness_workdir` (default `tmp/evals`), and `xharness_prices` (default `prices.toml`, optional, layered over the bundled table).\n  The single `__file__`-relative path that remains is the bundled `prices.toml`.\n\n## Consequences\n\n### Pros\n\n- Consumers carry no `conftest.py` or `pytest.ini` for the plugin.\n- The plugin's own test suite runs through `pytester` as real nested sessions.\n  The functions that spawn a CLI are excluded from coverage with a stated reason rather than faked.\n  That keeps ADR 0002 intact inside the package.\n\n### Cons\n\n- Consumers do need a config file at the repository root, and an empty `[tool.pytest.ini_options]` suffices.\n  That makes the rootdir the repository rather than the common ancestor of the arguments.\n  The report header names the resolved skills root, and marks it missing when it is not there.\n"}, "ADR-0015": {"file": "0015-harness-is-the-axis-and-the-project-owns-the-matrix.md", "title": "Harness is the axis name, and the project owns the default matrix", "status": "accepted", "description": "one word for the first axis, and a project scope between the case and the plugin default", "markdown": "> **Lens**: Name an axis once, in the word the package is named for.\n> Give every configurable default a project scope between the case and the plugin.\n\n## Relates to\n\n- Extends [ADR-0010](0010-matrix-options-and-dry-run.md) (the record's status line says \"refines\")\n\n## Problem\n\n### Symptom\n\nThe first design named the first matrix axis \"cli\" (`--cli`, `Cell.cli`, `RunResult.cli`), while the package is named for cross-*harness* evaluation.\nTwo words for one axis is the kind of drift the vocabulary table exists to prevent.\n\n### Pain point\n\nSeparately, the only way to change a repository's sweep was to edit the plugin's `DEFAULT_MATRIX` or to repeat `models=` on every case.\nThere was no project scope between the two.\nVisibility was also thin.\nA six-cell sweep printed as dots, and the verbose line said only `PASSED`, hiding the cost that had just been incurred.\n\n## Decision\n\n### The lens\n\n- **Given**: The package is named for cross-harness evaluation, and pytest offers hooks that itemise collection and per-test status.\n- **We prefer**: The single word **harness** for the axis and a three-scope matrix, over the parallel \"cli\" vocabulary and a two-scope one.\n  Hooks inside pytest's own output, over a second pivot report.\n- **Because**: The requirement was visibility inside pytest's own output, not a second report.\n  One word for one axis is what the vocabulary table exists to protect.\n- **Unless**: never\n\n### In practice\n\n- The axis is called **harness** everywhere: the `--harness` option, `Cell.harness`, `RunResult.harness`, `KNOWN_HARNESSES`, and the `harness` key in `report.json`.\n  Matrix entries stay `harness/model`.\n- The matrix has three scopes, highest precedence first: a case's `models=`, the project's `xharness_matrix` ini key, and the plugin's `DEFAULT_MATRIX`.\n  A case that omits `models=` inherits; `EvalCase.models` is `None` in that state so inheritance is distinguishable from an explicit choice.\n- Two hooks carry the itemised view inside ordinary pytest output.\n  Before the first cell runs, `pytest_report_collectionfinish` lists every permutation grouped by case.\n  As each cell lands, `pytest_report_teststatus` replaces the verbose status word with the verdict, USD, token count, and duration, and shows `DRY-RUN` for a dry-run skip.\n\n## Consequences\n\n### Pros\n\n- The report header names which matrix scope applied, so a surprising cell count is diagnosable from the first two lines of output.\n- Consumers see `--cli` rejected as an unknown option, which is the loud failure wanted.\n\n### Cons\n\n- Captured `.result.json` files written before this change carry a `cli` key; they are git-ignored run artefacts and are not migrated.\n- A pivot report was considered and deferred: the requirement was visibility inside pytest's own output, not a second report.\n"}, "ADR-0016": {"file": "0016-results-travel-on-the-test-report.md", "title": "Results travel on the test report, and cells group by harness", "status": "accepted", "description": "user_properties is the one channel xdist serialises, so per-cell records ride on it", "markdown": "> **Lens**: State that must reach the controller rides on the report; state that stays in a process belongs to that process only.\n\n## Relates to\n\n- Extends [ADR-0008](0008-evals-are-eval-prefixed-modules.md) (the record's status line says \"refines\")\n\n## Problem\n\n### Symptom\n\nPer-cell records (verdict, USD, tokens, duration) were kept on `config.stash`, which is per process.\nUnder `pytest-xdist` the workers run the cells and the controller renders the output.\nThe verbose status words therefore fell back to plain `PASSED`, and `report.json` was empty.\n\n### Pain point\n\nThe cells themselves were already isolated: each has its own workspace, its own private `CODEX_HOME`, and its own minted Claude session id.\nA second rule was also missing.\npytest's collection convention applies the `test_` prefix to files and functions alike, and this plugin pivoted that prefix to `eval_` for files only.\nAny function name was accepted.\n\n## Decision\n\n### The lens\n\n- **Given**: `TestReport.user_properties` is the one channel xdist serialises to the controller.\n- **We prefer**: Copying a cell's record onto its call `TestReport.user_properties`, over keeping it on the per-process `config.stash`.\n- **Because**: The controller can then read it for the status word, and accumulate it for the summary.\n  The single-process path runs the same code.\n- **Unless**: never\n\n### In practice\n\n- The worker copies a cell's record onto its call `TestReport.user_properties`, the one channel xdist serialises to the controller.\n  The controller reads it there for the status word and accumulates it in `pytest_runtest_logreport` for the summary and `report.json`.\n  The single-process path is the same code.\n- Every cell carries `xdist_group=<harness>`, so `-n 2 --dist loadgroup` runs the harnesses in parallel and each harness's cells serially.\n  That respects per-provider rate limits and avoids concurrent copies of Codex credentials refreshing against each other, a risk not yet measured.\n- `@evalcase` functions must be named `eval_*`; any other name is a `UsageError` at collection.\n  The `eval_` prefix is the collection rule for files and functions, as `test_` is for pytest.\n\n## Consequences\n\n### Pros\n\n- `-v -n N` output is as itemised as a serial run.\n\n### Cons\n\n- The pre-run permutation summary is not printed under xdist because its controller does not call `pytest_report_collectionfinish`; `--collect-only -q` shows the plan instead.\n- Full fan-out (`-n 6` without `--dist loadgroup`) is possible but is a deliberate choice, not the documented default.\n"}, "ADR-0017": {"file": "0017-distributed-through-pypi-with-trusted-publishing.md", "title": "Distribute through PyPI with trusted publishing, released from a GitHub Release", "status": "accepted", "description": "one trigger and one OIDC identity, so no long-lived publishing token is stored or rotated", "markdown": "> **Lens**: Make the release path one trigger with one identity.\n> A single event starts it, OIDC proves who is publishing, and nothing long-lived has to be stored or rotated.\n\n## Relates to\n\n- Extends [ADR-0014](0014-register-through-the-pytest11-entry-point.md) (the record's status line says \"refines\")\n\n## Problem\n\n### Symptom\n\nADR 0014 made the plugin its own distribution but left installation at \"an editable path dependency during development\".\nThat works only on a machine that holds both repositories side by side.\nIt is not something a consumer's `pyproject.toml` can record.\nThe README already instructs `uv add --dev pytest-xharness-eval`, which resolves only against an index.\n\n### Pain point\n\nA PyPI API token would work but is a long-lived secret to store and rotate.\nPyPI's trusted publishing instead issues a short-lived upload token against an OpenID Connect claim set that names the repository, the workflow file, and the environment.\n\n## Decision\n\n### The lens\n\n- **Given**: The package follows the maintainer's standard packaging conventions.\n  Those are a `uv_build` wheel, a `Makefile` as the command surface, and publishing driven by CI rather than by a laptop.\n- **We prefer**: PyPI with trusted publishing triggered by a GitHub Release, over a stored PyPI API token.\n  It is preferred over an editable path dependency a consumer would have to commit.\n- **Because**: OIDC issues a short-lived token against a claim set naming the repository, workflow file and environment.\n  Nothing long-lived therefore has to be stored or rotated.\n- **Unless**: the OIDC path is unavailable, in which case `make publish-test` against TestPyPI and `make publish` stay as the manual, token-based fallback.\n\n### In practice\n\n- A release is a GitHub Release, and publishing it triggers `.github/workflows/publish.yml`.\n  That workflow builds the wheel with `uv build --wheel` and uploads with `uv publish`, under the `pypi` environment with `id-token: write`.\n  The trusted publisher registered on PyPI for `pytest-xharness-eval` names exactly that owner, repository, workflow filename, and environment.\n  No publishing token is stored anywhere.\n- The version is declared twice: `version` in `pyproject.toml` and `__version__` in the package.\n  A unit test pins them equal, so a bump to one without the other fails `make test` before a tag can be cut.\n  Tags are `vX.Y.Z` and match the wheel's version.\n- The editable path dependency remains a development convenience for working on the plugin against a live consumer; it is never what a consumer commits.\n\n## Consequences\n\n### Pros\n\n- A consumer pins a version from PyPI, and gets the `pytest11` registration of ADR 0014 by installing it.\n  The consuming repository no longer needs to know where the plugin's source lives.\n- Until the first release is cut, `uv add --dev pytest-xharness-eval` fails with no matching version rather than installing something stale.\n  That is the loud failure this project prefers.\n- Every release is a GitHub Release, which is also where the changelog lives (`project.urls.Changelog`).\n\n### Cons\n\n- Publishing has one silent coupling.\n  If the environment name on PyPI's publisher differs from the workflow's `pypi` environment, the token exchange fails with a claims mismatch.\n  That mismatch is visible only in the Actions log.\n"}, "ADR-0018": {"file": "0018-fixtures-directory-and-metrics-history.md", "title": "Fixtures live under evals/fixtures/, and every live cell appends to a metrics history", "status": "accepted", "description": "seed trees become a shared pool, and each paid cell appends one committed metrics line", "markdown": "> **Lens**: Seed data is a pool, and evidence is keyed by what produced it.\n> The metrics worth keeping are the ones small enough to commit.\n\n## Relates to\n\n- Extends [ADR-0004](0004-workspace-is-a-plain-copy.md) (the record's status line says \"refines\")\n- Extends [ADR-0016](0016-results-travel-on-the-test-report.md) (the record's status line says \"refines\")\n\n## Problem\n\n### Symptom\n\nA fixture was addressed by a path relative to `evals/`, and conventionally placed beside a `captured/` directory named for the case.\nThat tied seed trees to single cases, although several scenarios can start from one seed.\n\n### Pain point\n\nPer-run metrics existed only inside each git-ignored `.result.json`, so there was no history of a skill's evals over time.\nThe pre-run permutation summary added in 0015 was not needed and xdist's controller never printed it anyway.\n\n## Decision\n\n### The lens\n\n- **Given**: Seed trees are reusable across scenarios, while evidence is only meaningful keyed by the cell that produced it.\n- **We prefer**: A shared `fixtures/<name>/` pool addressed by name, over a seed tree named for and tied to one case.\n  A committed flat `history.jsonl`, over metrics that exist only inside a git-ignored result file.\n- **Because**: The metrics worth keeping over time are the ones small enough to commit.\n  Anything richer is derivable from them, or from the captured results.\n- **Unless**: never\n\n### In practice\n\n- The layout under `<skill>/evals/` is:\n\n  ```text\n  eval_<suite>.py            # eval_* functions\n  fixtures/<name>/           # seed workspaces; @evalcase(fixture=\"<name>\")\n  captured/<case>/           # each run's session log and .result.json; git-ignored\n  history.jsonl              # one metrics line per live cell; committed\n  ```\n- Each live cell appends one flat JSON record to `history.jsonl`.\n  It carries the timestamp, node, harness, model, session id and verdict.\n  It also carries turns, tool calls (total and by name), the agent-reported duration, the harness wall clock, USD, tokens by tier, and files written.\n  The same record rides on `TestReport.user_properties`, with its scalars as individual `xharness_*` properties so `--junitxml` carries them.\n  It also feeds the verbose status word (`PASSED  $0.1261  573,213 tok  71.0s  12 turns  9 tools`).\n- The pre-run permutation summary is removed.\n  `--dist loadgroup` is an option, not a requirement: plain `-n N` is supported; `loadgroup` keeps one harness per worker.\n\n## Consequences\n\n### Pros\n\n- A dry run touches neither `captured/` nor `history.jsonl`.\n- `history.jsonl` is the committed record of a skill's eval history; anything richer is derived from it or from the captured results.\n\n### Cons\n\n- `history.jsonl` grows by one line per paid cell.\n"}, "ADR-0019": {"file": "0019-per-call-ledger-and-ttl-priced-cache-writes.md", "title": "Every run carries a per-call ledger; tokens are reported as context and billed; cache writes price by TTL", "status": "accepted", "description": "the per-call detail that explains every headline figure is kept rather than normalised away", "markdown": "> **Lens**: Keep the per-call evidence; a sum is a view of it, and a sum without its parts cannot be audited.\n\n## Relates to\n\n- Extends [ADR-0003](0003-runresult-is-a-stdlib-dataclass.md) (the record's status line says \"refines\")\n- Extends [ADR-0006](0006-local-price-table-is-authoritative.md) (the record's status line says \"refines\")\n- Extends [ADR-0018](0018-fixtures-directory-and-metrics-history.md) (the record's status line says \"refines\")\n\n## Problem\n\n### Symptom\n\nAn audit of six captured cells (2026-08-22) found every figure the plugin reported was arithmetically exact and still misleading on three counts:\n\n- `tokens` summed the four billed tiers over every model call.\n  The cached prefix is re-read on each call.\n  A 13-call opus run with a 51k peak context therefore reported 526k \"tokens\", ten times what the model ever held.\n  The number was right as a billing quantity and wrong as the quantity readers took it for.\n- `turns` meant two different things.\n  For Claude it was the envelope's `num_turns`, which equals tool calls plus one.\n  For Codex it counted `task_complete` events, which is always one for `codex exec`.\n  Neither was the number of model calls, although `_claude_usage` computed that number and discarded it.\n- Claude's own `total_cost_usd` sat 15% to 23% above `cost_usd`.\n  The price table carried one cache-write rate, the 5-minute TTL (1.25x input), while every write in every log was `ephemeral_1h` (2x input).\n  The remainder, $0.00107 per session, is Claude Code's `ai-title` side call, present in the envelope cost and absent from the main model's usage.\n\n### Pain point\n\nThe per-call detail that explained all three was in the session logs the plugin already captures, and was thrown away during normalisation.\n\n## Decision\n\n### The lens\n\n- **Given**: The session logs the plugin already captures carry per-call detail that explains every headline figure.\n- **We prefer**: Keeping a per-call ledger on `RunResult` and deriving the headlines from it, over normalising the per-call detail away and reporting sums alone.\n- **Because**: A sum without its parts cannot be audited, and all three defects were invisible precisely because the parts had been discarded.\n- **Unless**: never\n\n### In practice\n\n- `RunResult` carries a per-call ledger, `calls: list[Call]`.\n  One `Call` per model API call holds its `Usage`, its stop reason, and the tool calls it issued.\n  It also holds the tool results that entered its context since the previous call, and its text.\n  Both adapters build it.\n  Claude keys on `message.id`.\n  Codex keys on `token_count` events using `last_token_usage`, with the outputs that precede a count attributed to the next call's context.\n  That is the order the rollout records them in.\n- From the ledger:\n\n  - `turns` is the number of model calls on both harnesses.\n    The CLI's own figure is kept as `reported_turns`.\n  - `usage` is the ledger's sum.\n    The CLI's own aggregate is kept as `reported_usage`.\n  - `baseline_tokens` is the first call's context; `context_tokens` is the largest context any call processed.\n    `Usage.total_tokens` remains the billed sum and is recorded as `billed_tokens`; the bare word `tokens` is retired from the history record and the status word.\n- `Usage` gains `cache_write_1h_tokens` and `cache_write_5m_tokens` from Claude's `usage.cache_creation`.\n  `Rates` gains `cache_write_1h`; a row that omits it gets `cache_write x 1.6`, the Anthropic ratio.\n  `price()` bills tagged writes at their TTL rate and untagged writes at `cache_write`, and records `cost_by_tier`.\n- The status word becomes `PASSED  $0.6604 (cli $0.6615)  51,110 ctx  526,467 billed  87.1s  13 turns  12 tools`.\n  The CLI's own cost sits beside the plugin's whenever one exists, so drift is visible on every cell rather than rediscovered by audit.\n\n## Consequences\n\n### Pros\n\n- `Usage` keeps its positional field order and `total_tokens`, so graders that assert `run.usage.total_tokens > 0` are unchanged.\n- Drift between the plugin's estimate and the CLI's own figure is visible on every cell rather than rediscovered by audit.\n\n### Cons\n\n- `history.jsonl` records written before this decision carry `tokens` and no `billed_tokens`; readers treat the two as the same quantity.\n- Old `.result.json` files have no `calls`; the report (ADR 0020) says so and offers nothing for them.\n- The $0.00107 title-call residue stays outside `cost_usd` on purpose: it is not the model under test.\n"}, "ADR-0020": {"file": "0020-captured-report-is-a-static-microsite.md", "title": "`captured/report.html` is a static microsite over the captured JSON", "status": "accepted", "description": "a static page over relative-path JSON is the cheapest reader that survives the next run", "markdown": "> **Lens**: Evidence that is already JSON on disk needs a reader, not a database.\n> A static page over relative paths is the cheapest reader that survives the next run.\n\n## Relates to\n\n- Extends [ADR-0018](0018-fixtures-directory-and-metrics-history.md) (the record's status line says \"refines\")\n\n## Problem\n\n### Symptom\n\nA sweep leaves `<skill>/evals/captured/` holding one `.result.json` and one session log per cell, plus `history.jsonl`.\nReading them meant a terminal and `jq`.\n\n### Pain point\n\nThe per-call ledger introduced by [0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md) is too wide for a status word.\nThe first token audit was built as a one-off page by hand; the shape it needed is the shape every sweep needs.\n\n## Decision\n\n### The lens\n\n- **Given**: The evidence is already JSON on disk beside the page that would read it.\n- **We prefer**: A static page fetching relative-path JSON, over a database, a server-side report, or a page that embeds its data.\n- **Because**: The JSON files beside it are the source, so re-running a cell and refreshing the page is the whole loop.\n- **Unless**: never\n\n### In practice\n\n- After every sweep that captured at least one cell, the plugin writes into each touched `captured/` directory:\n\n  - `index.json`: one summary row per captured cell.\n    The row carries the case, harness, model, session, verdict and timestamp from `history.jsonl`.\n    It also carries cost, baseline / context / billed tokens, turns and tool calls.\n    It also carries the relative paths of its `.result.json` and log.\n  - `report.html`: one static page that fetches `index.json`.\n    It renders the sweep as cost and token charts and a sortable cell table.\n    It drills into a cell's `.result.json` to show its reconciliation against the CLI's own aggregate, cost by tier, and the per-call ledger.\n    That ledger carries each call's tools, tool results, and text.\n- The page is vanilla JavaScript with one pinned CDN chart library and no build step, in the manner of the richdocs skill.\n  Templated HTML plus relative-path JSON is a microsite.\n  It reads its theme from the OS, remembers a toggle in `localStorage`, and cache-busts every fetch.\n  It never embeds data: the JSON files beside it are the source, so re-running a cell and refreshing the page is the whole loop.\n- The template ships inside the package under `assets/`, and is read with `importlib.resources`, the same way the bundled `prices.toml` is found.\n  It is the second and last bundled resource.\n- Because the page fetches relative paths it is served over HTTP, never opened from `file://`.\n  The terminal summary prints the page path and the one-line `python3 -m http.server` command that serves it.\n\n## Consequences\n\n### Pros\n\n- The plugin's runtime dependencies are still pytest and the standard library (ADR 0003); the chart library loads in the browser.\n\n### Cons\n\n- A dry run writes nothing under `captured/`, so no report appears for it.\n- A result written before 0019 lists in the index with its totals and no ledger; the page says so rather than drawing an empty chart.\n- Because the page fetches relative paths it must be served over HTTP, never opened from `file://`.\n"}, "ADR-0021": {"file": "0021-metric-names-carry-unit-and-provenance.md", "title": "Metric names carry their unit and their source; the report has a named vocabulary and addressable ids", "status": "accepted", "description": "a metric name is read without its definition beside it, so it must carry unit and source", "markdown": "> **Lens**: A metric name is read without its definition beside it, so the name must carry the unit and the source.\n> A number nobody can trace to its inputs is an opinion.\n\n## Relates to\n\n- Extends [ADR-0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md) (the record's status line says \"refines\")\n- Extends [ADR-0020](0020-captured-report-is-a-static-microsite.md) (the record's status line says \"refines\")\n- Superseded by [ADR-0029](0029-the-billed-sum-is-named-accumulative-billed-tokens.md) (the `total_tokens` row is superseded; the billed sum is `accumulative_billed_tokens`)\n\n## Problem\n\n### Symptom\n\nThe first report built on 0019 showed a `cost` and a `cli cost` column, a `baseline` and a `context` and a `billed` column.\nRead cold, three of those names said too little:\n\n- `cost` did not say whose cost.\n- `billed` did not say billed what.\n- `context` needed a paragraph to justify.\n\n### Pain point\n\nWhen the two cost columns disagreed, nothing recorded which price row had produced the estimate.\nA reader could not tell a stale table from a wrong formula without re-deriving both.\nFeedback on the report had no shared names for its parts, and no way to point at one turn of one session.\n\n## Decision\n\n### The lens\n\n- **Given**: A metric name is read without its definition beside it.\n- **We prefer**: Names that state the unit and, where two sources exist, the source.\n  That is preferred over short names that need a paragraph of definition beside them.\n- **Because**: A number nobody can trace to its inputs is an opinion.\n  A decision made on a bad rate needs a source to point at.\n- **Unless**: never\n\n### In practice\n\n- Metric names state the unit and, where two sources exist, the source:\n\n  | Was | Is | Meaning |\n  |-----|----|---------|\n  | `cost_usd` | `estimated_cost_usd` | this plugin's price-table estimate |\n  | `reported_cost_usd` | `harness_reported_cost_usd` | the harness CLI's own figure |\n  | `billed_tokens` / `tokens` | `total_tokens` | every billed token summed over turns |\n  | `baseline` | `baseline_tokens` | the first turn's context |\n  | `context_tokens` (headline) | removed | stays only per turn, inside the ledger |\n- Every priced result records `rates_applied`: the per-tier USD-per-token rates, the `prices.toml` row key, the file the row came from, and when it was applied.\n  The same block rides on the history line, so a decision made on a bad rate has a source to point at.\n- The ledger keeps everything.\n  Tool inputs, tool results and assistant text are stored whole, and thinking text is captured.\n  Each turn lists the 1-based line numbers of the captured session log it was built from.\n  The report's detailed view renders all of it, including the raw records.\n- The report's parts have CamelCase names, carried as element ids and listed in a glossary shipped beside the page (`XHARNESS-REPORT-GLOSSARY.md`).\n  A session is addressed by its harness-minted `SessionId` (a unique prefix is accepted); a turn by `SessionTurnId` = `<SessionId>/t<N>`.\n  Both are shown as click-to-copy badges and both appear in the URL fragment (`#session=…&turn=…&view=…`), which the page keeps current as the reader navigates.\n\n## Consequences\n\n### Pros\n\n- A decision made on a bad rate has a source to point at.\n  Every priced result records the row it used and where the row came from.\n\n### Cons\n\n- `history.jsonl` lines written under 0019 carry the old keys.\n  Readers that merge histories treat `cost_usd` as `estimated_cost_usd`, `reported_cost_usd` as `harness_reported_cost_usd`, and `billed_tokens` (or `tokens`) as `total_tokens`.\n- `RunResult.cost_usd` is gone: graders assert `run.estimated_cost_usd`.\n- Result files grow to roughly the size of the session log they summarise; that is the price of a view that cuts nothing.\n"}, "ADR-0022": {"file": "0022-record-kind-catalogue-and-skill-coverage.md", "title": "A catalogued record kind per log line, and skill file coverage per run", "status": "accepted", "description": "colour the kind of information, and measure which skill files a run actually touched", "markdown": "> **Lens**: Colour the kind of information, not the information; and measure which paths were taken before arguing about which should have been.\n\n## Relates to\n\n- Extends [ADR-0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md) (the record's status line says \"refines\")\n- Extends [ADR-0021](0021-metric-names-carry-unit-and-provenance.md) (the record's status line says \"refines\")\n- Extended by [ADR-0027](0027-coverage-follows-the-shells-working-directory.md) (the detection rule is refined: shell commands are read at the working directory the shell actually had)\n\n## Problem\n\n### Symptom\n\nThe detailed view from 0021 rendered every raw session-log line as pretty JSON.\nThat proved to be the part of the report worth keeping.\nThe summaries beside it (tool calls, results, text, thinking) were re-renderings of the same lines with less information.\nRaw JSON, though, gives no visual cue when the kind of information changes from one line to the next.\nA 23k-character tool result, a five-token usage event and the user's prompt all look the same.\n\n### Pain point\n\nSeparately, a skill is a tree of files an agent loads hierarchically.\nIt loads `SKILL.md`, then the resources it points at, then the scripts it is told to run.\nNothing measured which of those files a run actually touched.\nWhether a skill's decision paths fork the way its author intended was unobservable.\n\n## Decision\n\n### The lens\n\n- **Given**: Every session-log line already declares its shape, and a skill's file tree can be catalogued at collection time.\n- **We prefer**: A catalogue that maps a line to a kind, and a kind to a coloured category.\n  That is preferred over re-rendered summaries that carry less information than the lines they replace.\n- **Because**: Colouring the kind of information leaves the information itself intact.\n  Measuring which paths were taken has to come before arguing about which should have been.\n- **Unless**: a shape has not been seen before, in which case it classifies as `<harness>/unknown` rather than failing.\n\n### In practice\n\n- **Record kinds.** `records.py` is the catalogue.\n  `classify(harness, record)` maps a log line to a kind, spelled `harness/type[/subtype]`.\n  The 2026-08-22 census of 21 logs saw 33 of them, across claude 2.1.237-2.1.239 and codex 0.148-0.149.\n  Every kind has a category.\n  The categories are prompt, assistant text, thinking, tool call, tool result, tool execution, file change, usage, harness context, harness meta, session meta, and lifecycle.\n  Each category has one pill colour, chosen so white text passes WCAG AA on it.\n  An unseen shape classifies as `<harness>/unknown` rather than failing.\n  Every result carries `record_kinds`, a census of its log, so a new kind appearing after a CLI upgrade is visible in the next sweep.\n  The report mirrors the catalogue in JavaScript.\n  One component per kind flips between its rendered view and the raw JSON, with the pill coloured by category.\n  The turn detail is those components and nothing else.\n- **Skill coverage.** `skillcov.py` catalogues the skill's files at collection time, recording path, kind, size and hash.\n  It excludes `evals/`, `node_modules/`, caches and dotfiles, and its kinds are `doc`, `script`, `test` and `asset`.\n  Every cell of a sweep is therefore measured against the same inventory.\n  After a run it walks the per-turn ledger.\n  A tool call whose arguments contain `<skill>/<path>` loads that file, and a shell call that runs a script through an interpreter runs it.\n  A `Skill` tool invocation loads `SKILL.md`.\n  The result carries `skill_coverage`, with per-file `loaded` and `run` turns and the derived `not_loaded` and `not_run` sets.\n  The history line and the status word carry the counts.\n\n## Consequences\n\n### Pros\n\n- The census and the coverage are per run, so sweeps over several models can be diffed.\n  A resource that one model loads and another never does is a decision fork worth a case of its own.\n- `not_run` excludes tests by construction.\n\n### Cons\n\n- Detection is textual.\n  A file read through an alias the harness resolves itself is a miss.\n  So is a script run by a wrapper that never names the path.\n  The raw records sit beside the coverage table, so such a miss can be seen and the detector extended.\n"}, "ADR-0023": {"file": "0023-turn-boundaries-skill-ignore-and-replay.md", "title": "A turn owns its tools' results; skills declare what is not decision surface; captures replay without spend", "status": "accepted", "description": "attribute evidence by cause, and never pay to recompute what is already on disk", "markdown": "> **Lens**: Attribute evidence by cause, not by position.\n> Let the owner of a surface declare its edges.\n> Never pay to recompute what is already on disk.\n\n## Relates to\n\n- Extends [ADR-0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md) (the record's status line says \"refines\")\n- Extends [ADR-0022](0022-record-kind-catalogue-and-skill-coverage.md) (the record's status line says \"refines\")\n- Extended by [ADR-0026](0026-skill-ignore-lives-in-the-pytest-config.md) (the skill-ignore decision is refined; `.skillignore` is no longer read)\n- Extended by [ADR-0027](0027-coverage-follows-the-shells-working-directory.md) (replay re-annotates coverage following the shell's working directory)\n\n## Problem\n\n### Symptom\n\nThree things surfaced from reading the first reports built on 0022.\n\nThe per-turn line ranges in a Claude session interleaved (turn 2: lines 12-18, 20, 22; turn 3: 19, 21, 23-29).\nClaude Code writes each content block of a message as its own record, and appends a tool's result record the moment that tool finishes.\nThe results of a turn's early tools therefore land between that turn's later blocks.\n\nThe skill coverage table listed 56 files for a skill whose decision surface is a dozen.\nExample galleries, lockfiles, linter configs and the skill's own unit tests were all \"not loaded\".\n\n### Pain point\n\nThe ledger attributed every non-assistant record to the *next* call, which was a rule about file order, not about what happened.\nWhich files matter is the skill author's call, and there was nowhere to say it.\nAnd every report change so far was verified by re-running the paid matrix.\nA captured cell already holds everything a result is derived from: its session log and the CLI's envelope.\n\n## Decision\n\n### The lens\n\n- **Given**: A captured cell already holds everything a result is derived from.\n  Every record a turn caused is identifiable by cause rather than by position.\n- **We prefer**: Attribution by cause, a skill-author-declared ignore surface, and a free replay over the captured evidence.\n  Those are preferred over file-order attribution, a fixed exclusion list, and re-running the paid matrix to verify a report change.\n- **Because**: Each turn's `records` is then one contiguous, monotonic line range.\n  The owner of a surface declares its edges.\n  Nothing is paid twice to recompute what is on disk.\n- **Unless**: a result's log is missing, in which case replay is an error, not a skip.\n\n### In practice\n\n- **Turn boundaries.** A record belongs to the turn that caused it.\n  A tool result belongs to the turn whose `tool_use` it answers, matched by `tool_use_id`.\n  Any other record belongs to the turn in progress.\n  Records before the first call belong to the first call.\n  Each turn's `records` is therefore one contiguous, monotonic line range.\n  `results_in` is unchanged: it still names the results that entered a call's context, which are the previous turn's results.\n  Codex rollouts already satisfy the rule (a call's items, then its outputs, then its `token_count`).\n- **Skill ignore.** A skill may carry a `.skillignore` at its root, and a project may set `xharness_skill_ignore` in its pytest config.\n  Both are gitignore-style globs: `**`, `*`, `?`, `{a,b}`, a trailing `/` for a directory, and no-slash patterns matching at any depth.\n  Ignored files stay in the catalogue flagged `ignored` and are excluded from every coverage denominator and from `not_loaded` / `not_run`.\n  The hard exclusions of 0022 (`evals/`, `node_modules/`, caches, dotfiles) still apply first.\n- **Replay.** `uv run -m pytest_xharness_eval.replay <captured dir>` rebuilds every `.result.json` from its log and stored envelope.\n  It re-prices with the current tables, and re-annotates coverage against the skill's current tree and ignore rules.\n  It rewrites the matching `history.jsonl` lines, keeping the verdict, timestamps and wall clock while recomputing the metrics.\n  It then regenerates the report.\n  It invokes no CLI.\n  A result whose log is missing is an error, not a skip.\n- The report's record cards show the kind pill, the log line number, the record's timestamp and its size in every header.\n  Each renders through one component library built bottom-up: values, blocks, tool payloads, messages, records.\n  A command is therefore a highlighted shell block, whether it came from Claude's `Bash` tool or Codex's `exec` wrapper.\n  An edit is a diff, and a JSON payload is JSON.\n\n## Consequences\n\n### Pros\n\n- A report change is verified against captured evidence rather than by re-running the paid matrix.\n\n### Cons\n\n- Old results are not rewritten by a sweep; run the replay once after upgrading to bring them onto the current schema.\n- Replay re-prices with *today's* table, so a dated override such as an introductory price changes historical estimates when it is removed.\n  `rates_applied` records which table each estimate used.\n- `.skillignore` semantics are a subset of gitignore: no negation, no nested braces.\n"}, "ADR-0024": {"file": "0024-context-window-metrics-injected-messages-and-design-tokens.md", "title": "Context window consumption and timing are first-class metrics; injected messages are not prompts; the report is themed by design tokens and can be written standalone", "status": "accepted", "description": "report what the provider measured, and qualify every percentage by its denominator", "markdown": "> **Lens**: Report what the provider measured, qualify every percentage by its denominator, and let the owner of the report own its palette.\n\n## Relates to\n\n- Extends [ADR-0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md) (the record's status line says \"refines\")\n- Extends [ADR-0020](0020-captured-report-is-a-static-microsite.md) (the record's status line says \"refines\")\n- Extends [ADR-0022](0022-record-kind-catalogue-and-skill-coverage.md) (the record's status line says \"refines\")\n\n## Problem\n\n### Symptom\n\nThree gaps in the report after 0023.\n\nNothing said how close a run came to its model's context window.\nBoth harnesses report the window: Claude as `modelUsage[<model>].contextWindow`, Codex as `model_context_window` on `task_started` and every `token_count`.\nBoth also time their runs: Claude with `ttft_ms` and `duration_api_ms`, Codex with `time_to_first_token_ms` and `duration_ms`.\n\nCodex writes its environment and plugin notes as *user*-role messages, such as `<environment_context>` and `<recommended_plugins>`.\nIt writes its policies as developer messages, such as `<permissions>` and `<skills_instructions>`.\nThe catalogue of 0022 coloured the user-role ones as the prompt under test; they are harness context.\n\nThe page's colours lived in its CSS.\n\n### Pain point\n\nThinking complicates the question of \"how full is the context\".\nThe provider withholds thinking text server-side, and may drop earlier turns' thinking from later prompts.\nA reader therefore cannot add up what they see.\nHarness context read as the prompt under test.\nAnd there was no way to brand a report, and no way to hand one file to someone without a web server.\n\n## Decision\n\n### The lens\n\n- **Given**: Both harnesses already measure the window and the timings, so nothing has to be estimated.\n- **We prefer**: Reporting the provider's own measured figures, over layering an estimate on top of what a reader can see.\n  A token file the project owns, over colours embedded in the page's CSS.\n- **Because**: Whatever the server retained or dropped of earlier thinking is already inside the provider's count.\n  The owner of the report should own its palette.\n- **Unless**: the harness reports no window, in which case percentages are `null`, never guessed.\n\n### In practice\n\n- **Context window.** `RunResult.context_window` is the window the harness reported for the model.\n  Per turn, `context_tokens` (`input + cache_read + cache_write`) is the prompt the provider says it processed, and `context_pct` is that over the window.\n  These are *measured*.\n  Whatever the server retained or dropped of earlier thinking is already inside the provider's count, so no estimate is layered on top.\n  `context_window_pct` (peak turn) and `final_context_pct` (last prompt plus its output) are top-level metrics, always qualified by the window size.\n  They appear on the history line, the status word (`ctx 7.2%`), the session table and `SessionMetaTable`.\n  A line of the log is annotated with the measured figure of the turn it belongs to.\n  A tool result is annotated with the next turn's figure, because that is the prompt it became part of.\n  When the harness reports no window, percentages are `null`, never guessed.\n- **Timing.** `ttft_ms` and `api_duration_ms` come from the harness; `output_tokens_per_sec` is output tokens over API time (else agent time).\n  Per turn, `latency_ms` is the wall time from the previous log record to the turn's first record (request plus generation) and `output_tokens_per_sec` follows.\n- **Injected messages.** A user-role message whose text opens with an XML-style tag classifies as `.../injected` (category `harness_context`): `codex/response_item/message/user/injected`, `codex/event_msg/item_completed/UserMessage/injected`, `claude/user/injected`.\n  The report renders every tagged message, whatever its role, as titled blocks per top-level element rather than as prose.\n- **Design tokens.** The page's palette lives in `report.tokens.json`.\n  It covers per-theme colours, chart series, waterfall colours, category pill colours, fonts and the highlight style.\n  The file is bundled with the package and copied beside every report, so it can be edited in place and refreshed.\n  A project points at its own file with the ini key `xharness_report_design_tokens` or the flag `--xharness-report-design-tokens FILE`.\n  The replay command takes `--design-tokens`.\n  A missing or malformed file is an error, not a fallback.\n  The CSS keeps a fallback palette only for the moment before the tokens load.\n- **Standalone report.** `xharness_report_inline` / `--xharness-report-inline` (replay: `--inline`) writes `report.html` with everything embedded on `window.__XH_DATA__`.\n  That is the index, every result, every session log and the tokens.\n  The one file therefore opens over `file://`, and can be attached or mailed.\n  `<\/` inside embedded data is written `<\\/` so a log cannot terminate the script.\n\n## Consequences\n\n### Pros\n\n- Every percentage is qualified by its denominator, and a run that reports no window reports `null` rather than a guess.\n\n### Cons\n\n- Results and history written before this decision have no window or timing fields; the replay command fills them from the captured logs and envelopes.\n- Inline reports are large (they carry every log) and go stale the moment a cell re-runs; the fetching form stays the default.\n- Per-turn latency on Claude includes the harness's own time between receiving a tool result and sending the next request.\n  It is an upper bound on model time, which is why the session-level figure uses the harness's `duration_api_ms` where available.\n"}, "ADR-0025": {"file": "0025-results-name-their-case-and-charts-have-a-log-line-axis.md", "title": "A result names the case that produced it, and the per-turn charts have a session-log-line axis", "status": "accepted", "description": "say which question produced the evidence, and draw a measurement where it was taken", "markdown": "> **Lens**: Say which question produced the evidence, and draw a measurement where it was taken rather than where it would look smoother.\n\n## Relates to\n\n- Extends [ADR-0018](0018-fixtures-directory-and-metrics-history.md) (the record's status line says \"refines\")\n- Extends [ADR-0024](0024-context-window-metrics-injected-messages-and-design-tokens.md) (the record's status line says \"refines\")\n\n## Problem\n\n### Symptom\n\nA `SessionView` showed the harness, the model and the node id.\nIt did not show which suite file and case produced the run, which fixture it started from, or the prompt that was sent.\nWith one case per skill that was implicit; with a second suite it is not.\n\n### Pain point\n\nThe four per-turn charts answered \"what happened on turn 3\", but not \"what was the state at line 27 of the log\".\nThe second is the question a reader has while scrolling the turn's records.\n\n## Decision\n\n### The lens\n\n- **Given**: The session log does not know which case produced it, but the plugin does at the moment it runs the cell.\n- **We prefer**: Recording the case on the result and offering a session-log-line axis, over leaving the suite implicit and drawing only a per-turn axis.\n- **Because**: A measurement should be drawn where it was taken, rather than where it would look smoother.\n  Evidence should say which question produced it.\n- **Unless**: never\n\n### In practice\n\n- `RunResult.case` records `suite` (the `eval_*.py` path relative to the rootdir), `name`, `skill`, `fixture` and `prompt`.\n  The plugin fills it after a run, and the replay command carries it forward from the previous result, since the log does not know it.\n  The history line carries `suite`, `case`, `skill` and `fixture`, but not the prompt.\n  The index and `SessionMetaTable` carry all five, and `SessionTable` gains a `suite` column.\n- Every per-turn chart can be drawn against the session-log line instead of the turn (`ChartAxisToggle`).\n  A value holds from the line that measured it until the next measurement, drawn as a step.\n  That measuring line is the turn's first assistant record on Claude, and its `token_count` on Codex.\n  Turn starts are marked.\n  The waterfall becomes a stacked step area of cumulative tokens by category; the output and tier bars sit at their measuring line.\n  Nothing is interpolated between measurements.\n\n## Consequences\n\n### Pros\n\n- The per-line charts are honest about granularity: a flat segment means \"no new measurement\", not \"nothing happened\".\n\n### Cons\n\n- Results written before this decision show \"not recorded\" for the suite until replayed, and replay can only carry what an earlier result stored.\n"}, "ADR-0026": {"file": "0026-skill-ignore-lives-in-the-pytest-config.md", "title": "What is not decision surface is declared in the project's pytest config, not in a dotfile beside the skill", "status": "accepted", "description": "a plugin's configuration lives where its host keeps configuration, not in a new dotfile", "markdown": "> **Lens**: A plugin's configuration lives where its host keeps configuration; a convention the host's users have never seen needs a stronger reason than convenience.\n\n## Relates to\n\n- Extends [ADR-0023](0023-turn-boundaries-skill-ignore-and-replay.md) (the record's status line says \"refines\"; its skill-ignore decision)\n- Extends [ADR-0014](0014-register-through-the-pytest11-entry-point.md) (the record's status line says \"refines\")\n\n## Problem\n\n### Symptom\n\n0023 let a skill carry a `.skillignore` at its root, and separately let a project set `xharness_skill_ignore` in its pytest config.\nThe two lists were concatenated.\nIn practice the dotfile was the one that got used, because only it could say something about *one* skill.\nThe ini key had no way to scope a pattern.\n\n### Pain point\n\nA dotfile beside the skill is a new convention with nothing to anchor it.\nA pytest user expects a plugin's permanent, file-based configuration in the place pytest keeps its own.\nThat is `[tool.pytest.ini_options]` in `pyproject.toml`, or `pytest.ini`, `tox.ini` or `setup.cfg`.\nNothing in `pytest --help` or in the project's config hinted that a second file, in a directory pytest never looks in, was also being read.\nThe skill directory is also shipped to agents as-is.\nThe dotfile therefore rode along into every `--add-dir` and `$CODEX_HOME/skills` copy.\nThe agent could see it, and it described a tool the agent had never heard of.\n0014 already settled that every location the plugin reads is an ini key resolved against the rootdir; the dotfile was the one exception.\n\n## Decision\n\n### The lens\n\n- **Given**: pytest's own `markers` lines already use a `name: description` form, so a scoped pattern reads as pytest config rather than as a new grammar.\n- **We prefer**: `xharness_skill_ignore` as the only source of ignore patterns, over a `.skillignore` dotfile beside the skill or the two concatenated.\n- **Because**: A convention the host's users have never seen needs a stronger reason than convenience.\n  0014 already settled that every location the plugin reads is an ini key resolved against the rootdir.\n- **Unless**: never\n\n### In practice\n\n- `xharness_skill_ignore` is the only source of ignore patterns.\n  The `.skillignore` file is not read; a leftover one is just another dotfile, which 0022 never catalogues.\n- Each line of the key is either a bare gitignore-style pattern, which applies to every skill, or `<selector>: <pattern>`.\n  A selector applies to the skills whose directory name matches it under `fnmatch`.\n  `mermaidjs-diagrams: README.md` names one skill, and `*-diagrams: README.md` a family.\n  This is the form pytest's own `markers` lines use (`name: description`), so it reads as pytest config rather than as a new grammar.\n  A selector with nothing after the colon is a usage error that stops the session at configure time, before any cell is collected.\n  It would ignore nothing, and is almost certainly a typo.\n  The pattern grammar is unchanged from 0023.\n\n  ```toml\n  [tool.pytest.ini_options]\n  xharness_skill_ignore = [\n      \"README.md\",                                # every skill\n      \"mermaidjs-diagrams: resources/examples/**\",\n      \"mermaidjs-diagrams: scripts/{Makefile,CLAUDE.md}\",\n      \"mermaidjs-diagrams: scripts/*.json\",\n  ]\n  ```\n- The replay command runs outside a pytest session, so it resolves the key the way pytest would.\n  It takes the first ancestor of the captured directory holding a pytest config.\n  That is a `pytest.ini`, a `pyproject.toml` with `[tool.pytest.ini_options]`, a `tox.ini`, or a `setup.cfg` with a pytest section.\n  Its `--ignore` flag takes extra lines in the same form.\n  A replay and a live sweep therefore always agree on what is decision surface.\n\n## Consequences\n\n### Pros\n\n- A replay and a live sweep always agree on what is decision surface.\n\n### Cons\n\n- A project that had a `.skillignore` moves its lines into the ini key, prefixed with the skill's name, and deletes the file.\n  Until it does, every file of that skill is decision surface again, and `not_loaded` grows.\n- Patterns whose path contains `:` cannot be written as bare lines (the first colon is the selector boundary); such files are not portable anyway.\n- Skill authors who do not own the project's `pyproject.toml` no longer have a place to declare their skill's edges.\n  That is deliberate: which files count is a decision of whoever pays for the sweep.\n"}, "ADR-0027": {"file": "0027-coverage-follows-the-shells-working-directory.md", "title": "Skill coverage follows the shell's working directory", "status": "accepted", "description": "state a tool keeps between calls is part of every call's meaning, so the detector tracks cwd", "markdown": "> **Lens**: Read the log the way the harness executed it, not the way it was typed.\n> State that the tool keeps between calls is part of every call's meaning.\n\n## Relates to\n\n- Extends [ADR-0022](0022-record-kind-catalogue-and-skill-coverage.md) (the record's status line says \"refines\"; its detection rule)\n- Extends [ADR-0023](0023-turn-boundaries-skill-ignore-and-replay.md) (the record's status line says \"refines\"; replay re-annotates under the new rule)\n\n## Problem\n\n### Symptom\n\n0022 detects that a tool call touched a skill file when the call's arguments contain `<skill>/<path>`.\n0022's consequences already named the blind spot
