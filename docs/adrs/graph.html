060", "target": "ADR-0050", "label": "extends", "relation": "extends", "note": "the record's status line says \"extends\""}}, {"data": {"id": "ADR-0060-extends-ADR-0051", "source": "ADR-0060", "target": "ADR-0051", "label": "extends", "relation": "extends", "note": "the record's status line says \"extends\""}}, {"data": {"id": "ADR-0061-supersedes-ADR-0043", "source": "ADR-0061", "target": "ADR-0043", "label": "supersedes", "relation": "supersedes", "note": "part 3, the one-screen budget for SessionTable"}}, {"data": {"id": "ADR-0062-extends-ADR-0004", "source": "ADR-0062", "target": "ADR-0004", "label": "extends", "relation": "extends", "note": "the record's status line says \"refines\""}}, {"data": {"id": "ADR-0062-extends-ADR-0032", "source": "ADR-0062", "target": "ADR-0032", "label": "extends", "relation": "extends", "note": "the record's status line says \"refines\""}}, {"data": {"id": "ADR-0063-extends-ADR-0012", "source": "ADR-0063", "target": "ADR-0012", "label": "extends", "relation": "extends", "note": "the record's status line says \"refines\""}}, {"data": {"id": "ADR-0063-extends-ADR-0049", "source": "ADR-0063", "target": "ADR-0049", "label": "extends", "relation": "extends", "note": "the record's status line says \"extends\""}}, {"data": {"id": "ADR-0064-extends-ADR-0063", "source": "ADR-0064", "target": "ADR-0063", "label": "extends", "relation": "extends", "note": "the record's status line says \"refines\""}}, {"data": {"id": "ADR-0064-extends-ADR-0049", "source": "ADR-0064", "target": "ADR-0049", "label": "extends", "relation": "extends", "note": "the record's status line says \"extends\""}}, {"data": {"id": "ADR-0065-extends-ADR-0033", "source": "ADR-0065", "target": "ADR-0033", "label": "extends", "relation": "extends", "note": "the record's status line says \"refines\""}}, {"data": {"id": "ADR-0065-extends-ADR-0051", "source": "ADR-0065", "target": "ADR-0051", "label": "extends", "relation": "extends", "note": "the record's status line says \"refines\""}}, {"data": {"id": "ADR-0066-extends-ADR-0048", "source": "ADR-0066", "target": "ADR-0048", "label": "extends", "relation": "extends", "note": "the record's status line says \"refines\""}}, {"data": {"id": "ADR-0066-extends-ADR-0034", "source": "ADR-0066", "target": "ADR-0034", "label": "extends", "relation": "extends", "note": "the difference lives on the harness class, never a name check"}}, {"data": {"id": "ADR-0067-extends-ADR-0052", "source": "ADR-0067", "target": "ADR-0052", "label": "extends", "relation": "extends", "note": "the record's status line says \"extends\""}}, {"data": {"id": "ADR-0067-extends-ADR-0059", "source": "ADR-0067", "target": "ADR-0059", "label": "extends", "relation": "extends", "note": "the record's status line says \"extends\""}}, {"data": {"id": "ADR-0067-extends-ADR-0060", "source": "ADR-0067", "target": "ADR-0060", "label": "extends", "relation": "extends", "note": "the record's status line says \"extends\""}}], "layout": {"name": "cose"}, "height": 620}</script>
<script id="record-data" type="application/json">{"ADR-0001": {"file": "0001-ship-as-a-pytest-plugin.md", "title": "Ship as a pytest plugin with per-skill opt-in evals", "status": "accepted", "status_note": "accepted, 2026-08-20.\nThe in-repository package location named in the Decision is superseded by [0014](0014-register-through-the-pytest11-entry-point.md); the choice of a pytest plugin over a standalone CLI stands.", "markdown": "# 0001: Ship as a pytest plugin with per-skill opt-in evals\n\nStatus: accepted, 2026-08-20.\nThe in-repository package location named in the Decision is superseded by [0014](0014-register-through-the-pytest11-entry-point.md); the choice of a pytest plugin over a standalone CLI stands.\n\n## Context\n\nThe brief asked for a lightweight, portable harness that runs both agent CLIs headlessly, across a model matrix, with fixtures, goldens, and custom verifiers.\nA standalone CLI would re-implement discovery, selection, and reporting that pytest already provides.\nThe surrounding toolchain and test conventions were Python-first, with `uv` already the package manager in use.\n\n## Decision\n\nThe harness is a custom pytest plugin, first housed as a package inside the repository whose skills it evaluated.\nIt supplies shared fixtures and extends collection to find eval structures under `skills/<skill>/evals/`.\nA skill opts in by adopting that layout and nothing else.\n\n## Consequences\n\nBare pytest mechanics work unmodified: path arguments target one skill, `-k` and node ids select cells, the terminal report is pytest's.\nThe cost is that the harness inherits pytest's collection rules, which forced ADR 0008 and ADR 0009.\nRejected: a standalone argparse CLI (second surface to keep in step).\nAlso rejected: TypeScript with bun and Go (neither had test conventions to lean on for a pytest-shaped matrix).\n\n## Lens\n\nWhen a capability already lives in pytest, reuse it; add a plugin option only when pytest has no equivalent.\n"}, "ADR-0002": {"file": "0002-every-cell-invokes-the-real-cli.md", "title": "Every eval cell always invokes the real CLI", "status": "accepted", "status_note": "accepted, 2026-08-20.\nInside this package the boundary is the `pragma: no cover` on every function that spawns a CLI ([0014](0014-register-through-the-pytest11-entry-point.md)).", "markdown": "# 0002: Every eval cell always invokes the real CLI\n\nStatus: accepted, 2026-08-20.\nInside this package the boundary is the `pragma: no cover` on every function that spawns a CLI ([0014](0014-register-through-the-pytest11-entry-point.md)).\n\n## Context\n\nTwo project rules appeared to conflict: tests never mock, and paid agent runs are never a dependency of the free `ci` target.\nA record-and-replay tier was the first idea for reconciling them.\n\n## Decision\n\nThere is no replay layer, no recorded-fixture tier, and no `--live` flag.\nA cell always runs the real `claude` or `codex` process and always costs money.\nThe eval suite is a declared exception to the `ci` rule, recorded as a carve-out in the consuming project's rules.\nThe free `ci` target covers only `test_*.py` unit tests.\n\n## Consequences\n\nThe only signal the harness produces is real agent behaviour; a cell that did not invoke an agent has measured nothing.\nThe rules are reconciled by scoping, not by recording: unit tests are free and mock-free, evals are paid and mock-free.\nEvery sweep spends money, so the matrix became an explicit spend dial (ADR 0010).\n\n## Lens\n\nNever let a cell report a verdict without a real session log behind it.\nIf a run cannot be real, fail the cell; do not fake it.\n"}, "ADR-0003": {"file": "0003-runresult-is-a-stdlib-dataclass.md", "title": "RunResult is a stdlib dataclass serialised to JSON", "status": "accepted", "status_note": "accepted, 2026-08-20; JSON Schema file not yet written.", "markdown": "# 0003: RunResult is a stdlib dataclass serialised to JSON\n\nStatus: accepted, 2026-08-20; JSON Schema file not yet written.\n\n## Context\n\nTwo adapters produce one record.\nWithout a shared contract their shapes drift and parity becomes an assertion nobody can check.\nPydantic would validate but adds a dependency to a harness whose brief is minimal.\n\n## Decision\n\n`RunResult` is a `dataclasses.dataclass` serialised to flat JSON, with a committed `runresult.schema.json` that both adapters validate against.\n\n## Consequences\n\nThe plugin has no runtime dependency beyond pytest.\nThe schema is the single source of truth for parity.\nUntil the schema file ships, parity rests on both adapters returning the same dataclass.\nThe type checker enforces that, but a mismatched JSON artefact would not reveal it.\n\n## Lens\n\nPrefer a committed schema over a validation library; a schema is diffable and language-neutral, and it costs nothing at runtime.\n"}, "ADR-0004": {"file": "0004-workspace-is-a-plain-copy.md", "title": "A workspace is a plain copy of the fixture tree, with no git context", "status": "accepted", "status_note": "accepted, 2026-08-20.\nThe project `tmp/` location is now the `xharness_workdir` ini key, default `tmp/evals` ([0014](0014-register-through-the-pytest11-entry-point.md)).", "markdown": "# 0004: A workspace is a plain copy of the fixture tree, with no git context\n\nStatus: accepted, 2026-08-20.\nThe project `tmp/` location is now the `xharness_workdir` ini key, default `tmp/evals` ([0014](0014-register-through-the-pytest11-entry-point.md)).\n\n## Context\n\nSeveral skills a consuming project may want to evaluate reason about diffs and history.\nGiving every workspace a git repository costs setup time and forces fixtures to be committed subtrees.\nThe user ruled git-dependent skills out of scope for this iteration.\n\n## Decision\n\nEach cell's workspace is `shutil.copytree` of the fixture into the project `tmp/`, discarded and rebuilt per cell.\nNo `git init`, no worktree.\nA case that needs git must fail loudly rather than run in a git-less workspace and report a score.\n\n## Consequences\n\nMaterialisation is fast and trivially resettable, and keeps run artefacts under the project's `tmp/`.\nCode-review, change-walkthrough, refactoring and similar diff-reading skills cannot be evaluated yet.\nThe `workspace` fixture is the seam where a git strategy is added later, without a rewrite.\n\n## Lens\n\nDo not give a workspace capabilities no in-scope skill reads; add them at the workspace seam when a skill that needs them enters scope.\n"}, "ADR-0005": {"file": "0005-private-codex-home-per-run.md", "title": "A private per-run CODEX_HOME, seeded with the credential files", "status": "accepted", "status_note": "accepted, 2026-08-20; verified live 2026-08-21.", "markdown": "# 0005: A private per-run CODEX_HOME, seeded with the credential files\n\nStatus: accepted, 2026-08-20; verified live 2026-08-21.\n\n## Context\n\n`codex exec` has no caller-chosen session id.\nRollouts land under `$CODEX_HOME/sessions/YYYY/MM/DD/`.\nPicking the newest file by modification time races any concurrent Codex session, which is exactly the grading-the-wrong- transcript failure this harness exists to prevent.\n\n## Decision\n\nEach Codex cell runs with `CODEX_HOME` pointed at a private directory into which the harness first copies `auth.json` and `.credentials.json` from the real home.\nExactly one rollout can then exist under that directory, so correlation is structural.\nThe `session_meta` id in the rollout is the cell's session id.\n\n## Consequences\n\nOne mechanism serves three needs: log correlation, ambient-config isolation, and the skill-injection path (`$CODEX_HOME/skills`).\nThe accepted risk is that `CODEX_HOME` is also the credential store; the first live run proved seeding works.\nRejected: newest-by-mtime (races), stdout id alone (depends on flush order).\n\n## Lens\n\nWhen a tool offers no identity lever, isolate its whole state store so only one artefact can exist; never search for the newest one.\n"}, "ADR-0006": {"file": "0006-local-price-table-is-authoritative.md", "title": "A local prices.toml is authoritative, with an optional upstream seed", "status": "accepted", "status_note": "accepted, 2026-08-21; `--seed-prices` not yet built.\nThe table is now bundled inside the package and layered with the consumer's optional `xharness_prices` file ([0014](0014-register-through-the-pytest11-entry-point.md)).\nThe project-level override moved from a rootdir `prices.toml` into `xharness_prices` ini lines with [0030](0030-price-rows-live-in-the-pytest-config.md); the bundled table is unchanged.\nRefined by [0050](0050-prices-are-dated-records-in-usd-per-mtok-grouped-by-harness.md): the one table became dated `prices-YYYYMMDD.toml` records, grouped by harness, in USD per MTok.\nThe upstream seed was built as `make prices` with [0051](0051-long-context-is-a-tier-priced-per-call-and-records-are-curated.md).", "markdown": "# 0006: A local prices.toml is authoritative, with an optional upstream seed\n\nStatus: accepted, 2026-08-21; `--seed-prices` not yet built.\nThe table is now bundled inside the package and layered with the consumer's optional `xharness_prices` file ([0014](0014-register-through-the-pytest11-entry-point.md)).\nThe project-level override moved from a rootdir `prices.toml` into `xharness_prices` ini lines with [0030](0030-price-rows-live-in-the-pytest-config.md); the bundled table is unchanged.\nRefined by [0050](0050-prices-are-dated-records-in-usd-per-mtok-grouped-by-harness.md): the one table became dated `prices-YYYYMMDD.toml` records, grouped by harness, in USD per MTok.\nThe upstream seed was built as `make prices` with [0051](0051-long-context-is-a-tier-priced-per-call-and-records-are-curated.md).\n\n## Context\n\nNeither CLI's session log carries cost, and Codex reports none anywhere.\nThe LiteLLM feed was fetched and carries per-token input, output, cache-read, and cache-write rates for Anthropic models.\nIts coverage of Codex's aliased model names (for example `gpt-5.6-sol`) is unconfirmed.\n\n## Decision\n\nA committed `prices.toml` is the single authority for rates.\nA `--seed-prices` command will populate and refresh rows from upstream.\nIt will never overwrite a row marked as a local override, and will report every model it could not match.\n\n## Consequences\n\nClaude rates can be refreshed from a real upstream; Codex aliases stay hand-entered.\nUntil the seed command exists, every row is maintained by hand, and absolute USD figures lag provider changes.\nRelative comparison across cells stays robust regardless.\n\n## Lens\n\nKeep the price table owned, not generated.\nAn upstream is a convenience for filling it, never the thing the harness reads.\n"}, "ADR-0007": {"file": "0007-unpriced-model-aborts-before-spend.md", "title": "An unpriced model aborts at matrix expansion and never prices as zero", "status": "accepted", "status_note": "accepted, 2026-08-20.", "markdown": "# 0007: An unpriced model aborts at matrix expansion and never prices as zero\n\nStatus: accepted, 2026-08-20.\n\n## Context\n\nA model missing from the price table could be priced at zero with a warning, recorded as `null`, or treated as an error.\nZero makes an expensive sweep look free; `null` pushes the obligation onto every consumer of the report.\n\n## Decision\n\nPrice coverage is validated when the matrix expands, before any cell runs.\nAn unpriced model stops the sweep with the model named. `--dry-run` surfaces the same gap without spending.\n\n## Consequences\n\nA new model blocks a sweep until a row is added, which is the intended friction.\nThe failure lands before money is spent, so fail-loud costs nothing here.\n\n## Lens\n\nValidate anything that gates spend before the first paid call, and make the failure name the fix.\n"}, "ADR-0008": {"file": "0008-evals-are-eval-prefixed-modules.md", "title": "Evals are `eval_*.py` modules collected by a directory-scoped hook", "status": "accepted", "status_note": "accepted, 2026-08-20.\nRefined by [0016](0016-results-travel-on-the-test-report.md): the `eval_` prefix also applies to case functions.\nThe `skills/` root is now the `xharness_skills_dir` ini key ([0014](0014-register-through-the-pytest11-entry-point.md)).", "markdown": "# 0008: Evals are `eval_*.py` modules collected by a directory-scoped hook\n\nStatus: accepted, 2026-08-20.\nRefined by [0016](0016-results-travel-on-the-test-report.md): the `eval_` prefix also applies to case functions.\nThe `skills/` root is now the `xharness_skills_dir` ini key ([0014](0014-register-through-the-pytest11-entry-point.md)).\n\n## Context\n\nPaid eval cells must never be triggered by an ordinary unit-test run. pytest's `python_files` option is a single rootdir-level setting, so changing it to `eval_*.py` would stop `test_*.py` collecting across the whole repository.\n\n## Decision\n\nAn eval case is a Python module named `eval_*.py` under `skills/<skill>/evals/`, beside its `fixture/` and `captured/` directories.\nThe plugin collects it through its own `pytest_collect_file` hook scoped to that path shape. `python_files` is left at its default.\n\n## Consequences\n\nThe `eval_*` prefix separates paid cells from unit tests by name.\nBecause a case is an executable module, custom verifiers are ordinary functions and need no second mechanism (ADR 0013).\nA directory that matches the layout but defines no case fails collection loudly rather than contributing zero cells.\n\n## Lens\n\nSeparate paid work from free work by collection scope and name, never by a skip marker that exits green.\n"}, "ADR-0009": {"file": "0009-register-via-rootdir-conftest.md", "title": "Register the plugin from the rootdir conftest.py", "status": "superseded", "status_note": "superseded by [0014](0014-register-through-the-pytest11-entry-point.md) on 2026-08-21, the day it was accepted.\nReplaced an earlier draft that chose `addopts = -p <package>.plugin`.\nKept because its Lens still applies to any uninstalled plugin.", "markdown": "# 0009: Register the plugin from the rootdir conftest.py\n\nStatus: superseded by [0014](0014-register-through-the-pytest11-entry-point.md) on 2026-08-21, the day it was accepted.\nReplaced an earlier draft that chose `addopts = -p <package>.plugin`.\nKept because its Lens still applies to any uninstalled plugin.\n\n## Context\n\nA `conftest.py` inside the plugin's own package directory cannot hook collection under `skills/*/evals/`: conftest hooks apply only to their own subtree. `addopts = -p <package>.plugin` was tried next.\nVerified 2026-08-21, it is invocation-dependent for an uninstalled package.\n`python -m pytest` puts the cwd on `sys.path` and it works.\nThe bare `pytest` console script does not, and it fails with `ImportError: No module named '<package>'`.\n\n## Decision\n\nA one-line repository-root `conftest.py` declares `pytest_plugins = [\"<package>.plugin\"]`.\nImporting that file is what puts the root on `sys.path`, so it works under every invocation.\nSince pytest 7 the rootdir conftest is the one place `pytest_plugins` is honoured.\nThe eventual target is a PyPI package registering the same module through a `pytest11` entry point.\n\n## Consequences\n\nOne file lives outside the plugin package.\nThe package keeps an importable, package-shaped layout so extraction later is a packaging change. `pytest.ini` carries only a comment explaining why it does not register the plugin.\n\n## Lens\n\nTest a registration mechanism under both `python -m pytest` and the console script before adopting it; the two differ in what is importable.\n"}, "ADR-0010": {"file": "0010-matrix-options-and-dry-run.md", "title": "Global default matrix, per-case override, and --model / --cli / --dry-run", "status": "accepted", "status_note": "accepted, 2026-08-20.\nRefined by [0015](0015-harness-is-the-axis-and-the-project-owns-the-matrix.md): `--cli` is `--harness`, and a project-scope `xharness_matrix` sits between the case and the plugin default.", "markdown": "# 0010: Global default matrix, per-case override, and --model / --cli / --dry-run\n\nStatus: accepted, 2026-08-20.\nRefined by [0015](0015-harness-is-the-axis-and-the-project-owns-the-matrix.md): `--cli` is `--harness`, and a project-scope `xharness_matrix` sits between the case and the plugin default.\n\n## Context\n\nEvery cell is paid (ADR 0002), so the matrix is the spend dial. `-k` string matching against node ids can narrow a run but cannot price one in advance, and hides the cost control behind a substring.\n\n## Decision\n\nA default matrix lives in `matrix.py`; a case may override it.\nThe plugin adds three options: `--model` and `--cli` narrow the sweep, and `--dry-run` enumerates the cells that would run, with estimated USD, without invoking anything.\n\n## Consequences\n\nWidening the repository-wide sweep is a single edit.\nA sweep can be priced before it is paid for, which stock pytest cannot do.\nThe plugin owns three options beyond stock pytest, against the spirit of ADR 0001; each exists because pytest has no equivalent.\n\n## Lens\n\nExpose spend controls as explicit, discoverable options; never make the cost of a run depend on remembering a substring.\n"}, "ADR-0011": {"file": "0011-inject-skill-through-each-cli-path.md", "title": "The skill under test loads through each CLI's own skill path", "status": "accepted", "status_note": "accepted, 2026-08-20.", "markdown": "# 0011: The skill under test loads through each CLI's own skill path\n\nStatus: accepted, 2026-08-20.\n\n## Context\n\nThe deliverable being evaluated is a skill.\nInlining its body into the prompt would grade a prompt while still attributing the score to the skill.\nCopying it into the workspace as `.claude/skills/` only takes effect when settings sources are loaded, which fights the isolation goal.\n\n## Decision\n\nClaude receives the skill directory through `--add-dir`; Codex loads it from `$CODEX_HOME/skills/<skill>`.\nTwo mechanisms, each the path a real user's skill travels.\n\n## Consequences\n\nThe eval exercises skill loading, not just skill text.\nTwo injection paths must be kept in step in `runner.py`.\n\n## Lens\n\nEvaluate a deliverable through the loading path its real users take; a shortcut that bypasses loading changes what is being measured.\n"}, "ADR-0012": {"file": "0012-grading-is-composable-not-prescribed.md", "title": "Grading semantics are not prescribed; the plugin supplies primitives", "status": "accepted", "status_note": "accepted, 2026-08-21; golden-tree and projection primitives not yet shipped.", "markdown": "# 0012: Grading semantics are not prescribed; the plugin supplies primitives\n\nStatus: accepted, 2026-08-21; golden-tree and projection primitives not yet shipped.\n\n## Context\n\nAgent prose is non-deterministic, so byte-exact comparison of transcripts always fails, while loosening comparison too far produces a grader that cannot fail.\nWhat counts as a correct run differs per skill and is not knowable up front.\n\n## Decision\n\nNo single comparison semantic is mandated.\nA case is an ordinary function that composes checks with plain `assert` over the `RunResult` and the workspace.\nThe plugin's set of grading primitives is curated over time.\nAn LLM judge may join it later as one optional primitive, never as the house rule.\n\n## Consequences\n\nNew primitives are added without touching existing cases.\nThe one invariant that survives: a check that cannot evaluate raises; it never passes.\nToday only plain assertions are shipped; the reference case shows the intended layering.\n\n## Lens\n\nGive case authors tools, not a policy; enforce only that no check can silently pass.\n"}, "ADR-0013": {"file": "0013-verifiers-are-python-beside-the-case.md", "title": "Custom verifiers are Python modules beside the case", "status": "accepted", "status_note": "accepted, 2026-08-21; dynamic import helper not yet built.", "markdown": "# 0013: Custom verifiers are Python modules beside the case\n\nStatus: accepted, 2026-08-21; dynamic import helper not yet built.\n\n## Context\n\nSkills need checks the plugin did not anticipate.\nA shell command per verifier is portable but loses structured detail on failure.\nDeclarative assertions in a manifest only cover checks anticipated when the schema was written.\n\n## Decision\n\nA verifier is a plain Python callable.\nIt lives in `skills/<skill>/evals/`, is versioned with the cases that use it, and is imported by the case module like any other code.\nA verifier that fails to import fails the case loudly.\n\n## Consequences\n\nExtensibility uses a mechanism every Python developer already knows.\nNo registry, no DSL, no new file format.\nUntil a dedicated import helper exists, a case imports its verifiers directly.\n\n## Lens\n\nWhen extensibility is the goal, prefer the host language's own import mechanism over a plug-in registry.\n"}, "ADR-0014": {"file": "0014-register-through-the-pytest11-entry-point.md", "title": "Register through the pytest11 entry point of an extracted package", "status": "accepted", "status_note": "accepted, 2026-08-21.\nSupersedes [0009](0009-register-via-rootdir-conftest.md).\nRefined by [0017](0017-distributed-through-pypi-with-trusted-publishing.md): distribution moved from an editable path dependency to PyPI.\nAlso refined by [0026](0026-skill-ignore-lives-in-the-pytest-config.md): the per-skill `.skillignore`, the one location read outside the ini keys, is gone.", "markdown": "# 0014: Register through the pytest11 entry point of an extracted package\n\nStatus: accepted, 2026-08-21.\nSupersedes [0009](0009-register-via-rootdir-conftest.md).\nRefined by [0017](0017-distributed-through-pypi-with-trusted-publishing.md): distribution moved from an editable path dependency to PyPI.\nAlso refined by [0026](0026-skill-ignore-lives-in-the-pytest-config.md): the per-skill `.skillignore`, the one location read outside the ini keys, is gone.\n\n## Context\n\nThe harness began as an uninstalled package inside the repository whose skills it evaluated, registered by a rootdir `conftest.py` (ADR 0009).\nThat made the plugin and the evals it runs one undifferentiated change set.\nIt also tied three paths to `__file__`:\n\n- the skills root found by walking up the tree\n- the `tmp/evals` work directory\n- the `report.json` path inside the package\n\nThe brief always named extraction as the end state; the trigger was wanting to review plugin changes apart from eval changes.\n\n## Decision\n\nThe plugin is its own distribution, `pytest-xharness-eval`, with the module `pytest_xharness_eval`.\nIts `pyproject.toml` declares `[project.entry-points.pytest11] xharness_eval = \"pytest_xharness_eval.plugin\"`, and installing the package is the whole registration.\nDuring development the consuming repository installs it as an editable path dependency.\n\nEvery location the plugin needs is an ini key resolved against pytest's `rootpath`:\n\n- `xharness_skills_dir` (default `skills`)\n- `xharness_workdir` (default `tmp/evals`)\n- `xharness_prices` (default `prices.toml`, optional, layered over the bundled table)\n\nThe single `__file__`-relative path that remains is the bundled `prices.toml`.\n\n## Consequences\n\nConsumers carry no `conftest.py` or `pytest.ini` for the plugin.\nThey do need a config file at the repository root (an empty `[tool.pytest.ini_options]` suffices).\nThat makes the rootdir the repository and not the common ancestor of the arguments.\nThe report header names the resolved skills root and marks it missing when it is not there.\nThe plugin's own test suite runs through `pytester` as real nested sessions.\nThe functions that spawn a CLI are excluded from coverage with a stated reason rather than faked, which keeps ADR 0002 intact inside the package.\n\n## Lens\n\nWhen a plugin leaves its birthplace, every path it derived from `__file__` becomes a rootdir-relative option, and the registration becomes the entry point.\n"}, "ADR-0015": {"file": "0015-harness-is-the-axis-and-the-project-owns-the-matrix.md", "title": "Harness is the axis name, and the project owns the default matrix", "status": "accepted", "status_note": "accepted, 2026-08-21.\nRefines [0010](0010-matrix-options-and-dry-run.md).", "markdown": "# 0015: Harness is the axis name, and the project owns the default matrix\n\nStatus: accepted, 2026-08-21.\nRefines [0010](0010-matrix-options-and-dry-run.md).\n\n## Context\n\nThe first design named the first matrix axis \"cli\" (`--cli`, `Cell.cli`, `RunResult.cli`), while the package is named for cross-*harness* evaluation.\nTwo words for one axis is the kind of drift the vocabulary table exists to prevent.\nSeparately, the only way to change a repository's sweep was to edit the plugin's `DEFAULT_MATRIX` or to repeat `models=` on every case.\nThere was no project scope between the two.\n\nVisibility was also thin: a six-cell sweep printed as dots.\nThe verbose line said only `PASSED`, hiding the cost that had just been incurred.\n\n## Decision\n\nThe axis is called **harness** everywhere: the `--harness` option, `Cell.harness`, `RunResult.harness`, `KNOWN_HARNESSES`, and the `harness` key in `report.json`.\nMatrix entries stay `harness/model`.\n\nThe matrix has three scopes, highest precedence first: a case's `models=`, the project's `xharness_matrix` ini key, and the plugin's `DEFAULT_MATRIX`.\nA case that omits `models=` inherits; `EvalCase.models` is `None` in that state so inheritance is distinguishable from an explicit choice.\n\nTwo hooks carry the itemised view inside ordinary pytest output.\nBefore the first cell runs, `pytest_report_collectionfinish` lists every permutation grouped by case.\nAs each cell lands, `pytest_report_teststatus` replaces the verbose status word with the verdict, USD, token count, and duration, and shows `DRY-RUN` for a dry-run skip.\n\n## Consequences\n\nCaptured `.result.json` files written before this change carry a `cli` key; they are git-ignored run artefacts and are not migrated.\nConsumers see `--cli` rejected as an unknown option, which is the loud failure wanted.\nThe report header names which matrix scope applied, so a surprising cell count is diagnosable from the first two lines of output.\nA pivot report was considered and deferred: the requirement was visibility inside pytest's own output, not a second report.\n\n## Lens\n\nName an axis once, in the word the package is named for.\nGive every configurable default a project scope between the case and the plugin.\n"}, "ADR-0016": {"file": "0016-results-travel-on-the-test-report.md", "title": "Results travel on the test report, and cells group by harness", "status": "accepted", "status_note": "accepted, 2026-08-21.\nRefines [0008](0008-evals-are-eval-prefixed-modules.md).", "markdown": "# 0016: Results travel on the test report, and cells group by harness\n\nStatus: accepted, 2026-08-21.\nRefines [0008](0008-evals-are-eval-prefixed-modules.md).\n\n## Context\n\nPer-cell records (verdict, USD, tokens, duration) were kept on `config.stash`, which is per process.\nUnder `pytest-xdist` the workers run the cells and the controller renders the output.\nSo the verbose status words fell back to plain `PASSED` and `report.json` was empty.\nThe cells themselves were already isolated: each has its own workspace, its own private `CODEX_HOME`, and its own minted Claude session id.\n\nA second rule was missing: pytest's collection convention applies the `test_` prefix to files and functions alike.\nThis plugin pivoted that prefix to `eval_` for files only.\nAny function name was accepted.\n\n## Decision\n\nThe worker copies a cell's record onto its call `TestReport.user_properties`, the one channel xdist serialises to the controller.\nThe controller reads it there for the status word and accumulates it in `pytest_runtest_logreport` for the summary and `report.json`.\nThe single-process path is the same code.\n\nEvery cell carries `xdist_group=<harness>`, so `-n 2 --dist loadgroup` runs the harnesses in parallel and each harness's cells serially.\nThat respects per-provider rate limits and avoids concurrent copies of Codex credentials refreshing against each other, a risk not yet measured.\n\n`@evalcase` functions must be named `eval_*`; any other name is a `UsageError` at collection.\nThe `eval_` prefix is the collection rule for files and functions, as `test_` is for pytest.\n\n## Consequences\n\n`-v -n N` output is as itemised as a serial run.\nThe pre-run permutation summary is not printed under xdist because its controller does not call `pytest_report_collectionfinish`; `--collect-only -q` shows the plan instead.\nFull fan-out (`-n 6` without `--dist loadgroup`) is possible but is a deliberate choice, not the documented default.\n\n## Lens\n\nState that must reach the controller rides on the report; state that stays in a process belongs to that process only.\n"}, "ADR-0017": {"file": "0017-distributed-through-pypi-with-trusted-publishing.md", "title": "Distribute through PyPI with trusted publishing, released from a GitHub Release", "status": "accepted", "status_note": "accepted, 2026-08-21; first release (0.1.0) published to PyPI the same day from GitHub Release `v0.1.0`.\nRefines [0014](0014-register-through-the-pytest11-entry-point.md).", "markdown": "# 0017: Distribute through PyPI with trusted publishing, released from a GitHub Release\n\nStatus: accepted, 2026-08-21; first release (0.1.0) published to PyPI the same day from GitHub Release `v0.1.0`.\nRefines [0014](0014-register-through-the-pytest11-entry-point.md).\n\n## Context\n\nADR 0014 made the plugin its own distribution but left installation at \"an editable path dependency during development\".\nThat works only on a machine that holds both repositories side by side.\nIt is not something a consumer's `pyproject.toml` can record.\nThe README already instructs `uv add --dev pytest-xharness-eval`, which resolves only against an index.\nThe package follows the maintainer's standard packaging conventions:\n\n- a `uv_build` wheel\n- a `Makefile` as the command surface\n- publishing driven by CI rather than by a laptop\n\nA PyPI API token would work but is a long-lived secret to store and rotate.\nPyPI's trusted publishing instead issues a short-lived upload token against an OpenID Connect claim set that names the repository, the workflow file, and the environment.\n\n## Decision\n\nPyPI is the distribution channel and the only one a consumer is told about.\nA release is a GitHub Release: publishing it triggers `.github/workflows/publish.yml`.\nThat workflow builds the wheel with `uv build --wheel` and uploads with `uv publish` under the `pypi` environment with `id-token: write`.\nThe trusted publisher registered on PyPI for `pytest-xharness-eval` names exactly that owner, repository, workflow filename, and environment.\nNo publishing token is stored anywhere.\n\nThe version is declared twice, `version` in `pyproject.toml` and `__version__` in the package.\nA unit test pins them equal, so a bump to one without the other fails `make test` before a tag can be cut.\nTags are `vX.Y.Z` and match the wheel's version.\n\nThe editable path dependency remains a development convenience for working on the plugin against a live consumer; it is never what a consumer commits.\n`make publish-test` against TestPyPI and `make publish` stay as the manual, token-based fallback for when the OIDC path is unavailable.\n\n## Consequences\n\nA consumer pins a version from PyPI and gets the `pytest11` registration of ADR 0014 by installing it.\nThe consuming repository no longer needs to know where the plugin's source lives.\nUntil the first release is cut, `uv add --dev pytest-xharness-eval` fails with no matching version rather than installing something stale, which is the loud failure this project prefers.\nPublishing has one silent coupling.\nIf the environment name on PyPI's publisher differs from the workflow's `pypi` environment, the token exchange fails with a claims mismatch.\nThat mismatch is visible only in the Actions log.\nEvery release is a GitHub Release, which is also where the changelog lives (`project.urls.Changelog`).\n\n## Lens\n\nMake the release path one trigger with one identity:\n\n- a single event starts it\n- OIDC proves who is publishing\n- nothing long-lived has to be stored or rotated\n"}, "ADR-0018": {"file": "0018-fixtures-directory-and-metrics-history.md", "title": "Fixtures live under evals/fixtures/, and every live cell appends to a metrics history", "status": "accepted", "status_note": "accepted, 2026-08-21; revised the same day: `history.jsonl` lives under `captured/` and is not version-controlled.\nRefines [0004](0004-workspace-is-a-plain-copy.md) and [0016](0016-results-travel-on-the-test-report.md).", "markdown": "# 0018: Fixtures live under evals/fixtures/, and every live cell appends to a metrics history\n\nStatus: accepted, 2026-08-21; revised the same day: `history.jsonl` lives under `captured/` and is not version-controlled.\nRefines [0004](0004-workspace-is-a-plain-copy.md) and [0016](0016-results-travel-on-the-test-report.md).\n\n## Context\n\nA fixture was addressed by a path relative to `evals/` and conventionally placed beside a `captured/` directory named for the case.\nThat tied seed trees to single cases, although several scenarios can start from one seed.\nPer-run metrics existed only inside each git-ignored `.result.json`, so there was no history of a skill's evals over time.\nThe pre-run permutation summary added in 0015 was not needed and xdist's controller never printed it anyway.\n\n## Decision\n\nThe layout under `<skill>/evals/` is:\n\n```text\neval_<suite>.py            # eval_* functions\nfixtures/<name>/           # seed workspaces; @evalcase(fixture=\"<name>\")\ncaptured/<case>/           # each run's session log and .result.json; git-ignored\nhistory.jsonl              # one metrics line per live cell; committed\n```\n\nEach live cell appends one flat JSON record to `history.jsonl`:\n\n- timestamp\n- node\n- harness\n- model\n- session id\n- verdict\n- turns\n- tool calls (total and by name)\n- the agent-reported duration\n- the harness wall clock\n- USD\n- tokens by tier\n- files written\n\nThe same record rides on `TestReport.user_properties`, with its scalars as individual `xharness_*` properties so `--junitxml` carries them.\nIt also feeds the verbose status word (`PASSED  $0.1261  573,213 tok  71.0s  12 turns  9 tools`).\n\nThe pre-run permutation summary is removed. `--dist loadgroup` is an option, not a requirement: plain `-n N` is supported; `loadgroup` keeps one harness per worker.\n\n## Consequences\n\nA dry run touches neither `captured/` nor `history.jsonl`.\n`history.jsonl` grows by one line per paid cell and is the committed record of a skill's eval history.\nAnything richer is derived from it or from the captured results.\n\n## Lens\n\nSeed data is a pool, evidence is keyed by what produced it, and the metrics worth keeping are the ones small enough to commit.\n"}, "ADR-0019": {"file": "0019-per-call-ledger-and-ttl-priced-cache-writes.md", "title": "Every run carries a per-call ledger, tokens are reported as context and billed, and cache writes price by TTL", "status": "accepted", "status_note": "accepted, 2026-08-22.\nRefines [0003](0003-runresult-is-a-stdlib-dataclass.md), [0006](0006-local-price-table-is-authoritative.md) and [0018](0018-fixtures-directory-and-metrics-history.md).", "markdown": "# 0019: Every run carries a per-call ledger, tokens are reported as context and billed, and cache writes price by TTL\n\nStatus: accepted, 2026-08-22.\nRefines [0003](0003-runresult-is-a-stdlib-dataclass.md), [0006](0006-local-price-table-is-authoritative.md) and [0018](0018-fixtures-directory-and-metrics-history.md).\n\n## Context\n\nAn audit of six captured cells (2026-08-22) found every figure the plugin reported was arithmetically exact and still misleading on three counts:\n\n- `tokens` summed the four billed tiers over every model call.\n  The cached prefix is re-read on each call.\n  So a 13-call opus run with a 51k peak context reported 526k \"tokens\", ten times what the model ever held.\n  The number was right as a billing quantity and wrong as the quantity readers took it for.\n- `turns` meant two different things.\n  For Claude it was the envelope's `num_turns`, which equals tool calls plus one.\n  For Codex it counted `task_complete` events, which is always one for `codex exec`.\n  Neither was the number of model calls, although `_claude_usage` computed that number and discarded it.\n- Claude's own `total_cost_usd` sat 15% to 23% above `cost_usd`.\n  The price table carried one cache-write rate, the 5-minute TTL (1.25x input), while every write in every log was `ephemeral_1h` (2x input).\n  The remainder, $0.00107 per session, is Claude Code's `ai-title` side call, present in the envelope cost and absent from the main model's usage.\n\nThe per-call detail that explained all three was in the session logs the plugin already captures, and was thrown away during normalisation.\n\n## Decision\n\n`RunResult` carries a per-call ledger, `calls: list[Call]`.\nOne `Call` per model API call holds:\n\n- its `Usage`\n- its stop reason\n- the tool calls it issued\n- the tool results that entered its context since the previous call\n- its text\n\nBoth adapters build it.\nClaude keys on `message.id`.\nCodex keys on `token_count` events using `last_token_usage`.\nIt attributes the outputs that precede a count to the next call's context (that is the order the rollout records them in).\n\nFrom the ledger:\n\n- `turns` is the number of model calls on both harnesses.\n  The CLI's own figure is kept as `reported_turns`.\n- `usage` is the ledger's sum.\n  The CLI's own aggregate is kept as `reported_usage`.\n- `baseline_tokens` is the first call's context; `context_tokens` is the largest context any call processed. `Usage.total_tokens` remains the billed sum and is recorded as `billed_tokens`; the bare word `tokens` is retired from the history record and the status word.\n\n`Usage` gains `cache_write_1h_tokens` and `cache_write_5m_tokens` from Claude's `usage.cache_creation`. `Rates` gains `cache_write_1h`; a row that omits it gets `cache_write x 1.6`, the Anthropic ratio. `price()` bills tagged writes at their TTL rate and untagged writes at `cache_write`, and records `cost_by_tier`.\n\nThe status word becomes `PASSED  $0.6604 (cli $0.6615)  51,110 ctx  526,467 billed  87.1s  13 turns  12 tools`.\nIt shows the CLI's own cost beside the plugin's whenever one exists.\nSo drift is visible on every cell rather than rediscovered by audit.\n\n## Consequences\n\n`history.jsonl` records written before this decision carry `tokens` and no `billed_tokens`; readers treat the two as the same quantity.\nOld `.result.json` files have no `calls`; the report (ADR 0020) says so and offers nothing for them. `Usage` keeps its positional field order and `total_tokens`, so graders that assert `run.usage.total_tokens > 0` are unchanged.\nThe $0.00107 title-call residue stays outside `cost_usd` on purpose: it is not the model under test.\n\n## Lens\n\nKeep the per-call evidence; a sum is a view of it, and a sum without its parts cannot be audited.\n"}, "ADR-0020": {"file": "0020-captured-report-is-a-static-microsite.md", "title": "`captured/report.html` is a static microsite over the captured JSON", "status": "accepted", "status_note": "accepted, 2026-08-22.\nRefines [0018](0018-fixtures-directory-and-metrics-history.md).", "markdown": "# 0020: `captured/report.html` is a static microsite over the captured JSON\n\nStatus: accepted, 2026-08-22.\nRefines [0018](0018-fixtures-directory-and-metrics-history.md).\n\n## Context\n\nA sweep leaves `<skill>/evals/captured/` holding one `.result.json` and one session log per cell, plus `history.jsonl`.\nReading them meant a terminal and `jq`, and the per-call ledger introduced by [0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md) is too wide for a status word.\nThe first token audit was built as a one-off page by hand; the shape it needed is the shape every sweep needs.\n\n## Decision\n\nAfter every sweep that captured at least one cell, the plugin writes into each touched `captured/` directory:\n\n- `index.json`: one summary row per captured cell.\n  Each row holds:\n  - case, harness, model, session\n  - verdict and timestamp from `history.jsonl`\n  - cost, baseline / context / billed tokens, turns, tool calls\n  - the relative paths of its `.result.json` and log\n- `report.html`: one static page that fetches `index.json`.\n  It renders the sweep (cost and token charts, a sortable cell table).\n  It drills into a cell's `.result.json` to show:\n  - its reconciliation against the CLI's own aggregate\n  - cost by tier\n  - the per-call ledger with each call's tools, tool results, and text\n\nThe page is vanilla JavaScript with one pinned CDN chart library and no build step, in the manner of the richdocs skill.\nTemplated HTML plus relative-path JSON is a microsite.\nIt reads its theme from the OS, remembers a toggle in `localStorage`, and cache-busts every fetch.\nIt never embeds data: the JSON files beside it are the source, so re-running a cell and refreshing the page is the whole loop.\n\nThe template ships inside the package under `assets/` and is read with `importlib.resources`, the same way the bundled `prices.toml` is found.\nIt is the second and last bundled resource.\n\nBecause the page fetches relative paths it is served over HTTP, never opened from `file://`.\nThe terminal summary prints the page path and the one-line `python3 -m http.server` command that serves it.\n\n## Consequences\n\nA dry run writes nothing under `captured/`, so no report appears for it.\nA result written before 0019 lists in the index with its totals and no ledger; the page says so rather than drawing an empty chart.\nThe plugin's runtime dependencies are still pytest and the standard library (ADR 0003); the chart library loads in the browser.\n\n## Lens\n\nEvidence that is already JSON on disk needs a reader, not a database.\nA static page over relative paths is the cheapest reader that survives the next run.\n"}, "ADR-0021": {"file": "0021-metric-names-carry-unit-and-provenance.md", "title": "Metric names carry their unit and their source; the report has a named vocabulary and addressable ids", "status": "accepted", "status_note": "accepted, 2026-08-22.\nRefines [0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md) and [0020](0020-captured-report-is-a-static-microsite.md).\nThe `total_tokens` row is superseded by [0029](0029-the-billed-sum-is-named-accumulative-billed-tokens.md): the billed sum is `accumulative_billed_tokens`.", "markdown": "# 0021: Metric names carry their unit and their source; the report has a named vocabulary and addressable ids\n\nStatus: accepted, 2026-08-22.\nRefines [0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md) and [0020](0020-captured-report-is-a-static-microsite.md).\nThe `total_tokens` row is superseded by [0029](0029-the-billed-sum-is-named-accumulative-billed-tokens.md): the billed sum is `accumulative_billed_tokens`.\n\n## Context\n\nThe first report built on 0019 showed a `cost` and a `cli cost` column, a `baseline` and a `context` and a `billed` column.\nRead cold:\n\n- `cost` did not say whose cost\n- `billed` did not say billed what\n- `context` needed a paragraph to justify\n\nWhen the two cost columns disagreed, nothing recorded which price row had produced the estimate.\nSo a reader could not tell a stale table from a wrong formula without re-deriving both.\nFeedback on the report had no shared names for its parts, and no way to point at one turn of one session.\n\n## Decision\n\nMetric names state the unit and, where two sources exist, the source:\n\n| Was | Is | Meaning |\n|-----|----|---------|\n| `cost_usd` | `estimated_cost_usd` | this plugin's price-table estimate |\n| `reported_cost_usd` | `harness_reported_cost_usd` | the harness CLI's own figure |\n| `billed_tokens` / `tokens` | `total_tokens` | every billed token summed over turns |\n| `baseline` | `baseline_tokens` | the first turn's context |\n| `context_tokens` (headline) | removed | stays only per turn, inside the ledger |\n\nEvery priced result records `rates_applied`: the per-tier USD-per-token rates, the `prices.toml` row key, the file the row came from, and when it was applied.\nThe same block rides on the history line, so a decision made on a bad rate has a source to point at.\n\nThe ledger keeps everything:\n\n- tool inputs, tool results and assistant text are stored whole\n- thinking text is captured\n- each turn lists the 1-based line numbers of the captured session log it was built from\n\nThe report's detailed view renders all of it, including the raw records.\n\nThe report's parts have CamelCase names, carried as element ids and listed in a glossary shipped beside the page (`XHARNESS-REPORT-GLOSSARY.md`).\nA session is addressed by its harness-minted `SessionId` (a unique prefix is accepted); a turn by `SessionTurnId` = `<SessionId>/t<N>`.\nBoth are shown as click-to-copy badges and both appear in the URL fragment (`#session=…&turn=…&view=…`), which the page keeps current as the reader navigates.\n\n## Consequences\n\n`history.jsonl` lines written under 0019 carry the old keys.\nReaders that merge histories treat the old keys as the new ones:\n\n- `cost_usd` as `estimated_cost_usd`\n- `reported_cost_usd` as `harness_reported_cost_usd`\n- `billed_tokens` (or `tokens`) as `total_tokens`\n\n`RunResult.cost_usd` is gone: graders assert `run.estimated_cost_usd`.\nResult files grow to roughly the size of the session log they summarise; that is the price of a view that cuts nothing.\n\n## Lens\n\nA metric name is read without its definition beside it, so the name must carry the unit and the source.\nAnd a number nobody can trace to its inputs is an opinion.\n"}, "ADR-0022": {"file": "0022-record-kind-catalogue-and-skill-coverage.md", "title": "A catalogued record kind per log line, and skill file coverage per run", "status": "accepted", "status_note": "accepted, 2026-08-22.\nRefines [0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md) and [0021](0021-metric-names-carry-unit-and-provenance.md).\nThe detection rule is refined by [0027](0027-coverage-follows-the-shells-working-directory.md): shell commands are read at the working directory the shell actually had.", "markdown": "# 0022: A catalogued record kind per log line, and skill file coverage per run\n\nStatus: accepted, 2026-08-22.\nRefines [0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md) and [0021](0021-metric-names-carry-unit-and-provenance.md).\nThe detection rule is refined by [0027](0027-coverage-follows-the-shells-working-directory.md): shell commands are read at the working directory the shell actually had.\n\n## Context\n\nThe detailed view from 0021 rendered every raw session-log line as pretty JSON.\nThat proved to be the part of the report worth keeping.\nThe summaries beside it (tool calls, results, text, thinking) were re-renderings of the same lines with less information.\nRaw JSON, though, gives no visual cue when the kind of information changes from one line to the next.\nA 23k-character tool result, a five-token usage event and the user's prompt all look the same.\n\nSeparately, a skill is a tree of files an agent loads hierarchically.\nThe order is `SKILL.md`, then the resources it points at, then the scripts it is told to run.\nNothing measured which of those files a run actually touched.\nWhether a skill's decision paths fork the way its author intended was unobservable.\n\n## Decision\n\n**Record kinds.** `records.py` is the catalogue.\n`classify(harness, record)` maps a log line to a kind (`harness/type[/subtype]`).\n33 kinds were seen in the 2026-08-22 census of 21 logs across claude 2.1.237-2.1.239 and codex 0.148-0.149.\nEvery kind has a category (prompt, assistant text, thinking, tool call, tool result, tool execution, file change, usage, harness context, harness meta, session meta, lifecycle).\nEach category has one pill colour, chosen so white text passes WCAG AA on it.\nAn unseen shape classifies as `<harness>/unknown` rather than failing.\nEvery result carries `record_kinds`, a census of its log, so a new kind appearing after a CLI upgrade is visible in the next sweep.\nThe report mirrors the catalogue in JavaScript.\nIt has one component per kind that flips between its rendered view and the raw JSON, the pill coloured by category.\nThe turn detail is those components and nothing else.\n\n**Skill coverage.** `skillcov.py` catalogues the skill's files at collection time, so every cell of a sweep is measured against the same inventory:\n\n- per file: path, kind, size, hash\n- excluded: `evals/`, `node_modules/`, caches and dotfiles\n- kinds: `doc`, `script`, `test`, `asset`\n\nAfter a run it walks the per-turn ledger:\n\n- a tool call whose arguments contain `<skill>/<path>` loads that file\n- a shell call that runs a script through an interpreter runs it\n- a `Skill` tool invocation loads `SKILL.md`\n\nThe result carries `skill_coverage` with per-file `loaded` and `run` turns and the derived `not_loaded` and `not_run` sets.\nThe history line and the status word carry the counts.\n\n## Consequences\n\nDetection is textual.\nA file read through an alias the harness resolves itself, or a script run by a wrapper that never names the path, is a miss.\nThe raw records are beside the coverage table so such a miss can be seen and the detector extended.\n`not_run` excludes tests by construction.\nThe census and the coverage are per run, so sweeps over several models can be diffed.\nA resource that one model loads and another never does is a decision fork worth a case of its own.\n\n## Lens\n\nColour the kind of information, not the information; and measure which paths were taken before arguing about which should have been.\n"}, "ADR-0023": {"file": "0023-turn-boundaries-skill-ignore-and-replay.md", "title": "A turn owns its tools' results, skills declare what is not decision surface, and captures replay without spend", "status": "accepted", "status_note": "accepted, 2026-08-22.\nRefines [0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md) and [0022](0022-record-kind-catalogue-and-skill-coverage.md).\nThe skill-ignore decision is refined by [0026](0026-skill-ignore-lives-in-the-pytest-config.md): `.skillignore` is no longer read.\nReplay re-annotates coverage under [0027](0027-coverage-follows-the-shells-working-directory.md), which follows the shell's working directory.", "markdown": "# 0023: A turn owns its tools' results, skills declare what is not decision surface, and captures replay without spend\n\nStatus: accepted, 2026-08-22.\nRefines [0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md) and [0022](0022-record-kind-catalogue-and-skill-coverage.md).\nThe skill-ignore decision is refined by [0026](0026-skill-ignore-lives-in-the-pytest-config.md): `.skillignore` is no longer read.\nReplay re-annotates coverage under [0027](0027-coverage-follows-the-shells-working-directory.md), which follows the shell's working directory.\n\n## Context\n\nThree things surfaced from reading the first reports built on 0022.\n\nThe per-turn line ranges in a Claude session interleaved (turn 2: lines 12-18, 20, 22; turn 3: 19, 21, 23-29).\nClaude Code writes each content block of a message as its own record.\nIt appends a tool's result record the moment that tool finishes.\nSo the results of a turn's early tools land between that turn's later blocks.\nThe ledger attributed every non-assistant record to the *next* call, which was a rule about file order, not about what happened.\n\nThe skill coverage table listed 56 files for a skill whose decision surface is a dozen.\nExample galleries, lockfiles, linter configs and the skill's own unit tests were all \"not loaded\".\nWhich files matter is the skill author's call, and there was nowhere to say it.\n\nEvery report change so far was verified by re-running the paid matrix.\nA captured cell, though, already holds everything a result is derived from: its session log and the CLI's envelope.\n\n## Decision\n\n**Turn boundaries.** A record belongs to the turn that caused it:\n\n- a tool result belongs to the turn whose `tool_use` it answers (matched by `tool_use_id`)\n- any other record belongs to the turn in progress\n- records before the first call belong to the first call\n\nEach turn's `records` is therefore one contiguous, monotonic line range. `results_in` is unchanged: it still names the results that entered a call's context, which are the previous turn's results.\nCodex rollouts already satisfy the rule (a call's items, then its outputs, then its `token_count`).\n\n**Skill ignore.** A skill may carry a `.skillignore` at its root and a project may set `xharness_skill_ignore` in its pytest config.\nBoth are gitignore-style globs (`**`, `*`, `?`, `{a,b}`, trailing `/` for a directory, no-slash patterns match at any depth).\nIgnored files stay in the catalogue flagged `ignored` and are excluded from every coverage denominator and from `not_loaded` / `not_run`.\nThe hard exclusions of 0022 (`evals/`, `node_modules/`, caches, dotfiles) still apply first.\n\n**Replay.** `uv run -m pytest_xharness_eval.replay <captured dir>` rebuilds every `.result.json` from its log and stored envelope.\nIt also:\n\n- re-prices with the current tables\n- re-annotates coverage against the skill's current tree and ignore rules\n- rewrites the matching `history.jsonl` lines (verdict, timestamps and wall clock kept; metrics recomputed)\n- regenerates the report\n\nIt invokes no CLI.\nA result whose log is missing is an error, not a skip.\n\nThe report's record cards show the kind pill, the log line number, the record's timestamp and its size in every header.\nEach renders through one component library built bottom-up (values, blocks, tool payloads, messages, records).\nSo a command is a highlighted shell block whether it came from Claude's `Bash` tool or Codex's `exec` wrapper.\nAn edit is a diff, and a JSON payload is JSON.\n\n## Consequences\n\nOld results are not rewritten by a sweep; run the replay once after upgrading to bring them onto the current schema.\nReplay re-prices with *today's* table.\nSo a dated override (an introductory price) changes historical estimates when it is removed.\n`rates_applied` records which table each estimate used.\n`.skillignore` semantics are a subset of gitignore: no negation, no nested braces.\n\n## Lens\n\nAttribute evidence by cause, not by position.\nLet the owner of a surface declare its edges.\nAnd never pay to recompute what is already on disk.\n"}, "ADR-0024": {"file": "0024-context-window-metrics-injected-messages-and-design-tokens.md", "title": "Context window consumption and timing are first-class metrics, injected messages are not prompts, and the report is design-token themed and can be written standalone", "status": "accepted", "status_note": "accepted, 2026-08-23.\nRefines [0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md), [0020](0020-captured-report-is-a-static-microsite.md) and [0022](0022-record-kind-catalogue-and-skill-coverage.md).", "markdown": "# 0024: Context window consumption and timing are first-class metrics, injected messages are not prompts, and the report is design-token themed and can be written standalone\n\nStatus: accepted, 2026-08-23.\nRefines [0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md), [0020](0020-captured-report-is-a-static-microsite.md) and [0022](0022-record-kind-catalogue-and-skill-coverage.md).\n\n## Context\n\nThree gaps in the report after 0023.\n\nNothing said how close a run came to its model's context window.\nYet both harnesses report the window (Claude: `modelUsage[<model>].contextWindow`; Codex: `model_context_window` on `task_started` and every `token_count`).\nBoth also time their runs (Claude: `ttft_ms`, `duration_api_ms`; Codex: `time_to_first_token_ms`, `duration_ms`).\nThinking complicates the question of \"how full is the context\".\nThe provider withholds thinking text server-side and may drop earlier turns' thinking from later prompts.\nSo a reader cannot add up what they see.\n\nCodex writes its environment and plugin notes as *user*-role messages (`<environment_context>`, `<recommended_plugins>`).\nIt writes its policies as developer messages (`<permissions>`, `<skills_instructions>`, ...).\nThe catalogue of 0022 coloured the user-role ones as the prompt under test; they are harness context.\n\nThe page's colours lived in its CSS.\nThere was no way to brand a report, and no way to hand one file to someone without a web server.\n\n## Decision\n\n**Context window.** `RunResult.context_window` is the window the harness reported for the model.\nPer turn, `context_tokens` (`input + cache_read + cache_write`) is the prompt the provider says it processed, and `context_pct` is that over the window.\nThese are *measured*.\nWhatever the server retained or dropped of earlier thinking is already inside the provider's count, so no estimate is layered on top.\n`context_window_pct` (peak turn) and `final_context_pct` (last prompt plus its output) are top-level metrics, always qualified by the window size.\nThey appear on the history line, the status word (`ctx 7.2%`), the session table and `SessionMetaTable`.\nA line of the log is annotated with the measured figure of the turn it belongs to.\nA tool result is annotated with the next turn's figure, because that is the prompt it became part of.\nWhen the harness reports no window, percentages are `null`, never guessed.\n\n**Timing.** `ttft_ms` and `api_duration_ms` come from the harness; `output_tokens_per_sec` is output tokens over API time (else agent time).\nPer turn, `latency_ms` is the wall time from the previous log record to the turn's first record (request plus generation) and `output_tokens_per_sec` follows.\n\n**Injected messages.** A user-role message whose text opens with an XML-style tag classifies as `.../injected` (category `harness_context`): `codex/response_item/message/user/injected`, `codex/event_msg/item_completed/UserMessage/injected`, `claude/user/injected`.\nThe report renders every tagged message, whatever its role, as titled blocks per top-level element rather than as prose.\n\n**Design tokens.** The page's palette (per-theme colours, chart series, waterfall colours, category pill colours, fonts, highlight style) lives in `report.tokens.json`.\nIt is bundled with the package and copied beside every report so it can be edited in place and refreshed.\nA project points at its own file with the ini key `xharness_report_design_tokens` or the flag `--xharness-report-design-tokens FILE` (the replay command takes `--design-tokens`).\nA missing or malformed file is an error, not a fallback.\nThe CSS keeps a fallback palette only for the moment before the tokens load.\n\n**Standalone report.** `xharness_report_inline` / `--xharness-report-inline` (replay: `--inline`) writes `report.html` with the index, every result, every session log and the tokens embedded on `window.__XH_DATA__`.\nSo the one file opens over `file://` and can be attached or mailed.\n`<\/` inside embedded data is written `<\\/` so a log cannot terminate the script.\n\n## Consequences\n\nResults and history written before this decision have no window or timing fields; the replay command fills them from the captured logs and envelopes.\nInline reports are large (they carry every log) and go stale the moment a cell re-runs; the fetching form stays the default.\nPer-turn latency on Claude includes the harness's own time between receiving a tool result and sending the next request.\nIt is an upper bound on model time.\nThat is why the session-level figure uses the harness's `duration_api_ms` where available.\n\n## Lens\n\nReport what the provider measured, qualify every percentage by its denominator, and let the owner of the report own its palette.\n"}, "ADR-0025": {"file": "0025-results-name-their-case-and-charts-have-a-log-line-axis.md", "title": "A result names the case that produced it, and the per-turn charts have a session-log-line axis", "status": "accepted", "status_note": "accepted, 2026-08-23.\nRefines [0018](0018-fixtures-directory-and-metrics-history.md) and [0024](0024-context-window-metrics-injected-messages-and-design-tokens.md).", "markdown": "# 0025: A result names the case that produced it, and the per-turn charts have a session-log-line axis\n\nStatus: accepted, 2026-08-23.\nRefines [0018](0018-fixtures-directory-and-metrics-history.md) and [0024](0024-context-window-metrics-injected-messages-and-design-tokens.md).\n\n## Context\n\nA `SessionView` showed the harness, the model and the node id.\nIt did not show which suite file and case produced the run, which fixture it started from, or the prompt that was sent.\nWith one case per skill that was implicit.\nWith a second suite it is not.\nThe four per-turn charts answered \"what happened on turn 3\" but not \"what was the state at line 27 of the log\".\nThat is the question a reader has while scrolling the turn's records.\n\n## Decision\n\n`RunResult.case` records `suite` (the `eval_*.py` path relative to the rootdir), `name`, `skill`, `fixture` and `prompt`.\nThe plugin fills it after a run.\nThe replay command carries it forward from the previous result, since the log does not know it.\nThe history line carries `suite`, `case`, `skill` and `fixture` (not the prompt).\nThe index and `SessionMetaTable` carry all five, and `SessionTable` gains a `suite` column.\n\nEvery per-turn chart can be drawn against the session-log line instead of the turn (`ChartAxisToggle`).\nA value holds from the line that measured it (the turn's first assistant record on Claude, its `token_count` on Codex) until the next measurement.\nIt is drawn as a step, and turn starts are marked.\nThe waterfall becomes a stacked step area of cumulative tokens by category; the output and tier bars sit at their measuring line.\nNothing is interpolated between measurements.\n\n## Consequences\n\nResults written before this decision show \"not recorded\" for the suite until replayed, and replay can only carry what an earlier result stored.\nThe per-line charts are honest about granularity: a flat segment means \"no new measurement\", not \"nothing happened\".\n\n## Lens\n\nSay which question produced the evidence, and draw a measurement where it was taken rather than where it would look smoother.\n"}, "ADR-0026": {"file": "0026-skill-ignore-lives-in-the-pytest-config.md", "title": "What is not decision surface is declared in the project's pytest config, not in a dotfile beside the skill", "status": "accepted", "status_note": "accepted, 2026-08-23.\nRefines [0023](0023-turn-boundaries-skill-ignore-and-replay.md) (its skill-ignore decision) and [0014](0014-register-through-the-pytest11-entry-point.md).", "markdown": "# 0026: What is not decision surface is declared in the project's pytest config, not in a dotfile beside the skill\n\nStatus: accepted, 2026-08-23.\nRefines [0023](0023-turn-boundaries-skill-ignore-and-replay.md) (its skill-ignore decision) and [0014](0014-register-through-the-pytest11-entry-point.md).\n\n## Context\n\n0023 let a skill carry a `.skillignore` at its root and, separately, let a project set `xharness_skill_ignore` in its pytest config.\nThe two lists were concatenated.\nIn practice the dotfile was the one that got used, because only it could say something about *one* skill.\nThe ini key had no way to scope a pattern.\n\nA dotfile beside the skill is a new convention with nothing to anchor it.\nA pytest user expects a plugin's permanent, file-based configuration in the place pytest keeps its own.\nThat place is `[tool.pytest.ini_options]` in `pyproject.toml` (or `pytest.ini`, `tox.ini`, `setup.cfg`).\nNothing in `pytest --help` or in the project's config hinted that a second file, in a directory pytest never looks in, was also being read.\nAnd the skill directory is shipped to agents as-is.\nSo the dotfile rode along into every `--add-dir` and `$CODEX_HOME/skills` copy.\nIt arrived as a file the agent could see but that described a tool it had never heard of.\n0014 already settled that every location the plugin reads is an ini key resolved against the rootdir; the dotfile was the one exception.\n\n## Decision\n\n`xharness_skill_ignore` is the only source of ignore patterns.\nThe `.skillignore` file is not read; a leftover one is just another dotfile, which 0022 never catalogues.\n\nEach line of the key is either:\n\n- a bare gitignore-style pattern, which applies to every skill\n- or `<selector>: <pattern>`, which applies to the skills whose directory name matches the `fnmatch` selector\n\n`mermaidjs-diagrams: README.md` names one skill, `*-diagrams: README.md` a family.\nThis is the form pytest's own `markers` lines use (`name: description`), so it reads as pytest config rather than as a new grammar.\nA selector with nothing after the colon is a usage error that stops the session at configure time, before any cell is collected.\nThat is because it would ignore nothing and is almost certainly a typo.\nThe pattern grammar is unchanged from 0023.\n\n```toml\n[tool.pytest.ini_options]\nxharness_skill_ignore = [\n    \"README.md\",                                # every skill\n    \"mermaidjs-diagrams: resources/examples/**\",\n    \"mermaidjs-diagrams: scripts/{Makefile,CLAUDE.md}\",\n    \"mermaidjs-diagrams: scripts/*.json\",\n]\n```\n\nThe replay command runs outside a pytest session, so it resolves the key the way pytest would.\nIt uses the first ancestor of the captured directory holding one of:\n\n- a `pytest.ini`\n- a `pyproject.toml` with `[tool.pytest.ini_options]`\n- a `tox.ini`\n- a `setup.cfg` with a pytest section\n\nIts `--ignore` flag takes extra lines in the same form.\nA replay and a live sweep therefore always agree on what is decision surface.\n\n## Consequences\n\nA project that had a `.skillignore` moves its lines into the ini key, prefixed with the skill's name, and deletes the file.\nUntil it does, every file of that skill is decision surface again and `not_loaded` grows.\nPatterns whose path contains `:` cannot be written as bare lines (the first colon is the selector boundary); such files are not portable anyway.\nSkill authors who do not own the project's `pyproject.toml` no longer have a place to declare their skill's edges.\nThat is deliberate: which files count is a decision of whoever pays for the sweep.\n\n## Lens\n\nA plugin's configuration lives where its host keeps configuration; a convention the host's users have never seen needs a stronger reason than convenience.\n"}, "ADR-0027": {"file": "0027-coverage-follows-the-shells-working-directory.md", "title": "Skill coverage follows the shell's working directory", "status": "accepted", "status_note": "accepted, 2026-08-23.\nRefines [0022](0022-record-kind-catalogue-and-skill-coverage.md) (its detection rule) and [0023](0023-turn-boundaries-skill-ignore-and-replay.md) (replay re-annotates under the new rule).", "markdown": "# 0027: Skill coverage follows the shell's working directory\n\nStatus: accepted, 2026-08-23.\nRefines [0022](0022-record-kind-catalogue-and-skill-coverage.md) (its detection rule) and [0023](0023-turn-boundaries-skill-ignore-and-replay.md) (replay re-annotates under the new rule).\n\n## Context\n\n0022 detects that a tool call touched a skill file when the call's arguments contain `<skill>/<path>`.\n0022's consequences already named the blind spot: a file reached through something the harness resolves itself is a miss.\nThe first paid run of the second suite (`eval_dual_density`, Claude Opus 5, 2026-08-23) hit that blind spot squarely.\nThe agent did `cd …/skills/mermaidjs-diagrams && cat SKILL.md`, then `cat resources/diagram_organization.md`, then `bun run scripts/mermaid_complexity.ts …`.\nIt relied on the one thing Claude Code's `Bash` tool promises and Codex's `exec` does not.\nThat thing: the shell is persistent, so a `cd` in one call is the working directory of the next.\nNone of those commands contains the literal `mermaidjs-diagrams/SKILL.md`.\nThe run was scored `skill 0/18 loaded 0/4 run`.\nThe grader's \"did the agent run the gates it was told are mandatory\" check failed, and $1.95 bought a wrong verdict.\nReplaying the same log under a detector that follows the shell gives `7/18 loaded 3/4 run`, and re-grading the unchanged workspace passes every check.\n\nThe session log holds everything needed to do better.\nThe harness announces when it moves the shell back (`Shell cwd was reset to <dir>` inside the tool result).\nCodex carries an explicit `workdir` on every exec, and the result records the workspace the run started in.\n\n## Decision\n\n`annotate` models the shell per result.\n\n- The working directory starts at the run's workspace.\n- A `cd` segment in a persistent-shell tool call (`Bash`) moves it for the rest of that command and for the calls after it.\n- A `Shell cwd was reset to <dir>` in a tool result moves it back.\n- A `cd` whose target cannot be known makes it unknown until the next absolute `cd` or reset.\n  Examples: `~`, `$VAR`, a bare `cd`.\n\nCodex's exec tools run each call at their own `workdir` and a `cd` there does not persist.\n\nDetection itself is unchanged.\nA shell command is split at `&&`, `||`, `;`, `|` and newlines.\nThe rewrite applies in every segment whose working directory is the skill's root or a directory under it.\nThere, each relative token that looks like a file is rewritten to `<skill>/<sub>/<token>`.\nA token looks like a file when it:\n\n- contains a `.` or a `/`\n- does not start with `/`, `-`, `$` or a redirection\n- is not already qualified\n\nThe rewritten command is matched by 0022's rule.\n\n- `bun run scripts/gate.ts` after `cd <skill>` becomes `bun run <skill>/scripts/gate.ts` and is a run.\n- `cat SKILL.md` becomes `cat <skill>/SKILL.md` and is a load.\n- `echo done` stays a word.\n\nThe shell state lives inside `annotate`, derived from `result.calls` in order.\nSo the plugin's live path and replay produce the same coverage from the same log, and nothing is shared between results.\n\n## Consequences\n\nCoverage from a captured log can change when the detector improves; that is what replay is for.\nIt is also why a verdict that depends on coverage should be re-graded rather than re-bought.\nReplay keeps the verdict a cell was given at the time.\nSo a run scored under the old rule still reads `fail` in the history until it is re-run or a regrade step exists.\nThe report's raw records beside the coverage table show the difference.\n\nThe model is a heuristic over text:\n\n- A `cd` inside a subshell or a function is taken as persisting.\n- A heredoc's body is split like a command (its tokens are rewritten but match no file).\n- A token with a `.` in a segment under the skill that happens to name a real skill file is counted.\n\nEach of those errs toward counting a file.\nThat is the cheaper error for a tool whose purpose is to show the decision paths an agent never took.\n\n## Lens\n\nRead the log the way the harness executed it, not the way it was typed.\nState that the tool keeps between calls is part of every call's meaning.\n"}, "ADR-0028": {"file": "0028-report-is-built-from-a-component-workspace.md", "title": "The report page is built from a component workspace and shipped as one file", "status": "accepted", "status_note": "accepted, 2026-08-23.\nRefines [0020](0020-captured-report-is-a-static-microsite.md), [0021](0021-metric-names-carry-unit-and-provenance.md) and [0024](0024-context-window-metrics-injected-messages-and-design-tokens.md); keeps [0003](0003-runresult-is-a-stdlib-dataclass.md).", "markdown": "# 0028: The report page is built from a component workspace and shipped as one file\n\nStatus: accepted, 2026-08-23.\nRefines [0020](0020-captured-report-is-a-static-microsite.md), [0021](0021-metric-names-carry-unit-and-provenance.md) and [0024](0024-context-window-metrics-injected-messages-and-design-tokens.md); keeps [0003](0003-runresult-is-a-stdlib-dataclass.md).\n\n## Context\n\n`assets/report.html` grew to 870 lines of hand-written HTML, CSS and vanilla JavaScript in one file:\n\n- a component library built from template strings\n- a hash router\n- two chart axes\n- a record-card renderer\n- the theme plumbing\n\nPlotly and highlight.js were pulled from a CDN at view time.\nIt works, and 0021's named ids and glossary keep it legible.\nBut every change is made:\n\n- without types\n- without a test runner that can mount a component\n- without a formatter\n- without any way to see the page against real data short of re-running a sweep or a replay\n\nComposing a table by concatenating strings is how the `total_tokens` / `context %` columns came to sit beside each other and read as one quantity.\n\nThe bar the report is held to is a polished single-page application.\nThe tools that produce those are well known:\n\n- a typed component model\n- a design-system component library\n- a bundler\n- a unit-test runner that renders components\n- a linter and a formatter\n\nNone of them may become a runtime dependency of the Python package (0003).\nThe page must still be one static file that `report.py` copies beside the captured JSON, fetches from there or is populated inline.\nThat file is themed by `report.tokens.json` (0020, 0024).\n\n## Decision\n\nThe page is authored in `report-ui/`, a bun workspace.\nIts stack: Vite, React, TypeScript in strict mode, Tailwind and shadcn/ui components, Vitest with Testing Library, ESLint and Prettier.\n`bun run build` emits **one** self-contained `dist/index.html` with every script, style and font inlined (`vite-plugin-singlefile`).\nNothing is fetched from a CDN at view time any more.\nThe built file is promoted into `src/pytest_xharness_eval/assets/report.html` with `make ui-promote` and committed.\nSo the Python package ships a plain asset and keeps zero runtime dependencies; bun is needed to change the page, never to use the plugin.\n\nThree contracts from the first microsite are kept, so `report.py` does not change:\n\n- the `<!--XHARNESS_INLINE_DATA-->` marker at the top of `<head>`\n- the `window.__XH_DATA__` inline payload as the alternative to fetching `index.json`, `*.result.json`, `*.jsonl` and `report.tokens.json` from beside the page\n- the `#session/<id>[/turn/<n>]` hash routes\n\nThe element ids and names of 0021's glossary are the component names: `SessionTable` is `<SessionTable>`.\nA new panel gets its id, its glossary row and its component in the same change.\n\nDesign tokens theme shadcn.\n`applyTokens` writes every token as an `--xh-*` custom property at runtime.\n`index.css` aliases shadcn's semantic variables (`--background`, `--primary`, `--chart-1`, …) to them.\nSo a project's `xharness_report_design_tokens` file restyles every component without a rebuild.\n\nDevelopment is against real data.\n`make ui-dev CAPTURED=<skill>/evals/captured` serves the captured directory under the Vite dev server.\n`make ui-smoke CAPTURED=…` builds the page and populates it through `report.inline_page` (the same code path as `--xharness-report-inline`).\nIt then renders it headlessly in jsdom, printing the rows it mounted.\nThere are no fixture JSONs for the page to drift from.\n\nThe move is panel by panel.\nThis record lands the workspace, the contracts, the theming, `ReportHeader`, `SweepOverview` with `SessionTable`, and `SessionView` with `SessionMetaTable`.\nStill on the legacy template, and moved in later changes:\n\n- `TokenAccumulationChart`\n- the per-session charts (`ContextWindowChart`, `TokenWaterfallChart`, `TurnTiersChart`, `OutputPerTurnChart`, `ChartAxisToggle`)\n- `SessionTurnTable` and `TurnRawRecords` with the record-card component library\n- `SkillCoveragePanel`\n- `RecordKindsPanel`\n- `CostByTierPanel`\n- `ReconciliationPanel`\n- `FinalMessagePanel`\n\nCharts will use shadcn's
