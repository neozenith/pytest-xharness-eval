: a file reached through something the harness resolves itself is a miss.\nThe first paid run of the second suite (`eval_dual_density`, Claude Opus 5, 2026-08-23) hit that blind spot squarely.\nThe agent did `cd …/skills/mermaidjs-diagrams && cat SKILL.md`, then `cat resources/diagram_organization.md`, then `bun run scripts/mermaid_complexity.ts …`.\nIt relied on the one thing Claude Code's `Bash` tool promises and Codex's `exec` does not.\nThe shell is persistent, so a `cd` in one call is the working directory of the next.\n\n### Pain point\n\nNone of those commands contains the literal `mermaidjs-diagrams/SKILL.md`.\nThe run was scored `skill 0/18 loaded 0/4 run`.\nThe grader's \"did the agent run the gates it was told are mandatory\" check failed, and $1.95 bought a wrong verdict.\nReplaying the same log under a detector that follows the shell gives `7/18 loaded 3/4 run`, and re-grading the unchanged workspace passes every check.\n\n## Decision\n\n### The lens\n\n- **Given**: The session log holds everything needed to do better.\n  The harness announces when it moves the shell back, with `Shell cwd was reset to <dir>` inside the tool result.\n  Codex carries an explicit `workdir` on every exec, and the result records the workspace the run started in.\n- **We prefer**: Modelling the shell's working directory per result, and rewriting relative tokens before matching.\n  That is preferred over matching the literal text of a command as typed.\n- **Because**: State that the tool keeps between calls is part of every call's meaning.\n  Reading the log any other way buys wrong verdicts with real money.\n- **Unless**: a `cd` target cannot be known, in which case the working directory is unknown until the next absolute `cd` or reset.\n  An unknowable target is `~`, `$VAR`, or a bare `cd`.\n\n### In practice\n\n- `annotate` models the shell per result.\n  The working directory starts at the run's workspace.\n  A `cd` segment in a persistent-shell tool call (`Bash`) moves it for the rest of that command and for the calls after it.\n  A `Shell cwd was reset to <dir>` in a tool result moves it back.\n  A `cd` whose target cannot be known makes it unknown until the next absolute `cd` or reset.\n  An unknowable target is `~`, `$VAR`, or a bare `cd`.\n  Codex's exec tools run each call at their own `workdir` and a `cd` there does not persist.\n- Detection itself is unchanged.\n  A shell command is split at `&&`, `||`, `;`, `|` and newlines.\n  A segment counts when its working directory is the skill's root or a directory under it.\n  In such a segment, each relative token that looks like a file is rewritten to `<skill>/<sub>/<token>`.\n  A token looks like a file when it contains a `.` or a `/`, and is not already qualified.\n  It must also not start with `/`, `-`, `$` or a redirection.\n  The rewritten command is then matched by 0022's rule.\n  `bun run scripts/gate.ts` after `cd <skill>` becomes `bun run <skill>/scripts/gate.ts`, and is a run.\n  `cat SKILL.md` becomes `cat <skill>/SKILL.md`, and is a load.\n  `echo done` stays a word.\n- The shell state lives inside `annotate`, derived from `result.calls` in order.\n  The plugin's live path and replay therefore produce the same coverage from the same log, and nothing is shared between results.\n\n## Consequences\n\n### Pros\n\n- The plugin's live path and replay produce the same coverage from the same log, and nothing is shared between results.\n\n### Cons\n\n- Coverage from a captured log can change when the detector improves.\n  That is what replay is for, and it is why a verdict that depends on coverage should be re-graded rather than re-bought.\n- Replay keeps the verdict a cell was given at the time.\n  A run scored under the old rule therefore still reads `fail` in the history, until it is re-run or a regrade step exists.\n  The report's raw records beside the coverage table show the difference.\n- The model is a heuristic over text.\n  A `cd` inside a subshell or a function is taken as persisting.\n  A heredoc's body is split like a command, so its tokens are rewritten but match no file.\n  A token with a `.` in a segment under the skill is counted when it happens to name a real skill file.\n  Each of those errs toward counting a file.\n  That is the cheaper error for a tool whose purpose is to show the decision paths an agent never took.\n"}, "ADR-0028": {"file": "0028-report-is-built-from-a-component-workspace.md", "title": "The report page is built from a component workspace and shipped as one file", "status": "accepted", "description": "the build carries the dependencies so the wheel stays free of them", "markdown": "> **Lens**: Hold a user-facing page to the tooling a page of that quality is built with.\n> Let the build, not the runtime, carry the dependencies.\n\n## Relates to\n\n- Extends [ADR-0020](0020-captured-report-is-a-static-microsite.md) (the record's status line says \"refines\")\n- Extends [ADR-0021](0021-metric-names-carry-unit-and-provenance.md) (the record's status line says \"refines\")\n- Extends [ADR-0024](0024-context-window-metrics-injected-messages-and-design-tokens.md) (the record's status line says \"refines\")\n- Extends [ADR-0003](0003-runresult-is-a-stdlib-dataclass.md) (the record's status line says it \"keeps\" 0003's zero-runtime-dependency rule)\n\n## Problem\n\n### Symptom\n\n`assets/report.html` grew to 870 lines of hand-written HTML, CSS and vanilla JavaScript in one file.\nIt held a component library built from template strings, a hash router, two chart axes, a record-card renderer and the theme plumbing.\nPlotly and highlight.js were pulled from a CDN at view time.\nIt works, and 0021's named ids and glossary keep it legible.\nBut every change is made without types, without a test runner that can mount a component, and without a formatter.\nThere is also no way to see the page against real data, short of re-running a sweep or a replay.\n\n### Pain point\n\nComposing a table by concatenating strings is how the `total_tokens` / `context %` columns came to sit beside each other and read as one quantity.\n\n## Decision\n\n### The lens\n\n- **Given**: The bar the report is held to is a polished single-page application.\n  The tools that produce those are well known.\n  They are a typed component model, a design-system component library, a bundler, a unit-test runner that renders components, a linter and a formatter.\n  None of them may become a runtime dependency of the Python package (0003).\n  The page must still be one static file that `report.py` copies beside the captured JSON.\n  It fetches from there or is populated inline, and is themed by `report.tokens.json` (0020, 0024).\n- **We prefer**: A `report-ui/` bun workspace whose build emits one self-contained file, over hand-written HTML, CSS and vanilla JavaScript in a single committed asset.\n- **Because**: The build, not the runtime, then carries the dependencies: bun is needed to change the page, never to use the plugin.\n- **Unless**: parity with the legacy page is not yet reached, in which case `assets/report.html` stays the legacy page and `ui-promote` is not run.\n\n### In practice\n\n- The page is authored in `report-ui/`, a bun workspace.\n  It uses Vite, React, TypeScript in strict mode, Tailwind and shadcn/ui components, Vitest with Testing Library, ESLint and Prettier.\n  `bun run build` emits **one** self-contained `dist/index.html`, with every script, style and font inlined by `vite-plugin-singlefile`.\n  Nothing is fetched from a CDN at view time any more.\n  The built file is promoted into `src/pytest_xharness_eval/assets/report.html` with `make ui-promote`, and committed.\n  The Python package therefore ships a plain asset and keeps zero runtime dependencies.\n  bun is needed to change the page, never to use the plugin.\n- Three contracts from the first microsite are kept, so `report.py` does not change.\n  The first is the `<!--XHARNESS_INLINE_DATA-->` marker at the top of `<head>`.\n  The second is the `window.__XH_DATA__` inline payload, as the alternative to fetching `index.json`, `*.result.json`, `*.jsonl` and `report.tokens.json` from beside the page.\n  The third is the `#session/<id>[/turn/<n>]` hash routes.\n  The element ids and names of 0021's glossary are the component names, so `SessionTable` is `<SessionTable>`.\n  A new panel gets its id, its glossary row and its component in the same change.\n- Design tokens theme shadcn.\n  `applyTokens` writes every token as an `--xh-*` custom property at runtime.\n  `index.css` aliases shadcn's semantic variables to them, such as `--background`, `--primary` and `--chart-1`.\n  A project's `xharness_report_design_tokens` file therefore restyles every component without a rebuild.\n- Development is against real data.\n  `make ui-dev CAPTURED=<skill>/evals/captured` serves the captured directory under the Vite dev server.\n  `make ui-smoke CAPTURED=…` builds the page and populates it through `report.inline_page`, the same code path as `--xharness-report-inline`.\n  It then renders the page headlessly in jsdom, printing the rows it mounted.\n  There are no fixture JSONs for the page to drift from.\n- The move is panel by panel.\n  This record lands the workspace, the contracts, the theming, `ReportHeader`, `SweepOverview` with `SessionTable`, and `SessionView` with `SessionMetaTable`.\n  Still on the legacy template, and moved in later changes: `TokenAccumulationChart`.\n  Also the per-session charts `ContextWindowChart`, `TokenWaterfallChart`, `TurnTiersChart`, `OutputPerTurnChart` and `ChartAxisToggle`.\n  Also `SessionTurnTable` and `TurnRawRecords` with the record-card component library, `SkillCoveragePanel`, `RecordKindsPanel`, `CostByTierPanel`, `ReconciliationPanel` and `FinalMessagePanel`.\n  Charts will use shadcn's chart components over Recharts, replacing Plotly.\n  Until parity, `assets/report.html` stays the legacy page and `ui-promote` is not run.\n\n## Consequences\n\n### Pros\n\n- A contributor changing the page needs bun; one changing the plugin does not.\n- CI type-checks, lints, tests and builds the workspace on every push now.\n  Once the page is promoted, the same job rebuilds it and fails on a difference from the committed asset.\n  The two therefore cannot drift.\n\n### Cons\n\n- The built page is a ~330 kB committed artifact that changes on every UI change, which is the price of a dependency-free wheel.\n- `src/components/ui/` is shadcn's generated code and is excluded from lint and format.\n  The root `.gitignore`'s Python patterns (`lib/`, `dist/`) are carved out for `report-ui/src/lib/`.\n- While the move is in progress the two pages coexist; nothing a user sees changes until promotion.\n"}, "ADR-0029": {"file": "0029-the-billed-sum-is-named-accumulative-billed-tokens.md", "title": "The billed sum is named `accumulative_billed_tokens`", "status": "accepted", "description": "name the aggregation as well as the unit, or the name will be read two ways", "markdown": "> **Lens**: A name that can be read two ways will be; name the aggregation, not just the unit.\n\n## Relates to\n\n- Supersedes [ADR-0021](0021-metric-names-carry-unit-and-provenance.md) (supersedes one row (`billed_tokens` → `total_tokens`))\n- Extends [ADR-0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md) (the record's status line says \"refines\")\n\n## Problem\n\n### Symptom\n\n0019 recorded the run's billed sum as `billed_tokens`.\n0021 renamed it `total_tokens` on the grounds that \"`billed` did not say billed what\".\nThat rename was made inside a working session, and was not put to the project's owner as a decision.\nIt was noticed when a report row read as \"1,504,090 tokens consumed of a 1M context window, 12%\".\n\n### Pain point\n\n`total_tokens` says neither what is totalled nor over what.\nBeside a context percentage it invites exactly the misreading that occurred.\nThe billed sum across sixteen calls looked like a single quantity to compare with the window.\n[docs/token-accounting.md](../token-accounting.md) works through why the two figures differ by an order of magnitude for an ordinary run.\n\n## Decision\n\n### The lens\n\n- **Given**: 0021's own rule is that a name must carry the unit and the source; applied fully it must also carry the aggregation.\n- **We prefer**: `accumulative_billed_tokens`, over `total_tokens` or `billed_tokens`.\n- **Because**: The name then states the unit (tokens), the source (what was billed) and the aggregation (accumulated over calls).\n  It cannot then be read as a single quantity to compare with a context window.\n- **Unless**: the name belongs to something else.\n  The Claude Code record kind `claude/attachment/total_tokens_reminder`, and the vendors' own `total_tokens` fields in raw usage objects, keep the old spelling.\n\n### In practice\n\n- The billed sum is `accumulative_billed_tokens`.\n  It is the four priced tiers, `input`, `output`, `cache_read` and `cache_write`, summed over every model call of the run.\n  One name is used everywhere.\n  That is the property on `Usage`, and the key `usage` in `.result.json`.\n  It is also the history line, `index.json`, the verbose status word, both report pages and the glossary.\n  The per-call prompt size keeps its name, `context_tokens`, and its headline `peak_context_tokens`.\n- Two things keep the old spelling, because they are not this metric.\n  The first is the Claude Code record kind `claude/attachment/total_tokens_reminder`.\n  The second is the vendors' own `total_tokens` fields in raw usage objects: `reported_usage`, Codex `token_count` events, and any record JSON.\n  The reconciliation panel shows those under the vendor's name, beside the plugin's figure.\n\n## Consequences\n\n### Pros\n\n- The status word is longer by one long word, which is the point.\n\n### Cons\n\n- `run.usage.total_tokens` no longer exists.\n  Graders that asserted it assert `run.usage.accumulative_billed_tokens > 0` instead.\n  The two eval suites in the first consuming repository are updated in the same change.\n- Results and history lines written before this record carry the old key until replayed; `make evals-replay` rewrites them.\n"}, "ADR-0030": {"file": "0030-price-rows-live-in-the-pytest-config.md", "title": "Project price rows live in the pytest config, not in a prices.toml beside it", "status": "accepted", "description": "the second config file has to argue harder than the first, and prices state the published unit", "markdown": "> **Lens**: The second file a tool asks a project to maintain should have to argue for itself harder than the first.\n> State prices in the unit the price tag uses.\n\n## Relates to\n\n- Extends [ADR-0006](0006-local-price-table-is-authoritative.md) (the record's status line says \"refines\")\n- Extends [ADR-0014](0014-register-through-the-pytest11-entry-point.md) (the record's status line says \"refines\")\n- Extends [ADR-0026](0026-skill-ignore-lives-in-the-pytest-config.md) (the record's status line says \"refines\")\n- See also [ADR-0007](0007-unpriced-model-aborts-before-spend.md) (ADR 0007's stop-before-spend rule is unchanged)\n\n## Problem\n\n### Symptom\n\n0026 moved skill-ignore rules out of a dotfile beside the skill, and into the `xharness_skill_ignore` ini key.\nThe grounds were that a pytest plugin's permanent, file-based configuration belongs where pytest keeps its own.\nPrice overrides had the same shape left over.\nThe `xharness_prices` ini key named a *file*, `prices.toml` at the rootdir, whose TOML rows layered over the bundled table.\n\n### Pain point\n\nThe objection is the same.\nIt is a second configuration file, in a second format that nothing in `pytest --help` reveals the contents of, and one more thing to discover.\nThere is also a unit trap inside it: rows were USD **per token** (`5.0e-6`), while every provider publishes USD per million tokens.\n\n## Decision\n\n### The lens\n\n- **Given**: pytest's own `markers` lines already pair a name with its text.\n  A price row therefore reads as pytest config rather than as a new grammar.\n- **We prefer**: `xharness_prices` as a linelist of price rows in the pytest config.\n  That is preferred over an ini key naming a second `prices.toml` file at the rootdir.\n- **Because**: The second file a tool asks a project to maintain should have to argue for itself harder than the first.\n  It did not.\n- **Unless**: the table is the plugin's own versioned data.\n  The bundled `prices.toml` inside the package is unchanged, and remains the one `__file__` exception of 0014.\n\n### In practice\n\n- `xharness_prices` becomes a linelist of price rows, in the way pytest's own `markers` lines pair a name with its text:\n\n  ```toml\n  [tool.pytest.ini_options]\n  xharness_prices = [\n      \"gpt-5.6-terra: input=1.25 output=10.00 cache_read=0.125\",\n      \"claude-sonnet-5: input=2.00 output=10.00 cache_read=0.20 cache_write=2.50 cache_write_1h=4.00\",\n  ]\n  ```\n- Values are **USD per million tokens**, the unit providers publish; the plugin divides by 1e6.\n  `input` and `output` are required.\n  `cache_read` and `cache_write` default to `input`.\n  `cache_write_1h` defaults to `cache_write` × 1.6, Anthropic's 2.0/1.25 TTL ratio.\n  That is the same defaulting the bundled table has always had.\n  The selector before the colon is the model key, prefix-matched by `resolve` like any bundled row.\n- Because the bundled table stays per-token, a row pasted from it into the ini would under-price by a factor of a million.\n  A value below $0.001/MTok is therefore rejected as \"looks like a per-token rate\".\n  A malformed line, an unknown tier, or a missing required tier stops the session at configure time, before any cell is collected.\n  That is the same never-price-as-zero posture as 0007.\n- The bundled `prices.toml` inside the package is unchanged.\n  It is the plugin's own versioned data file, not project configuration, and remains the one `__file__` exception of 0014.\n  The replay command resolves `xharness_prices` from the project's pytest config the way it already resolves `xharness_skill_ignore`.\n  The reader is now `config_lines_of(captured, key)`.\n  Its `--prices FILE` flag becomes `--price LINE`, repeatable and with the same grammar.\n  `rates_applied.source` records `xharness_prices` for ini rows and the bundled file's path for bundled rows.\n\n## Consequences\n\n### Pros\n\n- A dated override such as an introductory price becomes one commented line in the pytest config, instead of a block in a side file.\n  Its expiry note then sits where the reviewer of the config change will see it.\n\n### Cons\n\n- A project that had a rootdir `prices.toml` moves each row onto one line, multiplying by 1e6, and deletes the file.\n  Until it does, its overrides are silently gone.\n  A model priced only there then stops the sweep at collection, loudly, per 0007.\n- A project whose ini still says `xharness_prices = \"prices.toml\"` now fails at configure time with the line-grammar error, which is the migration signal.\n"}, "ADR-0031": {"file": "0031-plotly-tamagui-and-a-deeplink-permutation-matrix.md", "title": "The report draws with Plotly on a Tamagui base, every state deeplinks, and a Playwright matrix sweeps them all", "status": "accepted", "description": "a quality bar over every permutation is only checkable if every state has a URL", "markdown": "> **Lens**: A quality bar stated over every permutation of the data is only checkable if every state is addressable by URL.\n> Something must also sweep them all.\n\n## Relates to\n\n- Extends [ADR-0020](0020-captured-report-is-a-static-microsite.md) (the record's status line says \"refines\")\n- Extends [ADR-0024](0024-context-window-metrics-injected-messages-and-design-tokens.md) (the record's status line says \"refines\")\n- Supersedes [ADR-0024](0024-context-window-metrics-injected-messages-and-design-tokens.md) (supersedes the fold-onto-the-last-colour series rule only)\n- Extends [ADR-0025](0025-results-name-their-case-and-charts-have-a-log-line-axis.md) (the record's status line says \"refines\")\n- Extends [ADR-0028](0028-report-is-built-from-a-component-workspace.md) (the record's status line says \"refines\")\n- Supersedes [ADR-0028](0028-report-is-built-from-a-component-workspace.md) (supersedes the shadcn/recharts component stack only)\n\n## Problem\n\n### Symptom\n\n0028 built the report page from a Vite workspace on shadcn/ui (radix) with recharts, smoke-tested by rendering the bundle in jsdom.\nThree pressures outgrew that stack:\n\n- The charts are the product.\n  recharts composes primitives well, but tops out early.\n  Its legends overflowed the card on sweeps with many sessions, and unified hover, SI ticks and step-stacked areas each needed hand-rolling.\n- The page's quality bar is \"AAA for every permutation of the results data\".\n  That is only checkable if every state is addressable by URL and something sweeps them all.\n- Two component systems (radix primitives styled by Tailwind classes) meant every interactive state was styled twice and animated nowhere.\n\n### Pain point\n\njsdom cannot render the real page (no layout, no canvas), so the smoke proved boot, not behaviour.\n\n## Decision\n\n### The lens\n\n- **Given**: The one static file must route with zero server rewrites and over `file://`.\n- **We prefer**: Plotly on a Tamagui base with History-API query-string routes and a tiered Playwright sweep, over recharts on shadcn/radix smoke-tested in jsdom.\n- **Because**: A quality bar stated over every permutation is only checkable if every state is addressable by URL.\n  Something must also sweep them all in a real browser.\n- **Unless**: never\n\n### In practice\n\n- Three moves, one per pressure.\n- **Plotly.js draws every chart.** `plotly.js-basic-dist-min` (scatter and bar, all the page needs) goes through one mount point, `components/charts/Plot.tsx`.\n  Layouts are built from `useChartTheme()`, which resolves the `--xh-*` custom properties to concrete values and re-resolves when the theme flips.\n  0024's design tokens therefore still own every colour.\n  Legends are DOM (`ChartLegend`): flexbox chips that wrap instead of overflowing and toggle a trace by re-rendering it as `legendonly`.\n  Series past the eight-colour token palette cycle through it, with a different line dash per lap.\n  That supersedes 0024's rule that a ninth session folds onto the last colour, which made nine of sixteen lines identical.\n- **Tamagui is the base UI and animation framework.** `components/ui/*` are hand-written Tamagui components now, not shadcn output; radix and Tailwind are both gone.\n  Layout, chrome and interactivity are Tamagui components with props.\n  The Tamagui themes hold `var(--xh-*)` references, both light and dark on purpose.\n  0024's `.dark` class flip on the root already swaps the underlying values.\n  Document content is semantic HTML, styled by one hand-written stylesheet (`index.css`) and token-driven like everything else.\n  That content is tables, record cards, code blocks and key/value grids.\n  One trap is load-bearing.\n  Tamagui injects its atomic classes at runtime, after the stylesheet.\n  Chrome that must overrule it, such as the segmented control, is therefore pinned with `!important`.\n  Positioning on Tamagui components is set through props, never classes.\n- **Every state deeplinks, and one Playwright test sweeps the matrix.** The URL is the single source of truth.\n  The routes are real History-API routes as query strings, not a fragment router.\n  Query rather than path segments, because the one static file must route with zero server rewrites and over `file://`.\n  `session`, `turn` and `view` keep their 0020 meanings.\n  They are joined by `axis` (0025's log-line axis) and `rec` (raw/nice records).\n  `line` is a record-level permalink that opens its owning turn and flashes the card.\n  `sort` and `dir` (overview table) and `theme` join them too.\n  A param absent from the URL means its default.\n  State never sticks across navigations, navigations push history entries, and legacy `#…` links upgrade to their query form on load.\n  `lib/permutations.ts` enumerates the covering matrix from the captured data itself.\n  That is every turn of every session in both views, plus one permutation per remaining param per view type.\n  Each state gets a deterministic filesystem-safe slug.\n  The matrix is tiered.\n  `small` constrains every dimension to one representative value: one session per harness, one mid turn, detailed view only.\n  `medium` constrains each to a few: one session per harness×model, first/middle/last turns, every variant.\n  `large` uses all of them.\n  The inner loop therefore stays seconds long, and the full-cost sweep is absorbed less frequently.\n  Tiers nest by slug, so a faster run refreshes a subset of the same artifact tree.\n  The singular `e2e/matrix.spec.ts` full-loads each permutation in a real browser, and asserts zero console errors.\n  It saves the screenshot, console transcript and network timings under `tmp/e2e/matrix/<slug>/`.\n  That slug is the shared, precise language for \"this exact state is broken\".\n  The jsdom smoke is replaced by `e2e/inline.spec.ts`, which opens the inline-populated build over `file://` and checks the glossary-id parity list in a real browser.\n\n## Consequences\n\n### Pros\n\n- `make ui-e2e CAPTURED=<dir> TIER=small|medium|large` sweeps the matrix (`SAMPLE=<n>` for an evenly spaced sample, `E2E_TARGET=dev` against the dev server); `make ui-smoke` needs a browser, not jsdom.\n- `window.__XH_PENDING__` (in-flight loads) and `[data-xh-loading]` markers are the page's settledness contract with the e2e suite.\n\n### Cons\n\n- Playwright's chromium must be installed once (`bunx playwright install chromium`).\n- The bundle grows to ~1.7 MB (Plotly basic inlined); still one file, still offline.\n- A new route param must be added to `lib/permutations.ts` in the same change, or the matrix silently stops covering it.\n"}, "ADR-0032": {"file": "0032-all-run-output-consolidates-under-a-cache-dir.md", "title": "All run output consolidates under `.xharness_eval_cache/`, and the report is one combine step", "status": "accepted", "description": "every writer owns a unique path and one combine step aggregates, as pytest-cov does", "markdown": "> **Lens**: Give every parallel writer a path of its own, and aggregate in one combine step.\n> Run output belongs in a git-ignored cache root, never in the source tree it measures.\n\n## Relates to\n\n- Extends [ADR-0014](0014-register-through-the-pytest11-entry-point.md) (the record's status line says \"refines\"; path resolution)\n- Extends [ADR-0018](0018-fixtures-directory-and-metrics-history.md) (the record's status line says \"refines\"; history)\n- Supersedes [ADR-0018](0018-fixtures-directory-and-metrics-history.md) (supersedes the `captured/` location and the `xharness_workdir` ini key)\n- Extends [ADR-0020](0020-captured-report-is-a-static-microsite.md) (the record's status line says \"refines\"; the microsite)\n- Supersedes [ADR-0020](0020-captured-report-is-a-static-microsite.md) (supersedes the one-report-per-captured-directory rule)\n\n## Problem\n\n### Symptom\n\nRun output used to land in two conventions at once.\nPer-cell workspaces and `report.json` sat under `tmp/evals/`, the `xharness_workdir`.\nEvidence sat under each skill's own tree at `<skill>/evals/captured/<case>/`, with a shared, appended `history.jsonl` beside it.\nThree pressures broke that shape:\n\n- A sweep across several skills produced several disconnected reports, and no page over the whole run.\n  The SPA had grown multi-skill affordances with no index that ever exercised them.\n- Build artifacts accumulated inside `skills/`, the source tree, and every consuming repo needed its own git-ignore lines for them.\n\n### Pain point\n\nThe shared `history.jsonl` was the one file two parallel writers could contend on.\nThat is exactly the problem pytest-cov solves with suffix files: every writer owns a unique path, and a single combine step aggregates.\n\n## Decision\n\n### The lens\n\n- **Given**: pytest-cov already solves parallel writer contention with suffix files and a combine step.\n- **We prefer**: One git-ignored cache root with a per-session directory per cell, and one combine step.\n  That is preferred over a shared appended `history.jsonl` and per-skill `captured/` directories inside the source tree.\n- **Because**: Every writer then owns a unique path: no shared file, no lock, and full parallelisation under xdist.\n  One `.*_cache/` ignore line covers everything.\n- **Unless**: scale demands it: plain `.json`/`.jsonl` stays, and a database or columnar format is complexity to adopt then, not before.\n\n### In practice\n\n- One git-ignored root, resolved against the pytest rootdir through the new `xharness_cache_dir` ini key (default `.xharness_eval_cache`, matching the common `.*_cache/` ignore convention).\n  `xharness_workdir` is gone.\n\n  ```text\n  .xharness_eval_cache/\n    build/                                   # per-cell isolated workspaces\n    results/{skill}/{harness}/{model}/{run_ts}/{session_id}/\n      log.jsonl                              # the session log, verbatim\n      result.json                            # the derived RunResult (replayable)\n      history.json                           # one metrics record\n    report/\n      report.json                            # the last run's summary\n      history.jsonl                          # aggregated from results/**/history.json\n      index.json, report.html, report.tokens.json, XHARNESS-REPORT-GLOSSARY.md\n  ```\n- **Suffix convention.** A cell writes only inside its own `{run_ts}/{session_id}/` directory: no shared file, no lock, and full parallelisation under xdist.\n  `run_ts` is one UTC stamp per pytest session, spelled `YYYYMMDDTHHMMSSZ`.\n  It is exported as `XHARNESS_EVAL_RUN_TS` so xdist workers agree.\n  Repeated runs therefore accumulate side by side instead of overwriting.\n- **One combine step.** At session end, and on every replay, the report step walks everything under `results/`: every skill, every run.\n  It aggregates the per-session `history.json` records into `report/history.jsonl`.\n  It writes one `index.json` and one `report.html` into `report/`.\n  Index rows point at evidence by relative path (`../results/…`), so serving the cache root serves the whole report: `python3 -m http.server --directory .xharness_eval_cache` → `/report/report.html`.\n- **Replay is also the migrator.** `python -m pytest_xharness_eval.replay <cache>` rebuilds every result under `results/` as before.\n  Pointed at a legacy `<skill>/evals/captured` directory, it migrates that evidence into the project's cache and then rebuilds.\n  The original is left untouched.\n- **Plain files stay.** Everything remains human-readable `.json`/`.jsonl`; a database or columnar format is complexity to adopt when scale demands it, not before.\n\n## Consequences\n\n### Pros\n\n- Skills directories no longer accumulate run output, and one `.*_cache/` ignore line covers everything.\n- The report is a sweep-level page: multiple skills, multiple runs, one index.\n  The SPA needed no data-contract change, because index rows were always opaque relative paths.\n\n### Cons\n\n- `report.json` moves from `tmp/evals/` to `.xharness_eval_cache/report/`.\n- Consuming repos drop `xharness_workdir` from their pytest config; `xharness_cache_dir` exists for the rare override.\n"}, "ADR-0033": {"file": "0033-subagent-transcripts-are-captured-and-billed.md", "title": "Subagent transcripts are captured evidence, and their tokens are billed", "status": "accepted", "description": "every thread the agent spawned is part of the run, so it is captured and billed", "markdown": "> **Lens**: Every thread the agent spawned is part of the run.\n> Capture its transcript and bill its tokens, or the verdict rests on a fraction of what actually happened.\n\n## Relates to\n\n- Extends [ADR-0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md) (the record's status line says \"refines\"; the ledger)\n- Extends [ADR-0021](0021-metric-names-carry-unit-and-provenance.md) (the record's status line says \"refines\"; nothing is truncated)\n- Extends [ADR-0032](0032-all-run-output-consolidates-under-a-cache-dir.md) (the record's status line says \"refines\"; the session directory layout)\n- See also [ADR-0005](0005-private-codex-home-per-run.md) (the private home already made the forked Codex rollouts the place they can all be found, and `primary_rollout()` already tells them apart)\n\n## Problem\n\n### Symptom\n\nSkills that instruct the agent to parallelise (the discovery skill spawns research subagents) produce more than one transcript per session:\n\n- Claude Code writes each spawned agent to `projects/<slug>/<session-id>/subagents/agent-<id>.jsonl`.\n  An `agent-<id>.meta.json` sidecar carries the agent type, the spawn description and the `toolUseId` of the Agent tool call that spawned it.\n  The primary session log holds no sidechain records at all.\n- Codex forks one rollout file per spawned thread under the same `CODEX_HOME`.\n  Its `session_meta` carries `source.subagent.thread_spawn` (nickname, agent path, depth) and `forked_from_id` naming the primary.\n  [0005](0005-private-codex-home-per-run.md) already made the private home the place they can all be found, and `primary_rollout()` already tells them apart.\n\n### Pain point\n\nBefore this decision those transcripts were dropped.\nThe tokens the spawned threads spent were invisible to the ledger.\nThe estimate under-billed the run: a discovery session's real bill was ~1.5-2x what the report said.\nAnd the evidence contract, that the verdict is tied to what the agent actually did, had a hole the size of every parallel thread.\n\n## Decision\n\n### The lens\n\n- **Given**: Both harnesses already write each spawned thread's transcript where the run's own isolation puts it.\n- **We prefer**: Capturing every subagent transcript and folding its usage into the run's bill, over dropping the spawned threads and reporting the primary alone.\n- **Because**: The verdict is tied to what the agent actually did, and a run's estimate that omits half its threads is not that.\n- **Unless**: a harness ever spawns subagents on a *different* model, at which point the at-the-run's-rates pricing needs revisiting.\n\n### In practice\n\n- **Capture.** Every subagent transcript is copied into `<session dir>/subagents/` beside `log.jsonl` (Claude's `.meta.json` sidecars included).\n  The runner passes Codex's forked rollouts explicitly; a captured session (and therefore replay) discovers them from the directory alone.\n- **Normalise.** Each transcript folds through the same ledger machinery as the primary, `claude_ledger` or the Codex fold.\n  `RunResult.subagents` lists one `Subagent` per thread, carrying the agent name, id and captured log path.\n  Each also carries its own `Call` ledger and `Usage`, and `parent_turn`, the primary turn that spawned it.\n  That turn is matched by tool-use id on Claude, and by spawn timestamp on Codex.\n- **Bill.** A subagent's usage folds into the run's `usage`.\n  `usage` is the whole bill, priced at the run's own rates, and `accumulative_billed_tokens` covers every thread.\n  `turns` and `calls` stay the primary thread's own.\n- **Render.** The report attributes each thread's bill to its spawning turn.\n  The token waterfall carries a `sub` category with its own design token, and the running cost line includes it.\n  The turn table shows a `SubagentBand` beneath the turn that spawned it.\n  That band is each spawned thread's own per-call ledger.\n\n## Consequences\n\n### Pros\n\n- A discovery-style session's estimate now matches what the provider will actually charge.\n  Sweeps re-price historical runs on replay, so cached totals rise once and stay honest.\n- Replay derives identical subagent ledgers from the captured directory, so the session directory remains the complete unit of evidence (0032).\n\n### Cons\n\n- A subagent is priced at the primary run's rates.\n  If a harness ever spawns subagents on a *different* model, the estimate mis-prices those threads.\n  The rates row a thread was priced with is `rates_applied`, so the drift is explainable.\n  Revisit when a harness reports per-thread models worth splitting.\n"}, "ADR-0034": {"file": "0034-a-harness-is-a-class-and-the-registry-is-the-only-dispatch.md", "title": "A harness is a class, the registry is the only dispatch, and the layers are named", "status": "accepted", "description": "give the axis a type, make the registry the only dispatch, and let a linter hold the boundary", "markdown": "> **Lens**: When one axis is named but stays a string, its behaviour spreads into every module that has to ask what it is.\n> The branches that *default* are worse than the ones that fail.\n> Give the axis a type, make the registry the only way to reach an implementation, and let a linter keep the boundary you just drew.\n\n## Relates to\n\n- Extends [ADR-0002](0002-every-cell-invokes-the-real-cli.md) (the record's status line says \"refines\"; the real CLI)\n- Extends [ADR-0014](0014-register-through-the-pytest11-entry-point.md) (the record's status line says \"refines\"; locations are ini keys)\n- Extends [ADR-0015](0015-harness-is-the-axis-and-the-project-owns-the-matrix.md) (the record's status line says \"refines\"; harness is the axis)\n- Extends [ADR-0023](0023-turn-boundaries-skill-ignore-and-replay.md) (the record's status line says \"refines\"; replay)\n\n## Problem\n\n### Symptom\n\n0015 named *harness* as the first matrix axis, but the axis stayed a bare string.\nThe behaviour behind it had accumulated across six modules in four unrelated dispatch idioms:\n\n| Site | Idiom | What a third harness did |\n| --- | --- | --- |\n| `matrix.KNOWN_HARNESSES` | tuple literal | failed loudly |\n| `runner.RUNNERS` | dict lookup | failed loudly |\n| `normalise.from_claude` / `from_codex` | no dispatch; different signatures | failed loudly |\n| `records.classify` | `if harness == \"claude\" else _classify_codex` | **read as Codex, silently** |\n| `replay.rebuild_result` | `if old[\"harness\"] == \"claude\": ... else:` | **read as Codex, silently** |\n| `skillcov._SHELL_TOOLS` | one set unioning both providers' tool names | mis-attributed coverage, silently |\n\nTwo of the six defaulted rather than failing.\nThat is the opposite of the evidence contract this plugin is built on.\n0002 says never grade a run whose evidence is missing or ambiguous.\n\n### Pain point\n\nThe signature asymmetry was the load-bearing defect.\nA Claude session log is *incomplete*.\nThe session id, `total_cost_usd` and the aggregate usage exist only on the `-p --output-format json` stdout envelope.\nA Codex rollout is self-contained, but records no process exit code.\nBecause that asymmetry was exposed through the interface rather than encapsulated, `replay.py` had to fabricate a synthetic Claude envelope out of a stored `result.json`.\nThat was eight lines of Claude-specific knowledge in the module that otherwise knows nothing about Claude.\n\nSeparately, three layers were interleaved.\n`plugin.py` was simultaneously the pytest interface, the config resolver, the cell execution sequence and the evidence writer.\n`replay.py` independently reimplemented the config resolver, a second pytest-rootdir walker built with `configparser`.\nIt also reimplemented the execution sequence: price, annotate, name the case, write the metrics record.\nNothing failed when those two copies drifted.\nA replay would simply produce a record a live run never would.\n\n## Decision\n\n### The lens\n\n- **Given**: A registry lookup can raise on an unregistered name, where a string comparison falls through to whichever branch is the `else`.\n- **We prefer**: A `Harness` class reached only through the registry, over four dispatch idioms spread across six modules.\n- **Because**: An unregistered name then raises `UnknownHarness` rather than being read as Codex, and a linter can hold the boundary rather than a convention.\n- **Unless**: never\n\n### In practice\n\n- **A harness is a class.** `Harness` (in `harness/base.py`) is the extension point.\n  A provider implements five members: `name`, `run`, `session_from_capture`, `classify_record`, and the `shell_tools` / `persistent_shells` its coverage attribution needs.\n  `register()` puts it in the registry.\n  `get(name)` is the only way to reach one, and an unregistered name raises `UnknownHarness` rather than falling through to a default.\n- **A session log is a class.** `SessionLog` holds the log *plus the side-channel its dialect needs*.\n  `ClaudeSessionLog` carries the stdout envelope, and `CodexSessionLog` the exit code and the forked rollouts.\n  Every caller therefore gets one uniform `to_result(workspace, files_written)`, and none has to know which dialect needs what.\n  The Claude envelope reconstruction moves to `ClaudeHarness.session_from_capture`, beside the dialect that requires it.\n- **The layers are named modules.** `settings.py` resolves configuration once, for both entry points.\n  `Settings.from_config` serves a live sweep, and `Settings.from_cache` a replay running outside any pytest session.\n  `pipeline.py` owns the sequence that both paths run over a `RunResult`.\n  It derives (price, annotate coverage, name the case), captures (log, subagent transcripts, result), and records metrics.\n  `plugin.py` keeps only pytest hooks and collection; `report.py` and `replay.py` keep only curation.\n  `normalise.py` keeps the shared folding primitives and knows about no provider at all.\n- **The boundary is enforced, not just documented**.\n  A ruff `TID251` banned-api rule fails the build if anything outside the harness package imports `harness.claude` or `harness.codex` by name.\n  It carries an owner and a 2027-08-28 review date in `pyproject.toml`.\n  If the registry is ever abandoned, the rule is deleted rather than left to mislead.\n- `runner.py` is gone.\n  Its shared half (`RunError`, `spawn`, the default timeout) is `harness/base.py`; each provider's half is its own module.\n  The `pragma: no cover` markers move with the code they justify: spawning a CLI is still never mocked or faked (0002).\n\n## Consequences\n\n### Pros\n\n- Adding a third CLI is one new module under `harness/` and one `register()` call.\n  `matrix.known_harnesses()` reads the registry, so a harness cannot be runnable but unmatrixable.\n  The two silent Codex defaults are now `UnknownHarness`.\n- Behaviour is unchanged, and that is checked rather than asserted.\n  `tests/test_characterization.py` pins the whole serialised `RunResult` for a rich capture of each dialect against a golden.\n  It also pins that a replay reproduces the live result from the captured directory alone.\n  Those goldens did not move across any step of this change.\n  They normalise out the tmp path and the `rates_applied` wall-clock stamp, because pinning either would pin noise.\n- Extraction made previously unreachable code testable.\n  The evidence-capture and metrics-record steps used to sit inside `plugin.EvalItem._run_live`, behind the `pragma: no cover` that the paid CLI call requires.\n  In `pipeline.py` they are ordinary functions, tested without invoking anything.\n- `report.py` and the report UI are untouched: no key of `result.json`, `index.json` or `history.jsonl` changes, so `report-ui/src/lib/types.ts` and the glossary stay valid.\n\n### Cons\n\n- Two coverage cases had been sharing one fixture that put Claude's `Bash` and Codex's `exec` on a single run.\n  That only type-checked because `_SHELL_TOOLS` unioned both vocabularies.\n  A result comes from exactly one harness, so that test is now two.\n"}, "ADR-0035": {"file": "0035-the-nouns-carry-their-own-invariants.md", "title": "The nouns carry their own invariants", "status": "accepted", "description": "put the sum on the type that owns it, so the illegal state stops being a reviewer's job", "markdown": "> **Lens**: A rule that lives in a docstring is enforced by whoever read it last.\n> Put the sum on the type that owns it, make the multi-field write a single method, and give the record a name.\n> The illegal state then stops being something reviewers have to watch for.\n\n## Relates to\n\n- Extends [ADR-0003](0003-runresult-is-a-stdlib-dataclass.md) (the record's status line says \"refines\")\n- Extends [ADR-0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md) (the record's status line says \"refines\"; the per-call ledger)\n- Extends [ADR-0021](0021-metric-names-carry-unit-and-provenance.md) (the record's status line says \"refines\"; rates travel with the estimate)\n- Extends [ADR-0022](0022-record-kind-catalogue-and-skill-coverage.md) (the record's status line says \"refines\"; skill coverage)\n- Extends [ADR-0025](0025-results-name-their-case-and-charts-have-a-log-line-axis.md) (the record's status line says \"refines\"; a result names its case)\n- Extends [ADR-0033](0033-subagent-transcripts-are-captured-and-billed.md) (the record's status line says \"refines\"; subagents are billed)\n- Extended by [ADR-0036](0036-a-folding-constructor-declares-its-keyword-fields.md) (the folding constructors' keyword fields are declared and type-checked there)\n\n## Problem\n\n### Symptom\n\n0034 gave the *harness* axis a type and ended four dispatch idioms.\nEverything downstream of `SessionLog.to_result` was still dict-and-string plumbing, and four of this plugin's load-bearing rules survived only as prose repeated in docstrings:\n\n| Rule | How it was held | How it could break |\n| --- | --- | --- |\n| A run's `usage` is its whole bill: the primary ledger plus every subagent | `normalise.sum_usage` + `normalise.attach_subagents`, called by each adapter by hand | `attach_subagents` mutated `result.usage` in place, so calling it twice silently doubled the bill of every spawned thread |\n| An estimate never exists without the rates behind it (0021) | `pricing.price` assigning four `RunResult` fields in order, from a foreign module | any one of the four could be written, or left, alone |\n| `cost_status` is `priced` or `unpriced` | a `str` field with two string literals in two modules | a third spelling type-checked |\n| The case and the coverage records have fixed shapes | `dict[str, Any]`, hand-built in `pipeline.case_record`, `replay.case_meta` and `skillcov.annotate`/`catalog` | three hand-built copies of one key set, and `history.metrics_of` `.get()`-ing keys nothing guaranteed |\n\n### Pain point\n\nTwo of those are not stylistic.\n`Usage.add` was the only mutable accumulator in the model.\nThe one thing that must be summed exactly once is the number every verdict's cost is computed from.\nAnd the four cost fields written in sequence by another module is the same shape of defect 0034 removed from classification.\nThe invariant lived in the caller, so every caller had to be trusted with it.\n\nEach harness adapter also still exposed a `from_<provider>` module function that its `SessionLog.to_result` forwarded to in one line.\nThat was the last remnant of the pre-0034 signatures, and the reason the fold sat outside the class that owns it.\n\n## Decision\n\n### The lens\n\n- **Given**: A rule that lives in a docstring is enforced by whoever read it last.\n- **We prefer**: Invariants held by the types that own the data, over rules repeated in docstrings and trusted to every caller.\n  Those invariants are a frozen `Usage`, one folding constructor, an atomic `apply_cost`, and named records.\n- **Because**: The failure mode is then unrepresentable rather than merely undocumented.\n- **Unless**: the code is `pragma: no cover` by 0002.\n  The paid `run_claude` / `run_codex` spawn functions stay module-level, because a motion bug in them would be discovered only by spending money.\n\n### In practice\n\n- **A total is a value, not an accumulator.** `Usage` is frozen and gains `__add__` and `Usage.total(...)`.\n  `Usage.add` is gone, and with it `normalise.sum_usage` and `normalise.attach_subagents`.\n- **One folding constructor computes the bill once**.\n  `RunResult.folded(calls, subagents, **fields)` sets `turns = len(calls)` and `usage = Σ calls + Σ subagents`, and sorts the subagents.\n  `Subagent.folded(calls, ...)` is its counterpart for one spawned thread.\n  Both adapters build their result through it, so a second fold cannot bill a subagent twice.\n  The failure mode is now unrepresentable rather than merely undocumented.\n- **A price is applied atomically.** `pricing.CostEstimate` (total, per-tier split, `AppliedRates` provenance) is built by `CostEstimate.of(usage, rates)` and applied by the single method `RunResult.apply_cost`.\n  `Rates` owns the arithmetic that prices a `Usage`.\n  No module outside `runresult.py` writes a cost field.\n  `cost_status` is a `StrEnum`: a `str` subclass, so `asdict` keeps the member and `json.dumps` writes the same word the wire format has always carried.\n- **The two hand-built records become types.** `CaseRef` (`of` from a live case, `stored` from a capture) replaces `pipeline.case_record` and the mapping `replay.case_meta` returned.\n  `SkillFile`, `FileCoverage`, `CoverageSummary` and `SkillCoverage` replace the mappings `skillcov.catalog` and `annotate` built.\n  `SkillCoverage.over` derives the four path sets and the summary from the annotated rows in one place, so they cannot disagree with each other.\n  `FileKind` and `Access` are `StrEnum`s.\n- **The fold belongs to the session log.** `from_claude` and `from_codex` are gone; their bodies are `ClaudeSessionLog.to_result` and `CodexSessionLog.to_result`.\n  The paid `run_claude` / `run_codex` spawn functions stay module-level.\n  They are `pragma: no cover` by 0002, so a motion bug in them would be discovered only by spending money.\n- **`ignorerules.py` is its own module.** The `xharness_skill_ignore` line selection and the gitignore-pattern subset know nothing about skills, runs or harnesses.\n  `IgnoreRules.for_skill(skill, lines)` compiles them once, and `.matches(rel)` is the only question asked of them.\n  `skillcov.py` is now about coverage alone.\n- **`asdict` stays the serialiser.** `RunResult.to_dict` is still `asdict(self)` plus derived keys, and never a per-field `.to_dict()` walk.\n  That is what renders the typed records into the exact key sets they declare, while passing a plain mapping straight through.\n  It is also why `usage` stays a field rather than becoming a computed property.\n  `asdict` drops properties, and `usage` is a key of `result.json`.\n  The three optional records (`case`, `skill_coverage`, `rates_applied`) serialise as `{}` when absent, as they always have.\n\n## Consequences\n\n### Pros\n\n- Every serialised contract is unchanged, and that is checked rather than claimed.\n  `tests/test_characterization.py` pins the whole `RunResult` of a rich capture per dialect.\n  It also pins that a replay reproduces the live result from the captured directory alone.\n  Both goldens are byte-identical across this change, so `report.py`, `report-ui/src/lib/types.ts` and the glossary stay valid.\n- `skillcov.py` drops from 491 to 397 lines; `runresult.py` grows to 382 as the invariants move next to the data they constrain.\n- The unit tests changed shape with the API.\n  Mapping subscripts became attribute access, and the two `from_<provider>` call sites became their session-log classes.\n  No assertion was weakened to accommodate the move.\n\n### Cons\n\n- `history.metrics_of` reads attributes instead of `.get()`-ing keys, but still emits a flat mapping of builtins.\n  That record travels to the xdist controller on `TestReport.user_properties`, which serialises builtins only (0016).\n  The dict boundary is deliberate and now stated where it is crossed.\n"}, "ADR-0036": {"file": "0036-a-folding-constructor-declares-its-keyword-fields.md", "title": "A folding constructor declares its keyword fields", "status": "accepted", "description": "a TypedDict unpacked into the call checks the keywords `**kwargs Any` had erased", "markdown": "> **Lens**: `**kwargs: Any` on a constructor is a hole in the type system shaped exactly like the constructor it is meant to protect.\n> Declare the keywords as a TypedDict and unpack them.\n> The set of fields a caller may set is then checked rather than described.\n> So, by omission, is the set that belongs to another owner.\n\n## Relates to\n\n- Extends [ADR-0035](0035-the-nouns-carry-their-own-invariants.md) (the record's status line says \"refines\")\n- Extends [ADR-0003](0003-runresult-is-a-stdlib-dataclass.md) (the record's status line says \"refines\")\n\n## Problem\n\n### Symptom\n\n0035 replaced two per-adapter constructions of `RunResult` with one folding constructor, so that the run's whole bill is summed exactly once.\nIt spelled the remaining dialect fields `**fields: Any`, and that spelling gave back more than the fold won.\n`Any` erases the keyword names and their types.\nAt the only two construction sites in the codebase, the type checker stopped seeing the fields it had been checking:\n\n| Written at an adapter | Before 0035 (`RunResult(...)`) | After 0035 (`**fields: Any`) |\n| --- | --- | --- |\n| `harnes=\"claude\"` | `Unexpected keyword argument` | accepted |\n| `model=123` | `incompatible type \"int\"` | accepted |\n| omitting `duration_ms` | `Missing named argument` | accepted |\n\nAll three verified against this repository's pinned mypy under `--strict`.\n\n### Pain point\n\nThe regression sat at exactly the seam 0035 existed to harden.\nIt made \"build one with `folded`\" a rule held by a docstring, the prose enforcement that ADR set out to end.\nNothing distinguished a correct call from a wrong one.\n\nThe keyword caravan also hid a second thing.\n`RunResult` has four groups of fields with four different owners, and `**fields: Any` let a harness adapter reach all of them.\nIt could have set `estimated_cost_usd` without the rates that justify it, bypassing `apply_cost`.\nIt could also have written `skill_coverage` before the run was graded.\n\n## Decision\n\n### The lens\n\n- **Given**: PEP 692 `Unpack` is stdlib since 3.12, and this package targets 3.12.\n- **We prefer**: `**fields: Unpack[RunResultFields]` declaring each keyword and its exact type, over `**fields: Any`.\n- **Because**: Unpacking the TypedDict into the dataclass call is what checks each key's *type* against the field it lands on.\n  The two declarations cannot disagree without failing the gate.\n- **Unless**: never\n\n### In practice\n\n- **The keyword fields are a TypedDict, unpacked.** `RunResultFields` and `SubagentFields` declare, key by key with its exact type, what a harness adapter supplies.\n  `folded` takes `**fields: Unpack[RunResultFields]`, which is PEP 692, stdlib since 3.12, and this package targets 3.12.\n  Required keys are the dataclass fields that have no default, so a missing one is a type error too.\n  Unpacking the TypedDict into the dataclass call is what checks each key's *type* against the field it lands on.\n  The two declarations cannot disagree without failing the gate.\n- **A field's owner is visible in what the TypedDict omits.** Four groups partition `RunResult`, and only the last is reachable through the constructor:\n\n  | Group | Owner | Fields |\n  | --- | --- | --- |\n  | derived | `RunResult.folded` | `turns`, `usage`, `calls`, `subagents` |\n  | priced | `RunResult.apply_cost` (0021) | `estimated_cost_usd`, `cost_status`, `cost_by_tier`, `rates_applied` |\n  | attached | `pipeline.derive` after grading (0022, 0025) | `case`, `skill_coverage` |\n  | supplied | the harness adapter, via `RunResultFields` | everything else |\n\n  `tests/test_units.py` asserts those four groups tile the dataclass exactly.\n  That is the one drift a type checker cannot see.\n  A *new* field would be silently unreachable through `folded` rather than an error.\n  A stale key would fail first at a paid call site.\n\n## Consequences\n\n### Pros\n\n- Both adapters are unchanged, because the calls they already wrote type-check as they are.\n  So is every serialised key.\n  The characterization goldens are byte-identical, which is the evidence that this is a declaration and not a change.\n\n### Cons\n\n- `__required_keys__` is not the checker's view at runtime.\n  This package uses `from __future__ import annotations`, so `NotRequired` is never unwrapped and every key reports as required.\n  The partition test unions required with optional and says why, so the caveat is recorded where someone would otherwise \"fix\" it.\n"}, "ADR-0037": {"file": "0037-the-emitted-records-are-types-and-the-cache-tree-has-one-owner.md", "title": "The emitted records are types, and the cache tree has one owner", "status": "accepted", "description": "a document a program emits is part of its interface, so it gets a type and a pinned key set", "markdown": "> **Lens**: A document a program emits is part of its interface.\n> An interface assembled as a dict literal has no definition anywhere, only the union of what its readers happen to ask for.\n> Give it a type, and put the one serialisation boundary where the transport actually requires it.\n> Pin its key set against a list a human wrote.\n> Then the same rule holds for the tree those documents live in.\n> A path shape that appears in five modules is not a layout, it is five layouts that currently agree.\n\n## Relates to\n\n- Extends [ADR-0016](0016-results-travel-on-the-test-report.md) (the record's status line says \"refines\")\n- Extends [ADR-0018](0018-fixtures-directory-and-metrics-history.md) (the record's status line says \"refines\")\n- Extends [ADR-0020](0020-captured-report-is-a-static-microsite.md) (the record's status line says \"refines\")\n- Extends [ADR-0032](0032-all-run-output-consolidates-under-a-cache-dir.md) (the record's status line says \"refines\")\n- Extends [ADR-0035](0035-the-nouns-carry-their-own-invariants.md) (the record's status line says \"refines\")\n\n## Problem\n\n### Symptom\n\n0035 and 0036 gave the run record and its parts real types.\nEverything the product *emits* was still a mapping assembled by hand:\n\n| Emitted document | How it was built | What that cost |\n| --- | --- | --- |\n| `history.json` (one per session) | `history.metrics_of`, a 41-key dict literal | no type, no key set, `.get()` at every reader |\n| `report/index.json` rows | `report._row`, a 35-key dict literal | the same, plus the row's derivation buried in it |\n| `report.json` cells | the same records, plus a *fourth* shape for `--dry-run` | five keys where readers expected 41 |\n\nThese are wire formats.\n`report-ui/src/lib/types.ts` mirrors them, the glossary names them, and nothing in this repository failed when one drifted.\n\n### Pain point\n\nThree further consequences of not having the types:\n\n- **`cache` was stamped on afterwards.** `pipeline.record_metrics` called `history.metrics_of` and then wrote `record[\"cache\"] = str(cache)` onto the mapping a different module had just built.\n  The record's own definition did not mention the field the controller depends on to find the cache root (0032).\n- **The dry-run record was a different document.** Five keys with the same `verdict` field, written onto `report.json` beside full ones.\n- **A replay read `history.json` twice, by hand.** `replay.rebuild` and `replay.case_meta` each opened it, each caught `JSONDecodeError`, and each `.get()`-ed the keys it wanted.\n\nThe cache tree had the same problem one level down.\nThe five-level layout of 0032 is a published contract, because the page fetches `../results/{skill}/{harness}/{model}/{run}/{session}/log.jsonl` by that exact shape.\nIt was spelled out in five modules:\n\n| Spelling | Where |\n| --- | --- |\n| `HISTORY_NAME` = `history.json` | `pipeline.py` |\n| `HISTORY_NAME` = `history.jsonl` | `report.py`, the same name for a different file |\n| `glob(\"*/*/*/*/*/result.json\")` | `report.cells`, `report.aggregate_history`, `replay.rebuild` |\n| `session_dir / \"log.jsonl\"` | both harness adapters and `report._row` |\n| `<cache>/results` | `Settings.results_root`, a third spelling |\n\n## Decision\n\n### The lens\n\n- **Given**: An interface assembled as a dict literal has no definition anywhere, only the union of what its readers happen to ask for.\n- **We prefer**: A type per emitted document, and one `CacheLayout` owning the tree.\n  That is preferred over dict literals in one module and a path shape spelled out in five.\n- **Because**: A path shape that appears in five modules is not a layout, it is five layouts that currently agree.\n- **Unless**: the transport requires otherwise.\n  `TestReport.user_properties` is serialised by execnet, which handles builtins only (0016).\n  The record therefore crosses that one seam as a dict, and is a type everywhere else.\n\n### In practice\n\n- **The two emitted documents are types.** `metrics.CellMetrics` is the `history.json` record, with `status_word()` as a method on it and `cache` as a declared field.\n  `report.IndexRow` is one `index.json` row, with the derivation from a stored `result.json` in its `of()` constructor.\n  Both serialise through `asdict`, as `RunResult` does (0035), so the field names remain the wire format.\n  `history.py` becomes `metrics.py`: it holds the record, not an append-only file.\n- **The dict boundary is explicit and singular.** `TestReport.user_properties` is serialised by execnet, which handles builtins only (0016).\n  A dataclass there fails at runtime during a paid sweep, and never at type-check time.\n  The record is therefore `to_dict()`-ed at the `pytest_runtest_makereport` hook and `from_dict()`-ed on the controller, and it is a type everywhere else.\n  `from_dict` drops unknown keys and defaults absent ones, which is also what makes a capture written by an older version readable rather than fatal.\n- **A dry run emits the same document.** `CellMetrics.dry_run(node=, cell=)` builds a full record with nothing measured and an empty `cache`.\n  An empty `cache` is what already means \"combine nothing\", so a dry run still writes no evidence (0018).\n- **The cache tree has one owner.** `layout.CacheLayout` is a value object over the cache root.\n  It owns `build/`, `results/`, `report/`, every file name under them, the `session(skill=, harness=, model=, run=, session=)` constructor and the `sessions()` walk.\n  `layout.SessionDir` is one session's evidence directory and addresses its four members by property.\n  `Settings.cache` *is* a `CacheLayout`, so no caller reassembles a path under it.\n  `SessionDir.at(path)` serves the callers handed a directory rather than finding one.\n  Those are a replay, and a harness adapter re-reading its own captured log.\n- **The key sets are pinned by a test, against literal lists**.\n  `tests/test_units.py` asserts the exact keys of `history.json` and of an `index.json` row against spelled-out lists.\n  `tests/test_plugin.py` asserts `report.json` is `{cells, total_usd}`.\n  A field added, renamed or dropped without the matching edit to `types.ts` and the glossary fails the gate here.\n  That is the only place in this repository that could ever have caught it.\n- `history.append` is deleted.\n  It had no production caller after 0032 moved the metrics record beside its evidence, and its only exercise was its own test.\n\n## Consequences\n\n### Pros\n\n- `pricing` no longer imports `history` for a timestamp: `now_iso` moves to `normalise`, beside `ms_between`, with the other dialect-free primitives.\n  That removes the one edge from the pricing layer up into the metrics layer.\n\n### Cons\n\n- Reading a `history.json` that exists but is missing keys now yields `\"\"` and `0` where it yielded `None`.\n  Only a hand-truncated or pre-0021 record reaches that path.\n  A session with no record at all still indexes as `null`, which is the case the tests pin.\n- `report.py` keeps `INDEX_NAME`, `TOKENS_NAME` and `REPORT_DIR` in its namespace (re-exported from `layout` and listed in `__all__`) because `report-ui/scripts/inline.py` builds the page through them.\n"}, "ADR-0038": {"file": "0038-a-tolerant-reader-still-honours-its-declaration.md", "title": "A tolerant reader still honours its declaration", "status": "accepted", "description": "forgiving an unknown key but forwarding a null into a typed field only moves the failure", "markdown": "> **Lens**: Tolerance at a boundary is a promise to the callers *inside* it.\n> Whatever the document says, what comes out is what the type declares.\n> A reader that forgives an unknown key but forwards a `None` into a field typed `str` has not been tolerant.\n> It has moved the failure somewhere the document is no longer in hand.\n> The same rule shapes the types themselves.\n> A field that is optional only because one constructor cannot fill it is two types wearing one name.\n> The empty default is the bug waiting for a caller.\n\n## Relates to\n\n- Extends [ADR-0032](0032-all-run-output-consolidates-under-a-cache-dir.md) (the record's status line says \"refines\")\n- Extends [ADR-0037](0037-the-emitted-records-are-types-and-the-cache-tree-has-one-owner.md) (the record's status line says \"refines\")\n\n## Problem\n\n### Symptom\n\n0037 turned the two emitted documents into types and gave the cache tree one owner.\nBoth of its boundary constructors were tolerant in a way that produced a value its own declaration did not describe.\n\n**`CellMetrics.from_dict` dropped unknown keys but kept mistyped ones**.\nIt existed so that a capture written by an older version reads as a partial record rather than as a failed rebuild.\nAbsent keys correctly fell back to the field defaults.\nA key that was *present and null* did not: `at: str = \"\"` could hold `None`.\nBefore 0037 every reader spelled its own `str(r.get(\"at\") or \"\")` and tolerated that.\nAfterwards the readers trusted the declaration, so the same stored record that used to sort last now aborted the whole combine step:\n\n| Reader | Before 0037 | After 0037, on `{\"at\": null}` |\n| --- | --- | --- |\n| `report.aggregate_history` | `sorted(key=str(r.get(\"at\") or \"\"))` | `TypeError: '<' not supported between 'str' and 'NoneType'` |\n| `replay.migrate_legacy` | `_run_ts_of(str(hist.get(\"at\") or \"\"))` → `00000000T000000Z` | `AttributeError` on `None` |\n\n### Pain point\n\nA type that promises to survive a foreign document, and a test named for that promise, must not turn a tolerated document into a crash.\nThe crash simply lands one layer up.\n\n**`SessionDir` made an illegal state representable.** One type carried both a path and the five coordinates of `results/{skill}/{harness}/{model}/{run}/{session}`.\nThe coordinates defaulted to `\"\"` for the callers handed a directory rather than finding one.\nThose are a replay, and a harness adapter re-reading its own log.\nThose callers could still ask for the published key and the published link.\nThey got `\"////sid\"` and `\"../results/////sid/log.jsonl\"` back: no error, and a garbage URL on the report page.\nBoth constructors were documented as ordinary usage and the type is public, so \"no caller does that today\" was not an invariant.\n\n## Decision\n\n### The lens\n\n- **Given**: A field that is optional only because one constructor cannot fill it is two types wearing one name.\n- **We prefer**: Dropping a value that does not match its field's declared type.\n  Splitting the two ways of holding a session directory into two types.\n  Those are preferred over forwarding a null into a typed field and defaulting five coordinates to `\"\"`.\n- **Because**: Tolerance at a boundary is a promise to the callers inside it.\n  Whatever the document says, what comes out is what the type declares.\n- **Unless**: JSON's single number type is at stake: an `int` where a `float` is declared is read as a float, the one widening.\n\n### In practice\n\n- **A value that does not match its field's declared type is dropped, exactly as an unknown key is**.\n  `CellMetrics.from_dict` resolves what each field admits once, from the field annotations themselves (`int | None` → `(int, NoneType)`).\n  It keeps a stored value only when it is one of them, and anything else leaves the field at its default.\n  JSON's single number type is the one widening: an `int` where a `float` is declared is read as a float.\n  The defaults story now covers *present-but-null* as well as absent.\n  That is what makes the declaration true for every reader downstream, including the two above.\n  Those stay written as if the type were honest, because it is.\n- **The two ways to hold a session directory are two types.** `layout.SessionDir` is a directory addressed by path.\n  It offers `log.jsonl`, `result.json`, `history.json`, `subagents/` and `mkdir()`, and no report link.\n  A bare path does not know where it sits in a cache.\n  `layout.LocatedSession` extends it with the five coordinates and *therefore* with `rel` and `report_link()`.\n  Only `CacheLayout` builds one.\n  `session(...)` is handed the coordinates, and `sessions()` reads them off the walk.\n  A located session therefore always has all five, and the empty-string coordinate is gone rather than merely undocumented.\n  `report.IndexRow.of` takes a `LocatedSession`, which is now checked rather than hoped for; `pipeline`, the harness adapters and `replay.rebuild_result` take the narrow type.\n- Both rules are pinned.\n  An `\"at\": null` record appears in the metrics-record test, the report's tolerance test and the legacy-migration test.\n  The absence of the link surface on the narrow type is pinned in the layout test.\n\n## Consequences\n\n### Pros\n\n- Reading a `history.json` whose value is null yields the same `\"\"` and `0` that a missing key yields (0037's consequence, now extended to nulls).\n  A record with no `at` at all still sorts first and still stamps `00000000T000000Z`.\n\n### Cons\n\n- `SessionDir.at(path)` is gone; the type has one field, so `SessionDir(path)` is the constructor.\n  0037 named `at` as the entry point for a caller handed a directory.\n  That caller now names the type itself, and cannot reach the link surface at all.\n"}, "ADR-0039": {"file": "0039-the-package-listing-is-the-architecture.md", "title": "The package listing is the architecture", "status": "accepted", "description": "when the folders are the layers, \"may this import that\" has an answer a linter can check", "markdown": "> **Lens**: A package listing is the first documentation anyone reads and the only one that cannot go stale.\n> When it is a flat alphabetical column, every module claims equal standing and the reader learns nothing.\n> When the folders are the layers, the question \"may this import that?\" has an answer before the import is written.\n> The answer can be checked by a linter rather than by whoever reviews the diff.\n> The names that resolve outside the language, though, are load-bearing in a way no layering may break.\n> An entry point is a contract with a tool that does not read your architecture.\n> It stays a real module at the root, no matter how the rest is arranged.\n\n## Relates to\n\n- Extends [ADR-0014](0014-register-through-the-pytest11-entry-point.md) (the record's status line says \"refines\")\n- Extends [ADR-0027](0027-coverage-follows-the-shells-working-directory.md) (the record's status line says \"refines\")\n- Extends [ADR-0034](0034-a-harness-is-a-class-and-the-registry-is-the-only-dispatch.md) (the record's status line says \"refines\")\n- Extends [ADR-0037](0037-the-emitted-records-are-types-and-the-cache-tree-has-one-owner.md) (the record's status line says \"refines\")\n\n## Problem\n\n### Symptom\n\nTwenty modules sat flat in `src/pytest_xharness_eval/`, in one alphabetical list, after 0034 pulled `harness/` out of it.\nA reader opening the package could not tell the modules apart from the listing.\nFive of them do quite different jobs:\n\n- `case.py` is a declaration a user writes.\n- `codex.py` folds a foreign log.\n- `pricing.py` is arithmetic over a folded one.\n- `report.py` publishes.\n- `plugin.py` drives all four.\n\nThey are the same size, at the same level, in the same column.\nThe listing named the parts and said nothing about the shape, which is the complaint this refactoring campaign opened with.\n\n### Pain point\n\nFlatness is not only a reading problem: with no declared direction, three imports had quietly turned upside down, and nothing failed when they did.\n\n| Inversion | What it meant |\n| --- | --- |\n| `pricing` → `normalise.now_iso`, `report` → `normalise.now_iso` | Pricing an estimate and stamping an index both depended on the *harness dialect toolkit* for a wall clock. |\n| `skillcov.annotate` → `harness.get(result.harness)` | A derivation reached into the adapter registry mid-walk, so annotating a ledger (pure arithmetic) could not be done for a result whose harness nobody had registered. |\n| `matrix` → `harness` | Deliberate and correct (the `--harness` choices must be whatever is registered, 0034), but indistinguishable from the other two. |\n\n## Decision\n\n### The lens\n\n- **Given**: Two names in the package are resolved by *importlib*, not by Python code, and they bound any re-layering.\n  `pytest_xharness_eval.plugin` is the `pytest11` entry point (0014).\n  `pytest_xharness_eval.replay` is what `uv run -m pytest_xharness_eval.replay` executes.\n  Verified: a package with no `__main__.py` fails `-m` outright.\n  An attribute re-exported from a parent `__init__` does not satisfy importlib for either, and only a real module does.\n- **We prefer**: Layer folders whose listing order is the dependency order, over twenty modules flat in one alphabetical column.\n- **Because**: The question \"may this import that?\" then has an answer before the import is written.\n  A linter can check it, rather than whoever reviews the diff.\n- **Unless**: importlib resolves the name: the two entry-point modules stay real modules at the root no matter how the rest is arranged.\n\n### In practice\n\n- **The layers are folders, and the folder listing is the dependency order.**\n\n  ```text\n  pytest_xharness_eval/\n      plugin.py     the pytest11 entry point (0014)\n      replay.py     the `python -m` entry point (0023, 0032)\n      model/        the nouns: run, case, cell, workspace, cache tree, clock\n      harness/      one adapter class per agent CLI, and the toolkit they fold with\n      derive/       what a folded run cost, and which of the skill it reached\n      emit/         the documents that leave: the metrics record and the microsite\n      runtime/      how a sweep is wired: settings, and the steps after the CLI returns\n  ```\n\n  Each layer depends only on the ones above it in that list, entry points last.\n  The two entry-point modules stay real modules at the root, because importlib resolves them.\n  That placement narrates too: what the outside world calls sits at the top, and the layers it calls through underneath.\n- **Each `__init__` declares its layer's surface**.\n  A layer's `__init__` is the one place its public names are listed, and reading five of them is reading the architecture.\n  Submodules still import each other by full dotted path (`from pytest_xharness_eval.derive import pricing`), never through a layer's `__init__`.\n  Importing the matrix reaches the harness registry.\n  A name bound in an `__init__` is therefore not yet available to everything that loads during it.\n- **The three inversions are resolved, not merely noted**.\n  `now_iso` and `ms_between` are `model/clock.py`, a leaf that depends on nothing.\n  Pricing and the report therefore stop naming the adapter toolkit for a timestamp.\n  The tolerant reader for this package's own stored documents is `model/documents.py`, for the same reason.\n  `skillcov.annotate` takes the harness's shell vocabulary as an optional fourth argument.\n  That is a `model.registry.Shells` value of the tool names that run a shell, and the ones that keep their cwd (0027).\n  Annotating a ledger is therefore arithmetic over a value it was handed.\n  And the one edge that must point up, because the registry is the only dispatch (0034), is now a single module that says so.\n  `model/registry.py` answers \"which harnesses exist\" and \"what is this one's shell vocabulary\".\n  It is the only module below `harness/` that names `harness`.\n  `annotate` still resolves through it when the argument is omitted, which is what the pipeline and the pinned characterization call.\n- **A fourth inversion fails the build.** The ruff `TID251` rule that has kept provider modules unreachable since 0034 is joined by three more.\n  Nothing may name `pytest_xharness_eval.harness`, `.emit` or `.runtime` except the layers above it.\n  The exceptions are the per-file-ignore list in `pyproject.toml`: the two entry points, each layer itself, `model/registry.py`, and the tests.\n- **`report.py` becomes the layer it always was**.\n  It held four jobs at once: the `index.json` row type, the design-tokens reader, the page assembly, and the combine step.\n  They are `emit/index.py`, `emit/tokens.py` and `emit/page.py` beside `emit/metrics.py`, which is the same split the microsite already has on disk.\n  `pytest_xharness_eval.emit` is re-exported from the root package as `report`, which is the name `report-ui/scripts/inline.py` builds a page through.\n\n## Consequences\n\n### Pros\n\n- The from-import form `from pytest_xharness_eval import pricing` still resolves, and so do `normalise`, `records`, `skillcov` and `report`.\n  They are re-exported from the root `__init__` in `as` form, which mypy's `no_implicit_reexport` requires.\n  They are listed in `__all__` as the declared public API.\n  Every internal caller and both test modules use the from-import form, and the pinned characterization test imports exactly that way, unchanged.\n- The bundled `prices.toml` moves to `derive/prices.toml`, beside the only module that reads it.\n  0014's rule is unchanged: it is still the one path derived from `__file__`, and `pricing.py` still spells it `Path(__file__).parent`.\n\n### Cons\n\n- `import pytest_xharness_eval.pricing`, the dotted form, stops resolving for an outside caller.\n- `model/` is where `layout.py` and `workspace.py` live, not `runtime/`.\n  Both are value-level: one names paths under a cache, the other copies a fixture tree and hashes it.\n  Both are used *by* the harness adapters.\n  Putting them in the top layer would have made the adapter layer import the top layer.\n  That would leave the `runtime` ban with a hole big enough to walk through.\n- One edge points up that the rules cannot express.\n  `model/runresult.py` names `derive.pricing` and `derive.skillcov` under `TYPE_CHECKING`, to declare the two derived documents a result carries.\n  It is annotations only, so there is no runtime dependency and no cycle.\n  It is also the reason `derive` is not in the ban list.\n  A rule with a documented exception in the file it exists to constrain is worse than no rule.\n"}, "ADR-0040": {"file": "0040-the-plugin-is-a-hook-manifest.md", "title": "The plugin is a hook manifest, and each job behind it is a module", "status": "accepted", "description": "push the expensive line down until the pragma fits it exactly, and test what is left", "markdown": "> **Lens**: A plugin's entry-point module is a manifest, not a place to work.\n> Every job it accumulates is a job with no name, no test seam and no type.\n> The two most expensive symptoms are always the same.\n> A serialised format authored inside a hook, where no reader can find its definition.\n> And a `pragma: no cover` drawn around a whole sequence, because one line of it is expensive.\n> Push the expensive line down until the pragma fits it exactly.\n> What is left above is free,
