 ordinary code that can be tested like any other.\n\n## Relates to\n\n- Extends [ADR-0008](0008-evals-are-eval-prefixed-modules.md) (the record's status line says \"refines\")\n- Extends [ADR-0014](0014-register-through-the-pytest11-entry-point.md) (the record's status line says \"refines\")\n- Extends [ADR-0016](0016-results-travel-on-the-test-report.md) (the record's status line says \"refines\")\n- Extends [ADR-0032](0032-all-run-output-consolidates-under-a-cache-dir.md) (the record's status line says \"refines\")\n- Extends [ADR-0037](0037-the-emitted-records-are-types-and-the-cache-tree-has-one-owner.md) (the record's status line says \"refines\")\n- Extends [ADR-0039](0039-the-package-listing-is-the-architecture.md) (the record's status line says \"refines\")\n- Superseded by [ADR-0041](0041-the-vocabulary-is-a-domain-noun-and-the-manifest-is-a-manifest.md) (its placement of `Verdict` in `plugin/verdict.py`, and the exports its manifest widened to, are superseded)\n\n## Problem\n\n### Symptom\n\n0039 turned the layers into folders and left the two entry points at the root, where importlib resolves them.\n`plugin.py` was then the last module in the package doing five unrelated jobs at once, at 478 lines.\nIt registered the options and ini keys, decided what pytest collects, and ran a cell end to end.\nIt carried the record across the xdist boundary, and wrote `report.json` and the combine step.\n\n### Pain point\n\nThree consequences, none of them stylistic:\n\n| Symptom | What it cost |\n| --- | --- |\n| Two serialised contracts authored inside pytest hooks | `report.json` was a dict literal in `pytest_terminal_summary`. 0037 gave every other emitted document a type; this one had no definition to point a reader (or `report-ui/src/lib/types.ts`) at. |\n| One `# pragma: no cover` over the whole per-cell sequence | `_run_live` was forty lines of which *one* spends money. Materialise, derive, capture, grade and record were excluded from coverage along with the spawn, so the ordering a replay is pinned against could not be exercised at all without paying. |\n| The suite loader written twice | `plugin._load_module` and `replay._load_suite` were the same eight lines of `spec_from_file_location`, differing in whether the module was registered in `sys.modules` while it executed, a difference nobody had decided. \"Find the `EvalCase` called X\" was written twice as well. |\n\nThe last one is the drift class 0034 removed for the settings and 0037 for the cache tree.\nTwo implementations of one idea, each correct, neither aware of the other.\n\n## Decision\n\n### The lens\n\n- **Given**: Pluggy discovers a hook as an attribute of the imported plugin module, and importlib resolves `pytest_xharness_eval.plugin` to the package.\n  The `pytest11` entry point of 0014 therefore survives the package becoming a folder.\n- **We prefer**: A `plugin/` package whose `__init__` is a manifest of seven hooks bound to named modules.\n  That is preferred over one 478-line entry-point module doing five jobs.\n- **Because**: Pushing the expensive line down until the pragma fits it exactly leaves six free steps that can be tested like any other code.\n- **Unless**: the code is itself paid.\n  The `run_*` functions that spawn each CLI stay module-level in their adapters, because relocating uncovered paid code buys style and costs an unverifiable diff.\n\n### In practice\n\n- **`plugin` is a package whose `__init__` is a manifest.** Pluggy discovers a hook as an attribute of the imported plugin module.\n  importlib resolves `pytest_xharness_eval.plugin` to the package, so the `pytest11` entry point of 0014 is unchanged.\n  Every hook is re-exported by name from `__init__`:\n\n  ```text\n  plugin/\n      __init__.py   the hook manifest: seven hooks, bound to the modules below\n      options.py    every option and ini key, configure-time validation, the header\n      collect.py    the collection rule, EvalFile, EvalItem\n      cell.py       CellRun: the seven steps of one live cell, and the run stamp\n      verdict.py    Verdict: the words a cell may grade to\n      results.py    the record's one crossing to the controller, and its status word\n      summary.py    the terminal table, report.json, and the combine step\n  ```\n- **The paid step is one method, and the pragma stops there.** `CellRun` is the cell's run as a small state machine.\n  Its steps are `materialise`, `invoke`, `store`, `grade`, `record`, and an `execute` that sequences them.\n  `execute` leaves the record in the item's stash whether the grader passed or raised.\n  Only `invoke`, and the five-line `execute` that calls it, carries `# pragma: no cover`.\n  Every other step is now exercised from captured logs in `tests/test_units.py`.\n  Nothing is mocked to achieve that, which is the constraint 0002 actually imposes.\n  The workspace is really copied, the grader really runs, the record is really written, and no CLI is spawned.\n- **`report.json` is a type.** `emit/summary.py` holds `RunSummary`: the graded cells and `total_usd`, plus `cache_roots()`.\n  `cache_roots()` names the roots this session wrote evidence into.\n  That is the one place the combine step's trigger is decided, and the reason a dry run stays free (0018, 0032).\n  The hook decides *when* to write; the type decides *what* the file is.\n- **One `EvalSuite` loads every suite, for both entry points.** `model/suite.py` imports an `eval_*.py` by path under a name derived from that path.\n  It registers the module in `sys.modules` before executing it, and answers `cases` and `case_named(name)`.\n  Collection asks it for every case.\n  A replay asks `find_case(evals_dir, name)`, which skips an unimportable suite with a warning so one broken file cannot stop the others being rebuilt (0023).\n- **The pre-0032 migration is its own module.** `runtime/legacy.py` holds `LegacyCapture`, built only by `found_at`.\n  `found_at` recognises a legacy `captured/` directory by shape, and returns `None` for anything else.\n  A migration therefore cannot be started against a cache root, and the entry point has no \"is it legacy?\" question left to ask twice.\n  It is transitional code with a known end, and it is now deletable in one file.\n  `replay.py` keeps the rebuild and the command line that drives it.\n  `main` takes its `argv`, so the entry point can be exercised without touching the process.\n\n## Consequences\n\n### Pros\n\n- Coverage of the plugin's own code went from 89% to 93-100% per module.\n  That is not because tests were added around the old shape, but because the shape stopped hiding six free steps behind one paid one.\n- `from pytest_xharness_eval.plugin import EvalItem` still resolves, and so do `PROPERTY`, `RESULTS_KEY` and `RECORD_KEY`.\n  A consuming repository's `conftest.py` uses it to inspect collected cells.\n- `Verdict` is a `StrEnum`, and its `.value`, never the member, is what reaches an `Outcome`.\n  The record it becomes crosses to the xdist controller through execnet, which serialises builtins only (0016).\n  A test pins that the stored verdict is a plain `str`.\n\n### Cons\n\n- `pytest_xharness_eval.plugin` is now a package, so `plugin.py` no longer exists as a file.\n  The per-file-ignore that exempts the entry points from 0039's layer rules is `plugin/*`.\n- One thing deliberately did *not* move: the `run_*` functions that spawn each CLI stay module-level in their adapters.\n  Relocating uncovered paid code buys style and costs an unverifiable diff.\n"}, "ADR-0041": {"file": "0041-the-vocabulary-is-a-domain-noun-and-the-manifest-is-a-manifest.md", "title": "A shared vocabulary is a domain noun, and a manifest exports nothing of its own", "status": "accepted", "description": "a vocabulary belongs in the layer everyone may import, and it must type a field", "markdown": "> **Lens**: Two questions decide where a shared name lives, and neither is \"who uses it most\".\n> *Which layer may everyone that needs it import?* That is the only placement that can be enforced rather than agreed.\n> *Which field is declared as it*?\n> A vocabulary that types nothing is decoration, and its duplicate literals survive the refactor that was supposed to remove them.\n> And a module that advertises itself as a manifest must be audited as one: every convenience export is a public API nobody decided to publish.\n\n## Relates to\n\n- Extends [ADR-0016](0016-results-travel-on-the-test-report.md) (the record's status line says \"refines\")\n- Extends [ADR-0037](0037-the-emitted-records-are-types-and-the-cache-tree-has-one-owner.md) (the record's status line says \"refines\")\n- Extends [ADR-0038](0038-a-tolerant-reader-still-honours-its-declaration.md) (the record's status line says \"refines\")\n- Extends [ADR-0039](0039-the-package-listing-is-the-architecture.md) (the record's status line says \"refines\")\n- Extends [ADR-0040](0040-the-plugin-is-a-hook-manifest.md) (the record's status line says \"refines\")\n- Supersedes [ADR-0040](0040-the-plugin-is-a-hook-manifest.md) (supersedes 0040's placement of `Verdict` in `plugin/verdict.py`, and the justification given there for it)\n\n## Problem\n\n### Symptom\n\n0040 introduced `Verdict`, which is `pass`, `fail`, `error` or `dry-run`.\nIt put the enum in `plugin/verdict.py`, claiming a vocabulary the whole package shares.\nIt was neither, for three reasons that only show up when the layer rule of 0039 is taken seriously:\n\n| Symptom | What it cost |\n| --- | --- |\n| `plugin/` is the entry-point layer, above every other | `emit/` structurally *cannot* import from it, because the ruff `TID251` rule fails the build. So `CellMetrics.dry_run`, the only producer of the fourth word, still wrote the bare literal `verdict=\"dry-run\"`. The vocabulary was duplicated, not centralised. |\n| The enum typed no field | `Outcome.verdict`, `CellMetrics.verdict` and `IndexRow.verdict` were all `str`. An enum that nothing is declared as is a naming convention with a class statement around it. |\n| The module's own docstring was untrue | It said the two ends of a cell's life \"neither may import the other\", but `plugin/cell.py` imports `plugin/results.py` directly. A docstring that states a false constraint is worse than no docstring: the next reader preserves a shape for a reason that does not exist. |\n\n### Pain point\n\n0040 also widened the manifest it had just declared to be \"a manifest and nothing else\".\n`__init__` re-exported `CellRun`, `Attempt`, `run_stamp`, `Verdict` and a `_ResultCollector` renamed public on the way out.\nNone of those is named by 0040's own compatibility list, and every one of them is API the moment it is exported.\n\n## Decision\n\n### The lens\n\n- **Given**: `plugin/` is the entry-point layer, above every other, so `emit/` structurally cannot import from it.\n  The ruff `TID251` rule fails the build.\n- **We prefer**: `Verdict` in `model/verdict.py`, the bottom layer every layer above may name, over `plugin/verdict.py`.\n- **Because**: The move is what removes the duplicate literal, rather than a lint that forbids it.\n  A vocabulary that types no field is a naming convention with a class statement around it.\n- **Unless**: the word is crossing execnet: `CellMetrics.verdict` stays `str`, because execnet serialises builtins only (0016) and a `StrEnum` member is not one.\n\n### In practice\n\n- **A word two layers share is a domain noun.** `Verdict` moves to `model/verdict.py`, the bottom layer, which every layer above may name.\n  Its producers then all use it: `plugin/cell.py` decides one, and `emit/metrics.py` records it.\n  `CellMetrics.dry_run` is included, which is why the move is what removes the literal rather than a lint that forbids it.\n- **The vocabulary types the observation, and the wire keeps the word.** `Outcome.verdict` is declared `Verdict | None`.\n  The `.value`, never the member, is what reaches `CellMetrics.verdict`, which stays `str`.\n  That record crosses to the xdist controller through execnet, which serialises builtins only (0016).\n  A `StrEnum` member is not a builtin.\n  Typing the *record* field would have shipped a member over that wire.\n- **A stored word that names no member is no verdict, not a fabricated one**.\n  `Verdict.stored(word)` returns `None` for anything outside the four, which is what `CellMetrics.outcome` reads a replayed record back through.\n  A capture written before the field existed, or truncated by hand, carries its empty verdict forward exactly as it did before.\n  The alternative, mapping the unknown onto `error`, would have a rebuild assert a grade the run was never given.\n  0038's tolerance is about degrading to the default, never about inventing a value.\n- **A manifest exports the hooks and the compatibility surface, and nothing else**.\n  `plugin/__init__` binds the seven `pytest_*` hooks pluggy discovers as attributes of the imported module.\n  It also binds the four names a consuming repository's `conftest.py` already reaches for: `EvalFile`, `EvalItem`, `PROPERTY`, `RESULTS_KEY`, `RECORD_KEY`.\n  Internals stay addressable where they are implemented, as `plugin.cell.CellRun` and `plugin.results.ResultCollector`, which is where the tests already reach them.\n\n## Consequences\n\n### Pros\n\n- `tests/test_units.py` gains a fitness function over the manifest.\n  The bound hooks are exactly the hooks the package implements, and a hook not bound here silently stops firing.\n  The rest of `__all__` is exactly the compatibility surface, and the `pytest11` entry point still names `pytest_xharness_eval.plugin`.\n  A new hook that is implemented and not bound now fails the suite instead of the next sweep.\n\n### Cons\n\n- `from pytest_xharness_eval.plugin import Verdict` no longer resolves; the import is `from pytest_xharness_eval.model.verdict import Verdict`, or `pytest_xharness_eval.model`.\n  The name was one commit old and unreleased.\n"}, "ADR-0042": {"file": "0042-the-overview-is-filtered-by-the-url.md", "title": "The overview is filtered by the URL, and the summary aggregates the chart's own groups", "status": "accepted", "description": "two views of the same data on one page group it the same way, or they are not a pair", "markdown": "> **Lens**: **An interactive state that changes what the reader is looking at belongs in the URL**.\n> **A derived view names its own arithmetic**.\n> If two views of the same data sit on one page, they group it the same way, or they are not a pair.\n\n## Relates to\n\n- Extends [ADR-0020](0020-captured-report-is-a-static-microsite.md) (the record's status line says \"refines\")\n- Extends [ADR-0021](0021-metric-names-carry-unit-and-provenance.md) (the record's status line says \"refines\")\n- Extends [ADR-0028](0028-report-is-built-from-a-component-workspace.md) (the record's status line says \"refines\")\n- Extends [ADR-0031](0031-plotly-tamagui-and-a-deeplink-permutation-matrix.md) (the record's status line says \"refines\")\n\n## Problem\n\n### Symptom\n\nThe sweep grew to 24 sessions across 2 skills × 2 harnesses × 4 models, and both overview consumers stopped scaling with it.\n`TokenAccumulationChart` draws 16 lines whose legend already overflows its card, and `SessionTable` is 24 rows of 18 columns.\n\n### Pain point\n\nThere was no way to ask \"just claude\" or \"just this skill\", and no aggregate view at all.\nEvery comparison between two harnesses was done by eye, across 24 rows.\n\n## Decision\n\n### The lens\n\n- **Given**: Every other interactive state of this page already lives in the URL (0031).\n- **We prefer**: Three multi-select facet params on the overview route, with the filtering owned by `SweepOverview`.\n  That is preferred over per-component filter state or no filtering at all.\n  A mean aggregate over the chart's own grouping key, over a median or a different partition.\n- **Because**: If two views of the same data sit on one page they group it the same way, or they are not a pair.\n  The chart beside the summary already draws a mean line with a min-max envelope, so a median row would disagree with the picture by construction.\n- **Unless**: never\n\n### In practice\n\n- Three binding parts.\n- ### 1. The overview's filter state is URL state, like every other interactive state of this page\n\n  Three params, `skill`, `harness` and `model`, on the overview route only.\n  They are multi-select, because a reader compares two harnesses far more often than one.\n  A facet therefore serialises as a comma-separated list: **OR within a facet, AND across facets**.\n  An absent param means every value, which keeps `?`, `?sort=…` and `?theme=dark` byte-identical to what they were.\n  A present-but-empty param still means every value, never none.\n  A value the data does not contain is kept in route state and matches nothing.\n  A stale deeplink therefore lands in a visible empty state rather than silently widening.\n\n  Changing a facet **replaces** the history entry rather than pushing one, because a filter refines the page you are already on.\n  That is the same rule the neighbouring `sort` control follows, and `OverviewFiltersClear` is the undo.\n  Per 0031 the params are enumerated in `lib/permutations.ts` in this same change, including one permutation (`overview--filter-none`) that deliberately selects zero sessions.\n- ### 2. `SweepOverview` owns the filtering; its children are presentational\n\n  The view derives the visible `Cell[]` once and passes it down.\n  `TokenAccumulationChart`, `SessionSummaryTable` and `SessionTable` take the cells they are given and know nothing about facets.\n  The only concession is a shared `NO_MATCH` sentence all three print when handed nothing.\n  A filtered-to-nothing overview therefore says so three times in one voice, instead of rendering three empty boxes.\n\n  `OverviewFilters` is the producer, not a consumer, so it alone reads and writes the route.\n  It derives its option lists from the whole sweep, never from the filtered subset, so the control never moves under the reader's hand.\n  A value that would select nothing is dimmed rather than removed.\n- ### 3. `SessionSummaryTable` aggregates the chart's own groups, by mean\n\n  Its grouping key, skill × case × harness × model, is deliberately the same partition `accumulationGroups` draws with.\n  One summary row is therefore one line of the chart above it, and the two read as a pair.\n  Every aggregate is named `mean <field>` in full, per 0021: the name carries the operation as well as the unit.\n\n  Mean, not median.\n  The chart beside it already draws a mean line with a min-max envelope, and a median row would disagree with the picture by construction.\n  Cost and tokens are additive, so `mean × runs` is the group's total.\n  And a median over the group sizes this data produces (1-2) is either the single value or the mean of the two.\n  A missing value is skipped, never zero-filled, and an aggregate over nothing is null, never zero.\n  A sparse column must read as sparse.\n  The pass rate's denominator is the runs that carry a verdict, so an ungraded run is never counted as a failure.\n\n## Consequences\n\n### Pros\n\n- `lib/facets.ts` and `lib/summary.ts` join `lib/series.ts` as pure, unit-tested derivations over `Cell[]`.\n  `coverageShare` and the fixed-decimal formatter move into `lib/format.ts`, so the table and the summary compute one number from one place.\n- Nothing the Python side emits changes.\n\n### Cons\n\n- The three params join the deeplink matrix and the tiered sweep.\n  Every one of them must be enumerated in `lib/permutations.ts`, or the matrix silently stops covering it.\n"}, "ADR-0043": {"file": "0043-the-overview-tables-are-budgeted-to-one-screen.md", "title": "The overview's tables are budgeted to one screen, and the aggregate has a decomposition as well as an accumulation", "status": "accepted", "description": "a metric a reader cannot see is a metric that does not exist, so width is a contract", "markdown": "> **Lens**: A metric a reader cannot see is a metric that does not exist.\n> Budget the width and buy it back from how figures are spelled, never by dropping a measure.\n> Two figures whose difference is the interesting quantity are printed as that difference.\n> An average over a shrinking population shows how much it shrank, rather than smoothing it away.\n\n## Relates to\n\n- Extends [ADR-0020](0020-captured-report-is-a-static-microsite.md) (the record's status line says \"refines\")\n- Extends [ADR-0021](0021-metric-names-carry-unit-and-provenance.md) (the record's status line says \"refines\")\n- Extends [ADR-0025](0025-results-name-their-case-and-charts-have-a-log-line-axis.md) (the record's status line says \"refines\")\n- Extends [ADR-0031](0031-plotly-tamagui-and-a-deeplink-permutation-matrix.md) (the record's status line says \"refines\")\n- Extends [ADR-0042](0042-the-overview-is-filtered-by-the-url.md) (the record's status line says \"refines\")\n\n## Problem\n\n### Symptom\n\n0042 gave the overview a filter, a `SessionSummaryTable` and three consumers that answer to it.\nThree things were left unresolved by it.\n\n`SessionTable` did not fit.\nEighteen columns measured ~1600px against the 1086px a card gives it at a 1440px viewport.\nA third of the metrics were therefore permanently behind a horizontal scrollbar.\nThe table's own auto-scroll-the-sorted-head effect existed only to paper over that.\n\n### Pain point\n\nA metric a reader cannot see is a metric that does not exist.\nThe metrics off the right edge were not the unimportant ones, they were whichever ones happened to be declared last.\n\n`SessionSummaryTable` was declared unsortable, on the reasoning that a second sort param would double the route surface for a sixteen-row table.\nThat reasoning holds for the *route*, not for the reader.\nThe whole point of an aggregate is to rank groups, by mean cost, by pass rate, by mean wall.\nA fixed key order answers none of those questions.\n\nAnd the overview had an *accumulation* of tokens (how fast the bill grows) with no *decomposition* (where it went).\nThe per-session `TokenWaterfallChart` answers the second question for one run and there was no way to ask it of many.\n\n## Decision\n\n### The lens\n\n- **Given**: Width is finite and every metric earns its place.\n  The budget therefore has to come from how figures are spelled, rather than from which measures survive.\n- **We prefer**: Keeping every metric and buying width back from spelling, collapsing constant identity columns into the caption.\n  That is preferred over dropping a measure, or leaving a third of them behind a horizontal scrollbar.\n- **Because**: A metric a reader cannot see is a metric that does not exist.\n- **Unless**: the column is a *measure* that happens to be equal on every row.\n  That is a finding, and it must stay visible as a column.\n\n### In practice\n\n- Four binding parts.\n- ### 1. The second table sorts on its own param pair\n\n  `ssort` / `sdir` on the overview route, parsed and serialised by the same `sortState` helper as `sort` / `dir`.\n  **Not** a shared pair: a reader ranks groups by mean cost while ranking sessions by when they ran.\n  A shared pair would make every click on one table silently reorder the other.\n  No single URL could express the pair of orders the reader is actually looking at.\n  Both pairs are enumerated in `lib/permutations.ts` in this same change, including the permutation that carries both at once.\n\n  The fixed `skill|case|harness|model` key order stays the default.\n  It remains the only order in which `SessionSummaryTable`'s skill banding and its repeated-value muting tell the truth.\n  **Both switch off whenever a column is sorted**.\n  Under any other order \"the row above\" is whatever the reader last clicked.\n  A band drawn then is describing a grouping the table is no longer in.\n- ### 2. Every control on the overview writes through one patch function\n\n  `overviewWith(route, patch)` spreads the current overview state and applies one change.\n  Controls no longer respell the route.\n  This is not tidiness.\n  The filter chips had already been caught clearing `sort`, and the sort heads clearing `facets`.\n  Each new param makes every control that predates it wrong by default.\n  One function is wrong in one place or in none.\n- ### 3. `SessionTable` is budgeted to one screen, and width is taken from spelling rather than from data\n\n  Every metric stays.\n  The width comes back from how figures are *written*, and from one column that was not a metric:\n\n  - the session id is not a column, because it identified a row without telling you anything about it.\n    The row opens the `SessionView` that prints it beside a `CopyId`, and `data-sid` still carries it;\n  - `estimated_cost_usd` and `harness_reported_cost_usd` are one column: the estimate is the value and the harness's own figure is a signed **drift** from it.\n    Two four-decimal figures side by side were being subtracted by eye, and the subtraction is the whole question;\n  - token counts are abbreviated (`1.5M`, `29.4k`) with the exact figure on the cell's `title`, and cost drops to three decimals here.\n    A tenth of a cent is below the resolution anyone ranks a sweep by.\n    `ReconciliationPanel` and `CostByTierPanel`, which exist to reconcile, keep four;\n  - `model` drops its vendor prefix and `case` the `eval_` every case shares.\n    Shortening is abandoned for the *whole* sweep if any two models would collide, because a partial map reads as an inconsistency rather than a rule;\n  - `baseline_tokens` loses its column to the `peak ctx` cell's title.\n    It is the harness's own prompt before the agent acted, near-constant within a harness, and the one figure here nobody ranks a sweep by;\n  - the heads print the shortest form that reads.\n    The eight `mean …` labels in `SessionSummaryTable` say the word once in a caption, instead of eight times in eight heads.\n    The canonical field name stays in every head's tooltip and accessible name (WCAG 2.5.3), so nothing is renamed, only abbreviated;\n  - the pair steps down to a 5px cell inset and bleeds to the card's edge.\n    Fifteen columns at the kit's 10px inset spent 300px on gutter, and `CardContent`'s 20px frames prose, not a table that is the card's subject.\n\n  **An identity column whose value is the same on every visible row is stated once in the table's `<caption>` and dropped**.\n  Under a filter, which 0042 made the normal way to read this page, that is where most of the width comes back.\n  Filter to one harness and the harness column stops existing, rather than repeating twelve times.\n  Only the four identity columns may collapse.\n  A *measure* that happens to be equal on every row is a finding, and must stay visible as a column.\n\n  The measurement, not the column count, is the contract: `e2e/inline.spec.ts` asserts the box does not overflow.\n  At 1440px both tables fit exactly.\n  Below ~1350px `SessionTable` scrolls again, and the scroll box, its edge fade and its sticky head handle that as they did before.\n- ### 4. The aggregate waterfall aggregates the filtered population, not one group per line\n\n  `TokenWaterfallAggregateChart` sits below `TokenAccumulationChart` and draws the same six categories and total, averaged over every run in view.\n  One waterfall, not one per group.\n  The filters are how a reader narrows to a group, which is what makes the pair drillable rather than decorative.\n  Sixteen small-multiple waterfalls would answer no question the accumulation chart above does not already.\n\n  Each column is the arithmetic mean over the runs that **reached** that turn.\n  A short run is missing from a late turn, never zero in it, and the divisor is that count, never the run total.\n  Because the mean base and the mean segments are taken over the same subset, the stack's top is the mean running total.\n  That is what the min-max whisker brackets.\n\n  That makes the late columns a mean of fewer and fewer runs.\n  **A column's opacity is therefore the share of runs that reached it**.\n  A turn one run of twenty-four survived to fades almost out, rather than reading as a rising trend.\n  The `total` column is each run's own final figure, so it can sit *below* a late turn averaged over the one run that got there.\n  That is survivorship, it is the honest reading of \"these runs, on average\", and it is shown rather than smoothed away.\n\n## Consequences\n\n### Pros\n\n- A reader sees every metric of every session without scrolling sideways at 1440px, and a filtered read fits a 1280px laptop.\n- Two figures whose difference is the interesting quantity are printed as that difference.\n  The real capture immediately showed drifts of +14% to +29% between the plugin's estimate and Claude's own reported cost.\n  That is visible at a glance, and was previously two columns apart.\n- A new overview param is now a one-line change at each control instead of a silent omission at every control that predates it.\n- Nothing the Python side emits changes: no new JSON key, no ini key, no CLI option, no metric's value.\n\n### Cons\n\n- `SessionSummaryTable` can be ranked, and doing so honestly costs it the banding that only a fixed order justifies.\n- Abbreviation moves precision to a `title`.\n  Exactness is one hover away, and never on screen.\n  That is a deliberate trade, and the reason the exact figure is on every abbreviated cell rather than on some of them.\n"}, "ADR-0044": {"file": "0044-a-skill-is-invoked-the-way-its-user-invokes-it.md", "title": "A skill is invoked the way its user invokes it, in each harness's own syntax", "status": "accepted", "description": "an eval that has to explain the harness to the agent is measuring the harness", "markdown": "> **Lens**: An eval that has to explain the harness to the agent is measuring the harness.\n> The prompt is not a place to reconcile two loading mechanisms.\n> The reconciliation belongs behind the interface that already exists to hold the difference.\n> What the case declares is the part a user would actually say.\n\n## Relates to\n\n- Extends [ADR-0011](0011-inject-skill-through-each-cli-path.md) (the record's status line says \"refines\")\n- Extends [ADR-0034](0034-a-harness-is-a-class-and-the-registry-is-the-only-dispatch.md) (the record's status line says \"refines\")\n- Supersedes [ADR-0008](0008-evals-are-eval-prefixed-modules.md) (supersedes the `prompt=` field of `@evalcase` established there)\n\n## Problem\n\n### Symptom\n\n0011 settled that a skill reaches the agent through each CLI's own loading path.\nThe two adapters implemented it: Claude got `--add-dir <skill dir>`, and Codex a copy into the private `CODEX_HOME/skills/`.\nTwo different mechanisms, as 0011 intended.\n\nBut the *prompt* stayed one string, shared by every cell of the case.\nIt had to paper over the difference the adapters had just introduced.\nEvery case in every consuming repository opened the same way:\n\n> Use the mermaidjs-diagrams skill (its SKILL.md is in the extra allowed directory / your skills).\n\nThat sentence is the tell.\n\"The extra allowed directory / your skills\" is a prompt written to survive two loading paths at once, and it names neither mechanism correctly:\n\n| What the prompt asked for | What actually happens |\n| --- | --- |\n| Claude: \"its SKILL.md is in the extra allowed directory\" | `--add-dir` grants *tool access* to a path. It does not register a skill. The agent has to be told a path, then read it as a file, then decide to follow it: three steps a real user never performs. |\n| Codex: \"/ your skills\" | The skill *is* registered, and Codex's own instructions say the trigger is `$SkillName`. The prompt never used it, so the skill was reached by description-match at best. |\n\n### Pain point\n\nSo the matrix's two arms were not running the same experiment.\nOne arm graded a skill loaded as a document; the other graded a skill loaded as a skill.\nNeither arm graded what a user does, which is the only invocation whose failure anybody would care about.\nA skill whose `SKILL.md` frontmatter is malformed passed both arms, because being told to read a file does not require the file to be registered.\nThat is the single most common way a skill breaks for its users.\n\n## Decision\n\n### The lens\n\n- **Given**: Both CLIs have a documented, verified invocation, and they are not the same:\n\n  | Harness | Registration | Invocation a user types | Verified |\n  | --- | --- | --- | --- |\n  | `claude` | `--plugin-dir <dir>`, where the dir carries `.claude-plugin/plugin.json` and `skills/<skill>/` | `/<skill> <task>` | claude 2.1.251, against `--setting-sources \"\"` |\n  | `codex` | a copy under the private `CODEX_HOME/skills/<skill>/` | `$<skill> <task>` | codex-cli 0.151.0, against `--ignore-user-config` |\n\n  Claude's `--add-dir` was never a registration; `--plugin-dir` is.\n  It is the only one that keeps 0005's isolation intact.\n  A private `CLAUDE_CONFIG_DIR` would take the credentials with it, and `--setting-sources user` needs them.\n- **We prefer**: A `task=` the case declares, plus a `Harness.invoke` that renders each CLI's own syntax.\n  That is preferred over one shared `prompt=` string that names a loading path.\n- **Because**: An eval that has to explain the harness to the agent is measuring the harness.\n  The two arms were not running the same experiment.\n- **Unless**: never\n\n### In practice\n\n- **A case declares a task, not a prompt**.\n  `@evalcase(task=...)` is the sentence a user would type *after* naming the skill.\n  An example is \"Apply the palette mandate to ARCHITECTURE.md\".\n  It never names the skill, never names a loading path, and never mentions a CLI.\n- **The harness renders the invocation.** `Harness.invoke(skill=, task=)` is a new abstract member beside the four 0034 already requires.\n  It is the only place either syntax is spelled: `claude` renders `/<skill> <task>`, and `codex` renders `$<skill> <task>`.\n  Nothing outside `harness/` composes an invocation, so a third CLI with a third syntax is still the one-file job 0034 promises.\n  The one lookup from underneath goes through `model/registry.py`, 0039's declared edge.\n- **Registration is the adapter's job, and it is real registration.** The Claude adapter builds a wrapper plugin beside the workspace, and passes `--plugin-dir`.\n  That plugin is a `.claude-plugin/plugin.json` plus a copy of the skill under `skills/`.\n  A skill whose frontmatter Claude rejects now fails the cell, which is the point.\n- **The rendered prompt is evidence.** `CaseRef` carries both: `task`, the case's declaration, and `prompt`, the exact string that reached the CLI.\n  A reader of one `result.json` can see what was asked without holding the suite file.\n  Two cells of one case can be compared knowing precisely how their asks differed.\n\n## Consequences\n\n### Pros\n\n- A cell can now fail for a reason it previously could not: the skill did not resolve.\n  That is a true negative.\n  `/nosuchskill` comes back as \"Unknown command\" with zero billed tokens, so the evidence gate of [0045](0045-the-verifiers-ship-with-the-plugin.md) catches it before any grader reads a workspace.\n- **The skill's own `evals/` tree was being handed to the agent under test**.\n  Both loading paths copy the skill directory, and since 0046 that directory contains the goldens.\n  The exclusion is now in the shared spawn contract (`harness/base.py`), not in either adapter, so a third provider cannot reintroduce it.\n\n### Cons\n\n- Every existing suite is a breaking change, and deliberately so.\n  A `prompt=` that still carries \"use the X skill (its SKILL.md is in ...)\" is exactly the text this record exists to delete.\n  `@evalcase` raises on `prompt=` with a message naming `task=`, rather than accepting it as an alias.\n  An alias would let the old sentence survive the upgrade.\n- Captured runs from before this record carry `case.prompt` and no `case.task`.\n  A replay reads the task back as empty rather than re-deriving it, per [0038](0038-a-tolerant-reader-still-honours-its-declaration.md).\n- **The dialects disagree about whether `SKILL.md` is ever *read*.** Same task, same fixture.\n  `claude` resolves `/<skill>` by injecting the file, so it never appears in skill coverage.\n  `codex` is instructed to read it, and so it does.\n  An eval that asserts `SKILL.md` was loaded therefore passes on one arm and fails on the other.\n  The reason is not about the skill.\n  That is precisely the failure this record exists to end, reappearing one level down.\n  `check_skill_was_loaded` has no default, and refuses an empty call.\n  What a case names is the `resources/` and `scripts/` material the entry point points at, which both dialects reach when they follow it.\n"}, "ADR-0045": {"file": "0045-the-verifiers-ship-with-the-plugin.md", "title": "The verifiers ship with the plugin, and a rollout has one documented surface", "status": "accepted", "description": "composable is a decision about the shape of grading, not a reason to ship no vocabulary", "markdown": "> **Lens**: \"Composable, not prescribed\" is a decision about the *shape* of grading, not a reason to ship nothing.\n> The library that composition needs is a vocabulary of named checks with one documented noun beneath them.\n> Withhold it and every consuming repository writes the vocabulary anyway, four times, and two of the copies rot into assertions that cannot fail.\n\n## Relates to\n\n- Extends [ADR-0012](0012-grading-is-composable-not-prescribed.md) (the record's status line says \"delivers\"; the \"primitives pending\")\n- Extends [ADR-0013](0013-verifiers-are-python-beside-the-case.md) (the record's status line says \"delivers\"; the \"helper pending\")\n- Extends [ADR-0039](0039-the-package-listing-is-the-architecture.md) (the record's status line says \"refines\"; with a sixth layer)\n\n## Problem\n\n### Symptom\n\n0012 declined to prescribe a grading DSL and 0013 kept verifiers as plain Python beside the case.\nBoth were right, and both left a helper library pending for two years of records.\nWhat arrived instead was copy-paste.\nFour suites in one consuming repository, and all four opened with the same block:\n\n```python\ndef check_run_is_real(run: RunResult) -> None:\n    assert run.session_id, \"no session id - ...\"\n    assert Path(run.session_log).is_file(), ...\n    assert run.exit_code == 0, ...\n    assert run.usage.accumulative_billed_tokens > 0, ...\n    assert run.cost_status == \"priced\", ...\n```\n\n### Pain point\n\nFour copies drift, and these had.\nTwo of the four had gone stale against the plugin's own types and were asserting nothing at all:\n\n| Written | Why it always passed |\n| --- | --- |\n| `run.skill_coverage.get(\"run\")` | `SkillCoverage` has been a dataclass since 0035. On a dataclass this raises `AttributeError`, so the cell errored rather than graded, and an error is not a red check. |\n| `run.rates_applied.get(\"source\")` | Same: `AppliedRates` is a typed record. |\n| `run.cost_status == \"priced\"` | True by luck. `CostStatus` is a `StrEnum`, so this compares equal, but it is a comparison against a literal the vocabulary rule of 0041 forbids. |\n\nThe deeper cause is that nothing told a suite author what a rollout *is*.\nA grader is handed `(RunResult, Path)`.\n`RunResult` has 27 fields, five of them typed records with their own fields, and two of them lists of further records.\nEvery author reached for `.get()` because a mapping is what an undocumented payload looks like.\n\n## Decision\n\n### The lens\n\n- **Given**: A grader reads a finished rollout; it never participates in producing one.\n- **We prefer**: Shipping the vocabulary of named checks and one documented `CaseOutput` noun, over leaving every consuming repository to write the vocabulary itself.\n- **Because**: Withhold it and every consuming repository writes it anyway, four times, and two of the copies rot into assertions that cannot fail.\n- **Unless**: a suite wants something the vocabulary does not name.\n  It then still writes a plain function beside the case, exactly as 0013 says.\n\n### In practice\n\n- **`verify/` is a layer, between `derive/` and `emit/`.** It depends on `model/` and nothing else.\n  The ruff `TID251` rule of 0039 is extended to it in both directions.\n  `verify/` may not name `emit/` or `runtime/`, and `derive/`, `harness/` and `model/` may not name `verify/`.\n  A verifier reads a finished rollout; it never participates in producing one.\n- **A verifier is a function that raises `AssertionError` or returns.** No registry, no result object, no DSL: 0012's decision stands.\n  What ships is the vocabulary, not a framework.\n  The checks are `check_run_is_real`, `check_run_is_priced`, `check_files_written`, `check_no_files_added` and `check_skill_was_loaded`.\n  They continue with `check_skill_scripts_ran`, `check_subagents_spawned`, `check_tools_used`, `check_turns_within` and `check_no_tool_errors`.\n  Each is importable alone, and each says what went wrong in the agent's terms.\n  A suite that wants something else still writes a plain function beside the case, exactly as 0013 says.\n- **`check_rollout` is the gate every case owes.** It is `check_run_is_real` plus `check_run_is_priced`.\n  It is the first line of every shipped case: a verdict untied to a session that happened and was billed is not a verdict.\n  Making it one named call rather than five assertions is what stops the fifth from being dropped in the sixth copy.\n- **The rollout has one named surface, and a grader takes it.** `CaseOutput` is in `model/output.py`, beside the other nouns.\n  It is the pair a grader has always been handed, given a name and the accessors the copy-paste kept re-deriving.\n  Those are `output.run` (the `RunResult`), `output.workspace`, `output.read(rel)`, `output.exists(rel)`, `output.wrote(rel)`, `output.added` and `output.changed`.\n  A grader's signature becomes `def eval_x(output: CaseOutput) -> None`.\n  Two positional arguments were never two things, they were one rollout that had no noun.\n  That is why every suite re-opened the same file with the same four lines of `pathlib` around it.\n- `docs/rollout.md` documents that surface field by field, against the dataclasses rather than beside them.\n  It is the answer to \"what can I assert\", and it is what a suite author reads instead of guessing at `.get()`.\n\n## Consequences\n\n### Pros\n\n- The four stale suites fail loudly on upgrade rather than passing vacuously.\n  `SkillCoverage` and `AppliedRates` are reached as attributes because `check_skill_scripts_ran` reaches them that way once, in typed code that `mypy --strict` checks.\n- Verifiers are unit-tested against captured logs in `tests/test_units.py`.\n  Those are real `result.json` files folded by the real adapters, never a fabricated `RunResult`.\n  0002 forbids that for the same reason it forbids a mocked CLI.\n\n### Cons\n\n- `pytest_xharness_eval.verify` is public API and versioned as such.\n  A check whose assertion tightens is a breaking change for consuming suites, which is the correct pressure.\n  A shared gate that can be silently loosened is worse than four copies.\n- Every grader's signature changes.\n  A two-parameter grader raises at collection with a message naming `CaseOutput`, rather than being adapted by arity sniffing.\n  A suite that still expects `(run, workspace)` is a suite written against the undocumented surface this record replaces.\n  The four stale checks above are what silent adaptation would have carried forward.\n"}, "ADR-0046": {"file": "0046-a-golden-is-compared-facet-by-facet-within-a-declared-tolerance.md", "title": "A golden is compared facet by facet, and every facet declares its tolerance", "status": "accepted", "description": "name the parts of the answer, and say for each how much variation is still correct", "markdown": "> **Lens**: Between \"contains the word\" and \"equals the file\" there is one honest position.\n> Name the parts of the answer, and say for each how much variation is still correct.\n> The tolerance is the interesting content of the eval, because it is the author's actual claim about the skill.\n> It must be written down where a reviewer reads it, not hidden inside a similarity threshold on the whole file.\n\n## Relates to\n\n- Extends [ADR-0012](0012-grading-is-composable-not-prescribed.md) (the record's status line says \"refines\")\n- Extends [ADR-0018](0018-fixtures-directory-and-metrics-history.md) (the record's status line says \"refines\")\n- Extends [ADR-0045](0045-the-verifiers-ship-with-the-plugin.md) (the record's status line says \"refines\")\n\n## Problem\n\n### Symptom\n\nThe palette-mandate case is the harness's reference eval, and its grading is five substring searches:\n\n```python\nassert \"```mermaid\" in doc\nassert \"classDef\" in doc\nassert \"fill:#\" in doc\nassert \"color:\" in doc\n```\n\nGiven the fixture, one unstyled flowchart, a correct answer is very nearly determined.\nThe skill mandates an explicit `classDef` per node group, with fill and text colour drawn from its own palette.\nThe diagram's node set is fixed by the fixture.\nWe can write down what right looks like.\nThe substring searches do not: `classDef x fill:#000,color:#000` passes all four.\nSo does a document that styled one node of nine and left the rest on Mermaid's defaults.\n\n### Pain point\n\nThe obvious repair, checking the output against a stored correct file, fails in the other direction.\nTwo valid answers differ in whitespace, and in the order the `classDef` lines appear.\nThey differ in whether a node group is called `service` or `svc`.\nThey differ in one hex value being a legitimate neighbour on the same palette ramp.\nAn exact comparison would be red on every run and would teach its reader to ignore it.\n\nSo a golden needs to be neither a substring nor a file, and the missing piece is not a smarter diff.\nIt is *saying which parts of the answer are determined and which are free*, per part, and being able to read the failure.\n\n## Decision\n\n### The lens\n\n- **Given**: Which parts of an answer are determined and which are free is knowable per part.\n  It is the eval author's actual claim about the skill.\n- **We prefer**: A real stored artifact compared facet by facet under a declared tolerance, over a substring search or an exact file comparison.\n- **Because**: The tolerance is the interesting content of the eval.\n  It must be written where a reviewer reads it, rather than hidden in a similarity threshold on the whole file.\n- **Unless**: a facet is given no tolerance, which is a type error rather than a default to `Exact`.\n\n### In practice\n\n- **A golden is a real, complete, correct artifact**, stored at `evals/goldens/<name>/<path>`.\n  That mirrors `evals/fixtures/<name>/<path>`.\n  The pairing between a seed and its known-good output is therefore the directory layout, not a convention anyone has to remember.\n  It is committed, readable, and rendered by the same tools as the real thing: a golden nobody can open is a hash.\n- **A `GoldenCase` is that artifact plus a facet list.** A facet is a named extraction from the text.\n  That is node ids, fence count, `classDef` selectors, fill colours, headings, or a numeric measure.\n  Each is paired with the tolerance under which the candidate's value must match the golden's.\n  Facets are ordinary functions `str -> object`, so a project extracts whatever its artifact has.\n  `verify/facets.py` ships the markdown and mermaid extractors the shipped cases need.\n- **Tolerance is declared, never inferred.** Six kinds, and each answers one question about how much freedom this facet has:\n\n  | Tolerance | Holds when | Protects |\n  | --- | --- | --- |\n  | `Exact()` | candidate == golden | the part with one right answer |\n  | `Superset()` | candidate ⊇ golden | a required floor, additions allowed |\n  | `Jaccard(at_least=)` | set overlap ≥ threshold | naming freedom within a fixed concept set |\n  | `Ratio(at_least=)` | `difflib` similarity ≥ threshold | prose that must stay recognisable |\n  | `Count(delta=)` / `Count(lo, hi)` | a count near the golden's, or in a range | structure with legitimate slack |\n  | `Within(lo, hi)` | a number in a closed range | a measure with a defensible band |\n\n  A facet with no tolerance is a type error, not a default to `Exact`.\n  The whole point is that the author states how free each part is.\n- **A mismatch reports the delta, not the diff.** `GoldenMismatch` is an `AssertionError` whose message is one row per facet.\n  The row carries its name, its tolerance, the golden's value and the candidate's value.\n  For the set tolerances it also carries what was missing and what was extra, truncated to a readable width.\n  Passing facets are listed too, because a report that shows only failures cannot distinguish \"one facet failed\" from \"one facet ran\".\n\n## Consequences\n\n### Pros\n\n- Facet extraction is pure and free, so a golden comparison is exercised in `tests/test_units.py` against committed text, with no rollout and no spend.\n- `GoldenCase.record()` writes a candidate into the golden path for regeneration.\n  It is never called during grading, so a run can never launder its own output into the reference.\n\n### Cons\n\n- A golden must be regenerated when the skill's own contract changes, and that is a visible commit against a readable file.\n- A tolerance is a claim about the skill under test and belongs in review.\n  A `Jaccard(at_least=0.5)` says half the concepts may be renamed and the case still passes.\n  That is usually a sign the facet is the wrong extraction, rather than a sign the threshold is right.\n"}, "ADR-0047": {"file": "0047-adrs-are-authored-as-data-and-their-markdown-is-generated.md", "title": "ADRs are authored as data, and the argument travels verbatim", "status": "superseded", "description": "the records become data, and the argument is carried as verbatim markdown block scalars", "markdown": "> **Lens**: A schema earns its keep on the metadata a corpus actually carries, never on the shape a template wishes it had.\n> Where the source supplies a field, extract it; where it does not, leave the field absent and say why.\n> Filling it is authoring new requirements under the cover of a migration, and nobody reviews a migration the way they review a decision.\n\n## Relates to\n\n- Extends [ADR-0032](0032-all-run-output-consolidates-under-a-cache-dir.md) (the record's status line says \"refines\"; generated output has one owner)\n- Superseded by [ADR-0048](0048-the-record-schema-is-the-shipped-one-adopted-strictly.md) (the verbatim `body` and the loosened optional fields are replaced by the strict record; the authored-YAML arrangement stands)\n\n## Problem\n\n### Symptom\n\nThe index at `docs/adrs/README.md` carried the relation graph as prose in a hand-maintained Status column.\nOne read \"refines 0016, 0037, 0038 and 0039; supersedes 0040's placement of `Verdict`\".\nForty-six records, 109 cross-references, and one table a human had to update by hand on every addition.\nIt had already drifted, and the drift is invisible: a missing row reads exactly like a record with no relations.\n\n### Pain point\n\nThe librarian's `okf-yaml` convention exists for this, and its trigger fired.\nIts record schema, however, decomposes an argument into `problem.symptom` + `problem.pain_point` as two scalars, and `decision` into `given` / `we_prefer` / `because` / `unless`.\nMeasured against this corpus that shape did not fit:\n\n| Section | median words | max | with tables | with code fences |\n| --- | --- | --- | --- | --- |\n| `## Context` | 117 | 416 | 10 | 2 |\n| `## Decision` | 210 | 919 | 3 | 6 |\n| `## Consequences` | 72 | 319 | 0 | 0 |\n\nA 919-word Decision carrying six code fences has nowhere to go in four scalar clauses.\n`consequences.cons` carries `minItems: 1`, while these records argue in narrative rather than in pros and cons.\nAdopting the shipped schema unchanged would therefore have meant writing 46 new `cons` lists.\nThat is authoring decisions, not recording them, and a requirement invented during a migration is a requirement nobody agreed to.\n\n## Decision\n\n### The lens\n\n- **Given**: The corpus argues in narrative prose with tables and code fences.\n  The librarian's own instruction is to copy the schema and tighten it to the adopting repository's dialect.\n- **We prefer**: An authored-YAML record whose argument is carried verbatim in `body`, over the shipped schema's `problem` / `decision` / `consequences` decomposition.\n- **Because**: Every generated `.md` is then byte-identical to the file it replaced from the `# NNNN:` heading down, so nothing was reformatted in transit.\n- **Unless**: the corpus is deliberately re-authored into the strict shape, which is what ADR 0048 does.\n\n### In practice\n\n- **The record is the source of truth, and the argument is cargo.** Each ADR is authored as `NNNN-slug.yml`.\n  `body.context`, `body.decision` and `body.consequences` hold their sections as verbatim markdown block scalars, tables and fenced code included.\n  The generator emits them unchanged, which is what makes every generated `.md` byte-identical to the file it replaced from the `# NNNN:` heading down.\n  Nothing was reformatted in transit.\n- **The schema is tightened to the corpus, not the corpus to the schema**.\n  The librarian's own instruction is to copy the schema and tighten it to the adopting repository's dialect.\n  `docs/adrs/record.schema.json` therefore requires exactly what all 46 records demonstrably carry: id, slug, title, status, the verbatim status sentence, both dates, relations, and body.\n  It makes optional what none of them do: `description`, `tags`, `provenance`, `enforced_in`.\n  An absent field is a fact about the corpus.\n  Four records have no `## Lens`; `lens` is therefore optional, and those four keep no Lens rather than gaining an invented one.\n- **Typed edges are inferred from the sentence, and the sentence is kept**.\n  The status line's own vocabulary maps onto the closed relation set.\n  \"refines\" maps to `extends`, \"refined by\" to `extended_by`, and \"supersedes\" / \"superseded by\" to their own pair.\n  Each edge's `note` records which verb produced it.\n  The full original sentence stays verbatim in `status_note`, and is what the generated index renders.\n  Typing the relations therefore adds a queryable graph without costing the phrasing.\n  This is the one-way conversion the convention warns about, declined: both forms are kept.\n- **The title stays in an H1.** OKF's own preference is a frontmatter title with no heading above the body.\n  But the observed dialect of this repository puts it in `# NNNN: Title`, and every inbound citation resolves against that.\n  Templates own presentation, while the schema owns structure.\n  The generated frontmatter carries the title as well, so a query reaches it without parsing the heading.\n\n## Consequences\n\n### Pros\n\n- `docs/adrs/*.md` becomes build output.\n  Editing one is lost on the next `make adrs`.\n  The banner in each file's frontmatter says so, and CI fails when a generated file differs from a fresh build.\n- A record is now edited in two files' worth of discipline -- the `.yml` and a rebuild -- where it used to be one.\n  That cost buys the schema gate, the typed graph, and an index that cannot drift from the records it lists.\n\n### Cons\n\n- `docs/adrs/README.md` is replaced by the generated `index.md`.\n  OKF reserves `index.md` for the directory listing, and requires any other `.md` in the bundle to carry frontmatter.\n  GitHub therefore no longer renders a landing page for `docs/adrs/`; the ten inbound links that named `README.md` now name `index.md`.\n- The first symmetry run reports 109 one-way edges.\n  That is the expected finding on a corpus whose cross-references were only ever written in one direction.\n  It is reported rather than failed: closing an edge is a decision about the record set, which is the maintainer's, not the migration's.\n"}, "ADR-0048": {"file": "0048-the-record-schema-is-the-shipped-one-adopted-strictly.md", "title": "The record schema is the librarian's shipped one, adopted strictly", "status": "accepted", "description": "the corpus is re-authored into the strict shape rather than the schema loosened to fit it", "markdown": "> **Lens**: A migration that only re-encodes is cheap and reversible.\n> One that re-authors is neither, so it is a decision and must be recorded as one.\n> When a corpus is coerced into a shape it did not have, name the fields nobody could extract and say who wrote them.\n> A reader must be able to tell the argument the record made from the clauses the migration composed out of it.\n\n## Relates to\n\n- Supersedes [ADR-0047](0047-adrs-are-authored-as-data-and-their-markdown-is-generated.md) (replaces the verbatim `body` and the four loosened optional fields; the authored-YAML arrangement and the relation vocabulary stand)\n\n## Problem\n\n### Symptom\n\nADR 0047 adopted the librarian's `okf-yaml` convention, but copied its record schema and *loosened* it.\n`body.context` / `body.decision` / `body.consequences` carried each record's sections as verbatim markdown, and `status_note` carried the status sentence.\n`description`, `provenance`, `enforced_in` and `lens` were optional, because no record supplied them.\n\nThe result validates against `docs/adrs/record.schema.json` and against nothing else.\nTwo fields of the shipped schema had no counterpart at all, and four of its required fields were absent from all 47 records.\n\n### Pain point\n\nA named convention whose schema an adopter may relax at will is a convention in name only.\nThe point of `okf-yaml` is that a consumer knows what a record carries without reading the adopter's copy of the schema first.\nThe loosened form also left the corpus unable to answer the questions the shape exists for.\nWhich alternative was rejected, what the escape hatch is, and what the decision cost.\nThose clauses were dissolved inside a narrative block nothing could address.\n\n## Decision\n\n### The lens\n\n- **Given**: The librarian ships `resources/okf_yaml/record.schema.json` as the contract, and asks an adopter to tighten its patterns rather than to relax its requirements.\n- **We prefer**: The shipped schema adopted strictly, with every record re-authored into it.\n  That is preferred over ADR 0047's loosened copy carrying a verbatim `body`, and over condensing the argument to whatever fits the clauses.\n- **Because**: A record that answers `we_prefer`, `unless` and `cons` in named fields is queryable.\n  It is reviewable in a way a narrative block is not.\n  Nothing of the argument has to be discarded to get there.\n- **Unless**: a tightening is at stake.\n  `id` and `relates_to[].target` keep this repository's `ADR-` prefix, and `group` and `tags` are drawn from the eleven-domain enum, so a typo fails the build.\n  Nothing is relaxed.\n\n### In practice\n\n- **The schema is the shipped one**.\n  `docs/adrs/record.schema.json` requires all fifteen fields the librarian's copy requires, plus `plan_id` and `group`, which this repository declares on every record.\n  `body` and `status_note` are gone; `additionalProperties` stays false at every level.\n- **The argument is redistributed, not condensed**.\n  Each record's `## Context` became `problem.symptom` and `problem.pain_point`.\n  Its `## Decision` became `given`, `we_prefer`, `because`, `unless` and a list of `in_practice` block scalars.\n  Those carry the fourteen comparison tables and eight fenced examples unchanged.\n  Its `## Consequences` became `pros` and `cons`.\n  No sentence was dropped.\n- **The status sentence survives on the edges it described**.\n  Where 0047 kept the prose in `status_note` and typed the relations beside it, the governing clause is now each edge's `note`.\n  A partial supersession therefore still says which part.\n  Citations that 0047 left untyped because they lived only in that sentence are now `see_also` edges: there is no prose field left to hold them.\n- **The generated markdown is the librarian's own template**.\n  The title moves into frontmatter, the record opens with its Lens blockquote, and `provenance` and `enforced_in` join the frontmatter.\n  The relations render as a `## Relates to` list.\n  No inbound link used an `#nnnn-title` anchor, so nothing citing a record breaks.\n  The regenerate banner stays: the convention's verification gate requires every generated file to carry one.\n- **Four fields could not be extracted, and were written**.\n  `description`, `provenance` and `enforced_in` did not exist in any record.\n  Each was composed from that record's own text and, for `enforced_in`, from the surfaces the change map already names.\n  Four records (0031, 0032, 0033, 0043) had no `## Lens`, and the strict schema requires one.\n  Each was drawn from a rule the record itself states in prose.\n  This is the authoring ADR 0047 declined to do, done deliberately and under its own record rather than inside a migration.\n\n## Consequences\n\n### Pros\n\n- Every record now validates against the librarian's shipped schema.\n  The bundle is therefore portable to any `okf-yaml` consumer, without that consumer reading this repository's copy of the contract first.\n- The corpus is queryable on the clauses that matter.\n  `yq` over `decision.we_prefer` lists every rejected alternative, over `decision.unless` every escape hatch, and over `consequences.cons` every accepted cost.\n- Typing the citations that 0047 left in prose closes gaps in the graph.\n  Edges exist now for references that were previously visible only to a human reading a status sentence.\n\n### Cons\n\n- The verbatim `## Context` / `## Decision` / `## Consequences` prose is gone as prose.\n  Every sentence survives inside a named field.\n  But the reading order and the paragraphing of 47 accepted records changed, and the byte-identity ADR 0047 established against the pre-0047 markdown is permanently broken.\n  Git history is the only place the original rendering now exists.\n- Four fields per record were composed rather than extracted, which is a migration authoring content.\n  That is exactly what ADR 0047's Lens warns against.\n  It is recorded here so the provenance of those fields is legible.\n  A reader who wants only what the author wrote should read `problem`, `decision` and `consequences`.\n- A record is more work to write.\n  Fifteen required fields, a rejected alternative that must be named, and at least one cost that must be stated.\n  0047 asked for three prose blocks.\n- A prose-gate pass over the generated markdown then split and reworded the sentences themselves.\n  Every claim survives.\n  But 412 sentences were divided at a clause boundary, and 110 em-dashes became commas, colons or full stops.\n  The wording is no longer the author's throughout.\n  The gate is `prose_gates.ts`, from the `gooddocs` skill.\n  Its rules are one sentence per line, a 25-word budget, no em-dash, and no list disguised as prose.\n"}}</script>
<script id="token-data" type="application/json">{"$schema": "xharness-report-design-tokens/1", "name": "xharness default", "fonts": {"body": "ui-sans-serif, system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif", "mono": "ui-monospace, SFMono-Regular, Menlo, monospace"}, "themes": {"light": {"bg": "#f7f7fa", "panel": "#ffffff", "ink": "#1b1d23", "muted": "#5b6070", "line": "#e2e4ea", "accent": "#4f46e5", "good": "#047857", "bad": "#b91c1c", "warn": "#b45309", "code": "#f1f2f6", "grid": "#e6e8ee", "axis": "#c8ccd6", "plot": "#ffffff", "series": ["#4f46e5", "#d97706", "#059669", "#db2777", "#0284c7", "#7c3aed", "#dc2626", "#0d9488"], "waterfall": {"baseline": "#64748b", "read": "#94a3b8", "context": "#2563eb", "thinking": "#7c3aed", "output": "#059669", "sub": "#ea580c", "total": "#1b1d23"}, "hljs": "github"}, "dark": {"bg": "#0f1117", "panel": "#171a23", "ink": "#e6e8ef", "muted": "#9aa0b0", "line": "#2a2e3a", "accent": "#a5b4fc", "good": "#34d399", "bad": "#f87171", "warn": "#fbbf24", "code": "#1f2330", "grid": "#262a36", "axis": "#3a3f4e", "plot": "#171a23", "series": ["#a5b4fc", "#fbbf24", "#34d399", "#f9a8d4", "#7dd3fc", "#c4b5fd", "#fca5a5", "#5eead4"], "waterfall": {"baseline": "#94a3b8", "read": "#475569", "context": "#60a5fa", "thinking": "#c4b5fd", "output": "#34d399", "sub": "#fb923c", "total": "#e6e8ef"}, "hljs": "github-dark"}}, "categories": {"prompt": "#1d4ed8", "assistant_text": "#065f46", "thinking": "#6d28d9", "tool_call": "#4338ca", "tool_result": "#0f766e", "tool_exec": "#9a3412", "file_change": "#be185d", "usage": "#b45309", "harness_context": "#3f6212", "harness_meta": "#475569", "session_meta": "#1e3a8a", "lifecycle": "#b91c1c", "unknown": "#374151"}}</script>
<script>
(function () {
  "use strict";
  const read = (id) => JSON.parse(document.getElementById(id).textContent);
  const graph = read("graph-data");
  const RECORDS = read("record-data");
  const TOKENS = read("token-data");
  const pane = document.getElementById("pane");
  // A function declaration, not a const: applyTheme() runs before the graph exists
  // and would otherwise hit the temporal dead zone.
  function css(name) {
    return getComputedStyle(document.documentElement).getPropertyValue("--" + name).trim();
  }
  // Never `window.cy`: an element with id="cy" already claims that name through named
  // access on window, so the theme pass would style a <div> and throw.
  let graphInstance = null;

  if (!window.cytoscape || !window.marked) {
    document.getElementById("cy").innerHTML =
      '<p class="nofx">cytoscape.js and marked.js load from cdnjs.cloudflare.com. ' +
      "This page is otherwise self-contained; with no network the graph cannot draw. " +
      "The same records are readable as markdown in index.md.</p>";
    return;
  }

  // ---- theme -----------------------------------------------------------------
  // The repository's shipped design tokens drive the page, so the graph matches the
  // report. Both themes' values are written as CSS custom properties up front; the
  // toggle only flips which set is live.
  const themes = (TOKENS.themes) || {};
  function applyTheme(name) {
    document.documentElement.setAttribute("data-theme", name);
    const t = themes[name];
    if (t) {
      for (const [k, v] of Object.entries(t)) {
        if (typeof v === "string") document.documentElement.style.setProperty("--" + k, v);
      }
    }
    try { localStorage.setItem("adr-graph-theme", name); } catch (_) { /* opaque file:// origin */ }
    if (graphInstance) style(graphInstance);
  }
  let stored = null;
  try { stored = localStorage.getItem("adr-graph-theme"); } catch (_) { /* opaque file:// origin */ }
  const preferred =
    stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  applyTheme(preferred);
  document.getElementById("theme").onclick = () =>
    applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");

  // ---- elements --------------------------------------------------------------
  // graph.json carries the neutral data, compound parents included: each record
  // declares one `group`, its domain. Presentation is decided here, and both channels
  // are derived rather than assigned: fill is the domain, size is in-degree (how many
  // records refine or supersede this one). Status rides on the border, because only
  // one record is superseded and a whole colour channel would be wasted on it.
  const elements = graph.elements;
  const GROUPS = elements
    .filter((e) => String(e.data.id).startsWith("group-") )
    .map((e) => ({ id: e.data.id, label: e.data.label, colour: e.data.colour }))
    .sort((a, b) => a.label.localeCompare(b.label));

  const indegree = {};
  for (const e of elements) if (e.data.source) indegree[e.data.target] = (indegree[e.data.target] || 0) + 1;
  for (const e of elements) if (!e.data.source) e.data.weight = indegree[e.data.id] || 0;

  function style(cy) {
    cy.style([
      {
        selector: "node",
        style: {
          "background-color": "data(colour)",
          label: "data(label)",
          color: "#ffffff",
          "font-family": "ui-monospace, Menlo, monospace",
          "font-size": 10,
          "text-valign": "center",
          "text-halign": "center",
          width: (n) => 22 + Math.min(n.data("weight"), 10) * 3.4,
          height: (n) => 22 + Math.min(n.data("weight"), 10) * 3.4,
          "border-width": 0,
        },
      },
      {
        // A compound parent is a container, not a node: no fill of its own beyond a
        // wash of its domain colour, and its name sits above the cluster.
        selector: ":parent",
        style: {
          "background-color": "data(colour)",
          "background-opacity": 0.07,
          "border-width": 1,
          "border-color": "data(colour)",
          "border-opacity": 0.45,
          "border-style": "dashed",
          shape: "round-rectangle",
          padding: 14,
          label: "data(label)",
          color: "data(colour)",
          "font-family": "var(--body)",
          "font-size": 12,
          "font-weight": "bold",
          "text-valign": "top",
          "text-halign": "center",
          "text-margin-y": -4,
        },
      },
      {
        // The one status that is not "accepted" earns a ring rather than a hue.
        selector: 'node[status = "superseded"]',
        style: { "border-width": 3, "border-color": css("bad"), "border-opacity": 1 },
      },
      {
        selector: "edge",
        style: {
          width: 1.4,
          "line-color": (e) => (e.data("relation").startsWith("supersede") ? css("bad") : css("accent")),
          "target-arrow-color": (e) => (e.data("relation").startsWith("supersede") ? css("bad") : css("accent")),
          "target-arrow-shape": "triangle",
          "arrow-scale": 0.8,
          "curve-style": "bezier",
          "line-style": (e) => (e.data("relation").startsWith("supersede") ? "solid" : "dashed"),
          opacity: 0.5,
        },
      },
      { selector: "node.sel", style: { "border-width": 4, "border-color": css("ink"), "border-opacity": 1 } },
      { selector: ":parent.dim", style: { "background-opacity": 0.02, "border-opacity": 0.12, "text-opacity": 0.25 } },
      { selector: "node.dim, edge.dim", style: { opacity: 0.15 } },
      { selector: "edge.hot", style: { opacity: 1, width: 2.4 } },
      { selector: "node.hot", style: { opacity: 1 } },
    ]);
  }

  // ---- the grouped layout ------------------------------------------------------
  // Computed here rather than left to a force layout, for two reasons. Cytoscape's
  // built-in `cose` is only nominally compound-aware: records whose edges reach across
  // domains get dragged out of their own cluster, which collapsed several groups to a
  // few pixels. And a force layout is non-deterministic, so a committed generated file
  // would draw a different picture on every rebuild. The purpose-built compound
  // layouts (fcose, cose-bilkent) are not on the CDN this page is allowed to use.
  //
  // Shelf packing: each domain becomes a grid of its records, the grids are laid out
  // left to right and wrapped, and every position is a pure function of the sorted
  // record ids. Same input, same picture, every time.
  const SLOT = 66;          // one record's cell, in graph units
  const GAP = 46;           // between domain boxes

  function groupedPositions() {
    const boxes = GROUPS.map((g) => {
      const kids = elements
        .filter((e) => e.data.parent === g.id)
        .map((e) => e.data.id)
        .sort();
      const cols = Math.max(1, Math.ceil(Math.sqrt(kids.length)));
      const rows = Math.ceil(kids.length / cols);
      return { ...g, kids, cols, rows, w: cols * SLOT, h: rows * SLOT };
    });

    // Wrap width is derived from the total area and the pane's aspect ratio, so the
    // arrangement stays roughly as wide as the space it has to fit into. A fixed width
    // produced a long thin strip that fitted to almost nothing in a tall pane.
    const area = boxes.reduce((a, b) => a + (b.w + GAP) * (b.h + GAP), 0);
    const box = document.getElementById("cy").getBoundingClientRect();
    const aspect = box.width && box.height ? box.width / box.height : 1;
    const shelf = Math.max(
      Math.max(...boxes.map((b) => b.w)),
      Math.sqrt(area * Math.max(aspect, 0.6)),
    );

    const pos = {};
    let x = 0, y = 0, shelfHeight = 0;
    for (const b of boxes) {
      if (x > 0 && x + b.w > shelf) { x = 0; y += shelfHeight + GAP; shelfHeight = 0; }
      b.kids.forEach((id, i) => {
        pos[id] = {
          x: x + (i % b.cols) * SLOT + SLOT / 2,
          y: y + Math.floor(i / b.cols) * SLOT + SLOT / 2,
        };
      });
      x += b.w + GAP;
      shelfHeight = Math.max(shelfHeight, b.h);
    }
    return pos;
  }

  const GROUPED = {
    name: "preset",
    positions: (n) => groupedPositions()[n.id()],
    padding: 40,
    animate: false,
    fit: true,
  };

  const cy = cytoscape({
    container: document.getElementById("cy"),
    elements,
    layout: GROUPED,
    wheelSensitivity: 0.2,
  });
  graphInstance = cy;
  window.__adrGraph = cy;  // the browser check reaches the instance through this
  style(cy);

  // ---- selection -------------------------------------------------------------
  function show(id) {
    const rec = RECORDS[id];
    if (!rec) return;
    cy.batch(() => {
      cy.elements().removeClass("sel hot dim").addClass("dim");
      const node = cy.getElementById(id);
      node.removeClass("dim").addClass("sel hot");
      node.connectedEdges().removeClass("dim").addClass("hot").connectedNodes().removeClass("dim").addClass("hot");
    });
    pane.classList.remove("empty");
    pane.innerHTML =
      '<div class="meta"><span class="chip">' + id + '</span>' +
      '<span class="chip ' + rec.status + '">' + rec.status + "</span>" +
      '<a class="chip" href="' + rec.file + '">' + rec.file + "</a></div>" +
      '<div id="doc">' + marked.parse(rec.markdown) + "</div>";
    // A link to another record navigates the graph instead of leaving the page. Scoped to
    // the rendered body: the chip above links to this record's own file and must keep its
    // native behaviour, or it would rewire into a no-op that reselects the current record.
    for (const a of pane.querySelectorAll('#doc a[href$=".md"]')) {
      const target = Object.keys(RECORDS).find((k) => RECORDS[k].file === a.getAttribute("href"));
      if (!target) continue;
      a.classList.add("adr");
      a.addEventListener("click", (ev) => { ev.preventDefault(); select(target); });
    }
    pane.scrollTop = 0;
  }

  function select(id) {
    show(id);
    history.replaceState(null, "", "#" + id);
    const n = cy.getElementById(id);
    if (n.length) {
      cy.animate({ center: { eles: n }, zoom: Math.max(cy.zoom(), 0.75) }, { duration: 220 });
    }
  }

  cy.on("tap", "node", (ev) => select(ev.target.id()));
  cy.on("tap", (ev) => {
    if (ev.target !== cy) return;
    cy.elements().removeClass("sel hot dim");
    pane.classList.add("empty");
    pane.innerHTML = "<p>Select a record to read it.<br>Links between records navigate the graph.</p>";
    history.replaceState(null, "", "#");
  });

  // ---- controls --------------------------------------------------------------
  // One chip per domain. Clicking isolates that domain; clicking again restores the
  // whole graph. Counts come from the elements, so the legend cannot disagree with them.
  const nav = document.getElementById("groups");
  let isolated = null;
  for (const g of GROUPS) {
    const count = cy.getElementById(g.id).children().length;
    const chip = document.createElement("button");
    chip.className = "gchip";
    chip.type = "button";
    chip.setAttribute("aria-pressed", "false");
    chip.dataset.group = g.id;
    chip.innerHTML =
      '<span class="sw" style="background:' + g.colour + '"></span>' + g.label +
      ' <span class="n">' + count + "</span>";
    chip.onclick = () => {
      isolated = isolated === g.id ? null : g.id;
      for (const c of nav.children) c.setAttribute("aria-pressed", String(c.dataset.group === isolated));
      cy.batch(() => {
        cy.elements().removeClass("dim");
        if (!isolated) return;
        const keep = cy.getElementById(isolated).children();
        cy.elements().addClass("dim");
        keep.removeClass("dim");
        cy.getElementById(isolated).removeClass("dim");
        // Only edges with both ends inside the domain. A cross-domain edge left lit
        // terminates at a node that is no longer drawn, which reads as a stray line.
        keep.edgesWith(keep).removeClass("dim");
      });
    };
    nav.appendChild(chip);
  }

  document.getElementById("fit").onclick = () => cy.fit(undefined, 30);
  document.getElementById("layout").onchange = (ev) => {
    const choice = ev.target.value;
    // The alternates are force- or tree-based and ignore compound containment, so the
    // domain boxes stretch to wherever their records land. That is a fair view of the
    // relation structure; `grouped` is the one that keeps the domains legible.
    cy.layout(
      choice === "grouped"
        ? GROUPED
        : {
            name: choice, animate: false, padding: 30, directed: true, spacingFactor: 1.15,
            nodeRepulsion: 12000, idealEdgeLength: 70, nestingFactor: 1.2, numIter: 1000,
          },
    ).run();
    cy.fit(undefined, 30);
  };

  document.getElementById("q").addEventListener("input", (ev) => {
    const q = ev.target.value.trim().toLowerCase();
    cy.batch(() => {
      if (!q) { cy.elements().removeClass("dim"); return; }
      cy.nodes().forEach((n) => {
        if (n.isParent()) { n.addClass("dim"); return; }
        const hit =
          n.id().toLowerCase().includes(q) ||
          (n.data("title") || "").toLowerCase().includes(q) ||
          (n.data("group") || "").toLowerCase().includes(q);
        n.toggleClass("dim", !hit);
      });
      cy.edges().addClass("dim");
    });
  });

  window.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") { document.getElementById("q").value = ""; cy.elements().removeClass("dim"); }
    if (ev.key === "/" && document.activeElement !== document.getElementById("q")) {
      ev.preventDefault(); document.getElementById("q").focus();
    }
  });

  // The hash is the address. Honour it on load and on every later change, so the browser's
  // back and forward buttons walk the reading history and a pasted link opens its record.
  function fromHash() {
    const id = decodeURIComponent(location.hash.slice(1));
    if (RECORDS[id]) show(id);
  }
  window.addEventListener("hashchange", fromHash);

  // Fit once the first layout has settled, then honour any deep link. Fitting before
  // the layout runs measures an empty extent and leaves the graph off-screen.
  cy.ready(() => {
    cy.fit(undefined, 30);
    const deep = decodeURIComponent(location.hash.slice(1));
    if (RECORDS[deep]) select(deep);
  });
  window.addEventListener("resize", () => cy.fit(undefined, 30));
})();
</script>
</body>
</html>
