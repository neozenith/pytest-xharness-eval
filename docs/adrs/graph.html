": {"file": "0042-the-overview-is-filtered-by-the-url.md", "title": "The overview is filtered by the URL, and the summary aggregates the chart's own groups", "status": "accepted", "status_note": "accepted, 2026-08-29.\nRefines [0020](0020-captured-report-is-a-static-microsite.md) (the captured report is a static microsite) and [0021](0021-metric-names-carry-unit-and-provenance.md) (a metric name carries its unit and its source).\nIt also refines [0028](0028-report-is-built-from-a-component-workspace.md) (the report page is built from a component workspace) and [0031](0031-plotly-tamagui-and-a-deeplink-permutation-matrix.md) (every state deeplinks, and a Playwright matrix sweeps them all).\nNothing the Python side emits changes: no new JSON key, no ini key, no CLI option, no metric's value.", "markdown": "# 0042: The overview is filtered by the URL, and the summary aggregates the chart's own groups\n\nStatus: accepted, 2026-08-29.\nRefines [0020](0020-captured-report-is-a-static-microsite.md) (the captured report is a static microsite) and [0021](0021-metric-names-carry-unit-and-provenance.md) (a metric name carries its unit and its source).\nIt also refines [0028](0028-report-is-built-from-a-component-workspace.md) (the report page is built from a component workspace) and [0031](0031-plotly-tamagui-and-a-deeplink-permutation-matrix.md) (every state deeplinks, and a Playwright matrix sweeps them all).\nNothing the Python side emits changes: no new JSON key, no ini key, no CLI option, no metric's value.\n\n## Context\n\nThe sweep grew to 24 sessions across 2 skills × 2 harnesses × 4 models, and both overview consumers stopped scaling with it. `TokenAccumulationChart` draws 16 lines whose legend already overflows its card, and `SessionTable` is 24 rows of 18 columns.\nThere was no way to ask \"just claude\" or \"just this skill\".\nThere was no aggregate view at all.\nEvery comparison between two harnesses was done by eye, across 24 rows.\n\n## Decision\n\nThree binding parts.\n\n### 1. The overview's filter state is URL state, like every other interactive state of this page\n\nThree params (`skill`, `harness`, `model`) on the overview route only.\nThey are multi-select, because a reader compares two harnesses far more often than one.\nSo a facet serialises as a comma-separated list: **OR within a facet, AND across facets**.\nAn absent param means every value, which keeps `?`, `?sort=…` and `?theme=dark` byte-identical to what they were.\nA present-but-empty param still means every value, never none.\nA value the data does not contain is kept in route state and matches nothing.\nSo a stale deeplink lands in a visible empty state rather than silently widening.\n\nChanging a facet **replaces** the history entry rather than pushing one, because a filter refines the page you are already on.\nIt is the same rule the neighbouring `sort` control follows.\n`OverviewFiltersClear` is the undo.\nPer 0031 the params are enumerated in `lib/permutations.ts` in this same change, including one permutation (`overview--filter-none`) that deliberately selects zero sessions.\n\n### 2. `SweepOverview` owns the filtering; its children are presentational\n\nThe view derives the visible `Cell[]` once and passes it down. `TokenAccumulationChart`, `SessionSummaryTable` and `SessionTable` take the cells they are given and know nothing about facets.\nThe only concession is a shared `NO_MATCH` sentence all three print when handed nothing.\nSo a filtered-to-nothing overview says so three times in one voice instead of rendering three empty boxes.\n\n`OverviewFilters` is the producer, not a consumer, so it alone reads and writes the route.\nIt derives its option lists from the whole sweep, never from the filtered subset.\nSo the control never moves under the reader's hand.\nA value that would select nothing is dimmed rather than removed.\n\n### 3. `SessionSummaryTable` aggregates the chart's own groups, by mean\n\nIts grouping key (skill × case × harness × model) is deliberately the same partition `accumulationGroups` draws with.\nSo one summary row is one line of the chart above it, and the two read as a pair.\nEvery aggregate is named `mean <field>` in full, per 0021: the name carries the operation as well as the unit.\n\nMean, not median, for three reasons:\n\n- The chart beside it already draws a mean line with a min–max envelope, and a median row would disagree with the picture by construction.\n- Cost and tokens are additive, so `mean × runs` is the group's total.\n- A median over the group sizes this data produces (1–2) is either the single value or the mean of the two.\n\nA missing value is skipped, never zero-filled, and an aggregate over nothing is null, never zero: a sparse column must read as sparse.\nThe pass rate's denominator is the runs that carry a verdict, so an ungraded run is never counted as a failure.\n\n## Consequences\n\nThe three params join the deeplink matrix and the tiered sweep. `lib/facets.ts` and `lib/summary.ts` join `lib/series.ts` as pure, unit-tested derivations over `Cell[]`. `coverageShare` and the fixed-decimal formatter move into `lib/format.ts`, so the table and the summary compute one number from one place.\nNothing the Python side emits changes.\n\n## Lens\n\n**An interactive state that changes what the reader is looking at belongs in the URL, and a derived view names its own arithmetic.** If two views of the same data sit on one page, they group it the same way, or they are not a pair.\n"}, "ADR-0043": {"file": "0043-the-overview-tables-are-budgeted-to-one-screen.md", "title": "The overview's tables are budgeted to one screen, and the aggregate has a decomposition as well as an accumulation", "status": "accepted", "status_note": "accepted, 2026-08-30.\nPart 3, the one-screen budget for `SessionTable`, is superseded by [0061](0061-the-session-table-scrolls-and-the-reader-picks-its-columns.md): the table scrolls and the reader picks its columns.\nRefines [0020](0020-captured-report-is-a-static-microsite.md) (the captured report is a static microsite) and [0021](0021-metric-names-carry-unit-and-provenance.md) (a metric name carries its unit and its source).\nIt also refines [0025](0025-results-name-their-case-and-charts-have-a-log-line-axis.md) (a result names its case).\nIt also refines [0031](0031-plotly-tamagui-and-a-deeplink-permutation-matrix.md) (every state deeplinks, and a Playwright matrix sweeps them all) and [0042](0042-the-overview-is-filtered-by-the-url.md) (the overview is filtered by the URL).\nNothing the Python side emits changes: no new JSON key, no ini key, no CLI option, no metric's value.", "markdown": "# 0043: The overview's tables are budgeted to one screen, and the aggregate has a decomposition as well as an accumulation\n\nStatus: accepted, 2026-08-30.\nPart 3, the one-screen budget for `SessionTable`, is superseded by [0061](0061-the-session-table-scrolls-and-the-reader-picks-its-columns.md): the table scrolls and the reader picks its columns.\nRefines [0020](0020-captured-report-is-a-static-microsite.md) (the captured report is a static microsite) and [0021](0021-metric-names-carry-unit-and-provenance.md) (a metric name carries its unit and its source).\nIt also refines [0025](0025-results-name-their-case-and-charts-have-a-log-line-axis.md) (a result names its case).\nIt also refines [0031](0031-plotly-tamagui-and-a-deeplink-permutation-matrix.md) (every state deeplinks, and a Playwright matrix sweeps them all) and [0042](0042-the-overview-is-filtered-by-the-url.md) (the overview is filtered by the URL).\nNothing the Python side emits changes: no new JSON key, no ini key, no CLI option, no metric's value.\n\n## Context\n\n0042 gave the overview a filter, a `SessionSummaryTable` and three consumers that answer to it.\nThree things were left unresolved by it.\n\n`SessionTable` did not fit.\nEighteen columns measured ~1600px against the 1086px a card gives it at a 1440px viewport.\nSo a third of the metrics were permanently behind a horizontal scrollbar.\nThe table's own auto-scroll-the-sorted-head effect existed only to paper over that.\nA metric a reader cannot see is a metric that does not exist.\nAnd the metrics off the right edge were not the unimportant ones: they were whichever ones happened to be declared last.\n\n`SessionSummaryTable` was declared unsortable, on the reasoning that a second sort param would double the route surface for a sixteen-row table.\nThat reasoning holds for the *route*, not for the reader.\nThe whole point of an aggregate is to rank groups (by mean cost, by pass rate, by mean wall).\nA fixed key order answers none of those questions.\n\nAnd the overview had an *accumulation* of tokens (how fast the bill grows) with no *decomposition* (where it went).\nThe per-session `TokenWaterfallChart` answers the second question for one run and there was no way to ask it of many.\n\n## Decision\n\nFour binding parts.\n\n### 1. The second table sorts on its own param pair\n\n`ssort` / `sdir` on the overview route, parsed and serialised by the same `sortState` helper as `sort` / `dir`.\n**Not** a shared pair: a reader ranks groups by mean cost while ranking sessions by when they ran.\nSo a shared pair would make every click on one table silently reorder the other.\nAnd no single URL could express the pair of orders the reader is actually looking at.\nBoth pairs are enumerated in `lib/permutations.ts` in this same change, including the permutation that carries both at once.\n\nThe fixed `skill|case|harness|model` key order stays the default.\nIt remains the only order in which `SessionSummaryTable`'s skill banding and its repeated-value muting tell the truth.\nSo **both switch off whenever a column is sorted**.\nUnder any other order \"the row above\" is whatever the reader last clicked.\nA band drawn then is describing a grouping the table is no longer in.\n\n### 2. Every control on the overview writes through one patch function\n\n`overviewWith(route, patch)` spreads the current overview state and applies one change.\nControls no longer respell the route.\nThis is not tidiness: the filter chips had already been caught clearing `sort`, and the sort heads clearing `facets`.\nEach new param makes every control that predates it wrong by default.\nOne function is wrong in one place or in none.\n\n### 3. `SessionTable` is budgeted to one screen, and width is taken from spelling rather than from data\n\nEvery metric stays.\nThe width comes back from how figures are *written*, and from one column that was not a metric:\n\n- the session id is not a column: it identified a row without telling you anything about it.\n  The row opens the `SessionView` that prints it beside a `CopyId`, and `data-sid` still carries it.\n- `estimated_cost_usd` and `harness_reported_cost_usd` are one column: the estimate is the value and the harness's own figure is a signed **drift** from it.\n  Two four-decimal figures side by side were being subtracted by eye, and the subtraction is the whole question.\n- token counts are abbreviated (`1.5M`, `29.4k`) with the exact figure on the cell's `title`.\n  Cost drops to three decimals here: a tenth of a cent is below the resolution anyone ranks a sweep by.\n  `ReconciliationPanel` and `CostByTierPanel`, which exist to reconcile, keep four.\n- `model` drops its vendor prefix and `case` the `eval_` every case shares.\n  Shortening is abandoned for the *whole* sweep if any two models would collide, because a partial map reads as an inconsistency rather than a rule.\n- `baseline_tokens` loses its column to the `peak ctx` cell's title.\n  It is the harness's own prompt before the agent acted, near-constant within a harness, and the one figure here nobody ranks a sweep by.\n- the heads print the shortest form that reads.\n  The eight `mean …` labels in `SessionSummaryTable` say the word once in a caption instead of eight times in eight heads.\n  The canonical field name stays in every head's tooltip and accessible name (WCAG 2.5.3), so nothing is renamed: only abbreviated.\n- the pair steps down to a 5px cell inset and bleeds to the card's edge.\n  Fifteen columns at the kit's 10px inset spent 300px on gutter, and `CardContent`'s 20px frames prose, not a table that is the card's subject.\n\n**An identity column whose value is the same on every visible row is stated once in the table's `<caption>` and dropped.** Under a filter (which 0042 made the normal way to read this page) that is where most of the width comes back.\nFilter to one harness and the harness column stops existing rather than repeating twelve times.\nOnly the four identity columns may collapse.\nA *measure* that happens to be equal on every row is a finding, and must stay visible as a column.\n\nThe measurement, not the column count, is the contract: `e2e/inline.spec.ts` asserts the box does not overflow.\nAt 1440px both tables fit exactly.\nBelow ~1350px `SessionTable` scrolls again, and the scroll box, its edge fade and its sticky head handle that as they did before.\n\n### 4. The aggregate waterfall aggregates the filtered population, not one group per line\n\n`TokenWaterfallAggregateChart` sits below `TokenAccumulationChart` and draws the same six categories and total, averaged over every run in view.\nOne waterfall, not one per group: the filters are how a reader narrows to a group.\nThat is what makes the pair drillable rather than decorative.\nSixteen small-multiple waterfalls would answer no question the accumulation chart above does not already.\n\nEach column is the arithmetic mean over the runs that **reached** that turn.\nA short run is missing from a late turn, never zero in it, and the divisor is that count, never the run total.\nThe mean base and the mean segments are taken over the same subset.\nSo the stack's top is the mean running total, which is what the min–max whisker brackets.\n\nThat makes the late columns a mean of fewer and fewer runs.\nSo **a column's opacity is the share of runs that reached it**.\nA turn one run of twenty-four survived to fades almost out rather than reading as a rising trend.\nThe `total` column is each run's own final figure, so it can sit *below* a late turn averaged over the one run that got there.\nThat is survivorship, it is the honest reading of \"these runs, on average\", and it is shown rather than smoothed away.\n\n## Consequences\n\n- A reader sees every metric of every session without scrolling sideways at 1440px, and a filtered read fits a 1280px laptop.\n- Two figures whose difference is the interesting quantity are printed as that difference.\n  The real capture immediately showed drifts of +14% to +29% between the plugin's estimate and Claude's own reported cost.\n  They are visible at a glance, and were previously two columns apart.\n- `SessionSummaryTable` can be ranked, and doing so honestly costs it the banding that only a fixed order justifies.\n- Abbreviation moves precision to a `title`.\n  Exactness is one hover away, and never on screen.\n  That is a deliberate trade, and the reason the exact figure is on every abbreviated cell rather than on some of them.\n- A new overview param is now a one-line change at each control instead of a silent omission at every control that predates it.\n"}, "ADR-0044": {"file": "0044-a-skill-is-invoked-the-way-its-user-invokes-it.md", "title": "A skill is invoked the way its user invokes it, in each harness's own syntax", "status": "accepted", "status_note": "accepted, 2026-08-31.\nRefines [0011](0011-inject-skill-through-each-cli-path.md) (the skill loads through each CLI's own path) and [0034](0034-a-harness-is-a-class-and-the-registry-is-the-only-dispatch.md) (a harness is a class and the registry is the only dispatch). **Supersedes the `prompt=` field of `@evalcase` established by [0008](0008-evals-are-eval-prefixed-modules.md).** Breaking: `EvalCase.prompt` becomes `EvalCase.task`, and `result.json`'s `case` record gains `task` beside `prompt`.", "markdown": "# 0044: A skill is invoked the way its user invokes it, in each harness's own syntax\n\nStatus: accepted, 2026-08-31.\nRefines [0011](0011-inject-skill-through-each-cli-path.md) (the skill loads through each CLI's own path) and [0034](0034-a-harness-is-a-class-and-the-registry-is-the-only-dispatch.md) (a harness is a class and the registry is the only dispatch). **Supersedes the `prompt=` field of `@evalcase` established by [0008](0008-evals-are-eval-prefixed-modules.md).** Breaking: `EvalCase.prompt` becomes `EvalCase.task`, and `result.json`'s `case` record gains `task` beside `prompt`.\n\n## Context\n\n0011 settled that a skill reaches the agent through each CLI's own loading path.\nThe two adapters implemented it: Claude got `--add-dir <skill dir>`, Codex got a copy into the private `CODEX_HOME/skills/`.\nTwo different mechanisms, as 0011 intended.\n\nBut the *prompt* stayed one string, shared by every cell of the case.\nIt had to paper over the difference the adapters had just introduced.\nEvery case in every consuming repository opened the same way:\n\n> Use the mermaidjs-diagrams skill (its SKILL.md is in the extra allowed directory / your skills).\n\nThat sentence is the tell.\n\"The extra allowed directory / your skills\" is a prompt written to survive two loading paths at once, and it names neither mechanism correctly:\n\n| What the prompt asked for | What actually happens |\n| --- | --- |\n| Claude: \"its SKILL.md is in the extra allowed directory\" | `--add-dir` grants *tool access* to a path. It does not register a skill. The agent has to be told a path, then read it as a file, then decide to follow it: three steps a real user never performs. |\n| Codex: \"/ your skills\" | The skill *is* registered, and Codex's own instructions say the trigger is `$SkillName`. The prompt never used it, so the skill was reached by description-match at best. |\n\nSo the matrix's two arms were not running the same experiment.\nOne arm graded a skill loaded as a document; the other graded a skill loaded as a skill.\nNeither arm graded what a user does, which is the only invocation whose failure anybody would care about.\nA skill whose `SKILL.md` frontmatter is malformed (the single most common way a skill breaks for its users) passed both arms.\nBeing told to read a file does not require the file to be registered.\n\nBoth CLIs have a documented, verified invocation, and they are not the same:\n\n| Harness | Registration | Invocation a user types | Verified |\n| --- | --- | --- | --- |\n| `claude` | `--plugin-dir <dir>`, where the dir carries `.claude-plugin/plugin.json` and `skills/<skill>/` | `/<skill> <task>` | claude 2.1.251, against `--setting-sources \"\"` |\n| `codex` | a copy under the private `CODEX_HOME/skills/<skill>/` | `$<skill> <task>` | codex-cli 0.151.0, against `--ignore-user-config` |\n\nClaude's `--add-dir` was never a registration; `--plugin-dir` is.\nIt is the only one that keeps 0005's isolation intact.\nA private `CLAUDE_CONFIG_DIR` would take the credentials with it, and `--setting-sources user` needs them.\n\n## Decision\n\n**A case declares a task, not a prompt.** `@evalcase(task=...)` is the sentence a user would type *after* naming the skill.\nFor example: \"Apply the palette mandate to ARCHITECTURE.md.\" It never names the skill, never names a loading path, and never mentions a CLI.\n\n**The harness renders the invocation.** `Harness.invoke(skill=, task=)` is a new abstract member beside the four 0034 already requires.\nIt is the only place either syntax is spelled: `claude` renders `/<skill> <task>`, `codex` renders `$<skill> <task>`.\nNothing outside `harness/` composes an invocation, so a third CLI with a third syntax is still the one-file job 0034 promises.\nThe one lookup from underneath goes through `model/registry.py`, 0039's declared edge.\n\n**Registration is the adapter's job, and it is real registration.** The Claude adapter builds a wrapper plugin (`.claude-plugin/plugin.json` plus a copy of the skill under `skills/`) beside the workspace, and passes `--plugin-dir`.\nA skill whose frontmatter Claude rejects now fails the cell, which is the point.\n\n**The rendered prompt is evidence.** `CaseRef` carries both: `task`, the case's declaration, and `prompt`, the exact string that reached the CLI.\nA reader of one `result.json` can see what was asked without holding the suite file.\nTwo cells of one case can be compared knowing precisely how their asks differed.\n\n## Consequences\n\nEvery existing suite is a breaking change, and deliberately so.\nA `prompt=` that still carries \"use the X skill (its SKILL.md is in ...)\" is exactly the text this record exists to delete.\n`@evalcase` raises on `prompt=` with a message naming `task=`, rather than accepting it as an alias.\nAn alias would let the old sentence survive the upgrade.\n\nA cell can now fail for a reason it previously could not: the skill did not resolve.\nThat is a true negative. `/nosuchskill` comes back as \"Unknown command\" with zero billed tokens, so the evidence gate of [0045](0045-the-verifiers-ship-with-the-plugin.md) catches it before any grader reads a workspace.\n\nCaptured runs from before this record carry `case.prompt` and no `case.task`.\nA replay reads the task back as empty rather than re-deriving it, per [0038](0038-a-tolerant-reader-still-honours-its-declaration.md).\n\nTwo things showed up only once the first live cell ran under a real invocation.\nBoth are consequences of registering the skill properly rather than describing it:\n\n**The skill's own `evals/` tree was being handed to the agent under test.** Both loading paths copy the skill directory, and since 0046 that directory contains the goldens.\nThe exclusion is now in the shared spawn contract (`harness/base.py`), not in either adapter, so a third provider cannot reintroduce it.\n\n**The dialects disagree about whether `SKILL.md` is ever *read*.** Same task, same fixture.\n`claude` resolves `/<skill>` by injecting the file, so it never appears in skill coverage.\n`codex` is instructed to read it, and so it does.\nAn eval that asserts `SKILL.md` was loaded therefore passes on one arm and fails on the other.\nThe reason is not about the skill.\nThat is precisely the failure this record exists to end, reappearing one level down.\n`check_skill_was_loaded` has no default and refuses an empty call.\nWhat a case names is the `resources/` and `scripts/` material the entry point points at, which both dialects reach when they follow it.\n\n## Lens\n\nAn eval that has to explain the harness to the agent is measuring the harness.\nThe prompt is not a place to reconcile two loading mechanisms.\nThe reconciliation belongs behind the interface that already exists to hold the difference.\nWhat the case declares is the part a user would actually say.\n"}, "ADR-0045": {"file": "0045-the-verifiers-ship-with-the-plugin.md", "title": "The verifiers ship with the plugin, and a rollout has one documented surface", "status": "accepted", "status_note": "accepted, 2026-08-31.\nDelivers the \"primitives pending\" of [0012](0012-grading-is-composable-not-prescribed.md) (grading is composable, not prescribed) and the \"helper pending\" of [0013](0013-verifiers-are-python-beside-the-case.md) (custom verifiers are Python beside the case).\nRefines [0039](0039-the-package-listing-is-the-architecture.md) (the package listing is the architecture) with a sixth layer.\nBreaking: a grader takes one `CaseOutput` in place of `(RunResult, Path)`.", "markdown": "# 0045: The verifiers ship with the plugin, and a rollout has one documented surface\n\nStatus: accepted, 2026-08-31.\nDelivers the \"primitives pending\" of [0012](0012-grading-is-composable-not-prescribed.md) (grading is composable, not prescribed) and the \"helper pending\" of [0013](0013-verifiers-are-python-beside-the-case.md) (custom verifiers are Python beside the case).\nRefines [0039](0039-the-package-listing-is-the-architecture.md) (the package listing is the architecture) with a sixth layer.\nBreaking: a grader takes one `CaseOutput` in place of `(RunResult, Path)`.\n\n## Context\n\n0012 declined to prescribe a grading DSL and 0013 kept verifiers as plain Python beside the case.\nBoth were right, and both left a helper library pending for two years of records.\nWhat arrived instead was copy-paste.\nFour suites in one consuming repository, and all four opened with the same block:\n\n```python\ndef check_run_is_real(run: RunResult) -> None:\n    assert run.session_id, \"no session id - ...\"\n    assert Path(run.session_log).is_file(), ...\n    assert run.exit_code == 0, ...\n    assert run.usage.accumulative_billed_tokens > 0, ...\n    assert run.cost_status == \"priced\", ...\n```\n\nFour copies drift, and these had.\nTwo of the four had gone stale against the plugin's own types and were asserting nothing at all:\n\n| Written | Why it always passed |\n| --- | --- |\n| `run.skill_coverage.get(\"run\")` | `SkillCoverage` has been a dataclass since 0035. On a dataclass this raises `AttributeError`. The cell errored rather than graded, and an error is not a red check. |\n| `run.rates_applied.get(\"source\")` | Same: `AppliedRates` is a typed record. |\n| `run.cost_status == \"priced\"` | True by luck. `CostStatus` is a `StrEnum`, so this compares equal: but it is a comparison against a literal the vocabulary rule of 0041 forbids. |\n\nThe deeper cause is that nothing told a suite author what a rollout *is*.\nA grader is handed `(RunResult, Path)`.\n`RunResult` has 27 fields, five of them typed records with their own fields, two of them lists of further records.\nEvery author reached for `.get()` because a mapping is what an undocumented payload looks like.\n\n## Decision\n\n**`verify/` is a layer, between `derive/` and `emit/`.** It depends on `model/` and nothing else.\nThe ruff `TID251` rule of 0039 is extended to it in both directions.\n`verify/` may not name `emit/` or `runtime/`, and `derive/`, `harness/` and `model/` may not name `verify/`.\nA verifier reads a finished rollout; it never participates in producing one.\n\n**A verifier is a function that raises `AssertionError` or returns.** No registry, no result object, no DSL: 0012's decision stands.\nWhat ships is the vocabulary, not a framework.\nThe shipped checks are `check_run_is_real`, `check_run_is_priced`, `check_files_written`, `check_no_files_added`, `check_skill_was_loaded`, `check_skill_scripts_ran`, `check_subagents_spawned`, `check_tools_used`, `check_turns_within`, `check_no_tool_errors`.\nEach is importable alone, and each says what went wrong in the agent's terms.\nA suite that wants something else still writes a plain function beside the case, exactly as 0013 says.\n\n**`check_rollout` is the gate every case owes.** It is `check_run_is_real` plus `check_run_is_priced`, and it is the first line of every shipped case.\nA verdict untied to a session that happened and was billed is not a verdict.\nMaking it one named call rather than five assertions is what stops the fifth from being dropped in the sixth copy.\n\n**The rollout has one named surface, and a grader takes it.** `CaseOutput` (in `model/output.py`, beside the other nouns) is the pair a grader has always been handed.\nIt is given a name.\nIt is also given the accessors the copy-paste kept re-deriving.\nThey are `output.run` (the `RunResult`), `output.workspace`, `output.read(rel)`, `output.exists(rel)`, `output.wrote(rel)`, `output.added` and `output.changed`.\nA grader's signature becomes `def eval_x(output: CaseOutput) -> None`.\nTwo positional arguments were never two things: they were one rollout that had no noun.\nThat is why every suite re-opened the same file with the same four lines of `pathlib` around it.\n\n`docs/rollout.md` documents that surface field by field, against the dataclasses rather than beside them.\nIt is the answer to \"what can I assert\", and it is what a suite author reads instead of guessing at `.get()`.\n\n## Consequences\n\n`pytest_xharness_eval.verify` is public API and versioned as such.\nA check whose assertion tightens is a breaking change for consuming suites, which is the correct pressure.\nA shared gate that can be silently loosened is worse than four copies.\n\nEvery grader's signature changes.\nA two-parameter grader raises at collection with a message naming `CaseOutput`, rather than being adapted by arity sniffing.\nA suite that still expects `(run, workspace)` is a suite written against the undocumented surface this record replaces.\nThe four stale checks above are what silent adaptation would have carried forward.\n\nThe four stale suites fail loudly on upgrade rather than passing vacuously. `SkillCoverage` and `AppliedRates` are reached as attributes because `check_skill_scripts_ran` reaches them that way once, in typed code that `mypy --strict` checks.\n\nVerifiers are unit-tested against captured logs in `tests/test_units.py`.\nThey are real `result.json` files folded by the real adapters, never a fabricated `RunResult`.\n0002 forbids that for the same reason it forbids a mocked CLI.\n\n## Lens\n\n\"Composable, not prescribed\" is a decision about the *shape* of grading, not a reason to ship nothing.\nThe library that composition needs is a vocabulary of named checks with one documented noun beneath them.\nWithhold it and every consuming repository writes the vocabulary anyway, four times.\nTwo of the copies rot into assertions that cannot fail.\n"}, "ADR-0046": {"file": "0046-a-golden-is-compared-facet-by-facet-within-a-declared-tolerance.md", "title": "A golden is compared facet by facet, and every facet declares its tolerance", "status": "accepted", "status_note": "accepted, 2026-08-31.\nRefines [0012](0012-grading-is-composable-not-prescribed.md) (grading is composable, not prescribed), [0018](0018-fixtures-directory-and-metrics-history.md) (fixtures live under `evals/fixtures/`) and [0045](0045-the-verifiers-ship-with-the-plugin.md) (the verifiers ship with the plugin).", "markdown": "# 0046: A golden is compared facet by facet, and every facet declares its tolerance\n\nStatus: accepted, 2026-08-31.\nRefines [0012](0012-grading-is-composable-not-prescribed.md) (grading is composable, not prescribed), [0018](0018-fixtures-directory-and-metrics-history.md) (fixtures live under `evals/fixtures/`) and [0045](0045-the-verifiers-ship-with-the-plugin.md) (the verifiers ship with the plugin).\n\n## Context\n\nThe palette-mandate case is the harness's reference eval, and its grading is five substring searches:\n\n```python\nassert \"```mermaid\" in doc\nassert \"classDef\" in doc\nassert \"fill:#\" in doc\nassert \"color:\" in doc\n```\n\nGiven the fixture (one unstyled flowchart) a correct answer is very nearly determined.\nThe skill mandates an explicit `classDef` per node group, with fill and text colour drawn from its own palette.\nThe diagram's node set is fixed by the fixture.\nWe can write down what right looks like.\nThe substring searches do not: `classDef x fill:#000,color:#000` passes all four.\nSo does a document that styled one node of nine and left the rest on Mermaid's defaults.\n\nThe obvious repair (check the output against a stored correct file) fails in the other direction.\nTwo valid answers differ in whitespace, and in the order the `classDef` lines appear.\nThey differ in whether a node group is called `service` or `svc`.\nThey differ in one hex value being a legitimate neighbour on the same palette ramp.\nAn exact comparison would be red on every run and would teach its reader to ignore it.\n\nSo a golden needs to be neither a substring nor a file, and the missing piece is not a smarter diff.\nIt is *saying which parts of the answer are determined and which are free*, per part, and being able to read the failure.\n\n## Decision\n\n**A golden is a real, complete, correct artifact**, stored at `evals/goldens/<name>/<path>`, mirroring `evals/fixtures/<name>/<path>`.\nSo the pairing between a seed and its known-good output is the directory layout and not a convention anyone has to remember.\nIt is committed, readable, and rendered by the same tools as the real thing: a golden nobody can open is a hash.\n\n**A `GoldenCase` is that artifact plus a facet list.** A facet is a named extraction from the text (node ids, fence count, `classDef` selectors, fill colours, headings, a numeric measure).\nIt is paired with the tolerance under which the candidate's value must match the golden's.\nFacets are ordinary functions `str -> object`, so a project extracts whatever its artifact has; `verify/facets.py` ships the markdown and mermaid extractors the shipped cases need.\n\n**Tolerance is declared, never inferred.** Six kinds, and each answers one question about how much freedom this facet has:\n\n| Tolerance | Holds when | Protects |\n| --- | --- | --- |\n| `Exact()` | candidate == golden | the part with one right answer |\n| `Superset()` | candidate ⊇ golden | a required floor, additions allowed |\n| `Jaccard(at_least=)` | set overlap ≥ threshold | naming freedom within a fixed concept set |\n| `Ratio(at_least=)` | `difflib` similarity ≥ threshold | prose that must stay recognisable |\n| `Count(delta=)` / `Count(lo, hi)` | a count near the golden's, or in a range | structure with legitimate slack |\n| `Within(lo, hi)` | a number in a closed range | a measure with a defensible band |\n\nA facet with no tolerance is a type error, not a default to `Exact`.\nThe whole point is that the author states how free each part is.\n\n**A mismatch reports the delta, not the diff.** `GoldenMismatch` is an `AssertionError` whose message is one row per facet, truncated to a readable width.\nA row holds the facet's name, its tolerance, the golden's value and the candidate's value.\nFor the set tolerances it also holds what was missing and what was extra.\nPassing facets are listed too, because a report that shows only failures cannot distinguish \"one facet failed\" from \"one facet ran\".\n\n## Consequences\n\nA golden must be regenerated when the skill's own contract changes, and that is a visible commit against a readable file.\n`GoldenCase.record()` writes a candidate into the golden path for exactly that purpose.\nIt is never called during grading, so a run can never launder its own output into the reference.\n\nA tolerance is a claim about the skill under test and belongs in review.\nA `Jaccard(at_least=0.5)` says half the concepts may be renamed and the case still passes.\nThat is usually a sign the facet is the wrong extraction rather than a sign the threshold is right.\n\nFacet extraction is pure and free, so a golden comparison is exercised in `tests/test_units.py` against committed text, with no rollout and no spend.\n\n## Lens\n\nBetween \"contains the word\" and \"equals the file\" there is one honest position: name the parts of the answer.\nAnd say for each how much variation is still correct.\nThe tolerance is the interesting content of the eval (it is the author's actual claim about the skill).\nSo it must be written down where a reviewer reads it, not hidden inside a similarity threshold on the whole file.\n"}, "ADR-0047": {"file": "0047-adrs-are-authored-as-data-and-their-markdown-is-generated.md", "title": "ADRs are authored as data, and the argument travels verbatim", "status": "accepted", "status_note": "accepted, 2026-08-31.\nRefines [0032](0032-all-run-output-consolidates-under-a-cache-dir.md) (generated output has one owner).\nStructural only: no record's argument changes.\nEvery id, slug, anchor and inbound citation still resolves.\nEach generated `.md` is byte-identical to the file it replaced from its `# NNNN:` heading down.\nRefined by [0054](0054-decision-records-pass-the-prose-gates.md): a record's shape may change to pass the prose gates, its argument unchanged.", "markdown": "# 0047: ADRs are authored as data, and the argument travels verbatim\n\nStatus: accepted, 2026-08-31.\nRefines [0032](0032-all-run-output-consolidates-under-a-cache-dir.md) (generated output has one owner).\nStructural only: no record's argument changes.\nEvery id, slug, anchor and inbound citation still resolves.\nEach generated `.md` is byte-identical to the file it replaced from its `# NNNN:` heading down.\nRefined by [0054](0054-decision-records-pass-the-prose-gates.md): a record's shape may change to pass the prose gates, its argument unchanged.\n\n## Context\n\nThe index at `docs/adrs/README.md` carried the relation graph as prose in a hand-maintained Status column.\nOne entry read: \"refines 0016, 0037, 0038 and 0039; supersedes 0040's placement of `Verdict`\".\nForty-six records, 109 cross-references, and one table a human had to update by hand on every addition.\nIt had already drifted, and the drift is invisible: a missing row reads exactly like a record with no relations.\n\nThe librarian's `okf-yaml` convention exists for this, and its trigger fired.\nIts record schema, however, decomposes an argument into `problem.symptom` + `problem.pain_point` as two scalars, and `decision` into `given` / `we_prefer` / `because` / `unless`.\nMeasured against this corpus that shape does not fit:\n\n| Section | median words | max | with tables | with code fences |\n| --- | --- | --- | --- | --- |\n| `## Context` | 117 | 416 | 10 | 2 |\n| `## Decision` | 210 | 919 | 3 | 6 |\n| `## Consequences` | 72 | 319 | 0 | 0 |\n\nA 919-word Decision carrying six code fences has nowhere to go in four scalar clauses.\n`consequences.cons` carries `minItems: 1`, while these records argue in narrative rather than in pros and cons.\nSo adopting the shipped schema unchanged would have meant writing 46 new `cons` lists.\nThat is authoring decisions, not recording them, and a requirement invented during a migration is a requirement nobody agreed to.\n\n## Decision\n\n**The record is the source of truth, and the argument is cargo.** Each ADR is authored as `NNNN-slug.yml`; `body.context`, `body.decision` and `body.consequences` hold their sections as verbatim markdown block scalars, tables and fenced code included.\nThe generator emits them unchanged, which is what makes every generated `.md` byte-identical to the file it replaced from the `# NNNN:` heading down.\nNothing was reformatted in transit.\n\n**The schema is tightened to the corpus, not the corpus to the schema.** The librarian's own instruction is to copy the schema and tighten it to the adopting repository's dialect.\nSo `docs/adrs/record.schema.json` requires exactly what all 46 records demonstrably carry: id, slug, title, status, the verbatim status sentence, both dates, relations, body.\nIt makes optional what none of them do: `description`, `tags`, `provenance`, `enforced_in`.\nAn absent field is a fact about the corpus.\nFour records have no `## Lens`; `lens` is therefore optional, and those four keep no Lens rather than gaining an invented one.\n\n**Typed edges are inferred from the sentence, and the sentence is kept.** The status line's own vocabulary maps onto the closed relation set:\n\n- \"refines\" to `extends`\n- \"refined by\" to `extended_by`\n- \"supersedes\" / \"superseded by\" to their own pair\n\nEach edge's `note` records which verb produced it.\nThe full original sentence stays verbatim in `status_note` and is what the generated index renders.\nSo typing the relations adds a queryable graph without costing the phrasing.\nThis is the one-way conversion the convention warns about, declined: both forms are kept.\n\n**The title stays in an H1.** OKF's own preference is a frontmatter title with no heading above the body.\nBut the observed dialect of this repository puts it in `# NNNN: Title`, and every inbound citation resolves against that.\nTemplates own presentation while the schema owns structure.\nThe generated frontmatter carries the title as well, so a query reaches it without parsing the heading.\n\n## Consequences\n\n`docs/adrs/*.md` becomes build output.\nEditing one is lost on the next `make adrs`.\nThe banner in each file's frontmatter says so, and CI fails when a generated file differs from a fresh build.\n\n`docs/adrs/README.md` is replaced by the generated `index.md`.\nThis is because OKF reserves `index.md` for the directory listing and requires any other `.md` in the bundle to carry frontmatter.\nGitHub therefore no longer renders a landing page for `docs/adrs/`; the ten inbound links that named `README.md` now name `index.md`.\n\nThe first symmetry run reports 109 one-way edges.\nThat is the expected finding on a corpus whose cross-references were only ever written in one direction.\nIt is reported rather than failed: closing an edge is a decision about the record set, which is the maintainer's, not the migration's.\n\nA record is now edited in two files' worth of discipline -- the `.yml` and a rebuild -- where it used to be one.\nThat cost buys the schema gate, the typed graph, and an index that cannot drift from the records it lists.\n\n## Lens\n\nA schema earns its keep on the metadata a corpus actually carries, never on the shape a template wishes it had.\nWhere the source supplies a field, extract it.\nWhere it does not, leave the field absent and say why.\nFilling it is authoring new requirements under the cover of a migration, and nobody reviews a migration the way they review a decision.\n"}, "ADR-0048": {"file": "0048-coverage-reads-the-command-the-shell-ran.md", "title": "Coverage reads the command the shell ran, and expands what only the shell knew", "status": "accepted", "status_note": "accepted, 2026-09-18.\nRefines [0027](0027-coverage-follows-the-shells-working-directory.md) (coverage follows the shell's working directory) with the second half of the same problem, and [0022](0022-record-kind-catalogue-and-skill-coverage.md) (its detection rule).\nExtends the per-call ledger of [0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md) with one field, `call.executed`: a new key of `result.json`.", "markdown": "# 0048: Coverage reads the command the shell ran, and expands what only the shell knew\n\nStatus: accepted, 2026-09-18.\nRefines [0027](0027-coverage-follows-the-shells-working-directory.md) (coverage follows the shell's working directory) with the second half of the same problem, and [0022](0022-record-kind-catalogue-and-skill-coverage.md) (its detection rule).\nExtends the per-call ledger of [0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md) with one field, `call.executed`: a new key of `result.json`.\n\n## Context\n\n0027 taught coverage to follow a persistent shell's working directory.\nThat is because an agent that `cd`s into the skill and then runs `bun run scripts/gate.ts` never writes the needle `<skill>/scripts/gate.ts` down.\nThe same run had a second way of not writing it down, and it cost a paid cell.\n\nA live `claude/claude-opus-5` cell reported `skill 0/84 loaded 0/6 run` and failed its gate:\n\n```\nAssertionError: the run never executed ['scripts/mermaid_contrast.ts'], which the\nskill declares mandatory. It ran: nothing\n```\n\nIts session log shows the script ran twice.\nThe agent held the skill directory in a shell variable:\n\n```sh\nS=<workspace>/.claude/plugin/skills/mermaidjs-diagrams\nls $S/resources; cat $S/resources/color_host_themed_renderers.md\nbun run $S/scripts/mermaid_contrast.ts DATA_MODEL.md\n```\n\nA second run of the same case failed the `codex` cell too, through a different indirection.\nIts code-mode `exec` tool holds the directory in a JavaScript constant and interpolates it.\nSo the tool input coverage parses is JavaScript source and the needle is nowhere in it.\n\nBoth are the same shape.\nThe path is assembled by something that runs *after* the text coverage reads.\nModelling one wrapper language at a time is a losing game.\nThe next one will be a `Makefile` variable, or a wrapper script, or a shell function.\n\n## Decision\n\n**Where the harness logs the command its shell ran, that is what coverage reads.** `Call.executed` is a list of `ExecutedCommand` (`tool`, `command`, `cwd`): the harness's own record of an executed command, after its own expansion.\nCodex emits exactly this as the `CommandExecution` item of an `item_completed` event.\nIts `command` field is the fully resolved string, and its `cwd` is where it ran.\nSo `harness/codex.py` folds it into the turn it completed in.\nClaude Code logs no such record, so its list is empty: the whole of what that harness knows, not a gap.\nAttribution walks `call.executed` beside `call.tools`, resolving each at its own `cwd` through the same rewrite 0027 introduced.\n\nThis is the general fix.\nA command that reached the shell has already been through every wrapper the agent wrote, whatever language it was in.\nSo no future wrapper needs a parser of its own.\n\n**Where it does not, the variable is substituted before the rewrite.** Claude Code's `Bash` input is the only record of what it ran.\nSo `resolve_command` now keeps a variable table beside the working directory.\nA segment that is `NAME=value` (with `export` and quotes allowed, and `$OTHER` inside the value already substituted) records a name.\n`$NAME` and `${NAME}` are expanded in every later segment, including the target of a `cd`.\nSo `cd $S && bun run scripts/gate.ts` resolves too.\nA `NAME=value cmd ...` prefix scopes to its own command, as a shell scopes it.\n\n**The table is per command.** Claude Code's `Bash` keeps its working directory between calls but not its environment.\nSo the variables die with the command that set them while the `cwd` of 0027 lives on.\nA harness whose shell does keep its environment would say so the way it says `persistent_shells` today.\n\n**An unknown name stays unexpanded.** `$HOME`, an unset name, anything assigned somewhere this command cannot see: the text is left exactly as written.\nSo every path that never depended on an assignment attributes exactly as it did before.\n\n## Consequences\n\n`result.json` gains `call.executed`, mirrored in `report-ui/src/lib/types.ts` and documented in `docs/rollout.md` as part of the grader surface.\nThe characterization goldens move by that key alone.\nNo coverage figure in them changes, which is the evidence that the new path adds attribution rather than redistributing it.\n\nCoverage can now rise on a replay of a capture taken before this change: the evidence was always in the log, and `uv run -m pytest_xharness_eval.replay` reads it.\nA cell that failed `check_skill_scripts_ran` for this reason was a false negative, and re-grading it is free.\n\nThe two fixes are not alternatives.\nThe expansion is a best effort over text the shell already resolved perfectly.\nWhere a harness reports the resolved command, that record wins, because it needed no guess at all.\n\n## Lens\n\nAttribution belongs at the last point the name is still written down.\nA tool call records an intention.\nAn agent is free to express it through a variable, a template literal or a wrapper language.\nThe shell's own record of what it ran is the one string that has survived every indirection.\nRead that where the harness offers it, and reconstruct only what it does not.\n"}, "ADR-0049": {"file": "0049-effort-is-the-third-matrix-axis.md", "title": "Effort is the third matrix axis, and a bad rung stops the sweep before it spends", "status": "accepted", "status_note": "accepted, 2026-09-22.\nRefines:\n\n- [0015](0015-harness-is-the-axis-and-the-project-owns-the-matrix.md) (harness is the axis and the project owns the matrix) with a third axis\n- [0034](0034-a-harness-is-a-class-and-the-registry-is-the-only-dispatch.md) (a harness is a class and the registry is the only dispatch) with a fourth question asked of a harness\n- [0037](0037-the-emitted-records-are-types-and-the-cache-tree-has-one-owner.md) (the cache tree has one owner) with a sixth coordinate that is not a sixth level\n\nExtends [0007](0007-unpriced-model-aborts-before-spend.md)'s stop-before-spend rule to the new axis.\nAdditive:\n\n- `result.json` gains `effort`\n- `history.json` gains `effort`\n- `report/index.json` gains `effort`\n\nEvery existing capture still walks, links and replays unchanged.", "markdown": "# 0049: Effort is the third matrix axis, and a bad rung stops the sweep before it spends\n\nStatus: accepted, 2026-09-22.\nRefines:\n\n- [0015](0015-harness-is-the-axis-and-the-project-owns-the-matrix.md) (harness is the axis and the project owns the matrix) with a third axis\n- [0034](0034-a-harness-is-a-class-and-the-registry-is-the-only-dispatch.md) (a harness is a class and the registry is the only dispatch) with a fourth question asked of a harness\n- [0037](0037-the-emitted-records-are-types-and-the-cache-tree-has-one-owner.md) (the cache tree has one owner) with a sixth coordinate that is not a sixth level\n\nExtends [0007](0007-unpriced-model-aborts-before-spend.md)'s stop-before-spend rule to the new axis.\nAdditive:\n\n- `result.json` gains `effort`\n- `history.json` gains `effort`\n- `report/index.json` gains `effort`\n\nEvery existing capture still walks, links and replays unchanged.\n\n## Context\n\nBoth shipped CLIs now take a reasoning budget.\nIt moves the two things a sweep exists to compare: how much a cell costs and how well it does.\n`claude --effort <level>` accepts `low, medium, high, xhigh, max`, and codex reads `model_reasoning_effort` from its config, which `codex exec -c` overrides.\nA matrix that could only name a harness and a model could not ask the question at all.\n\"is opus at `low` cheaper *and* good enough here than sol at `xhigh`\" is a three-axis question, and the plugin had two axes.\n\nThe obstacle is that neither CLI fails on a rung it does not recognise.\nVerified against the installed versions:\n\n```\n$ claude --effort bogus -p \"hi\"\nWarning: Unknown --effort value 'bogus' - ignoring it and using the default\neffort. Valid values: low, medium, high, xhigh, max.\n```\n\nand `codex exec -c model_reasoning_effort=bogus` launches without comment.\nA typo in a matrix line therefore buys a full-priced run at the default budget and stores a result.\nThe report names a rung the run never had.\nThat is exactly the failure 0007 refuses for an unpriced model, arriving through a different door.\n\nThe vocabularies may also disagree, and neither CLI is a reliable witness to its own.\ncodex-cli 0.155.1's local `model_reasoning_effort` enum lists `none`, `minimal`, `low`, `medium`, `high`, `xhigh`, `max`, `ultra` and `persistent`.\nThe gpt-5.6 models accept six of those, and the CLI validates none of it.\nA paid sweep at `minimal` returned, for both models::\n\n    Unsupported value: 'minimal' is not supported with the 'gpt-5.6-sol' model.\n    Supported values are: 'none', 'low', 'medium', 'high', 'xhigh', and 'max'.\n\nSo a ladder read off a CLI's own enum is wrong in both directions at once.\nIt offers rungs the provider rejects and omits rungs the provider has.\nAn author naming a native rung therefore cannot know from the CLI whether the word will survive the request.\n\n## Decision\n\n**A matrix entry gains an optional third component: `harness/model/effort`.** An entry with two components is unchanged in every respect.\nIt leaves the CLI on whatever default its own configuration gives it.\nIt produces the node id it always produced, and writes to the directory it always wrote to.\nThe absence of a rung is a value, not a gap.\n\n**The vocabulary is closed, and it lives in `model/effort.py`.** `Effort` is a `StrEnum` holding every word an entry may use (ADR 0041).\nA harness declares the rungs it actually has as an ordered `Harness.efforts` ladder -- lowest first, because the order is load-bearing.\n`harness/claude.py` and `harness/codex.py` each render the rung in their own dialect (`--effort <rung>` against `-c model_reasoning_effort=<rung>`).\nSo nothing outside `harness/` knows either (ADR 0034).\n`model/registry.py` gains the lookup, as the one declared edge from the domain into the adapter layer (ADR 0039).\n\n**The portable aliases `min`, `mid` and `max` name a position, not a level.** They resolve against whichever ladder the harness has, by index, so they follow a harness that gains or loses a rung. `max` is deliberately both an alias and a native top rung, and resolves to itself where a harness has it.\nBoth shipped harnesses declare the same five rungs, so the aliases resolve identically on each today.\nThat is a fact about these two CLIs, not a rule the resolution depends on.\n\n**A ladder is pinned to what the provider accepts, not to what the CLI offers.** `Harness.efforts` is a claim about the request surviving.\nSo a rung goes in only when it has been seen to work, and a rung the provider rejects comes out. `none` is accepted by codex and still omitted.\nIt disables reasoning rather than setting a budget, so it would put a no-reasoning cell in every default sweep.\n\n**Resolution happens once, at matrix expansion, and an unresolvable rung is an error there.** `mx.expand` turns the typed word into a native rung before a `Cell` exists.\nSo the node id, the evidence directory and the report row all carry what was actually sent rather than what was typed.\nA word outside the vocabulary, a rung this harness does not have, or a fourth component stops collection with the offending line named.\nThat happens before any cell has spent anything, which is the only moment at which refusing is free.\n\n**Effort is a sixth coordinate but not a sixth level.** The evidence tree is a published contract: the report page fetches `../results/{skill}/{harness}/{model}/{run}/{session}/log.jsonl` by that exact shape.\nSo the rung rides the model's level as `{model}--{effort}`, owned by `model/layout.py` like every other name under the cache root (ADR 0037).\nA level with no separator named no effort, which is precisely what every capture written before this record holds.\nSo the glob, the links and the replay are all unchanged and no migration exists to forget to run.\n\n**The rung is attached by the derivation pipeline, not folded by a harness.** No session log records what a CLI was *asked* for, only what it then did.\nA harness that folded the rung would be reporting its own argv back to itself. `RunResult` gains `effort` alongside `case` and `skill_coverage`.\nIt is set by `runtime/pipeline.py` from the cell that ran, and carried forward from the stored result on a replay.\nSo a rebuild reports the effort the run had rather than the effort today's matrix would give it.\n\n## Consequences\n\nThree emitted documents gain one key each: `result.json`, `history.json` and `report/index.json` all carry `effort` (empty or null when the cell named none).\nIt is mirrored in `report-ui/src/lib/types.ts` and the shipped glossary.\nThe characterization goldens move by that key alone and no measured value in them changes.\nThat is the evidence that this adds a coordinate rather than redistributing one.\n\n`--effort` narrows a sweep the way `--harness` and `--model` do, and matches the *resolved* rung.\nSo `--effort mid` selects whatever `mid` meant on each harness.\nThat is the only reading under which one flag narrows both arms of a two-harness sweep to the same intensity.\nA word that resolves on one harness and not another simply does not match the other's cells.\nNarrowing a sweep is not the moment to refuse a flag, because nothing is about to be billed.\n\nTwo cells of one case may now differ in nothing but their rung, so the build workspace name includes it.\nWithout that the pair would overwrite each other.\n\nThe first paid sweep across the axis (20 cells, one case, both harnesses) paid for itself.\nIt did so by falsifying the ladder this record was first written with.\n`minimal` was declared a codex rung and is not one; `max` was withheld as unverifiable and is one.\nBoth `minimal` cells exited 1 having produced nothing.\n`check_run_is_real` failed them rather than grading an empty run.\nThat is the evidence gate of ADR 0002 doing exactly its job, on the first axis value that needed it.\n\nThat is the argument for validating at expansion rather than trusting the flag, restated as data.\nThe CLI forwarded a word it listed in its own enum, and the request died at the provider.\nA ladder is a claim about the request surviving, and only a run can settle it.\nAdding or removing a rung is one tuple entry, and it moves what `mid` resolves to.\nThat is why the ladder is ordered rather than a set.\n\n## Lens\n\nAn axis is only an axis once a wrong value on it can fail.\nA knob that every consumer accepts and silently ignores is not a parameter, it is a comment.\nThe sweep spends full price and reports a number that names a setting it never had.\nSo the vocabulary closes where the plugin can still refuse.\nThe word the author typed is resolved into the word the CLI received before anything downstream stores it.\nThis is because a record that keeps the typed word cannot say what was measured.\n"}, "ADR-0050": {"file": "0050-prices-are-dated-records-in-usd-per-mtok-grouped-by-harness.md", "title": "Prices are dated records in USD per MTok, grouped by harness, and a run is priced on the day it ran", "status": "accepted", "status_note": "accepted, 2026-09-28.\nRefines [0006](0006-local-price-table-is-authoritative.md) (a local price table is authoritative) from one table into a series of dated records.\nRefines [0030](0030-price-rows-live-in-the-pytest-config.md) (project price rows live in the pytest config) with a `harness/model` selector and optional `from=`/`to=` bounds.\nRefines [0021](0021-metric-names-carry-unit-and-provenance.md) (rates travel with the estimate) with the unit and the interval.\nExtends [0007](0007-unpriced-model-aborts-before-spend.md)'s stop-before-spend rule to a date no record covers.\nBreaking: an `xharness_prices` line must name its harness.\nBreaking: `result.json`'s `rates_applied` is stated in USD per MTok and gains `unit`, `harness`, `effective_from` and `effective_to`.\nRefined by [0051](0051-long-context-is-a-tier-priced-per-call-and-records-are-curated.md): a row may carry a long-context tier, and pricing is per call.\nUnder it, the backfilled records were replaced by a curated record effective 2026-09-29.", "markdown": "# 0050: Prices are dated records in USD per MTok, grouped by harness, and a run is priced on the day it ran\n\nStatus: accepted, 2026-09-28.\nRefines [0006](0006-local-price-table-is-authoritative.md) (a local price table is authoritative) from one table into a series of dated records.\nRefines [0030](0030-price-rows-live-in-the-pytest-config.md) (project price rows live in the pytest config) with a `harness/model` selector and optional `from=`/`to=` bounds.\nRefines [0021](0021-metric-names-carry-unit-and-provenance.md) (rates travel with the estimate) with the unit and the interval.\nExtends [0007](0007-unpriced-model-aborts-before-spend.md)'s stop-before-spend rule to a date no record covers.\nBreaking: an `xharness_prices` line must name its harness.\nBreaking: `result.json`'s `rates_applied` is stated in USD per MTok and gains `unit`, `harness`, `effective_from` and `effective_to`.\nRefined by [0051](0051-long-context-is-a-tier-priced-per-call-and-records-are-curated.md): a row may carry a long-context tier, and pricing is per call.\nUnder it, the backfilled records were replaced by a curated record effective 2026-09-29.\n\n## Context\n\nThe bundled `derive/prices.toml` was one flat table: one row per model, keyed by the model id alone, stated in USD **per token** (`4.0e-6`).\nThree things about that shape started to cost more than it saved.\n\n*It has no memory.* A price change was an edit of the row in place.\nSo the moment a provider changed a rate every replay of an older capture silently re-priced that run at today's rate.\nReplay exists to re-derive a result after the plugin changes (ADR 0023).\nIt was also re-deriving it after the *market* changed, which is not a plugin change and should not move a historic bill.\n\n*Its unit is not the published one.* Every provider publishes USD per million tokens.\nDividing each published figure by 1e6 before storing it put a representation error into every rate.\n`2.0e-6` is stored as `2.0000000000000003e-06` once it has passed through `1.25 * 1.6`.\nIt also made the table the one place in the project's configuration whose unit differed from the price tag.\nADR 0030 already had to guard its ini lines against a row pasted from it.\n\n*Its key is ambiguous.* A row was found by model id and prefix, with no notion of which harness ran the model.\nThe matrix axis is `harness/model` (ADR 0015); the table was the one place the first half of that pair was dropped.\n\n## Decision\n\n**Records, not a table.** The bundled prices live in `derive/prices/prices-YYYYMMDD.toml`, one file per interval.\nEach file declares `effective_from` (a TOML date, required) and `effective_to` (optional; absent on the one record still in effect).\nThe interval is half-open, `[from, to)`, so a record's `effective_to` is the next record's `effective_from` and a boundary day belongs to exactly one of them.\nThe file's name must carry its own `effective_from`.\nAny of these stops the session:\n- a record whose name and body disagree\n- two records whose intervals overlap\n- a record naming an unregistered harness\n\nGaps between records are allowed, and a run dated inside one is unpriced -- never priced from a neighbour.\n\nCurating a price change is: set `effective_to` on the open record to the change date, and add `prices-<that date>.toml` with the new rows.\nThe old record is never edited again, so the directory is the price history.\n\n**Grouped by harness.** Each top-level table in a record is a registered harness name, and a row is keyed by the pair: `[claude.\"claude-opus-5-5\"]`, `[codex.\"gpt-6-sol\"]`.\nLookup is `(harness, model, day)`; prefix tolerance (`claude-opus-5[1m]`) applies within the harness only.\nKeying rows by the harness's registered name is data, not dispatch: nothing branches on it.\nIt is validated against `model.registry.names()` rather than against a second list (ADR 0034).\n\n**USD per MTok everywhere.** Records, `xharness_prices` lines and the wire record all state rates per million tokens.\n`Rates.breakdown` multiplies tokens by the rate and divides by 1e6 once, per tier.\nThis removes most representation error rather than all of it.\n`3_000_000 * 0.10 / 1e6` is `0.3` where `3_000_000 * 1e-7` was `0.30000000000000004`.\nThe six-decimal rounding of the estimate is unchanged.\nA rate below $0.001/MTok is still refused as \"looks per-token\", now in records as well as in lines.\n\n**Priced on the day it ran.** The day comes from the session's `{run}` stamp (`20260928T101500Z`), which both a live cell and a replay already hold.\nSo the two paths still choose the same row (ADR 0034).\nCollection validates the matrix against the rows in effect on today's stamp.\nA capture whose stamp names no day (the all-zero stamp a legacy migration writes) is priced from the record still open.\nIts `rates_applied` says which interval that was.\n\n**Project lines follow the same shape.** An `xharness_prices` line is `<harness>/<model>: input=<n> output=<n> [cache_read=..] [cache_write=..] [cache_write_1h=..] [from=YYYY-MM-DD] [to=YYYY-MM-DD]`.\nA line with neither bound applies on every date; a bounded one only inside `[from, to)`.\nProject lines are consulted before the bundled records wherever they cover the day.\nTwo lines for one pair whose intervals overlap is an error.\nA bare `<model>:` selector is an error whose message shows the new form.\n\n**The wire record says what it is.** `rates_applied` is `AppliedRates`:\n- the five tiers in USD per MTok\n- `unit: \"usd_per_mtok\"`\n- `harness`\n- `model`\n- `source`\n- `effective_from`, `effective_to` (ISO dates, `null` when open)\n- `applied_at`\n\n`unit` is what lets the report page read a result written before this record without guessing from magnitudes.\nSuch a result's rates are per token, and it carries no `unit`.\n\n## Consequences\n\nEvery replay now reproduces the bill a run had when it ran.\nA price change is an additive file rather than an edit that rewrites history.\nThe first record, `prices-20260820.toml`, is backfilled to the plugin's first run (ADR 0001) because no earlier rate was curated.\nIts rows are the 2026-09-24 verification.\n\nA consuming project must prefix each `xharness_prices` line with its harness (`gpt-house: ...` becomes `codex/gpt-house: ...`).\nUntil it does, the session stops at configure time with the new grammar in the message -- loud, per 0007.\nCode that read `rates_applied` as per-token rates must read `unit` first; the bundled report page does.\nA replay rewrites old results into the new shape.\n\nOne golden estimate moved by one micro-dollar: its exact cost was `$0.0023325`, a rounding tie.\nThe per-token floats landed just above it, and the per-MTok sum lands on it.\nNeither is wrong; the characterization golden pins the new figure.\n\nKeeping the module-relative path exception of ADR 0014, it now names the bundled `derive/prices/` directory rather than one file inside `derive/`.\n\n## Lens\n\nA price is a fact about an interval, not about a model.\nRecord when it held, key it by everything that decides it, and state it in the unit it was published in.\nSo re-deriving an old run reproduces the bill it had, not the bill it would have today.\n"}, "ADR-0051": {"file": "0051-long-context-is-a-tier-priced-per-call-and-records-are-curated.md", "title": "Long context is a price tier billed per call, and price records are curated from LiteLLM", "status": "accepted", "status_note": "accepted, 2026-09-29.\nRefines [0050](0050-prices-are-dated-records-in-usd-per-mtok-grouped-by-harness.md) (prices are dated records) with a long-context tier and a reset of the bundled records.\nRefines [0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md) (the per-call ledger) by making it the unit of pricing.\nRefines [0021](0021-metric-names-carry-unit-and-provenance.md) (rates travel with the estimate) and [0030](0030-price-rows-live-in-the-pytest-config.md) (project price rows) with the tier's keys.\nDelivers the upstream seed command of [0006](0006-local-price-table-is-authoritative.md).\nExtends [0007](0007-unpriced-model-aborts-before-spend.md) to pricing dimensions: an unmodelled one stops curation.\nBreaking: the bundled records were replaced, `rates_applied` gains `long_context`, and `result.json` gains `long_context_calls`.\nRefined by [0052](0052-scope-is-a-boundary-not-a-roster.md).\nThe watched families shown below as an enumerated generation set and tier list are now a shape, a generation floor and a tier pattern.", "markdown": "# 0051: Long context is a price tier billed per call, and price records are curated from LiteLLM\n\nStatus: accepted, 2026-09-29.\nRefines [0050](0050-prices-are-dated-records-in-usd-per-mtok-grouped-by-harness.md) (prices are dated records) with a long-context tier and a reset of the bundled records.\nRefines [0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md) (the per-call ledger) by making it the unit of pricing.\nRefines [0021](0021-metric-names-carry-unit-and-provenance.md) (rates travel with the estimate) and [0030](0030-price-rows-live-in-the-pytest-config.md) (project price rows) with the tier's keys.\nDelivers the upstream seed command of [0006](0006-local-price-table-is-authoritative.md).\nExtends [0007](0007-unpriced-model-aborts-before-spend.md) to pricing dimensions: an unmodelled one stops curation.\nBreaking: the bundled records were replaced, `rates_applied` gains `long_context`, and `result.json` gains `long_context_calls`.\nRefined by [0052](0052-scope-is-a-boundary-not-a-roster.md).\nThe watched families shown below as an enumerated generation set and tier list are now a shape, a generation floor and a tier pattern.\n\n## Context\n\nOpenAI bills long prompts at higher rates.\nIts model page states:\n\n> \"Prompts with more than 272K input tokens are priced at 2x input and cache rates and 1.5x output for the full request.\"\n\nLiteLLM's feed carries the same tier as `*_above_272k_tokens` fields on every `gpt-5.6` and `gpt-6` row.\nIts cost calculator applies them exactly so:\n- the threshold is 272,000 (`k` is ×1000)\n- the count compared is the whole prompt including cached input\n- the comparison is strict\n- crossing it re-prices every tier of that request\n\nClaude Sonnet 4.5 carries the same shape at 200K.\n\nThe bundled records had no place for this tier, and the first curator turned it into a comment.\nWorse, pricing ran on a run's summed usage: a threshold that is a property of one request was unanswerable from a total.\nA run whose calls each stayed under 272K could sum past it.\nA run with one long call among many short ones could not be told apart from a run of uniformly medium calls.\nEither way the estimate was wrong on exactly the calls that cost most.\n\nThe per-call ledger already exists (ADR 0019): one `Call` per API request, from Claude's message ids and Codex's `token_count` events, with subagent ledgers beside it.\nIt was not the unit of pricing.\n\n## Decision\n\n**A long-context tier is part of a row.** A record row may carry a `long_context` sub-table: `above_prompt_tokens` (a whole number) and the five tiers, defaulted by the same rules as the base tier.\nAn `xharness_prices` line states the same tier with `long_context_above=<n>` and `long_<tier>=<n>` keys; `long_input` and `long_output` are required once the threshold is stated.\nA row without the tier bills every call at its base rates, which is how Anthropic bills its current models' whole window.\n\n**Pricing is per call.** `price` walks the primary ledger and every subagent ledger.\nA call whose prompt (uncached input plus cache read plus cache write) is strictly greater than the threshold is billed entirely at the long-context tier.\nEvery other call is billed at the base tier.\nUsage the ledgers do not account for is priced at the base tier, because no call can be blamed for crossing a threshold with it.\nIt is never dropped.\n\n- `cost_by_tier` sums each tier across both regimes.\n- `long_context_calls` says how many calls were billed at the long-context tier.\n- `rates_applied.long_context` carries the tier so the report page re-prices each turn with the same rule.\n\n**The bundled records were reset.** Both earlier records priced OpenAI rows without the tier.\nRather than amend history, they were removed, and the first record was bootstrapped from LiteLLM by the curator, effective 2026-09-29.\nA run stamped before that date is unpriced and stops (ADR 0007).\n\n**Records are curated.** `.github/scripts/curate_prices.py`, run as `make prices`, is the upstream seed ADR 0006 decided on.\nIt reads LiteLLM's feed at a pinned commit and keeps only first-party rows (`litellm_provider` `anthropic` under `[claude]`, `openai` under `[codex]`).\nIt keeps them because those are the IDs the harness session logs report.\nIt keeps only the watched families, each parsed with its vendor's grammar rather than a prefix:\n\n```text\nclaude:  claude-<tier>-<major>[-<minor>][-<YYYYMMDD>]  |  claude-<tier>-preview\n         tier = opus | sonnet | haiku | fable | mythos\ncodex:   gpt-<generation>[-<tier>]      generation in { 5.6, 6 }\n```\n\nA first-party ID a watched family owns but no grammar fits stops the run.\nSo does a cost field the curator neither models nor deliberately ignores.\nThe ignored set is the `_batches`, `_flex` and `_priority` service tiers the CLIs never request, and `search_context_cost_per_query`, a per-query tool fee.\n\n- A row with a comment line starting `# curate: keep` is a local override the curator never re-prices.\n- A row the feed no longer has is carried forward.\n- A record is written only on a change.\n- The staged record set must load through `pricing.load_records` and price the default matrix before anything reaches the package.\n\n## Consequences\n\nA call over 272K prompt tokens on `gpt-5.6-sol` is billed at $8 / $30 per MTok instead of $4 / $20, as OpenAI bills it.\nCaptures from before 2026-09-29 no longer replay into a price; that is the cost of not carrying forward records that priced those runs wrongly.\nCode that read `rates_applied` must allow the new `long_context` key.\nA project whose `xharness_prices` line overrides an OpenAI row must state the long-context keys too, or its override bills every call at base.\n\nThe grammars above were derived from a survey of every Claude and OpenAI ID in the feed.\nHosted spellings disagree on word order, version separators, date formats and where a region or vendor sits.\nOnly the first-party IDs follow one grammar per vendor.\nThe watched families are a scope decision, recorded in the script's `WATCHES`; widening them is a reviewed edit there.\n\n## Lens\n\nModel every rate a provider publishes, at the grain the provider bills it.\nA rate that becomes a comment is a rate that is not charged.\nA threshold applied to a sum is a threshold applied to nothing the provider ever measured.\n"}, "ADR-0052": {"file": "0052-scope-is-a-boundary-not-a-roster.md", "title": "Scope is a boundary, not a roster, so a new release arrives without an edit", "status": "accepted", "status_note": "accepted, 2026-09-29.\nRefines [0051](0051-long-context-is-a-tier-priced-per-call-and-records-are-curated.md) (records are curated): the watched families become a shape and a generation floor.\nA Claude tier becomes any word in the tier position.\nKeeps [0007](0007-unpriced-model-aborts-before-spend.md)'s refusal for an ID whose shape is new.\nIt leaves [0049](0049-effort-is-the-third-matrix-axis.md)'s closed effort vocabulary closed.\nThe rule here is for what a provider will add, not for what a CLI accepts.", "markdown": "# 0052: Scope is a boundary, not a roster, so a new release arrives without an edit\n\nStatus: accepted, 2026-09-29.\nRefines [0051](0051-long-context-is-a-tier-priced-per-call-and-records-are-curated.md) (records are curated): the watched families become a shape and a generation floor.\nA Claude tier becomes any word in the tier position.\nKeeps [0007](0007-unpriced-model-aborts-before-spend.md)'s refusal for an ID whose shape is new.\nIt leaves [0049](0049-effort-is-the-third-matrix-axis.md)'s closed effort vocabulary closed.\nThe rule here is for what a provider will add, not for what a CLI accepts.\n\n## Context\n\nThe first curator scoped OpenAI with an enumerated set, `families={\"gpt-5.6\", \"gpt-6\"}`, and matched only IDs that began with one of those names.\nThe day OpenAI ships `gpt-7`, the curator would not see it.\nThere would be not an error, not a report, just a model absent from every record from then on.\nA sweep that names it stops at collection as unpriced.\nThe Claude grammar had the same flaw in a louder form.\nIts tier alternation (`opus|sonnet|haiku|fable|mythos`) would make a new tier an unparsable ID, stopping every curation until someone edited the list.\n\nBoth lists described the releases that existed when they were written.\nNeither described what the scope was for: every current generation of OpenAI's `gpt-` line, and every Claude tier.\n\n## Decision\n\n**A scope is a shape plus a floor.** A watch owns every first-party ID of its provider that matches its shape and whose generation is at or above its floor.\nFor OpenAI the shape is `gpt-<number>...` and the floor is `5.6`.\nThe generation is compared numerically (`5.10` is above `5.6`, and `10` is above `6`).\nSo `gpt-6`, `gpt-7` and `gpt-7.1` are in scope as they appear.\nA word after `gpt-` is a sub-line (`gpt-image`, `gpt-realtime`) and is outside the shape.\nA generation below the floor is outside the boundary.\nNeither is an error: they were never in scope.\n\n**A vocabulary slot is a pattern, not a list.** Where a grammar has a slot providers fill with new names, the slot accepts any word of the right form.\nA Claude tier is any lowercase word in the tier position, so a new tier is curated with no edit.\n\n**A new shape still stops.** Inside the boundary, an ID the grammar cannot parse stops the run and names the ID (ADR 0007).\nExamples are a dated first-party snapshot the grammar does not describe, or a suffix nobody has seen.\nThe boundary decides what is in scope; the grammar decides whether we understand it.\nOnly the second may block curation.\n\n**Closed vocabularies stay closed where an open one is the bug.** ADR 0049 closes the effort vocabulary because a CLI accepts any rung and silently bills its default.\nThat is a vocabulary the plugin sends; this record is about names the plugin receives.\nThe test for which applies:\n- if an unknown value would be silently misused, close the list\n- if a new value would be silently ignored, name the boundary\n\n## Consequences\n\n`gpt-7` appears in the next curated record on the day LiteLLM lists it.\nA changed report names it under `added`, so a reviewer sees the scope grow rather than discovering it did not.\nNarrowing scope is now an explicit edit of a floor or a shape, not the omission of a name.\nThe curator's tests pin the boundary with releases that do not exist yet (`gpt-7`, `gpt-10-sol`, `claude-nova-6`).\nSo a regression to a roster fails a test.\n\n## Lens\n\nName the boundary, not today's members.\nA list of what exists now is correct on the day it is written and silently wrong on the next release.\nA rule for what belongs keeps being right.\nThe only thing that should stop it is a shape nobody has seen.\n"}, "ADR-0053": {"file": "0053-the-test-suite-mirrors-the-system-it-tests.md", "title": "The test suite is concise and mirrors the structure of the system it tests", "status": "accepted", "status_note": "accepted, 2026-09-29.\nRefines [0039](0039-the-package-listing-is-the-architecture.md) (the package listing is the architecture) by making the test listing mirror it.\nRefines [0040](0040-the-plugin-is-a-hook-manifest.md) (each job behind the manifest is a module), whose tests now sit beside the module they exercise.\nStructural only: no test was added, removed or renamed in the move, and the collected test IDs are identical before and after.", "markdown": "# 0053: The test suite is concise and mirrors the structure of the system it tests\n\nStatus: accepted, 2026-09-29.\nRefines [0039](0039-the-package-listing-is-the-architecture.md) (the package listing is the architecture) by making the test listing mirror it.\nRefines [0040](0040-the-plugin-is-a-hook-manifest.md) (each job behind the manifest is a module), whose tests now sit beside the module they exercise.\nStructural only: no test was added, removed or renamed in the move, and the collected test IDs are identical before and after.\n\n## Context\n\nADR 0039 made the package listing the architecture: six layers, one folder each, each module one job.\nThe tests did not follow. `tests/test_units.py` had grown to 3,300 lines holding the unit tests of every layer, in the order they were written.\nIts section headers were the only map, and they had drifted:\n\n- the \"effort\" section held matrix, layout, metrics and cell tests\n- the \"normalise\" section held both harnesses' folding\n- the \"pricing\" section held the run stamp's day\n\nFinding the tests for one module meant searching the file, and a new test went wherever the last related one happened to be.\n\nA file that size also hides duplication.\nBuilders for a `RunResult`, a metrics record or a skill tree were defined once near their first user.\nThey were reached for from sections far away.\nSo no reader could see which tests shared which setup.\n\n## Decision\n\n**The test listing mirrors the package listing.** The tests of `src/pytest_xharness_eval/<layer>/<module>.py` live in `tests/<layer>/test_<module>.py`; a package's `__init__.py` is tested by `test_init.py`.\nRepository tooling under `.github/scripts/` is mirrored by `tests/scripts/`.\nEach test directory is a package, so two modules of the same name in different layers
