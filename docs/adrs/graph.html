nent without a rebuild.\n\nDevelopment is against real data: `make ui-dev CAPTURED=<skill>/evals/captured`\nserves the captured directory under the Vite dev server, and\n`make ui-smoke CAPTURED=…` builds the page, populates it through `report.inline_page`\n(the same code path as `--xharness-report-inline`) and renders it headlessly in\njsdom, printing the rows it mounted. There are no fixture JSONs for the page to\ndrift from.\n\nThe move is panel by panel. This record lands the workspace, the contracts, the\ntheming, `ReportHeader`, `SweepOverview` with `SessionTable`, and `SessionView` with\n`SessionMetaTable`. Still on the legacy template, and moved in later changes:\n`TokenAccumulationChart`, the per-session charts (`ContextWindowChart`,\n`TokenWaterfallChart`, `TurnTiersChart`, `OutputPerTurnChart`, `ChartAxisToggle`),\n`SessionTurnTable` and `TurnRawRecords` with the record-card component library,\n`SkillCoveragePanel`, `RecordKindsPanel`, `CostByTierPanel`, `ReconciliationPanel`\nand `FinalMessagePanel`. Charts will use shadcn's chart components over Recharts,\nreplacing Plotly. Until parity, `assets/report.html` stays the legacy page and\n`ui-promote` is not run.\n\n## Consequences\n\nA contributor changing the page needs bun; one changing the plugin does not. The\nbuilt page is a ~330 kB committed artifact that changes on every UI change, which is\nthe price of a dependency-free wheel. CI type-checks, lints, tests and builds the\nworkspace on every push now; once the page is promoted, the same job rebuilds it\nand fails on a difference from the committed asset, so the two cannot drift. `src/components/ui/` is\nshadcn's generated code and is excluded from lint and format. The root\n`.gitignore`'s Python patterns (`lib/`, `dist/`) are carved out for\n`report-ui/src/lib/`. While the move is in progress the two pages coexist; nothing a\nuser sees changes until promotion.\n\n## Lens\n\nHold a user-facing page to the tooling a page of that quality is built with, and\nlet the build, not the runtime, carry the dependencies.\n"}, "ADR-0029": {"file": "0029-the-billed-sum-is-named-accumulative-billed-tokens.md", "title": "The billed sum is named `accumulative_billed_tokens`", "status": "accepted", "status_note": "accepted, 2026-08-23. Supersedes one row of\n[0021](0021-metric-names-carry-unit-and-provenance.md) (`billed_tokens` → `total_tokens`);\nrefines [0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md).", "markdown": "# 0029: The billed sum is named `accumulative_billed_tokens`\n\nStatus: accepted, 2026-08-23. Supersedes one row of\n[0021](0021-metric-names-carry-unit-and-provenance.md) (`billed_tokens` → `total_tokens`);\nrefines [0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md).\n\n## Context\n\n0019 recorded the run's billed sum as `billed_tokens`. 0021 renamed it `total_tokens`\non the grounds that \"`billed` did not say billed what\". That rename was made inside a\nworking session and was not put to the project's owner as a decision; it was noticed\nwhen a report row read as \"1,504,090 tokens consumed of a 1M context window, 12%\".\n\n`total_tokens` says neither what is totalled nor over what. Beside a context\npercentage it invites exactly the misreading that occurred: the billed sum across\nsixteen calls looked like a single quantity to compare with the window.\n[docs/token-accounting.md](../token-accounting.md) works through why the two\nfigures differ by an order of magnitude for an ordinary run.\n\n## Decision\n\nThe billed sum is `accumulative_billed_tokens`: the four priced tiers (`input`,\n`output`, `cache_read`, `cache_write`) summed over every model call of the run. The\nname states the unit (tokens), the source (what was billed) and the aggregation\n(accumulated over calls), which is 0021's own rule applied fully. The property on\n`Usage`, the key in `.result.json` `usage`, the history line, `index.json`, the\nverbose status word, both report pages and the glossary use the one name. The per-call\nprompt size keeps its name, `context_tokens`, and its headline `peak_context_tokens`.\n\nTwo things keep the old spelling because they are not this metric: the Claude Code\nrecord kind `claude/attachment/total_tokens_reminder`, and the vendors' own\n`total_tokens` fields in raw usage objects (`reported_usage`, Codex `token_count`\nevents, any record JSON), which the reconciliation panel shows under the vendor's name\nbeside the plugin's figure.\n\n## Consequences\n\n`run.usage.total_tokens` no longer exists; graders that asserted it assert\n`run.usage.accumulative_billed_tokens > 0` instead (the two eval suites in the first\nconsuming repository are updated in the same change). Results and history lines\nwritten before this record carry the old key until replayed; `make evals-replay`\nrewrites them. The status word is longer by one long word, which is the point.\n\n## Lens\n\nA name that can be read two ways will be; name the aggregation, not just the unit.\n"}, "ADR-0030": {"file": "0030-price-rows-live-in-the-pytest-config.md", "title": "Project price rows live in the pytest config, not in a prices.toml beside it", "status": "accepted", "status_note": "accepted, 2026-08-24. Refines [0006](0006-local-price-table-is-authoritative.md),\n[0014](0014-register-through-the-pytest11-entry-point.md) and\n[0026](0026-skill-ignore-lives-in-the-pytest-config.md); ADR 0007's\nstop-before-spend rule is unchanged.", "markdown": "# 0030: Project price rows live in the pytest config, not in a prices.toml beside it\n\nStatus: accepted, 2026-08-24. Refines [0006](0006-local-price-table-is-authoritative.md),\n[0014](0014-register-through-the-pytest11-entry-point.md) and\n[0026](0026-skill-ignore-lives-in-the-pytest-config.md); ADR 0007's\nstop-before-spend rule is unchanged.\n\n## Context\n\n0026 moved skill-ignore rules out of a dotfile beside the skill and into the\n`xharness_skill_ignore` ini key, on the grounds that a pytest plugin's permanent,\nfile-based configuration belongs where pytest keeps its own. Price overrides had the\nsame shape left over: the `xharness_prices` ini key named a *file* (`prices.toml` at\nthe rootdir) whose TOML rows layered over the bundled table. Same objection: a\nsecond configuration file in a second format that nothing in `pytest --help` reveals\nthe contents of, one more thing to discover, and a unit trap inside it — rows were\nUSD **per token** (`5.0e-6`), while every provider publishes USD per million tokens.\n\n## Decision\n\n`xharness_prices` becomes a linelist of price rows, in the way pytest's own\n`markers` lines pair a name with its text:\n\n```toml\n[tool.pytest.ini_options]\nxharness_prices = [\n    \"gpt-5.6-terra: input=1.25 output=10.00 cache_read=0.125\",\n    \"claude-sonnet-5: input=2.00 output=10.00 cache_read=0.20 cache_write=2.50 cache_write_1h=4.00\",\n]\n```\n\nValues are **USD per million tokens**, the unit providers publish; the plugin divides\nby 1e6. `input` and `output` are required; `cache_read` and `cache_write` default to\n`input`; `cache_write_1h` defaults to `cache_write` × 1.6 (Anthropic's 2.0/1.25 TTL\nratio), the same defaulting the bundled table has always had. The selector before the\ncolon is the model key, prefix-matched by `resolve` like any bundled row.\n\nBecause the bundled table stays per-token, a row pasted from it into the ini would\nunder-price by a factor of a million; a value below $0.001/MTok is therefore rejected\nas \"looks like a per-token rate\". A malformed line, an unknown tier, or a missing\nrequired tier stops the session at configure time, before any cell is collected —\nthe same never-price-as-zero posture as 0007.\n\nThe bundled `prices.toml` inside the package is unchanged: it is the plugin's own\nversioned data file, not project configuration, and remains the one `__file__`\nexception of 0014. The replay command resolves `xharness_prices` from the project's\npytest config the way it already resolves `xharness_skill_ignore` (the reader is now\n`config_lines_of(captured, key)`), and its `--prices FILE` flag becomes `--price LINE`\n(repeatable, same grammar). `rates_applied.source` records `xharness_prices` for ini\nrows and the bundled file's path for bundled rows.\n\n## Consequences\n\nA project that had a rootdir `prices.toml` moves each row onto one line, multiplying\nby 1e6, and deletes the file; until it does, its overrides are silently gone and a\nmodel priced only there stops the sweep at collection — loudly, per 0007. A project\nwhose ini still says `xharness_prices = \"prices.toml\"` now fails at configure time\nwith the line-grammar error, which is the migration signal. Dated overrides (an\nintroductory price) become one commented line in the pytest config instead of a\nblock in a side file, so their expiry note sits where the reviewer of the config\nchange will see it.\n\n## Lens\n\nThe second file a tool asks a project to maintain should have to argue for itself\nharder than the first; and state prices in the unit the price tag uses.\n"}, "ADR-0031": {"file": "0031-plotly-tamagui-and-a-deeplink-permutation-matrix.md", "title": "The report draws with Plotly on a Tamagui base, every state deeplinks, and a Playwright matrix sweeps them all", "status": "accepted", "status_note": "accepted, 2026-08-27. Refines\n[0020](0020-captured-report-is-a-static-microsite.md),\n[0024](0024-context-window-metrics-injected-messages-and-design-tokens.md),\n[0025](0025-results-name-their-case-and-charts-have-a-log-line-axis.md) and\n[0028](0028-report-is-built-from-a-component-workspace.md); supersedes 0028's\nshadcn/recharts component stack and 0024's fold-onto-the-last-colour series rule.", "markdown": "# 0031: The report draws with Plotly on a Tamagui base, every state deeplinks, and a Playwright matrix sweeps them all\n\nStatus: accepted, 2026-08-27. Refines\n[0020](0020-captured-report-is-a-static-microsite.md),\n[0024](0024-context-window-metrics-injected-messages-and-design-tokens.md),\n[0025](0025-results-name-their-case-and-charts-have-a-log-line-axis.md) and\n[0028](0028-report-is-built-from-a-component-workspace.md); supersedes 0028's\nshadcn/recharts component stack and 0024's fold-onto-the-last-colour series rule.\n\n## Context\n\n0028 built the report page from a Vite workspace on shadcn/ui (radix) with recharts,\nsmoke-tested by rendering the bundle in jsdom. Three pressures outgrew that stack:\n\n- The charts are the product. recharts composes primitives well but tops out early:\n  its legends overflowed the card on sweeps with many sessions, and unified hover,\n  SI ticks and step-stacked areas each needed hand-rolling.\n- The page's quality bar is \"AAA for every permutation of the results data\" — which\n  is only checkable if every state is addressable by URL and something sweeps them\n  all. jsdom cannot render the real page (no layout, no canvas), so the smoke proved\n  boot, not behaviour.\n- Two component systems (radix primitives styled by Tailwind classes) meant every\n  interactive state was styled twice and animated nowhere.\n\n## Decision\n\nThree moves, one per pressure.\n\n**Plotly.js draws every chart.** `plotly.js-basic-dist-min` (scatter, bar — all the\npage needs) through one mount point, `components/charts/Plot.tsx`. Layouts are built\nfrom `useChartTheme()`, which resolves the `--xh-*` custom properties to concrete\nvalues and re-resolves when the theme flips, so 0024's design tokens still own every\ncolour. Legends are DOM (`ChartLegend`): flexbox chips that wrap instead of\noverflowing and toggle a trace by re-rendering it as `legendonly`. Series past the\neight-colour token palette cycle through it with a different line dash per lap —\nsuperseding 0024's rule that a ninth session folds onto the last colour, which made\nnine of sixteen lines identical.\n\n**Tamagui is the base UI and animation framework.** `components/ui/*` are hand-written\nTamagui components now, not shadcn output; radix and Tailwind are both gone. Layout,\nchrome and interactivity are Tamagui components with props; the Tamagui themes hold\n`var(--xh-*)` references — both light and dark on purpose, because 0024's `.dark`\nclass flip on the root already swaps the underlying values. Document content —\ntables, record cards, code blocks, key/value grids — is semantic HTML styled by one\nhand-written stylesheet (`index.css`), token-driven like everything else. One trap\nis load-bearing: Tamagui injects its atomic classes at runtime, after the\nstylesheet, so chrome that must overrule it (the segmented control) is pinned with\n`!important`, and positioning on Tamagui components is set through props, never\nclasses.\n\n**Every state deeplinks, and one Playwright test sweeps the matrix.** The URL is\nthe single source of truth — real History-API routes as query strings (no fragment\nrouter; query, not path segments, because the one static file must route with zero\nserver rewrites and over `file://`): `session`, `turn`, `view` keep their 0020\nmeanings, and\n`axis` (0025's log-line axis), `rec` (raw/nice records), `line` (a record-level\npermalink that opens its owning turn and flashes the card), `sort`/`dir` (overview\ntable) and `theme` join them. A param absent from the URL means its default — state\nnever sticks across navigations, navigations push history entries, and legacy\n`#…` links upgrade to their query form on load. `lib/permutations.ts` enumerates the covering\nmatrix from the captured data itself (every turn of every session in both views,\nplus one permutation per remaining param per view type) and gives each state a\ndeterministic filesystem-safe slug. The matrix is tiered — `small` constrains every\ndimension to one representative value (one session per harness, one mid turn,\ndetailed view only), `medium` to a few (one session per harness×model,\nfirst/middle/last turns, every variant), `large` to all — so the inner loop stays\nseconds long and the full-cost sweep is absorbed less frequently; tiers nest by\nslug, so a faster run refreshes a subset of the same artifact tree. The singular `e2e/matrix.spec.ts` full-loads\neach permutation in a real browser, asserts zero console errors, and saves\nscreenshot, console transcript and network timings under\n`tmp/e2e/matrix/<slug>/` — the shared, precise language for \"this exact state is\nbroken\". The jsdom smoke is replaced by `e2e/inline.spec.ts`, which opens the\ninline-populated build over `file://` and checks the glossary-id parity list in a\nreal browser.\n\n## Consequences\n\n- `make ui-e2e CAPTURED=<dir> TIER=small|medium|large` sweeps the matrix\n  (`SAMPLE=<n>` for an evenly spaced sample, `E2E_TARGET=dev` against the dev\n  server); `make ui-smoke` needs a browser,\n  not jsdom. Playwright's chromium must be installed once\n  (`bunx playwright install chromium`).\n- The bundle grows to ~1.7 MB (Plotly basic inlined); still one file, still offline.\n- A new route param must be added to `lib/permutations.ts` in the same change, or\n  the matrix silently stops covering it.\n- `window.__XH_PENDING__` (in-flight loads) and `[data-xh-loading]` markers are the\n  page's settledness contract with the e2e suite.\n"}, "ADR-0032": {"file": "0032-all-run-output-consolidates-under-a-cache-dir.md", "title": "All run output consolidates under `.xharness_eval_cache/`, and the report is one combine step", "status": "accepted", "status_note": "accepted, 2026-08-27. Refines\n[0014](0014-register-through-the-pytest11-entry-point.md) (path resolution),\n[0018](0018-fixtures-directory-and-metrics-history.md) (history) and\n[0020](0020-captured-report-is-a-static-microsite.md) (the microsite); supersedes\n0018's `captured/` location, 0020's one-report-per-captured-directory rule, and the\n`xharness_workdir` ini key.", "markdown": "# 0032: All run output consolidates under `.xharness_eval_cache/`, and the report is one combine step\n\nStatus: accepted, 2026-08-27. Refines\n[0014](0014-register-through-the-pytest11-entry-point.md) (path resolution),\n[0018](0018-fixtures-directory-and-metrics-history.md) (history) and\n[0020](0020-captured-report-is-a-static-microsite.md) (the microsite); supersedes\n0018's `captured/` location, 0020's one-report-per-captured-directory rule, and the\n`xharness_workdir` ini key.\n\n## Context\n\nRun output used to land in two conventions at once: per-cell workspaces and\n`report.json` under `tmp/evals/` (`xharness_workdir`), and evidence under each\nskill's own tree at `<skill>/evals/captured/<case>/` with a shared, appended\n`history.jsonl` beside it. Three pressures broke that shape:\n\n- A sweep across several skills produced several disconnected reports and no page\n  over the whole run; the SPA had grown multi-skill affordances with no index that\n  ever exercised them.\n- Build artifacts accumulated inside `skills/` — the source tree — and every\n  consuming repo needed its own git-ignore lines for them.\n- The shared `history.jsonl` was the one file two parallel writers could contend\n  on, which is exactly the problem pytest-cov solves with suffix files: every\n  writer owns a unique path, and a single combine step aggregates.\n\n## Decision\n\nOne git-ignored root, resolved against the pytest rootdir through the new\n`xharness_cache_dir` ini key (default `.xharness_eval_cache`, matching the common\n`.*_cache/` ignore convention). `xharness_workdir` is gone.\n\n```text\n.xharness_eval_cache/\n  build/                                   # per-cell isolated workspaces\n  results/{skill}/{harness}/{model}/{run_ts}/{session_id}/\n    log.jsonl                              # the session log, verbatim\n    result.json                            # the derived RunResult (replayable)\n    history.json                           # one metrics record\n  report/\n    report.json                            # the last run's summary\n    history.jsonl                          # aggregated from results/**/history.json\n    index.json, report.html, report.tokens.json, XHARNESS-REPORT-GLOSSARY.md\n```\n\n- **Suffix convention.** A cell writes only inside its own\n  `{run_ts}/{session_id}/` directory — no shared file, no lock, full\n  parallelisation under xdist. `run_ts` is one UTC stamp per pytest session\n  (`YYYYMMDDTHHMMSSZ`, exported as `XHARNESS_EVAL_RUN_TS` so xdist workers agree),\n  so repeated runs accumulate side by side instead of overwriting.\n- **One combine step.** At session end (and on every replay) the report step walks\n  everything under `results/` — every skill, every run — aggregates the per-session\n  `history.json` records into `report/history.jsonl`, and writes one `index.json`\n  and one `report.html` into `report/`. Index rows point at evidence by relative\n  path (`../results/…`), so serving the cache root serves the whole report:\n  `python3 -m http.server --directory .xharness_eval_cache` →\n  `/report/report.html`.\n- **Replay is also the migrator.** `python -m pytest_xharness_eval.replay <cache>`\n  rebuilds every result under `results/` as before; pointed at a legacy\n  `<skill>/evals/captured` directory it migrates that evidence into the project's\n  cache (the original is left untouched) and then rebuilds.\n- **Plain files stay.** Everything remains human-readable `.json`/`.jsonl`; a\n  database or columnar format is complexity to adopt when scale demands it, not\n  before.\n\n## Consequences\n\n- Skills directories no longer accumulate run output, and one `.*_cache/` ignore\n  line covers everything.\n- The report is a sweep-level page: multiple skills, multiple runs, one index. The\n  SPA needed no data-contract change — index rows were always opaque relative\n  paths.\n- `report.json` moves from `tmp/evals/` to `.xharness_eval_cache/report/`.\n- Consuming repos drop `xharness_workdir` from their pytest config;\n  `xharness_cache_dir` exists for the rare override.\n"}, "ADR-0033": {"file": "0033-subagent-transcripts-are-captured-and-billed.md", "title": "Subagent transcripts are captured evidence, and their tokens are billed", "status": "accepted", "status_note": "accepted, 2026-08-28. Refines\n[0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md) (the ledger),\n[0021](0021-metric-names-carry-unit-and-provenance.md) (nothing is truncated) and\n[0032](0032-all-run-output-consolidates-under-a-cache-dir.md) (the session\ndirectory layout).", "markdown": "# 0033: Subagent transcripts are captured evidence, and their tokens are billed\n\nStatus: accepted, 2026-08-28. Refines\n[0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md) (the ledger),\n[0021](0021-metric-names-carry-unit-and-provenance.md) (nothing is truncated) and\n[0032](0032-all-run-output-consolidates-under-a-cache-dir.md) (the session\ndirectory layout).\n\n## Context\n\nSkills that instruct the agent to parallelise (the discovery skill spawns\nresearch subagents) produce more than one transcript per session:\n\n- Claude Code writes each spawned agent to\n  `projects/<slug>/<session-id>/subagents/agent-<id>.jsonl`, with an\n  `agent-<id>.meta.json` sidecar carrying the agent type, the spawn description\n  and the `toolUseId` of the Agent tool call that spawned it. The primary session\n  log holds no sidechain records at all.\n- Codex forks one rollout file per spawned thread under the same `CODEX_HOME`;\n  its `session_meta` carries `source.subagent.thread_spawn` (nickname, agent\n  path, depth) and `forked_from_id` naming the primary\n  ([0005](0005-private-codex-home-per-run.md) already\n  made the private home the place they can all be found;\n  `primary_rollout()` already tells them apart).\n\nBefore this decision those transcripts were dropped: the tokens the spawned\nthreads spent were invisible to the ledger, the estimate under-billed the run\n(a discovery session's real bill was ~1.5–2x what the report said), and the\nevidence contract — the verdict is tied to what the agent actually did — had a\nhole the size of every parallel thread.\n\n## Decision\n\n- **Capture.** Every subagent transcript is copied into\n  `<session dir>/subagents/` beside `log.jsonl` (Claude's `.meta.json` sidecars\n  included). The runner passes Codex's forked rollouts explicitly; a captured\n  session (and therefore replay) discovers them from the directory alone.\n- **Normalise.** Each transcript folds through the same ledger machinery as the\n  primary (`claude_ledger` / the Codex fold): `RunResult.subagents` lists one\n  `Subagent` per thread — agent name, id, captured log path, its own `Call`\n  ledger and `Usage`, and `parent_turn`, the primary turn that spawned it\n  (matched by tool-use id on Claude, by spawn timestamp on Codex).\n- **Bill.** A subagent's usage folds into the run's `usage`: `usage` is the whole\n  bill, priced at the run's own rates, and `accumulative_billed_tokens` covers\n  every thread. `turns` and `calls` stay the primary thread's own.\n- **Render.** The report attributes each thread's bill to its spawning turn: the\n  token waterfall carries a `sub` category (its own design token), the running\n  cost line includes it, and the turn table shows a `SubagentBand` — each\n  spawned thread's own per-call ledger — beneath the turn that spawned it.\n\n## Consequences\n\n- A discovery-style session's estimate now matches what the provider will\n  actually charge; sweeps re-price historical runs on replay, so cached totals\n  rise once and stay honest.\n- A subagent is priced at the primary run's rates. If a harness ever spawns\n  subagents on a *different* model, the estimate mis-prices those threads; the\n  rates row a thread was priced with is `rates_applied`, so the drift is\n  explainable. Revisit when a harness reports per-thread models worth splitting.\n- Replay derives identical subagent ledgers from the captured directory, so the\n  session directory remains the complete unit of evidence (0032).\n"}, "ADR-0034": {"file": "0034-a-harness-is-a-class-and-the-registry-is-the-only-dispatch.md", "title": "A harness is a class, the registry is the only dispatch, and the layers are named", "status": "accepted", "status_note": "accepted, 2026-08-28. Refines\n[0002](0002-every-cell-invokes-the-real-cli.md) (the real CLI),\n[0014](0014-register-through-the-pytest11-entry-point.md) (locations are ini keys),\n[0015](0015-harness-is-the-axis-and-the-project-owns-the-matrix.md) (harness is\nthe axis) and [0023](0023-turn-boundaries-skill-ignore-and-replay.md) (replay).\nStructural only: no record's shape and no metric's value changes.", "markdown": "# 0034: A harness is a class, the registry is the only dispatch, and the layers are named\n\nStatus: accepted, 2026-08-28. Refines\n[0002](0002-every-cell-invokes-the-real-cli.md) (the real CLI),\n[0014](0014-register-through-the-pytest11-entry-point.md) (locations are ini keys),\n[0015](0015-harness-is-the-axis-and-the-project-owns-the-matrix.md) (harness is\nthe axis) and [0023](0023-turn-boundaries-skill-ignore-and-replay.md) (replay).\nStructural only: no record's shape and no metric's value changes.\n\n## Context\n\n0015 named *harness* as the first matrix axis, but the axis stayed a bare string.\nThe behaviour behind it had accumulated across six modules in four unrelated\ndispatch idioms:\n\n| Site | Idiom | What a third harness did |\n| --- | --- | --- |\n| `matrix.KNOWN_HARNESSES` | tuple literal | failed loudly |\n| `runner.RUNNERS` | dict lookup | failed loudly |\n| `normalise.from_claude` / `from_codex` | no dispatch; different signatures | failed loudly |\n| `records.classify` | `if harness == \"claude\" else _classify_codex` | **read as Codex, silently** |\n| `replay.rebuild_result` | `if old[\"harness\"] == \"claude\": ... else:` | **read as Codex, silently** |\n| `skillcov._SHELL_TOOLS` | one set unioning both providers' tool names | mis-attributed coverage, silently |\n\nTwo of the six defaulted rather than failing, which is the opposite of the\nevidence contract this plugin is built on (0002: never grade a run whose evidence\nis missing or ambiguous).\n\nThe signature asymmetry was the load-bearing defect. A Claude session log is\n*incomplete* — the session id, `total_cost_usd` and the aggregate usage exist\nonly on the `-p --output-format json` stdout envelope — while a Codex rollout is\nself-contained but records no process exit code. Because that asymmetry was\nexposed through the interface rather than encapsulated, `replay.py` had to\nfabricate a synthetic Claude envelope out of a stored `result.json`: eight lines\nof Claude-specific knowledge in the module that otherwise knows nothing about\nClaude.\n\nSeparately, three layers were interleaved. `plugin.py` was simultaneously the\npytest interface, the config resolver, the cell execution sequence and the\nevidence writer; `replay.py` independently reimplemented the config resolver\n(a second pytest-rootdir walker, with `configparser`) and the execution sequence\n(price, annotate, name the case, write the metrics record). Nothing failed when\nthose two copies drifted — a replay would simply produce a record a live run\nnever would.\n\n## Decision\n\n**A harness is a class.** `Harness` (in `harness/base.py`) is the extension\npoint, and a provider implements five members: `name`, `run`,\n`session_from_capture`, `classify_record`, and the `shell_tools` /\n`persistent_shells` its coverage attribution needs. `register()` puts it in the\nregistry; `get(name)` is the only way to reach one, and an unregistered name\nraises `UnknownHarness` rather than falling through to a default.\n\n**A session log is a class.** `SessionLog` holds the log *plus the side-channel\nits dialect needs* — `ClaudeSessionLog` carries the stdout envelope,\n`CodexSessionLog` the exit code and the forked rollouts — so every caller gets\none uniform `to_result(workspace, files_written)` and none has to know which\ndialect needs what. The Claude envelope reconstruction moves to\n`ClaudeHarness.session_from_capture`, beside the dialect that requires it.\n\n**The layers are named modules.** `settings.py` resolves configuration once, for\nboth entry points: `Settings.from_config` for a live sweep,\n`Settings.from_cache` for a replay running outside any pytest session.\n`pipeline.py` owns the sequence that both paths run over a `RunResult` — derive\n(price, annotate coverage, name the case), capture (log, subagent transcripts,\nresult), record metrics. `plugin.py` keeps only pytest hooks and collection;\n`report.py` and `replay.py` keep only curation. `normalise.py` keeps the shared\nfolding primitives and knows about no provider at all.\n\n**The boundary is enforced, not just documented.** A ruff `TID251` banned-api\nrule fails the build if anything outside the harness package imports\n`harness.claude` or `harness.codex` by name. It carries an owner and a\n2027-08-28 review date in `pyproject.toml`; if the registry is ever abandoned the\nrule is deleted rather than left to mislead.\n\n`runner.py` is gone. Its shared half (`RunError`, `spawn`, the default timeout)\nis `harness/base.py`; each provider's half is its own module. The `pragma: no\ncover` markers move with the code they justify: spawning a CLI is still never\nmocked or faked (0002).\n\n## Consequences\n\nAdding a third CLI is one new module under `harness/` and one `register()` call.\n`matrix.known_harnesses()` reads the registry, so a harness cannot be runnable\nbut unmatrixable. The two silent Codex defaults are now `UnknownHarness`.\n\nBehaviour is unchanged, and that is checked rather than asserted:\n`tests/test_characterization.py` pins the whole serialised `RunResult` for a rich\ncapture of each dialect against a golden, and pins that a replay reproduces the\nlive result from the captured directory alone. Those goldens did not move across\nany step of this change. They normalise out the tmp path and the `rates_applied`\nwall-clock stamp — pinning either would pin noise.\n\nTwo coverage cases had been sharing one fixture that put Claude's `Bash` and\nCodex's `exec` on a single run, which only type-checked because `_SHELL_TOOLS`\nunioned both vocabularies. A result comes from exactly one harness, so that test\nis now two.\n\nExtraction made previously unreachable code testable: the evidence-capture and\nmetrics-record steps used to sit inside `plugin.EvalItem._run_live`, behind the\n`pragma: no cover` that the paid CLI call requires. In `pipeline.py` they are\nordinary functions, tested without invoking anything.\n\n`report.py` and the report UI are untouched: no key of `result.json`,\n`index.json` or `history.jsonl` changes, so `report-ui/src/lib/types.ts` and the\nglossary stay valid.\n\n## Lens\n\nWhen one axis is named but stays a string, its behaviour spreads into every\nmodule that has to ask what it is — and the branches that *default* are worse\nthan the ones that fail. Give the axis a type, make the registry the only way to\nreach an implementation, and let a linter keep the boundary you just drew.\n"}, "ADR-0035": {"file": "0035-the-nouns-carry-their-own-invariants.md", "title": "The nouns carry their own invariants", "status": "accepted", "status_note": "accepted, 2026-08-28. Refines\n[0003](0003-runresult-is-a-stdlib-dataclass.md) (RunResult is a stdlib dataclass),\n[0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md) (the per-call ledger),\n[0021](0021-metric-names-carry-unit-and-provenance.md) (rates travel with the\nestimate), [0022](0022-record-kind-catalogue-and-skill-coverage.md) (skill\ncoverage), [0025](0025-results-name-their-case-and-charts-have-a-log-line-axis.md)\n(a result names its case) and\n[0033](0033-subagent-transcripts-are-captured-and-billed.md) (subagents are\nbilled). Structural only: no serialised key and no metric's value changes. The\nfolding constructors' keyword fields are declared and type-checked by\n[0036](0036-a-folding-constructor-declares-its-keyword-fields.md).", "markdown": "# 0035: The nouns carry their own invariants\n\nStatus: accepted, 2026-08-28. Refines\n[0003](0003-runresult-is-a-stdlib-dataclass.md) (RunResult is a stdlib dataclass),\n[0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md) (the per-call ledger),\n[0021](0021-metric-names-carry-unit-and-provenance.md) (rates travel with the\nestimate), [0022](0022-record-kind-catalogue-and-skill-coverage.md) (skill\ncoverage), [0025](0025-results-name-their-case-and-charts-have-a-log-line-axis.md)\n(a result names its case) and\n[0033](0033-subagent-transcripts-are-captured-and-billed.md) (subagents are\nbilled). Structural only: no serialised key and no metric's value changes. The\nfolding constructors' keyword fields are declared and type-checked by\n[0036](0036-a-folding-constructor-declares-its-keyword-fields.md).\n\n## Context\n\n0034 gave the *harness* axis a type and ended four dispatch idioms. Everything\ndownstream of `SessionLog.to_result` was still dict-and-string plumbing, and four\nof this plugin's load-bearing rules survived only as prose repeated in docstrings:\n\n| Rule | How it was held | How it could break |\n| --- | --- | --- |\n| A run's `usage` is its whole bill: the primary ledger plus every subagent | `normalise.sum_usage` + `normalise.attach_subagents`, called by each adapter by hand | `attach_subagents` mutated `result.usage` in place, so calling it twice silently doubled the bill of every spawned thread |\n| An estimate never exists without the rates behind it (0021) | `pricing.price` assigning four `RunResult` fields in order, from a foreign module | any one of the four could be written, or left, alone |\n| `cost_status` is `priced` or `unpriced` | a `str` field with two string literals in two modules | a third spelling type-checked |\n| The case and the coverage records have fixed shapes | `dict[str, Any]`, hand-built in `pipeline.case_record`, `replay.case_meta` and `skillcov.annotate`/`catalog` | three hand-built copies of one key set, and `history.metrics_of` `.get()`-ing keys nothing guaranteed |\n\nTwo of those are not stylistic. `Usage.add` was the only mutable accumulator in\nthe model, and the one thing that must be summed exactly once is the number every\nverdict's cost is computed from. And the four cost fields written in sequence by\nanother module is the same shape of defect 0034 removed from classification: the\ninvariant lived in the caller, so every caller had to be trusted with it.\n\nEach harness adapter also still exposed a `from_<provider>` module function that\nits `SessionLog.to_result` forwarded to in one line — the last remnant of the\npre-0034 signatures, and the reason the fold sat outside the class that owns it.\n\n## Decision\n\n**A total is a value, not an accumulator.** `Usage` is frozen and gains `__add__`\nand `Usage.total(...)`. `Usage.add` is gone, and with it `normalise.sum_usage`\nand `normalise.attach_subagents`.\n\n**One folding constructor computes the bill once.** `RunResult.folded(calls,\nsubagents, **fields)` sets `turns = len(calls)` and\n`usage = Σ calls + Σ subagents`, and sorts the subagents. `Subagent.folded(calls,\n...)` is its counterpart for one spawned thread. Both adapters build their result\nthrough it, so a second fold cannot bill a subagent twice — the failure mode is\nnow unrepresentable rather than merely undocumented.\n\n**A price is applied atomically.** `pricing.CostEstimate` (total, per-tier split,\n`AppliedRates` provenance) is built by `CostEstimate.of(usage, rates)` and\napplied by the single method `RunResult.apply_cost`. `Rates` owns the arithmetic\nthat prices a `Usage`. No module outside `runresult.py` writes a cost field.\n`cost_status` is a `StrEnum`: a `str` subclass, so `asdict` keeps the member and\n`json.dumps` writes the same word the wire format has always carried.\n\n**The two hand-built records become types.** `CaseRef` (`of` from a live case,\n`stored` from a capture) replaces `pipeline.case_record` and the mapping\n`replay.case_meta` returned. `SkillFile`, `FileCoverage`, `CoverageSummary` and\n`SkillCoverage` replace the mappings `skillcov.catalog` and `annotate` built;\n`SkillCoverage.over` derives the four path sets and the summary from the\nannotated rows in one place, so they cannot disagree with each other. `FileKind`\nand `Access` are `StrEnum`s.\n\n**The fold belongs to the session log.** `from_claude` and `from_codex` are gone;\ntheir bodies are `ClaudeSessionLog.to_result` and `CodexSessionLog.to_result`.\nThe paid `run_claude` / `run_codex` spawn functions stay module-level: they are\n`pragma: no cover` by 0002, so a motion bug in them would be discovered only by\nspending money.\n\n**`ignorerules.py` is its own module.** The `xharness_skill_ignore` line\nselection and the gitignore-pattern subset know nothing about skills, runs or\nharnesses; `IgnoreRules.for_skill(skill, lines)` compiles them once and\n`.matches(rel)` is the only question asked of them. `skillcov.py` is now about\ncoverage alone.\n\n**`asdict` stays the serialiser.** `RunResult.to_dict` is still `asdict(self)`\nplus derived keys, and never a per-field `.to_dict()` walk. That is what renders\nthe typed records into the exact key sets they declare while passing a plain\nmapping straight through, and it is why `usage` stays a field rather than\nbecoming a computed property — `asdict` drops properties, and `usage` is a key of\n`result.json`. The three optional records (`case`, `skill_coverage`,\n`rates_applied`) serialise as `{}` when absent, as they always have.\n\n## Consequences\n\nEvery serialised contract is unchanged, and that is checked rather than claimed:\n`tests/test_characterization.py` pins the whole `RunResult` of a rich capture per\ndialect, and pins that a replay reproduces the live result from the captured\ndirectory alone. Both goldens are byte-identical across this change, so\n`report.py`, `report-ui/src/lib/types.ts` and the glossary stay valid.\n\n`history.metrics_of` reads attributes instead of `.get()`-ing keys, but still\nemits a flat mapping of builtins: that record travels to the xdist controller on\n`TestReport.user_properties`, which serialises builtins only (0016). The dict\nboundary is deliberate and now stated where it is crossed.\n\n`skillcov.py` drops from 491 to 397 lines; `runresult.py` grows to 382 as the\ninvariants move next to the data they constrain.\n\nThe unit tests changed shape with the API — mapping subscripts became attribute\naccess, the two `from_<provider>` call sites became their session-log classes —\nand no assertion was weakened to accommodate the move.\n\n## Lens\n\nA rule that lives in a docstring is enforced by whoever read it last. Put the\nsum on the type that owns it, make the multi-field write a single method, and\ngive the record a name — then the illegal state stops being something reviewers\nhave to watch for.\n"}, "ADR-0036": {"file": "0036-a-folding-constructor-declares-its-keyword-fields.md", "title": "A folding constructor declares its keyword fields", "status": "accepted", "status_note": "accepted, 2026-08-28. Refines\n[0035](0035-the-nouns-carry-their-own-invariants.md) (the nouns carry their own\ninvariants) and [0003](0003-runresult-is-a-stdlib-dataclass.md) (RunResult is a\nstdlib dataclass). Structural only: no serialised key and no metric's value\nchanges.", "markdown": "# 0036: A folding constructor declares its keyword fields\n\nStatus: accepted, 2026-08-28. Refines\n[0035](0035-the-nouns-carry-their-own-invariants.md) (the nouns carry their own\ninvariants) and [0003](0003-runresult-is-a-stdlib-dataclass.md) (RunResult is a\nstdlib dataclass). Structural only: no serialised key and no metric's value\nchanges.\n\n## Context\n\n0035 replaced two per-adapter constructions of `RunResult` with one folding\nconstructor, so that the run's whole bill is summed exactly once. It spelled the\nremaining dialect fields `**fields: Any`, and that spelling gave back more than\nthe fold won. `Any` erases the keyword names and their types, so at the only two\nconstruction sites in the codebase the type checker stopped seeing the fields it\nhad been checking:\n\n| Written at an adapter | Before 0035 (`RunResult(...)`) | After 0035 (`**fields: Any`) |\n| --- | --- | --- |\n| `harnes=\"claude\"` | `Unexpected keyword argument` | accepted |\n| `model=123` | `incompatible type \"int\"` | accepted |\n| omitting `duration_ms` | `Missing named argument` | accepted |\n\nAll three verified against this repository's pinned mypy under `--strict`. The\nregression sat at exactly the seam 0035 existed to harden, and it made \"build one\nwith `folded`\" a rule held by a docstring — the prose enforcement that ADR set\nout to end — because nothing distinguished a correct call from a wrong one.\n\nThe keyword caravan also hid a second thing. `RunResult` has four groups of\nfields with four different owners, and `**fields: Any` let a harness adapter\nreach all of them: it could have set `estimated_cost_usd` without the rates that\njustify it, bypassing `apply_cost`, or written `skill_coverage` before the run\nwas graded.\n\n## Decision\n\n**The keyword fields are a TypedDict, unpacked.** `RunResultFields` and\n`SubagentFields` declare, key by key with its exact type, what a harness adapter\nsupplies; `folded` takes `**fields: Unpack[RunResultFields]` (PEP 692, stdlib\nsince 3.12, and this package targets 3.12). Required keys are the dataclass\nfields that have no default, so a missing one is a type error too. Unpacking the\nTypedDict into the dataclass call is what checks each key's *type* against the\nfield it lands on: the two declarations cannot disagree without failing the gate.\n\n**A field's owner is visible in what the TypedDict omits.** Four groups\npartition `RunResult`, and only the last is reachable through the constructor:\n\n| Group | Owner | Fields |\n| --- | --- | --- |\n| derived | `RunResult.folded` | `turns`, `usage`, `calls`, `subagents` |\n| priced | `RunResult.apply_cost` (0021) | `estimated_cost_usd`, `cost_status`, `cost_by_tier`, `rates_applied` |\n| attached | `pipeline.derive` after grading (0022, 0025) | `case`, `skill_coverage` |\n| supplied | the harness adapter, via `RunResultFields` | everything else |\n\n`tests/test_units.py` asserts those four groups tile the dataclass exactly. That\nis the one drift a type checker cannot see: a *new* field would be silently\nunreachable through `folded` rather than an error, and a stale key would fail\nfirst at a paid call site.\n\n## Consequences\n\nBoth adapters are unchanged — the calls they already wrote type-check as they\nare — and so is every serialised key. The characterization goldens are\nbyte-identical, which is the evidence that this is a declaration and not a\nchange.\n\n`__required_keys__` is not the checker's view at runtime: this package uses\n`from __future__ import annotations`, so `NotRequired` is never unwrapped and\nevery key reports as required. The partition test unions required with optional\nand says why, so the caveat is recorded where someone would otherwise \"fix\" it.\n\n## Lens\n\n`**kwargs: Any` on a constructor is a hole in the type system shaped exactly like\nthe constructor it is meant to protect. Declare the keywords as a TypedDict and\nunpack them; then the set of fields a caller may set — and, by omission, the ones\nthat belong to another owner — is checked rather than described.\n"}, "ADR-0037": {"file": "0037-the-emitted-records-are-types-and-the-cache-tree-has-one-owner.md", "title": "The emitted records are types, and the cache tree has one owner", "status": "accepted", "status_note": "accepted, 2026-08-28. Refines\n[0016](0016-results-travel-on-the-test-report.md) (results travel on the test\nreport), [0018](0018-fixtures-directory-and-metrics-history.md) (the metrics\nrecord), [0020](0020-captured-report-is-a-static-microsite.md) (the report is a\nstatic microsite), [0032](0032-all-run-output-consolidates-under-a-cache-dir.md)\n(all run output consolidates under a cache dir) and\n[0035](0035-the-nouns-carry-their-own-invariants.md) (the nouns carry their own\ninvariants). Structural only: no serialised key and no metric's value changes,\nand the characterization goldens are byte-identical.", "markdown": "# 0037: The emitted records are types, and the cache tree has one owner\n\nStatus: accepted, 2026-08-28. Refines\n[0016](0016-results-travel-on-the-test-report.md) (results travel on the test\nreport), [0018](0018-fixtures-directory-and-metrics-history.md) (the metrics\nrecord), [0020](0020-captured-report-is-a-static-microsite.md) (the report is a\nstatic microsite), [0032](0032-all-run-output-consolidates-under-a-cache-dir.md)\n(all run output consolidates under a cache dir) and\n[0035](0035-the-nouns-carry-their-own-invariants.md) (the nouns carry their own\ninvariants). Structural only: no serialised key and no metric's value changes,\nand the characterization goldens are byte-identical.\n\n## Context\n\n0035 and 0036 gave the run record and its parts real types. Everything the\nproduct *emits* was still a mapping assembled by hand:\n\n| Emitted document | How it was built | What that cost |\n| --- | --- | --- |\n| `history.json` (one per session) | `history.metrics_of`, a 41-key dict literal | no type, no key set, `.get()` at every reader |\n| `report/index.json` rows | `report._row`, a 35-key dict literal | the same, plus the row's derivation buried in it |\n| `report.json` cells | the same records, plus a *fourth* shape for `--dry-run` | five keys where readers expected 41 |\n\nThese are wire formats. `report-ui/src/lib/types.ts` mirrors them, the glossary\nnames them, and nothing in this repository failed when one drifted.\n\nThree further consequences of not having the types:\n\n- **`cache` was stamped on afterwards.** `pipeline.record_metrics` called\n  `history.metrics_of` and then wrote `record[\"cache\"] = str(cache)` onto the\n  mapping a different module had just built. The record's own definition did not\n  mention the field the controller depends on to find the cache root (0032).\n- **The dry-run record was a different document.** Five keys with the same\n  `verdict` field, written onto `report.json` beside full ones.\n- **A replay read `history.json` twice, by hand.** `replay.rebuild` and\n  `replay.case_meta` each opened it, each caught `JSONDecodeError`, and each\n  `.get()`-ed the keys it wanted.\n\nThe cache tree had the same problem one level down. The five-level layout of\n0032 is a published contract — the page fetches\n`../results/{skill}/{harness}/{model}/{run}/{session}/log.jsonl` by that exact\nshape — and it was spelled out in five modules:\n\n| Spelling | Where |\n| --- | --- |\n| `HISTORY_NAME` = `history.json` | `pipeline.py` |\n| `HISTORY_NAME` = `history.jsonl` | `report.py` — the same name, a different file |\n| `glob(\"*/*/*/*/*/result.json\")` | `report.cells`, `report.aggregate_history`, `replay.rebuild` |\n| `session_dir / \"log.jsonl\"` | both harness adapters and `report._row` |\n| `<cache>/results` | `Settings.results_root`, a third spelling |\n\n## Decision\n\n**The two emitted documents are types.** `metrics.CellMetrics` is the\n`history.json` record, with `status_word()` as a method on it and `cache` as a\ndeclared field; `report.IndexRow` is one `index.json` row, with the derivation\nfrom a stored `result.json` in its `of()` constructor. Both serialise through\n`asdict`, as `RunResult` does (0035), so the field names remain the wire format.\n`history.py` becomes `metrics.py`: it holds the record, not an append-only file.\n\n**The dict boundary is explicit and singular.** `TestReport.user_properties` is\nserialised by execnet, which handles builtins only (0016), so a dataclass there\nfails at runtime during a paid sweep and never at type-check time. The record is\ntherefore `to_dict()`-ed at the `pytest_runtest_makereport` hook and\n`from_dict()`-ed on the controller, and it is a type everywhere else. `from_dict`\ndrops unknown keys and defaults absent ones, which is also what makes a capture\nwritten by an older version readable rather than fatal.\n\n**A dry run emits the same document.** `CellMetrics.dry_run(node=, cell=)` builds\na full record with nothing measured and an empty `cache` — and empty `cache` is\nwhat already means \"combine nothing\", so a dry run still writes no evidence\n(0018).\n\n**The cache tree has one owner.** `layout.CacheLayout` is a value object over the\ncache root: `build/`, `results/`, `report/`, every file name under them, the\n`session(skill=, harness=, model=, run=, session=)` constructor and the\n`sessions()` walk. `layout.SessionDir` is one session's evidence directory and\naddresses its four members by property. `Settings.cache` *is* a `CacheLayout`,\nso no caller reassembles a path under it, and `SessionDir.at(path)` serves the\ncallers handed a directory rather than finding one — a replay, a harness adapter\nre-reading its own captured log.\n\n**The key sets are pinned by a test, against literal lists.** `tests/test_units.py`\nasserts the exact keys of `history.json` and of an `index.json` row against\nspelled-out lists, and `tests/test_plugin.py` asserts `report.json` is\n`{cells, total_usd}`. A field added, renamed or dropped without the matching edit\nto `types.ts` and the glossary fails the gate here, which is the only place in\nthis repository that could ever have caught it.\n\n`history.append` is deleted. It had no production caller after 0032 moved the\nmetrics record beside its evidence, and its only exercise was its own test.\n\n## Consequences\n\n`pricing` no longer imports `history` for a timestamp: `now_iso` moves to\n`normalise`, beside `ms_between`, with the other dialect-free primitives. That\nremoves the one edge from the pricing layer up into the metrics layer.\n\nReading a `history.json` that exists but is missing keys now yields `\"\"` and `0`\nwhere it yielded `None`. Only a hand-truncated or pre-0021 record reaches that\npath; a session with no record at all still indexes as `null`, which is the case\nthe tests pin.\n\n`report.py` keeps `INDEX_NAME`, `TOKENS_NAME` and `REPORT_DIR` in its namespace\n(re-exported from `layout` and listed in `__all__`) because\n`report-ui/scripts/inline.py` builds the page through them.\n\n## Lens\n\nA document a program emits is part of its interface, and an interface assembled\nas a dict literal has no definition anywhere — only the union of what its readers\nhappen to ask for. Give it a type, put the one serialisation boundary where the\ntransport actually requires it, and pin its key set against a list a human wrote.\nThen the same rule holds for the tree those documents live in: a path shape that\nappears in five modules is not a layout, it is five layouts that currently agree.\n"}, "ADR-0038": {"file": "0038-a-tolerant-reader-still-honours-its-declaration.md", "title": "A tolerant reader still honours its declaration", "status": "accepted", "status_note": "accepted, 2026-08-28. Refines\n[0032](0032-all-run-output-consolidates-under-a-cache-dir.md) (all run output\nconsolidates under a cache dir) and\n[0037](0037-the-emitted-records-are-types-and-the-cache-tree-has-one-owner.md)\n(the emitted records are types, and the cache tree has one owner). Structural\nonly: no serialised key and no metric's value changes, and the characterization\ngoldens are byte-identical.", "markdown": "# 0038: A tolerant reader still honours its declaration\n\nStatus: accepted, 2026-08-28. Refines\n[0032](0032-all-run-output-consolidates-under-a-cache-dir.md) (all run output\nconsolidates under a cache dir) and\n[0037](0037-the-emitted-records-are-types-and-the-cache-tree-has-one-owner.md)\n(the emitted records are types, and the cache tree has one owner). Structural\nonly: no serialised key and no metric's value changes, and the characterization\ngoldens are byte-identical.\n\n## Context\n\n0037 turned the two emitted documents into types and gave the cache tree one\nowner. Both of its boundary constructors were tolerant in a way that produced a\nvalue its own declaration did not describe.\n\n**`CellMetrics.from_dict` dropped unknown keys but kept mistyped ones.** It\nexisted so that a capture written by an older version reads as a partial record\nrather than as a failed rebuild, and absent keys correctly fell back to the\nfield defaults. A key that was *present and null* did not: `at: str = \"\"` could\nhold `None`. Before 0037 every reader spelled its own `str(r.get(\"at\") or \"\")`\nand tolerated that; afterwards the readers trusted the declaration, so the same\nstored record that used to sort last now aborted the whole combine step:\n\n| Reader | Before 0037 | After 0037, on `{\"at\": null}` |\n| --- | --- | --- |\n| `report.aggregate_history` | `sorted(key=str(r.get(\"at\") or \"\"))` | `TypeError: '<' not supported between 'str' and 'NoneType'` |\n| `replay.migrate_legacy` | `_run_ts_of(str(hist.get(\"at\") or \"\"))` → `00000000T000000Z` | `AttributeError` on `None` |\n\nA type that promises to survive a foreign document, and a test named for that\npromise, must not turn a tolerated document into a crash one layer up.\n\n**`SessionDir` made an illegal state representable.** One type carried both a\npath and the five coordinates of `results/{skill}/{harness}/{model}/{run}/{session}`,\nwith the coordinates defaulting to `\"\"` for the callers handed a directory\nrather than finding one (a replay, a harness adapter re-reading its own log).\nThose callers could still ask for the published key and the published link, and\ngot `\"////sid\"` and `\"../results/////sid/log.jsonl\"` back — no error, a garbage\nURL on the report page. Both constructors were documented as ordinary usage and\nthe type is public, so \"no caller does that today\" was not an invariant.\n\n## Decision\n\n**A value that does not match its field's declared type is dropped, exactly as\nan unknown key is.** `CellMetrics.from_dict` resolves what each field admits\nonce, from the field annotations themselves (`int | None` → `(int, NoneType)`),\nand keeps a stored value only when it is one of them; anything else leaves the\nfield at its default. JSON's single number type is the one widening: an `int`\nwhere a `float` is declared is read as a float. The defaults story now covers\n*present-but-null* as well as absent, which is what makes the declaration true\nfor every reader downstream — including the two above, which stay written as if\nthe type were honest, because it is.\n\n**The two ways to hold a session directory are two types.** `layout.SessionDir`\nis a directory addressed by path: `log.jsonl`, `result.json`, `history.json`,\n`subagents/` and `mkdir()`, and no report link, because a bare path does not\nknow where it sits in a cache. `layout.LocatedSession` extends it with the five\ncoordinates and *therefore* with `rel` and `report_link()`. Only `CacheLayout`\nbuilds one — `session(...)` is handed the coordinates, `sessions()` reads them\noff the walk — so a located session always has all five, and the empty-string\ncoordinate is gone rather than merely undocumented. `report.IndexRow.of` takes\na `LocatedSession`, which is now checked rather than hoped for; `pipeline`, the\nharness adapters and `replay.rebuild_result` take the narrow type.\n\nBoth rules are pinned: a `\"at\": null` record in the metrics-record test, in the\nreport's tolerance test and in the legacy-migration test, and the absence of the\nlink surface on the narrow type in the layout test.\n\n## Consequences\n\n`SessionDir.at(path)` is gone; the type has one field, so `SessionDir(path)` is\nthe constructor. 0037 named `at` as the entry point for a caller handed a\ndirectory — that caller now names the type itself, and cannot reach the link\nsurface at all.\n\nReading a `history.json` whose value is null yields the same `\"\"` and `0` that a\nmissing key yields (0037's consequence, now extended to nulls). A record with no\n`at` at all still sorts first and still stamps `00000000T000000Z`.\n\n## Lens\n\nTolerance at a boundary is a promise to the callers *inside* it: whatever the\ndocument says, what comes out is what the type declares. A reader that forgives\nan unknown key but forwards a `None` into a field typed `str` has not been\ntolerant, it has moved the failure somewhere the document is no longer in hand.\nThe same rule shapes the types themselves — a field that is optional only because\none constructor cannot fill it is two types wearing one name, and the empty\ndefault is the bug waiting for a caller.\n"}, "ADR-0039": {"file": "0039-the-package-listing-is-the-architecture.md", "title": "The package listing is the architecture", "status": "accepted", "status_note": "accepted, 2026-08-28. Refines\n[0014](0014-register-through-the-pytest11-entry-point.md) (register through the\npytest11 entry point),\n[0027](0027-coverage-follows-the-shells-working-directory.md) (coverage follows\nthe shell's working directory),\n[0034](0034-a-harness-is-a-class-and-the-registry-is-the-only-dispatch.md) (a\nharness is a class and the registry is the only dispatch) and\n[0037](0037-the-emitted-records-are-types-and-the-cache-tree-has-one-owner.md)\n(the emitted records are types). Structural only: no serialised key, no ini key,\nno CLI option and no metric's value changes, and the characterization goldens are\nbyte-identical.", "markdown": "# 0039: The package listing is the architecture\n\nStatus: accepted, 2026-08-28. Refines\n[0014](0014-register-through-the-pytest11-entry-point.md) (register through the\npytest11 entry point),\n[0027](0027-coverage-follows-the-shells-working-directory.md) (coverage follows\nthe shell's working directory),\n[0034](0034-a-harness-is-a-class-and-the-registry-is-the-only-dispatch.md) (a\nharness is a class and the registry is the only dispatch) and\n[0037](0037-the-emitted-records-are-types-and-the-cache-tree-has-one-owner.md)\n(the emitted records are types). Structural only: no serialised key, no ini key,\nno CLI option and no metric's value changes, and the characterization goldens are\nbyte-identical.\n\n## Context\n\nTwenty modules sat flat in `src/pytest_xharness_eval/`, in one alphabetical list,\nafter 0034 pulled `harness/` out of it. A reader opening the package could not\ntell from the listing that `case.py` is a declaration a user writes, `codex.py`\nfolds a foreign log, `pricing.py` is arithmetic over a folded one, `report.py`\npublishes, and `plugin.py` drives all four — they are the same size, at the same\nlevel, in the same column. The listing named the parts and said nothing about\nthe shape, which is the complaint this refactoring campaign opened with.\n\nFlatness is not only a reading problem: with no declared direction, three\nimports had quietly turned upside down, and nothing failed when they did.\n\n| Inversion | What it meant |\n| --- | --- |\n| `pricing` → `normalise.now_iso`, `report` → `normalise.now_iso` | Pricing an estimate and stamping an index both depended on the *harness dialect toolkit* for a wall clock. |\n| `skillcov.annotate` → `harness.get(result.harness)` | A derivation reached into the adapter registry mid-walk, so annotating a ledger — pure arithmetic — could not be done for a result whose harness nobody had registered. |\n| `matrix` → `harness` | Deliberate and correct (the `--harness` choices must be whatever is registered, 0034), but indistinguishable from the other two. |\n\nTwo names in the package are resolved by *importlib*, not by Python code, and\nthey bound any re-layering: `pytest_xharness_eval.plugin` is the `pytest11`\nentry point (0014) and `pytest_xharness_eval.replay` is what\n`uv run -m pytest_xharness_eval.replay` executes. Verified: a package with no\n`__main__.py` fails `-m` outright, and an attribute re-exported from a parent\n`__init__` does not satisfy importlib for either — only a real module does.\n\n## Decision\n\n**The layers are folders, and the folder listing is the dependency order.**\n\n```text\npytest_xharness_eval/\n    plugin.py     the pytest11 entry point (0014)\n    replay.py     the `python -m` entry point (0023, 0032)\n    model/        the nouns: run, case, cell, workspace, cache tree, clock\n    harness/      one adapter class per agent CLI, and the toolkit they fold with\n    derive/       what a folded run cost, and which of the skill it reached\n    emit/         the documents that leave: the metrics record and the microsite\n    runtime/      how a sweep is wired: settings, and the steps after the CLI returns\n```\n\nEach layer depends only on the ones above it in that list, entry points last.\nThe two entry-point modules stay real modules at the root because importlib\nresolves them, and that placement narrates too: what the outside world calls at\nthe top, the layers it calls through underneath.\n\n**Each `__init__` declares its layer's surface.** A layer's `__init__` is the\none place its public names are listed, and reading five of them is reading the\narchitecture. Submodules still import each other by full dotted path\n(`from pytest_xharness_eval.derive import pricing`), never through a layer's\n`__init__`: importing the matrix reaches the harness registry, so a name bound\nin an `__init__` is not yet available to everything that loads during it.\n\n**The three inversions are resolved, not merely noted.** `now_iso` and\n`ms_between` are `model/clock.py`, a leaf that depends on nothing, so pricing and\nthe report stop naming the adapter toolkit for a timestamp; the tolerant reader\nfor this package's own stored documents is `model/documents.py` for the same\nreason. `skillcov.annotate` takes the harness's shell vocabulary as an optional\nfourth argument — a `model.registry.Shells` value of the tool names that run a\nshell and the ones that keep their cwd (0027) — so annotating a ledger is\narithmetic over a value it was handed. And the one edge that must point up,\nbecause the registry is the only dispatch (0034), is now a single module that\nsays so: `model/registry.py` answers \"which harnesses exist\" and \"what is this\none's shell vocabulary\", and it is the only module below `harness/` that names\n`harness`. `annotate` still resolves through it when the argument is omitted,\nwhich is what the pipeline and the pinned characterization call.\n\n**A fourth inversion fails the build.** The ruff `TID251` rule that has kept\nprovider modules unreachable since 0034 is joined by three more: nothing may name\n`pytest_xharness_eval.harness`, `.emit` or `.runtime` except the layers above it,\nand the exceptions are the per-file-ignore list in `pyproject.toml` — the two\nentry points, each layer itself, `model/registry.py`, and the tests.\n\n**`report.py` becomes the layer it always was.** It held four jobs at once: the\n`index.json` row type, the design-tokens reader, the page assembly, and the\ncombine step. They are `emit/index.py`, `emit/tokens.py` and `emit/page.py`\nbeside `emit/metrics.py`, which is the same split the microsite already has on\ndisk. `pytest_xharness_eval.emit` is re-exported from the root package as\n`report`, which is the name `report-ui/scripts/inline.py` builds a page through.\n\n## Consequences\n\n`import pytest_xharness_eval.pricing` — the dotted form — stops resolving for an\noutside caller. The from-import form `from pytest_xharness_eval import pricing`\nstill does, and so do `normalise`, `records`, `skillcov` and `report`: they are\nre-exported from the root `__init__` in `as` form (mypy's `no_implicit_reexport`\nrequires it) and listed in `__all__` as the declared public API. Every internal\ncaller and both test modules use the from-import form, and the pinned\ncharacterization test imports exactly that way, unchanged.\n\nThe bundled `prices.toml` moves to `derive/prices.toml`, beside the only module\nthat reads it. 0014's rule is unchanged: it is still the one path derived from\n`__file__`, and `pricing.py` still spells it `Path(__file__).parent`.\n\n`model/` is where `layout.py` and `workspace.py` live, not `runtime/`. Both are\nvalue-level — one names paths under a cache, the other copies a fixture tree and\nhashes it — and both are used *by* the harness adapters, so putting them in the\ntop layer would have made the adapter layer import the top layer and left the\n`runtime` ban with a hole big enough to walk through.\n\nOne edge points up that the rules cannot express: `model/runresult.py` names\n`derive.pricing` and `derive.skillcov` under `TYPE_CHECKING`, to declare the two\nderived documents a result carries. It is annotations only, so there is no\nruntime dependency and no cycle, and it is the reason `derive` is not in the ban\nlist — a rule with a documented exception in the file it exists to constrain is\nworse than no rule.\n\n## Lens\n\nA package listing is the first documentation anyone reads and the only one that\ncannot go stale. When it is a flat alphabetical column, every module claims equal\nstanding and the reader learns nothing; when the folders are the layers, the\nquestion \"may this import that?\" has an answer before the import is written — and\nthe answer can be checked by a linter rather than by whoever reviews the diff.\nThe names that resolve outside the language, though, are load-bearing in a way no\nlayering may break: an entry point is a contract with a tool that does not read\nyour architecture, and it stays a real module at the root no matter how the rest\nis arranged.\n"}, "ADR-0040": {"file": "0040-the-plugin-is-a-hook-manifest.md", "title": "The plugin is a hook manifest, and each job behind it is a module", "status": "accepted", "status_note": "accepted, 2026-08-28. Refines\n[0008](0008-evals-are-eval-prefixed-modules.md) (evals are `eval_*.py` modules),\n[0014](0014-register-through-the-pytest11-entry-point.md) (register through the\npytest11 entry point),\n[0016](0016-results-travel-on-the-test-report.md) (results travel on the test\nreport),\n[0032](0032-all-run-output-consolidates-under-a-cache-dir.md) (all run output\nconsolidates under a cache dir),\n[0037](0037-the-emitted-records-are-types-and-the-cache-tree-has-one-owner.md)\n(the emitted records are types) and\n[0039](0039-the-package-listing-is-the-architecture.md) (the package listing is\nthe architecture). Its placement of `Verdict` in `plugin/verdict.py`, and the\nexports its manifest widened to, are superseded by\n[0041](0041-the-vocabulary-is-a-domain-noun-and-the-manifest-is-a-manifest.md).\nStructural only: no serialised key, no ini key, no CLI option\nand no metric's value changes; every hook keeps its name and its signature, and\nthe characterization goldens are byte-identical.", "markdown": "# 0040: The plugin is a hook manifest, and each job behind it is a module\n\nStatus: accepted, 2026-08-28. Refines\n[0008](0008-evals-are-eval-prefixed-modules.md) (evals are `eval_*.py` modules),\n[0014](0014-register-through-the-pytest11-entry-point.md) (register through the\npytest11 entry point),\n[0016](0016-results-travel-on-the-test-report.md) (results travel on the test\nreport),\n[0032](0032-all-run-output-consolidates-under-a-cache-dir.md) (all run output\nconsolidates under a cache dir),\n[0037](0037-the-emitted-records-are-types-and-the-cache-tree-has-one-owner.md)\n(the emitted records are types) and\n[0039](0039-the-package-listing-is-the-architecture.md) (the package listing is\nthe architecture). Its placement of `Verdict` in `plugin/verdict.py`, and the\nexports its manifest widened to, are superseded by\n[0041](0041-the-vocabulary-is-a-domain-noun-and-the-manifest-is-a-manifest.md).\nStructural only: no serialised key, no ini key, no CLI option\nand no metric's value changes; every hook keeps its name and its signature, and\nthe characterization goldens are byte-identical.\n\n## Context\n\n0039 turned the layers into folders and left the two entry points at the root,\nwhere importlib resolves them. `plugin.py` was then the last module in the\npackage doing five unrelated jobs at once, at 478 lines: it registered the\noptions and ini keys, decided what pytest collects, ran a cell end to end,\ncarried the record across the xdist boundary, and wrote `report.json` and the\ncombine step. Three consequences, none of them stylistic:\n\n| Symptom | What it cost |\n| --- | --- |\n| Two serialised contracts authored inside pytest hooks | `report.json` was a dict literal in `pytest_terminal_summary`. 0037 gave every other emitted document a type; this one had no definition to point a reader (or `report-ui/src/lib/types.ts`) at. |\n| One `# pragma: no cover` over the whole per-cell sequence | `_run_live` was forty lines of which *one* spends money. Materialise, derive, capture, grade and record were excluded from coverage along with the spawn, so the ordering a replay is pinned against could not be exercised at all without paying. |\n| The suite loader written twice | `plugin._load_module` and `replay._load_suite` were the same eight lines of `spec_from_file_location`, differing in whether the module was registered in `sys.modules` while it executed — a difference nobody had decided. \"Find the `EvalCase` called X\" was written twice as well. |\n\nThe last one is the drift class 0034 removed for the settings and 0037 for the\ncache tree: two implementations of one idea, each correct, neither aware of the\nother.\n\n## Decision\n\n**`plugin` is a package whose `__init__` is a manifest.** Pluggy discovers a hook\nas an attribute of the imported plugin module and importlib resolves\n`pytest_xharness_eval.plugin` to the package, so the `pytest11` entry point of\n0014 is unchanged and every hook is re-exported by name from `__init__`:\n\n```text\nplugin/\n    __init__.py   the hook manifest: seven hooks, bound to the modules below\n    options.py    every option and ini key, configure-time validation, the header\n    collect.py    the collection rule, EvalFile, EvalItem\n    cell.py       CellRun: the seven steps of one live cell, and the run stamp\n    verdict.py    Verdict: the words a cell may grade to\n    results.py    the record's one crossing to the controller, and its status word\n    summary.py    the terminal table, report.json, and the combine step\n```\n\n**The paid step is one method, and the pragma stops there.** `CellRun` is the\ncell's run as a small state machine: `materialise`, `invoke`, `store`, `grade`,\n`record`, and an `execute` that sequences them and leaves the record in the\nitem's stash whether the grader passed or raised. Only `invoke` — and the\nfive-line `execute` that calls it — carries `# pragma: no cover`; every other\nstep is now exercised from captured logs in `tests/test_units.py`. Nothing is\nmocked to achieve that, which is the constraint 0002 actually imposes: the\nworkspace is really copied, the grader really runs, the record is really written,\nand no CLI is spawned.\n\n**`report.json` is a type.** `emit/summary.py` holds `RunSummary`: the graded\ncells and `total_usd`, plus `cache_roots()` — the roots this session wrote\nevidence into, which is the one place the combine step's trigger is decided and\nthe reason a dry run stays free (0018, 0032). The hook decides *when* to write;\nthe type decides *what* the file is.\n\n**One `EvalSuite` loads every suite, for both entry points.** `model/suite.py`\nimports an `eval_*.py` by path under a name derived from that path, registering\nit in `sys.modules` before executing it, and answers `cases` and\n`case_named(name)`. Collection asks it for every case; a replay asks\n`find_case(evals_dir, name)`, which skips an unimportable suite with a warning so\none broken file cannot stop the others being rebuilt (0023).\n\n**The pre-0032 migration is its own module.** `runtime/legacy.py` holds\n`LegacyCapture`, built only by `found_at`, which recognises a legacy\n`captured/` directory by shape and returns `None` for anything else — so a\nmigration cannot be started against a cache root, and the entry point has no\n\"is it legacy?\" question left to ask twice. It is transitional code with a known\nend, and it is now deletable in one file. `replay.py` keeps the rebuild and the\ncommand line that drives it, and `main` takes its `argv` so the entry point can\nbe exercised without touching the process.\n\n## Consequences\n\n`from pytest_xharness_eval.plugin import EvalItem` still resolves — a consuming\nrepository's `conftest.py` uses it to inspect collected cells — as do\n`PROPERTY`, `RESULTS_KEY` and `RECORD_KEY`. What changes is that\n`pytest_xharness_eval.plugin` is now a package: `plugin.py` no longer exists as a\nfile, and the per-file-ignore that exempts the entry points from 0039's layer\nrules is `plugin/*`.\n\nCoverage of the plugin's own code went from 89% to 93–100% per module, not\nbecause tests were added around the old shape but because the shape stopped\nhiding six free steps behind one paid one.\n\n`Verdict` is a `StrEnum`, and its `.value` — never the member — is what reaches an\n`Outcome`. The record it becomes crosses to the xdist controller through execnet,\nwhich serialises builtins only (0016), and a test pins that the stored verdict is\na plain `str`.\n\nOne thing deliberately did *not* move: the `run_*` functions that spawn each CLI\nstay module-level in their adapters. Relocating uncovered paid code buys style\nand costs an unverifiable diff.\n\n## Lens\n\nA plugin's entry-point module is a manifest, not a place to work. Every job it\naccumulates is a job with no name, no test seam and no type — and the two most\nexpensive symptoms are always the same: a serialised format authored inside a\nhook, where no reader can find its definition, and a `pragma: no cover` drawn\naround a whole sequence because one line of it is expensive. Push the expensive\nline down until the pragma fits it exactly; what is left above is free, ordinary\ncode that can be tested like any other.\n"}, "ADR-0041": {"file": "0041-the-vocabulary-is-a-domain-noun-and-the-manifest-is-a-manifest.md", "title": "A shared vocabulary is a domain noun, and a manifest exports nothing of its own", "status": "accepted", "status_note": "accepted, 2026-08-28. Refines\n[0016](0016-results-travel-on-the-test-report.md) (results travel on the test\nreport),\n[0037](0037-the-emitted-records-are-types-and-the-cache-tree-has-one-owner.md)\n(the emitted records are types),\n[0038](0038-a-tolerant-reader-still-honours-its-declaration.md) (a tolerant\nreader still honours its declaration),\n[0039](0039-the-package-listing-is-the-architecture.md) (the package listing is\nthe architecture) and\n[0040](0040-the-plugin-is-a-hook-manifest.md) (the plugin is a hook manifest).\n**Supersedes 0040's placement of `Verdict` in `plugin/verdict.py`, and the\njustification given there for it.** Structural only: no serialised key, no ini\nkey, no CLI option and no metric's value changes; every hook keeps its name and\nits signature, and the characterization goldens are byte-identical.", "markdown": "# 0041: A shared vocabulary is a domain noun, and a manifest exports nothing of its own\n\nStatus: accepted, 2026-08-28. Refines\n[0016](0016-results-travel-on-the-test-report.md) (results travel on the test\nreport),\n[0037](0037-the-emitted-records-are-types-and-the-cache-tree-has-one-owner.md)\n(the emitted records are types),\n[0038](0038-a-tolerant-reader-still-honours-its-declaration.md) (a tolerant\nreader still honours its declaration),\n[0039](0039-the-package-listing-is-the-architecture.md) (the package listing is\nthe architecture) and\n[0040](0040-the-plugin-is-a-hook-manifest.md) (the plugin is a hook manifest).\n**Supersedes 0040's placement of `Verdict` in `plugin/verdict.py`, and the\njustification given there for it.** Structural only: no serialised key, no ini\nkey, no CLI option and no metric's value changes; every hook keeps its name and\nits signature, and the characterization goldens are byte-identical.\n\n## Context\n\n0040 introduced `Verdict` — `pass`, `fail`, `error`, `dry-run` — and put it in\n`plugin/verdict.py`, claiming a vocabulary the whole package shares. It was\nneither, for three reasons that only show up when the layer rule of 0039 is taken\nseriously:\n\n| Symptom | What it cost |\n| --- | --- |\n| `plugin/` is the entry-point layer, above every other | `emit/` structurally *cannot* import from it — the ruff `TID251` rule fails the build. So `CellMetrics.dry_run`, the only producer of the fourth word, still wrote the bare literal `verdict=\"dry-run\"`. The vocabulary was duplicated, not centralised. |\n| The enum typed no field | `Outcome.verdict`, `CellMetrics.verdict` and `IndexRow.verdict` were all `str`. An enum that nothing is declared as is a naming convention with a class statement around it. |\n| The module's own docstring was untrue | It said the two ends of a cell's life \"neither may import the other\", but `plugin/cell.py` imports `plugin/results.py` directly. A docstring that states a false constraint is worse than no docstring: the next reader preserves a shape for a reason that does not exist. |\n\nThe repository already had the right answer in it. `CostStatus` — `priced` or\n`unpriced`, with no third state — lives in `model/runresult.py`, beside\n`cost_status: CostStatus`, the field it types.\n\n0040 also widened the manifest it had just declared to be \"a manifest and nothing\nelse\": `__init__` re-exported `CellRun`, `Attempt`, `run_stamp`, `Verdict` and a\n`_ResultCollector` renamed public on the way out. None of those is named by\n0040's own compatibility list, and every one of them is API the moment it is\nexported.\n\n## Decision\n\n**A word two layers share is a domain noun.** `Verdict` moves to\n`model/verdict.py`, the bottom layer, which every layer above may name. Its\nproducers then all use it: `plugin/cell.py` decides one, `emit/metrics.py`\nrecords it — `CellMetrics.dry_run` included, which is why the move is what\nremoves the literal rather than a lint that forbids it.\n\n**The vocabulary types the observation, and the wire keeps the word.**\n`Outcome.verdict` is declared `Verdict | None`. The `.value` — never the member —\nis what reaches `CellMetrics.verdict`, which stays `str`: that record crosses to\nthe xdist controller through execnet, which serialises builtins only (0016), and\na `StrEnum` member is not a builtin. Typing the *record* field would have shipped\na member over that wire.\n\n**A stored word that names no member is no verdict, not a fabricated one.**\n`Verdict.stored(word)` returns `None` for anything outside the four, which is\nwhat `CellMetrics.outcome` reads a replayed record back through. A capture\nwritten before the field existed, or truncated by hand, carries its empty verdict\nforward exactly as it did before; the alternative — mapping the unknown onto\n`error` — would have a rebuild assert a grade the run was never given, and 0038's\ntolerance is about degrading to the default, never about inventing a value.\n\n**A manifest exports the hooks and the compatibility surface, and nothing else.**\n`plugin/__init__` binds the seven `pytest_*` hooks pluggy discovers as attributes\nof the imported module, plus the four names a consuming repository's\n`conftest.py` already reaches for: `EvalFile`, `EvalItem`, `PROPERTY`,\n`RESULTS_KEY`, `RECORD_KEY`. Internals stay addressable where they are\nimplemented — `plugin.cell.CellRun`, `plugin.results.ResultCollector` — which is\nwhere the tests already reach them.\n\n## Consequences\n\n`tests/test_units.py` gains a fitness function over the manifest: the bound hooks\nare exactly the hooks the package implements (a hook not bound here silently\nstops firing), the rest of `__all__` is exactly the compatibility surface, and\nthe `pytest11` entry point still names `pytest_xharness_eval.plugin`. A new hook\nthat is implemented and not bound now fails the suite instead of the next sweep.\n\n`from pytest_xharness_eval.plugin import Verdict` no longer resolves; the import\nis `from pytest_xharness_eval.model.verdict import Verdict`, or\n`pytest_xharness_eval.model`. The name was one commit old and unreleased.\n\n## Lens\n\nTwo questions decide where a shared na
