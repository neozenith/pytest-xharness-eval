 never collide.\n\n**Only whole-system suites sit at the top level,** and each is named with its reason:\n- the pytester sessions that run the installed plugin end to end\n- the characterization suite that pins the pipeline's output\n- the shape gate itself\n\n**Shared setup has one home.** A builder used by one test module lives in it.\nA builder several modules share lives in `tests/support.py`, and a shared fixture in a `conftest.py`.\nHelper modules are an explicit, short list.\n\n**A test module has a budget.** No test module exceeds 500 lines.\nA module that grows past it is testing more than one thing, or repeating a block that belongs in a builder or a `parametrize`.\n\n**The shape is a test.** `tests/test_suite_shape.py` fails the build when:\n- a test module mirrors no source module\n- one outgrows the budget\n- one has no docstring naming its subject\n- an exception outlives its suite\n\nThe rules are data in that file, so an exception is a reviewed line with its reason beside it.\n\n## Consequences\n\n`tests/test_units.py` and `tests/test_verify.py` are gone, split into the modules that mirror their subjects.\nThe split moved every definition verbatim and the collected test IDs did not change.\nReferences in docstrings and `AGENTS.md` point at the mirrored modules.\nAccepted ADRs that name `tests/test_units.py` describe the suite as it was when they were written.\nThe tests they cite are now beside the module each one names.\n\nAdding a module to the package now implies where its tests go.\nAdding a test somewhere else fails the build until it moves or its exception is written down.\n\n## Lens\n\nA test suite is documentation of the system's structure, so it should have the same structure.\nWhen finding a module's tests means searching a file, the suite has stopped describing the system.\nIt has started describing the order its tests were written in.\n"}, "ADR-0054": {"file": "0054-decision-records-pass-the-prose-gates.md", "title": "Decision records pass the prose gates, and their shape may change while their argument does not", "status": "accepted", "status_note": "accepted, 2026-09-29.\nRefines [0047](0047-adrs-are-authored-as-data-and-their-markdown-is-generated.md) (ADRs are authored as data), whose argument still travels verbatim in substance.\nThe words of an accepted record may now be reshaped to pass the prose gates, with every claim unchanged.\nEnforced by `make adrs-prose` in CI.", "markdown": "# 0054: Decision records pass the prose gates, and their shape may change while their argument does not\n\nStatus: accepted, 2026-09-29.\nRefines [0047](0047-adrs-are-authored-as-data-and-their-markdown-is-generated.md) (ADRs are authored as data), whose argument still travels verbatim in substance.\nThe words of an accepted record may now be reshaped to pass the prose gates, with every claim unchanged.\nEnforced by `make adrs-prose` in CI.\n\n## Context\n\nThe prose gates (`@jpeakai/prose-gates`) check the mechanical subset of the repository's writing standard.\nThey flag mid-sentence line wraps, sentences over 25 words, em-dashes and lists disguised as prose.\nThe decision records had never been checked.\nTheir generated markdown carried 2,408 findings across 54 files.\n\nTwo rules stood in the way of fixing them.\n`AGENTS.md` said an accepted record is never edited.\nADR 0047 said a record's argument travels verbatim from its authored `.yml` to its generated `.md`.\nBoth rules exist so a decision cannot be quietly rewritten after it was taken.\nNeither was written to protect a line break or a 40-word sentence.\n\n## Decision\n\n**Every generated record passes the prose gates.** `make adrs-prose` regenerates the markdown and runs the gate, pinned to an exact version, over `docs/adrs/*.md`.\nCI runs it beside `make adrs-check`, so a record that fails either gate fails the build.\n\n**A finding is fixed in the `.yml`, never the `.md`.** The markdown is generated, so a fix made there is overwritten on the next `make adrs`.\nThe renderer's templates are fixed the same way, in `docs/adrs/templates/`.\n\n**Shape may change; the argument may not.** An accepted record's words may be reflowed to one sentence per line.\nA long sentence may be split into shorter ones.\nAn em-dash may become a comma, colon, parenthesis or full stop.\nA list written as prose may become a bullet list.\nNo claim, number, date, name, code span, link or ADR reference changes.\nA verbatim quotation of an outside source is split around, never inside.\n\n**Anything beyond shape is still a new record.** Changing what a decision says, why, or with what consequence remains a superseding ADR.\nThe status-line cross-link remains the only other edit an accepted record takes.\n\n## Consequences\n\nThe first pass reshaped every record.\nThe pinned gate's own safe fixes handled the line wraps and most em-dashes.\nThe long sentences were split by hand, shape only, and checked field by field.\n\nA record now reads the way the rest of the documentation does.\nA reviewer of a shape-only change checks one thing: that no claim moved.\n`AGENTS.md` now forbids changing an accepted record's argument, instead of forbidding any edit.\n\n## Lens\n\nA record is kept for its argument, not its line breaks.\nHold the claims fixed and let the shape meet the standard every other document meets.\n"}, "ADR-0055": {"file": "0055-treatment-is-an-opt-in-axis-layered-over-the-fixture.md", "title": "Treatment is an opt-in axis layered over the fixture, and every treatment is swept beside its control", "status": "accepted", "status_note": "accepted, 2026-10-02.\nRefines:\n\n- [0004](0004-workspace-is-a-plain-copy.md) (a workspace is a plain copy of the fixture tree) with overlays copied over the copy\n- [0018](0018-fixtures-directory-and-metrics-history.md) (fixtures live under `evals/fixtures/`) with a sibling `evals/treatments/`\n- [0049](0049-effort-is-the-third-matrix-axis.md) (effort is the third matrix axis) with a fourth axis that rides the same directory level\n\nExtends [0007](0007-unpriced-model-aborts-before-spend.md)'s stop-before-spend rule to the new axis.\nAdditive:\n\n- `result.json` gains `treatment`\n- `history.json` gains `treatment`\n- `report/index.json` gains `treatment`\n\nEvery existing capture still walks, links and replays unchanged.", "markdown": "# 0055: Treatment is an opt-in axis layered over the fixture, and every treatment is swept beside its control\n\nStatus: accepted, 2026-10-02.\nRefines:\n\n- [0004](0004-workspace-is-a-plain-copy.md) (a workspace is a plain copy of the fixture tree) with overlays copied over the copy\n- [0018](0018-fixtures-directory-and-metrics-history.md) (fixtures live under `evals/fixtures/`) with a sibling `evals/treatments/`\n- [0049](0049-effort-is-the-third-matrix-axis.md) (effort is the third matrix axis) with a fourth axis that rides the same directory level\n\nExtends [0007](0007-unpriced-model-aborts-before-spend.md)'s stop-before-spend rule to the new axis.\nAdditive:\n\n- `result.json` gains `treatment`\n- `history.json` gains `treatment`\n- `report/index.json` gains `treatment`\n\nEvery existing capture still walks, links and replays unchanged.\n\n## Context\n\nA fixture is all or nothing.\nIt is the seed workspace a case starts from.\nA case that wanted to try one change to the agent's standing instructions had to copy the whole fixture under a new name.\nIt then became a second case, graded and reported apart from the first.\nThe question a team actually asks is narrower.\nDoes adding this `AGENTS.md`, or this hook, change what the same cell costs and how well it does?\nThat is a comparison, and the matrix had no axis to make it on.\n\nThe obstacle is that neither CLI reads an instruction file the same way, and one of them reads none under the plugin's isolation.\nVerified against the installed versions (claude 2.1.287, codex-cli 0.160.0), with a workspace holding a `CLAUDE.md` and an `AGENTS.md` that each named a different codeword:\n\n- `claude --setting-sources \"\"`, the plugin's lever since ADR 0002, loads no `CLAUDE.md` at all, the workspace's included.\n- `claude --setting-sources project` loads the workspace's, and also the user's `~/.claude/CLAUDE.md` and every ancestor directory's.\n  A workspace under a consuming repository therefore inherits that repository's instructions and its owner's.\n- `claude --add-dir <workspace>` with `CLAUDE_CODE_ADDITIONAL_DIRECTORIES_CLAUDE_MD=1` loads the workspace's `CLAUDE.md` alone, and follows its `@AGENTS.md` import.\n- `codex exec` reads `AGENTS.md` from its working directory, and under a private `CODEX_HOME` reads no user-level file.\n\nSo an overlay that only drops an `AGENTS.md` into the workspace would change codex and silently change nothing on claude.\nThat is a full-priced run reporting a treatment it never had, which is ADR 0049's failure arriving through a different door.\n\n## Decision\n\n**A treatment is a named directory copied over the fixture, and it lives beside the fixtures.** `evals/treatments/<name>/` holds the files every harness gets.\n`evals/treatments/<name>__<harness>/` holds files that harness also gets, copied last, so a dialect file wins at a shared path.\nA portable instruction treatment is therefore an `AGENTS.md` in the first, and a one-line `CLAUDE.md` reading `@AGENTS.md` in `<name>__claude/`.\nThe treatments live in their own directory rather than under `evals/fixtures/` so that no treatment name can collide with a fixture name.\n\n**The axis is opt-in, and its default is empty.** A case names its treatments with `@evalcase(treatments=[...])`, and a project may name them for every case with the `xharness_treatments` ini key.\nThe case wins, as it does for the matrix (ADR 0015).\nUnlike the matrix there is no plugin default, because a treatment is a directory a project writes.\nA case that names none sweeps exactly the cells it swept before this record.\n\n**The untreated cell is the *control*, and it is always swept beside its treatments.** `matrix.treat` crosses every expanded cell with `(None, *treatments)`, control first.\nA treatment measured alone is a number with nothing to compare it to.\nSo the control is not something a case can forget to ask for.\n`control` is a reserved word: it names the untreated cell in `--treatment` and on the report, and no treatment directory may take it.\n\n**A bad treatment stops collection before anything is spent.** A name must be lowercase words joined by a single `_` or `-`, so it reads like the fixture beside it.\nIt carries no separator that a node id, a directory level or a URL already uses.\nA treatment with no directory for some harness the case is about to sweep is refused, with the case and the harness named.\nIts cell on that harness would be the control under a second name.\n\n**A treatment's files are seeded, not written.** The workspace is the fixture, then each overlay in order (ADR 0004 stays a plain copy, now of a stack).\n`CaseOutput.seeded` counts every layer, so a grader asserting that no file was added does not mistake the agent's instructions for its output.\n\n**Claude reads the workspace's own `CLAUDE.md`, and nothing above it.** The claude harness adds the workspace with `--add-dir` and sets `CLAUDE_CODE_ADDITIONAL_DIRECTORIES_CLAUDE_MD=1` on every cell, treated or not.\n`--setting-sources \"\"` stays, so the user's and the ancestors' files remain excluded.\nThat makes the two harnesses symmetric for the first time: codex already read its workspace's `AGENTS.md`, and claude now reads its workspace's `CLAUDE.md`.\n\n**Treatment is a coordinate but not a level.** It rides the model's directory level after the rung, as `{model}[--{effort}][+{treatment}]`, owned by `model/layout.py` (ADR 0037).\nThe cell id gains the same suffix, `harness/model[/effort][+treatment]`.\nA level or an id with no `+` is the control, which is what every capture written before this record holds.\n\n**The treatment is attached by the derivation pipeline, not folded by a harness.** A session log shows what the agent read, never which overlay put it there.\n`RunResult.treatment` is set by `runtime/pipeline.py` from the cell, and carried forward from the stored result on a replay, exactly as `effort` is (ADR 0049).\n\n## Consequences\n\nThree emitted documents gain one key each: `result.json`, `history.json` and `report/index.json` all carry `treatment` (null or empty for the control).\nIt is mirrored in `report-ui/src/lib/types.ts` and the shipped glossary.\nThe characterization goldens move by that key alone, `\"treatment\": null`, and no measured value in them changes.\nThat is the evidence that this adds a coordinate rather than redistributing one.\n\nThe report groups a control and its treated twin as two rows of the same case and model.\nThe comparison the axis exists for is then one glance.\n`--treatment` narrows a sweep the way `--effort` does, and `--treatment control` selects the untreated arm alone.\n\nTwo cells of one case may now differ in nothing but their treatment, so the build workspace name includes it.\n\nThe claude lever changes the control arm in one case: a fixture that already shipped a `CLAUDE.md` is now read, where before it was ignored.\nThat is a correction rather than a regression.\nA user running claude in that repository would have read it, and codex always did.\n\nHooks are not given a lever here.\nA treatment may carry a `.claude/settings.json`, but `--setting-sources \"\"` still excludes it.\nAdmitting it is a separate decision with its own contamination question, and this record does not make it.\n\n## Lens\n\nA change to an agent's instructions is only measured when the same cell runs without it.\nSo the untreated cell is never optional: it is swept every time a treatment is.\nA treatment that copies nothing onto some harness is that harness's control billed twice under a second name.\nSo the overlay must exist for every harness it is swept on, and collection refuses it otherwise.\nAn overlay the CLI never reads is the same failure arriving later.\nSo the lever that makes a harness read it is verified before it is trusted.\n"}, "ADR-0056": {"file": "0056-a-run-is-credited-with-its-subagents-work.md", "title": "A run is credited with its subagents' work, at the turn that spawned them", "status": "accepted", "status_note": "accepted, 2026-10-04.\nRefines:\n\n- [0022](0022-record-kind-catalogue-and-skill-coverage.md) (skill coverage) with the subagents' ledgers walked beside the primary's\n- [0033](0033-subagent-transcripts-are-captured-and-billed.md) (subagent transcripts are captured and billed) with the same scope for credit as for cost", "markdown": "# 0056: A run is credited with its subagents' work, at the turn that spawned them\n\nStatus: accepted, 2026-10-04.\nRefines:\n\n- [0022](0022-record-kind-catalogue-and-skill-coverage.md) (skill coverage) with the subagents' ledgers walked beside the primary's\n- [0033](0033-subagent-transcripts-are-captured-and-billed.md) (subagent transcripts are captured and billed) with the same scope for credit as for cost\n\n## Context\n\nSkill coverage walked the primary session's ledger and nothing else.\nSince ADR 0033 every subagent transcript is captured, folded into a ledger of its own, and billed into the run's usage.\nSo a subagent's tokens were the run's, while its file reads and script runs were not.\n\nThe first sweep across the treatment axis (ADR 0055) made the gap a verdict.\nIts treatment told the agent to delegate the skill's mandatory gate scripts to a cheaper subagent.\nEvery treated cell did so, and the subagent transcripts show `mermaid_contrast.ts` and `mermaid_complexity.ts` running.\nTwo of those cells still failed with \"the run never executed the gate scripts\".\nThe grader asked coverage, and coverage had not looked where the scripts ran.\n\n## Decision\n\n**`skillcov.annotate` walks every subagent's ledger after the primary's.** It uses the same vocabulary, the same command resolution (ADR 0048) and the same rows.\nA file a subagent loaded or ran therefore counts exactly as if the primary had.\n\n**A subagent's access is credited to the primary turn that spawned it.** Coverage turns are primary turns, and `Subagent.parent_turn` already names the one whose tool call spawned the thread (ADR 0033).\nA subagent whose spawn could not be matched keeps its own call's turn number, rather than being dropped.\n\n**Each subagent's shell starts back in the workspace.** A subagent is a separate process with a shell of its own.\nThe persistent working directory the primary's walk tracks does not carry into it.\n\n## Consequences\n\nA run that delegates a skill's scripts is now graded on whether they ran, not on who ran them.\nThe control and treated arms of a delegation treatment are comparable for the first time.\n\nNo coverage key changes shape, and the characterization goldens do not move, because their captures spawn no subagent that touches a skill file.\nA replay re-derives coverage for every existing capture under the new rule.\nIt does not re-grade, so a stored verdict that the old rule failed stays failed until the cell is run again.\n\n## Lens\n\nWhat a run is billed for and what it is credited with must cover the same work.\nA measure that charges for a delegated step and then reports the step as never done punishes delegation twice.\nIt also makes any comparison of a delegating arm against a non-delegating one meaningless.\n"}, "ADR-0057": {"file": "0057-each-harness-declares-a-model-catalogue.md", "title": "Each harness declares a model catalogue, with a hand-curated family tier frozen at release", "status": "accepted", "status_note": "accepted, 2026-10-06.\nWhere the catalogue lives is superseded by [0059](0059-the-model-catalogue-is-one-config-file-beside-the-prices.md): one config file, not a list on each harness class.\nThe tier, line and release-date decisions stand.\nRefines:\n\n- [0034](0034-a-harness-is-a-class-and-the-registry-is-the-only-dispatch.md) (a harness is a class) with a fifth question asked of a harness\n- [0007](0007-unpriced-model-aborts-before-spend.md) (an unpriced model aborts before spend) with an uncatalogued model aborting the same way\n\nAdditive:\n\n- `result.json` gains `line`, `family_tier` and `released`\n- `history.json` gains the same three keys\n- `report/index.json` gains the same three keys", "markdown": "# 0057: Each harness declares a model catalogue, with a hand-curated family tier frozen at release\n\nStatus: accepted, 2026-10-06.\nWhere the catalogue lives is superseded by [0059](0059-the-model-catalogue-is-one-config-file-beside-the-prices.md): one config file, not a list on each harness class.\nThe tier, line and release-date decisions stand.\nRefines:\n\n- [0034](0034-a-harness-is-a-class-and-the-registry-is-the-only-dispatch.md) (a harness is a class) with a fifth question asked of a harness\n- [0007](0007-unpriced-model-aborts-before-spend.md) (an unpriced model aborts before spend) with an uncatalogued model aborting the same way\n\nAdditive:\n\n- `result.json` gains `line`, `family_tier` and `released`\n- `history.json` gains the same three keys\n- `report/index.json` gains the same three keys\n\n## Context\n\nA model was a bare string.\nIt appeared in the plugin-default matrix and in the dated price records, and nowhere said what kind of model it was.\nComparing the treatment sweeps across eight models from two providers needed exactly that.\nWhich models are the small ones on each side? Which are the flagships?\n\nTwo candidate signals were researched and rejected as the bucket.\nPrice drifts: GPT-6 Luna matches Sonnet 5 on a capability index at a twentieth of the price.\nA continuous capability index such as Epoch's ECI does not bucket, and drifts across generations.\nHaiku 4.5 and GPT-5.6 Luna both fill the smallest role in their lineups, yet sit three ECI tiers apart.\n\nNo comparator publishes a cross-provider size class or generation field either.\nThe one grouping field they all share is the release date.\n\n## Decision\n\n**Each harness class declares its `models`, beside its effort ladder.** One `ModelSpec` per supported model holds four curated facts: `id`, `line`, `family_tier` and `released`.\nA provider's differences live on its class (ADR 0034), so there is no table of models keyed by harness name.\n`model/registry.py` gathers them into a `Catalogue`, the fifth lookup it answers for the domain.\n\n**`line` is the provider's own product line.** It is the word Anthropic's Models API publishes and models.dev calls `family`: haiku, sonnet, opus, fable, luna, terra, sol, astra.\n\n**`family_tier` is a hand-curated integer for the model's role in its lineup, 1 the smallest.** It is a number because a name is reassigned when a lineup changes, while a number keeps sliding.\nIt is a role and never a price, so GPT-6 Sol is tier 3 beside Opus although its rates sit with tier-2 models.\nIt is frozen at release: a model keeps the tier it shipped with.\nA lineup that later gains or loses a line renumbers only the models that follow.\n\n**`released` is the release date, and no generation format is decided.** A cohort derived from it, such as a quarter, was considered and deferred.\n\n**A project may add or correct a model before a plugin release.** An `xharness_models` ini line in the shape of `xharness_prices` does it, and the project's line wins.\n\n**A matrix entry naming an uncatalogued model stops collection, before spend.** The refusal names the `xharness_models` line that would add it, the same way an unpriced model is refused (ADR 0007).\n\n**The three facts are stored on every record.** The derivation pipeline copies `line`, `family_tier` and `released` from the catalogue.\nAn archived run then states what it was without the catalogue that produced it.\nA replay carries stored values forward and looks up older captures, which is the same answer because a tier is frozen.\n\n## Consequences\n\nThe plugin default matrix is no longer a hand-kept list: it is derived from the catalogue, filtered by cost (ADR 0058).\nThe price curator now checks that every catalogued model is priced, not only the default matrix.\nA test checks that every bundled model is priced today and that no harness skips a tier.\n\nThe characterization goldens gain the three keys with real values, `opus` and `sol` at tier 3, which is the intended behaviour change.\n\nGated models, such as the Mythos line and `gpt-5.6-cyber`, are not catalogued.\nNeither are retired ones, and older captures of them still replay with the three keys left null.\n\n## Lens\n\nA cross-provider comparison needs a bucket that survives a lineup change.\nNames get reassigned when a provider retires a line or adds one above the top.\nNumbers can keep sliding, and a number frozen at release keeps history comparable.\nCurate the few facts a measurement cannot supply, and compute everything else.\n"}, "ADR-0058": {"file": "0058-the-default-matrix-is-the-catalogue-under-a-cost-limit.md", "title": "The default matrix is the catalogue under an output-rate limit that a project raises to opt in", "status": "accepted", "status_note": "accepted, 2026-10-06.\nRefines [0015](0015-harness-is-the-axis-and-the-project-owns-the-matrix.md) (the project owns the matrix) and [0010](0010-matrix-options-and-dry-run.md) (the matrix is the spend dial) with how the plugin default is chosen.", "markdown": "# 0058: The default matrix is the catalogue under an output-rate limit that a project raises to opt in\n\nStatus: accepted, 2026-10-06.\nRefines [0015](0015-harness-is-the-axis-and-the-project-owns-the-matrix.md) (the project owns the matrix) and [0010](0010-matrix-options-and-dry-run.md) (the matrix is the spend dial) with how the plugin default is chosen.\n\n## Context\n\nThe plugin default matrix was a hand-kept list of six models that had to move with the price records.\nWith a model catalogue (ADR 0057) it can be derived instead.\nBut every catalogued model is the expensive reading of \"the whole axis\", and the apex models bill ten times a small one.\nThe person who owns the first consuming project had been leaving the newest frontier models out of every sweep by hand, for cost.\n\n## Decision\n\n**The plugin default is every catalogued model whose output rate is below a limit.** The rate is read from the price record in effect on the run's day, in USD per million output tokens.\n\n**The limit is the `xharness_output_rate_limit` ini key, and it defaults to 50.** Today that leaves out Fable and Astra, which bill $50, and keeps every other catalogued model.\nA project raises the limit to opt in to the cost, and the report header names how many catalogued models it kept.\n\n**The limit shapes only the plugin default.** A case's `models=` or a project's `xharness_matrix` that names an apex model has already opted in, so it is never filtered.\n\n**A catalogued model with no price row is kept, not dropped.** The price check that follows then refuses it by name (ADR 0007), rather than the sweep quietly shrinking.\n\n## Consequences\n\nA new catalogued model joins every default sweep below the limit with no other edit.\nA new apex model stays out until a project raises the limit, so a release does not silently raise everyone's bill.\n\nThe default grows from six cells per case to eleven.\n`DEFAULT_MATRIX` is removed from the public names, because no list exists to export.\n\n## Lens\n\nA default that names models will go stale, and a default that names every model will one day cost too much.\nName a rule instead, and make the costly side of the rule something a reader opts in to.\n"}, "ADR-0059": {"file": "0059-the-model-catalogue-is-one-config-file-beside-the-prices.md", "title": "The model catalogue is one config file beside the price records, not a list on each harness class", "status": "accepted", "status_note": "accepted, 2026-10-07.\nSupersedes [0057](0057-each-harness-declares-a-model-catalogue.md) on where the catalogue lives.\nIts tier, line and release-date decisions stand.", "markdown": "# 0059: The model catalogue is one config file beside the price records, not a list on each harness class\n\nStatus: accepted, 2026-10-07.\nSupersedes [0057](0057-each-harness-declares-a-model-catalogue.md) on where the catalogue lives.\nIts tier, line and release-date decisions stand.\n\n## Context\n\nADR 0057 put each harness's models on its class, beside its effort ladder, because ADR 0034 keeps a provider's differences on its class.\nIn use, that split one list of supported models across two adapter modules.\nThe person maintaining it could not find \"the spot\" where models and their tiers are configured.\n\nThe effort ladder is behaviour: it decides which flag the CLI is passed.\nA model's line, tier and release date are facts about the world, curated by hand.\nThe matrix, the price curator and the report all read them.\nThe price records are already exactly that kind of data, bundled as TOML and grouped by harness (ADR 0050).\n\n## Decision\n\n**The catalogue is `derive/prices/models.toml`, beside the dated price records.** One table per registered harness holds `feed_provider`, the 1-hour cache-write flag, and its models.\nEach model states `line`, `tier` and `released`.\n\n**`derive/catalogue.py` reads it into the domain's `Catalogue`.** It refuses an unknown harness, an unknown key, or a model missing one of its three facts.\nThe harness classes no longer declare models, and `model/registry.py` no longer gathers them.\n\n**It is located the way the price records are.** `derive/prices/` is the one directory the plugin may find from `__file__` (ADR 0014, ADR 0050).\nThe catalogue joins it rather than adding a second exception.\nThe price loader now reads only `prices-*.toml` there.\n\n**The harness-level keys say how each harness appears in LiteLLM's feed.** `feed_provider` is the `litellm_provider` on its first-party rows, read by live pricing (ADR 0060) and by the curator.\n\n## Consequences\n\nAdding a model is one TOML table in one file, and every reader follows: the default matrix, the collection check, the curator and the records.\n`make test` curates its price automatically when the bundled records lack one (ADR 0060).\n\nA table keyed by harness name now exists in data, as it already did for prices.\nADR 0034's rule is about dispatching behaviour on a name in code, and no code branches on these keys.\n\n## Lens\n\nConfiguration that a person edits by hand belongs in one file they can find without reading code.\nBehaviour belongs on a class; facts about the world belong in data.\n"}, "ADR-0060": {"file": "0060-an-unpriced-model-is-priced-live-into-the-cache.md", "title": "An unpriced model is priced live from LiteLLM's feed into a cached dated record, and only then refused", "status": "accepted", "status_note": "accepted, 2026-10-07.\nRefines [0007](0007-unpriced-model-aborts-before-spend.md) (an unpriced model aborts before spend) with a lookup before the refusal.\nExtends [0050](0050-prices-are-dated-records-in-usd-per-mtok-grouped-by-harness.md) and [0051](0051-long-context-is-a-tier-priced-per-call-and-records-are-curated.md) with a second writer of the same records.", "markdown": "# 0060: An unpriced model is priced live from LiteLLM's feed into a cached dated record, and only then refused\n\nStatus: accepted, 2026-10-07.\nRefines [0007](0007-unpriced-model-aborts-before-spend.md) (an unpriced model aborts before spend) with a lookup before the refusal.\nExtends [0050](0050-prices-are-dated-records-in-usd-per-mtok-grouped-by-harness.md) and [0051](0051-long-context-is-a-tier-priced-per-call-and-records-are-curated.md) with a second writer of the same records.\n\n## Context\n\nA model a provider released after the last plugin release has no bundled price row.\nThe sweep stopped at collection (ADR 0007), and the only remedy was an `xharness_prices` line the user had to look up and type.\nThe rate was already published, in the same LiteLLM feed the curator reads.\n\nThe plugin's own development had the mirror problem.\nA model added to the catalogue needed someone to remember to run `make prices` before its price existed.\n\n## Decision\n\n**Collection prices a gap live before it refuses one.** `Settings.ensure_priced` finds every matrix entry no row prices on the run's day.\nIt looks each one up in LiteLLM's feed by exact first-party id and by its harness's `feed_provider` from the catalogue (ADR 0059).\nA host's own spelling of a model is never read as a first-party rate.\n\n**What it finds is written as a dated record under `<cache>/pricing/`.** The record has the same format as a bundled one, rendered by the same code.\nA later day closes the open cache record and carries its rows forward, exactly as the curator does.\nEvery stamped day still resolves to the rates it had.\nThe price table reads cached records after the bundled ones, so a live row only fills a gap.\nA replay reads the same cache, and so re-prices a live-priced run identically.\n\n**Whatever the feed does not price either still stops the sweep.** The existing refusal names it (ADR 0007), and nothing is written.\nWith no gap, nothing is fetched, so a sweep of priced models never touches the network.\n\n**The feed's location is the `xharness_price_feed` ini key.** It defaults to LiteLLM's current feed and accepts a URL or a local path, which is how the test suite stays offline.\n\n**One conversion, two writers.** The LiteLLM-to-row conversion and the record format moved from the curator script into `derive/feed.py`.\nSo the curator and live pricing cannot disagree.\nADR 0051's rules bind both.\nEvery published rate is modelled, and an unmodelled cost field stops the write.\n\n**`make test` curates a new bundled snapshot when the catalogue gets ahead of the prices.** It first runs the curator with `--when-catalogue-unpriced`.\nThat exits at once, offline, while every catalogued model is priced, and curates a new dated record otherwise.\n\n## Consequences\n\nA consuming project can run a model released yesterday without editing its config, provided the catalogue knows the model.\nThe plugin's own suite never runs with a catalogued model the bundled records cannot price.\n\nThe cache now holds a third kind of evidence beside results and the report.\nDeleting it is safe for the sweep, which re-fetches, but loses the record a replay of a live-priced run needs.\n\n## Lens\n\nThe bundled prices are a cache of the world, not the world.\nWhen the cache misses, look the answer up and write it down where every later reader will find it.\nRefuse only when the world has no answer either, and never write down a guess.\n"}, "ADR-0061": {"file": "0061-the-session-table-scrolls-and-the-reader-picks-its-columns.md", "title": "The session table scrolls sideways, and the reader picks which columns it shows", "status": "accepted", "status_note": "accepted, 2026-10-07.\nSupersedes part 3 of [0043](0043-the-overview-tables-are-budgeted-to-one-screen.md) (`SessionTable` is budgeted to one screen).\nThe rest of 0043 stands.", "markdown": "# 0061: The session table scrolls sideways, and the reader picks which columns it shows\n\nStatus: accepted, 2026-10-07.\nSupersedes part 3 of [0043](0043-the-overview-tables-are-budgeted-to-one-screen.md) (`SessionTable` is budgeted to one screen).\nThe rest of 0043 stands.\n\n## Context\n\nADR 0043 budgeted `SessionTable` to one 1440px screen, taking width back from how values were spelled.\nThe treatment axis (ADR 0055) and the family tier (ADR 0057) each added to the row.\nTo stay inside the budget the treatment was capped at 7 characters, so `cheap_eval_subagents` read as `cheap_...`.\nEven so, a real two-skill, two-arm capture overflowed by 128px.\n\nScreenshots of five layouts were measured on that capture before deciding.\nTrimming the identity columns, merging effort with treatment, or dropping the harness column still left 98px to 165px of overflow.\nThe width goes to the metric columns, and which of those matter depends on the question a reader is asking.\n\n## Decision\n\n**The session table scrolls sideways inside its card, with no pinned column.** The one-screen budget and its 1px smoke assertion are gone.\n\n**A column picker sits above the table.** It is a checkbox per column, with \"Select all\" and \"Deselect all\".\n`verdict` and `case` are always shown and their boxes are locked, because without them a row cannot be read.\n\n**The choice is a per-reader preference, kept in the browser.** It is stored in `localStorage` under a versioned key, and is not part of a shared link.\nBlocked storage, or a stored value of the wrong shape, falls back to showing every column.\n\n**Width hacks that existed only for the budget are removed.** The treatment prints its full name again.\n\n## Consequences\n\nA new column no longer has to be paid for out of another column's width.\n\nThe smoke test now asserts the contract that replaced the budget: the box scrolls horizontally, and deselecting every optional column makes it fit any card.\n\nA reader who hides columns sees the same table on their next visit, and a link they share opens with every column for its recipient.\n\n## Lens\n\nA fixed width budget makes every new column a fight over pixels, and the losing column gets truncated into noise.\nLet the table be as wide as its data, and give the reader the control to make it as narrow as their question.\n"}, "ADR-0062": {"file": "0062-a-finished-cell-removes-its-workspace.md", "title": "A finished cell removes its workspace, and a project can keep them for inspection", "status": "accepted", "status_note": "accepted, 2026-10-07.\nRefines [0004](0004-workspace-is-a-plain-copy.md) (a workspace is a plain copy of the fixture tree) with when a workspace is removed.\nRefines [0032](0032-all-run-output-consolidates-under-a-cache-dir.md) (all run output consolidates under a cache dir) the same way.", "markdown": "# 0062: A finished cell removes its workspace, and a project can keep them for inspection\n\nStatus: accepted, 2026-10-07.\nRefines [0004](0004-workspace-is-a-plain-copy.md) (a workspace is a plain copy of the fixture tree) with when a workspace is removed.\nRefines [0032](0032-all-run-output-consolidates-under-a-cache-dir.md) (all run output consolidates under a cache dir) the same way.\n\n## Context\n\nA cell's workspace was removed only when the same cell ran again, so every cell of every sweep stayed on disk.\nThe mermaid skill's render step downloads its own browser into a task-local npm cache, about 675MB per cell.\nBy the first effort sweep the build tree held 19GB, the disk filled, and the sweep died at 16% mid-cell.\n\nNothing a later step reads lives in the workspace.\nThe session log, any subagent transcripts, the result and the metrics record are all copied under `results/`.\nThat happens before the cell is graded (ADR 0032, ADR 0033).\nEach harness also keeps a run directory beside the workspace: claude's plugin wrapper, and codex's private home, which holds a copy of its credentials.\n\n## Decision\n\n**A finished cell removes its workspace and its harness run directories.** It happens after the cell's record is written, in a `finally`.\nA cell whose CLI or grader failed is cleaned up too.\n\n**Only the exact sibling names are removed.** They are `<workspace>.<harness>` for each registered harness, never a `<workspace>.*` pattern.\nThat pattern would also match a neighbouring cell's workspace, as `…-gpt-5` matches `…-gpt-5.6-sol`.\n\n**A project keeps them for inspection with `xharness_keep_workspaces`, or `--xharness-keep-workspaces` for one run.** Both default to off.\n\n## Consequences\n\nA sweep's disk use stays at roughly one workspace per worker, however many cells it runs.\nCodex's copied credentials no longer outlive the cell that needed them.\n\nThe files an agent wrote are no longer inspectable after the run unless the project keeps workspaces.\nThe written paths are still listed on every record, and the evidence a replay needs is unaffected.\n\n## Lens\n\nScratch that outlives its purpose is not free.\nClean up by default once the evidence is safe.\nMake keeping the scratch an explicit choice for the reader who needs it.\n"}, "ADR-0063": {"file": "0063-a-run-that-never-reached-the-model-is-an-error.md", "title": "A run that never reached the model is an error, and a model that ignores effort refuses a rung", "status": "accepted", "status_note": "accepted, 2026-10-07.\nRefines [0012](0012-grading-is-composable-not-prescribed.md) (grading is composable, not prescribed) with a check before the grader runs.\nExtends [0049](0049-effort-is-the-third-matrix-axis.md) (effort is the third matrix axis) to a model whose CLI ignores the rung.", "markdown": "# 0063: A run that never reached the model is an error, and a model that ignores effort refuses a rung\n\nStatus: accepted, 2026-10-07.\nRefines [0012](0012-grading-is-composable-not-prescribed.md) (grading is composable, not prescribed) with a check before the grader runs.\nExtends [0049](0049-effort-is-the-third-matrix-axis.md) (effort is the third matrix axis) to a model whose CLI ignores the rung.\n\n## Context\n\nTwo findings from the first effort sweep.\n\nTwenty-nine claude cells hit the subscription's session limit.\nThe CLI exited 1 with the message \"You've hit your session limit\", made no model call and spent nothing.\nThe grader then ran against an untouched workspace and failed.\nSo the report showed 29 fails of the skill that were never attempts at the task.\n\nHaiku 4.5 was swept at all five effort rungs.\nIts reasoning tokens and cost stayed flat from low to max.\nEvery other model scaled clearly: Sonnet 5 went from 5k to 100k reasoning tokens.\nClaude Code accepts `--effort` for Haiku 4.5 and runs it at its default.\nSo five billed runs carried five rung labels none of them had, which is the failure ADR 0049 closed for an unknown rung.\n\n## Decision\n\n**A run is attempted when its CLI exited cleanly or made at least one model call.** `RunResult.attempted` states it.\n\n**An unattempted run is an error, decided before the grader is asked.** `CellRun.grade` raises a `RunError` naming the CLI's own message, so the record's verdict is `error` and the evidence is still captured.\nA run that called the model and then exited non-zero did attempt the task, and is graded as before.\n\n**The catalogue can say a model takes no effort rung.** `effort = false` on a model in `models.toml`, or `effort=false` on an `xharness_models` line, sets `ModelSpec.takes_effort`.\nHaiku 4.5 is marked so.\n\n**A matrix entry naming a rung for such a model stops collection, before spend.** The refusal names the model and tells the reader to drop the rung.\nThe same model with no rung still collects.\n\n## Consequences\n\nA session limit, an expired login or a refused request now reads as an error on the report, not a regression of the skill.\n\nThe Haiku rows already captured at a rung keep their labels, because a replay carries a stored effort forward (ADR 0049).\nNo new Haiku cell can be recorded at a rung.\n\nWhether a model honours effort is now a curated fact, settled by a sweep and recorded in the catalogue with the evidence beside it.\n\n## Lens\n\nA fail is a statement about the skill, so only a run that attempted the task can earn one.\nA label is a statement about the run, so a setting the run never had must be refused, not recorded.\n"}, "ADR-0064": {"file": "0064-a-run-killed-at-the-wall-fails-if-active-and-errors-if-stalled.md", "title": "A run killed at the timeout keeps its evidence, fails if it was still working, and errors if it had stalled", "status": "accepted", "status_note": "accepted, 2026-10-08.\nRefines [0063](0063-a-run-that-never-reached-the-model-is-an-error.md) (a run that never reached the model is an error) with the other way a run ends without finishing.\nExtends [0049](0049-effort-is-the-third-matrix-axis.md) (effort is the third matrix axis), whose top rungs are the runs most likely to meet the limit.", "markdown": "# 0064: A run killed at the timeout keeps its evidence, fails if it was still working, and errors if it had stalled\n\nStatus: accepted, 2026-10-08.\nRefines [0063](0063-a-run-that-never-reached-the-model-is-an-error.md) (a run that never reached the model is an error) with the other way a run ends without finishing.\nExtends [0049](0049-effort-is-the-third-matrix-axis.md) (effort is the third matrix axis), whose top rungs are the runs most likely to meet the limit.\n\n## Context\n\nEach CLI runs under a wall-clock limit, `xharness_timeout_s`.\nAt the limit, `subprocess.run` killed the CLI and raised `TimeoutExpired` straight out of the cell.\nNo result was folded, no record was written, and the report showed nothing.\nYet the run had been billed, and the session log it had written up to the kill was on disk.\n\nThe first effort sweep timed out twice, both Sonnet 5.5 at `max` on the heaviest case.\nGiven a 60-minute limit, the same two cells finished in about 25 to 29 minutes, one passing and one failing.\nThey had been working the whole time, and only the budget was too small.\n\nA run can also stop making progress: blocked on a skill script, a prompt, the network or the harness itself.\nThat is not a judgement about the skill.\n\n## Decision\n\n**A kill at the limit is not an exception.** `spawn` returns exit code 124, as GNU `timeout` does, with whatever the CLI printed.\nEach harness then folds the session log it wrote, as for any run.\nClaude prints its result envelope only at the end, so a killed run gets an envelope carrying only its minted session id.\n\n**The run is priced and captured.** Its evidence is written like any other, so the money it spent appears on the report.\n\n**`RunResult` records the kill.** `timed_out_after_s` is the limit it met.\n`idle_before_timeout_s` is how long its session logs, subagent transcripts included, had been silent at that moment.\nA replay carries both forward, because neither is in the log.\n\n**Active within five minutes of the limit is a fail.** The agent was working and ran out of time.\nThat is a failure to complete in a timely manner, and a longer `xharness_timeout_s` might turn it into a pass.\n\n**Silent for five minutes or more is an error.** Something stalled, so the run is not a clean run of the skill to call failed, and it warrants investigation.\nA killed run with no session log at all is an error on the same ground.\n\n**The timeout is decided before the grader runs.** A run that ran out of time is never graded on the partial work it left behind.\n\n## Consequences\n\nEvery killed run now appears on the report with a verdict, a reason and its cost.\nA timed-out run that a longer limit would rescue is told apart from one that would never finish.\n\n`result.json` gains `timed_out_after_s` and `idle_before_timeout_s`.\nThe characterization goldens gain both, null.\n\nThe five-minute line is a constant, `STALLED_AFTER_S` in `plugin/cell.py`.\nLong silences inside a working run, such as a single slow tool call, read as a stall.\nRaising the constant is the remedy if that proves common.\n\n## Lens\n\nRunning out of time and getting stuck look the same from outside the process, and mean opposite things.\nAsk the log when it last moved before you decide which one you are looking at.\n"}, "ADR-0065": {"file": "0065-a-subagent-is-priced-at-its-own-models-rates.md", "title": "A subagent is priced at its own model's rates, from the final usage of each call", "status": "accepted", "status_note": "accepted, 2026-10-08.\nRefines [0033](0033-subagent-transcripts-are-captured-and-billed.md) (subagent transcripts are captured and billed) with which rates bill them.\nRefines [0051](0051-long-context-is-a-tier-priced-per-call-and-records-are-curated.md) (each call is priced on its own) with which row a call is priced from.", "markdown": "# 0065: A subagent is priced at its own model's rates, from the final usage of each call\n\nStatus: accepted, 2026-10-08.\nRefines [0033](0033-subagent-transcripts-are-captured-and-billed.md) (subagent transcripts are captured and billed) with which rates bill them.\nRefines [0051](0051-long-context-is-a-tier-priced-per-call-and-records-are-curated.md) (each call is priced on its own) with which row a call is priced from.\n\n## Context\n\nClaude's CLI reports a session's whole cost, subagents included.\nFor the 82 claude sessions without subagents, the plugin's estimate matched it to the cent.\nFor the 57 with subagents it drifted from -23% to +25%.\nThat made the delegation treatment look more expensive than it was: up to 87% on a codex parent.\n\nTwo causes, both visible in the captured logs.\nEvery call of a run was priced at the run's model, so a Haiku subagent under an Opus parent was billed as Opus.\nThe model that answered is named on each record of the subagent's own transcript.\n\nAnd a subagent transcript streams a call's usage across that call's records.\nOne call recorded output tokens of 4, 4, 4 and then 917, while the main session's log repeats the final figure on every record.\nThe ledger kept the first, so subagent output was undercounted about 100-fold.\n\n## Decision\n\n**A subagent records the model that answered it.** Claude's is the model its assistant records name.\nCodex's is its rollout's last `turn_context`, because a fork first replays its parent's.\n\n**Each part of a run is priced at its own model's rates.** The primary's calls bill at the run's model, and each subagent's at its own.\nA subagent whose transcript names no model bills at its parent's, the only rate it can be shown to have.\nA subagent model with no price row stops pricing, as an unpriced run does (ADR 0007); it never borrows a neighbour's rate.\n\n**The parts are summed before any rounding.** So a run priced in parts costs the same, to the micro-dollar, as one priced whole.\nEach subagent also carries its own `estimated_cost_usd`.\nThe run's `rates_applied` stays the primary's row, the one a reader checks it against.\n\n**A call bills its final usage.** When one message spans several records, the ledger keeps the furthest-along usage, not the first.\n\n## Consequences\n\nReplayed against the cache, all 139 claude sessions now land within 0.5% of the CLI's own cost.\nThe 57 with subagents sum to $52.41, exactly the CLI's figure; the worst single session is 0.26% off.\nThe comparison is the check this record leaves behind, and a replay re-runs it for free.\n\nCodex prints no cost of its own, so its subagents are priced by the same rule but cannot be cross-checked the same way.\n\nThe characterization goldens gain each subagent's `model` and `estimated_cost_usd`, and no total moves.\n\n## Lens\n\nA cost estimate is only trustworthy where it can be checked against the provider's own bill, and it must be checked there.\nPrice each call at the rates of the model that answered it, and count what it produced, not the first fragment of it.\n"}, "ADR-0066": {"file": "0066-a-harness-says-what-commands-a-shell-call-ran.md", "title": "A harness says which commands a shell call ran", "status": "accepted", "status_note": "accepted, 2026-10-08.\nRefines [0048](0048-coverage-reads-the-command-the-shell-ran.md) (shell variables are expanded) with where the commands come from.", "markdown": "# 0066: A harness says which commands a shell call ran\n\nStatus: accepted, 2026-10-08.\nRefines [0048](0048-coverage-reads-the-command-the-shell-ran.md) (shell variables are expanded) with where the commands come from.\n\n## Context\n\nCodex's `exec` tool takes a JavaScript script, not a shell command.\nEach command sits inside it as `tools.exec_command({cmd: \"...\", workdir: \"...\"})`.\nSkill coverage read the whole script as one shell line.\n\nThe usual command opens with `skill_root='<dir>'`, then runs `bun run \"$skill_root/scripts/gate.ts\"`.\nRead whole, the script's first statement swallowed the assignment, so the variable never expanded.\nSeven codex sessions that ran the skill's gates recorded no script run at all.\n\n## Decision\n\n**A harness says which commands one shell call ran.** `Harness.shell_commands` takes a call's input and returns each command with its working directory.\nThe base reads a `command` or `cmd` key, as coverage did before.\n\n**Codex unwraps its scripts.** It reads the object literal after each `exec_command(`, with keys bare or quoted and values JSON.\nAn input it cannot read stays the script text, which is what was matched before.\n\n**The vocabulary carries it.** `Shells` gains `commands`, filled from the harness like `tools` and `persistent`.\nCoverage resolves each command on its own, so a variable set in one is expanded within it (ADR 0048).\n\n## Consequences\n\nReplayed against the cache, the seven codex sessions now record the scripts they ran.\nThe one codex session still recording none ran no script.\n\nA new CLI whose shell tool wraps its commands overrides one method; nothing in `derive/` learns its dialect.\n\n## Lens\n\nCoverage can only attribute a command it can read as a command.\nHow a CLI wraps its commands is that CLI's business, so the harness unwraps them.\n"}, "ADR-0067": {"file": "0067-a-priced-release-is-catalogued-or-excluded-before-it-is-curated.md", "title": "A priced first-party release is catalogued or excluded before the curator writes it", "status": "accepted", "status_note": "accepted, 2026-10-08.\nExtends [0052](0052-scope-is-a-boundary-not-a-roster.md) (scope is a boundary, not a roster) with a decision owed for every id the boundary admits.\nExtends [0059](0059-the-model-catalogue-is-one-config-file-beside-the-prices.md) with an `excluded` table beside each harness's models.\nExtends [0060](0060-an-unpriced-model-is-priced-live-into-the-cache.md), which checks the other direction: a catalogued model with no price.", "markdown": "# 0067: A priced first-party release is catalogued or excluded before the curator writes it\n\nStatus: accepted, 2026-10-08.\nExtends [0052](0052-scope-is-a-boundary-not-a-roster.md) (scope is a boundary, not a roster) with a decision owed for every id the boundary admits.\nExtends [0059](0059-the-model-catalogue-is-one-config-file-beside-the-prices.md) with an `excluded` table beside each harness's models.\nExtends [0060](0060-an-unpriced-model-is-priced-live-into-the-cache.md), which checks the other direction: a catalogued model with no price.\n\n## Context\n\nThe curator's watch-list is a boundary, so a new release is priced without an edit (ADR 0052).\nThe catalogue is a roster, so a new release is swept only once someone adds it (ADR 0059).\n`make test` closes the gap in one direction only: a catalogued model with no price curates a snapshot (ADR 0060).\n\nThe other direction had no check.\nClaude Haiku 5.5 was released on 2026-10-07, and the feed priced it the next day.\n`make prices` would have bundled its row without a word, and the default matrix would never have swept it.\nThe priced rows the catalogue already left out (gated models, previous generations, undated aliases) were left out silently.\nNothing told a reader those omissions were decisions.\n\n## Decision\n\n**Each harness in `models.toml` may carry an `excluded` table.** Each entry maps a model id to the reason it is left out.\nThe reason is a required non-empty string, and an id cannot be both catalogued and excluded.\n\n**A priced first-party model that is neither catalogued nor excluded is undecided.** `derive/catalogue.py`'s `undecided` names every such model.\n\n**The curator stops on an undecided model before it writes anything.** It names each one with the feed's `source` link and says where to decide it.\nIt does not guess a line, a tier or a release date, because those are hand-curated facts (ADR 0057).\n\n**The weekly curation workflow asks for the decision.** When it stops on an undecided model, it opens or refreshes one \"Undecided model releases\" issue naming each model, and the run stays red.\nNobody has to watch the feed or name the new model to start an update.\n\n**`make test` holds the bundled records to the same rule, offline.** A test fails when any bundled price row is undecided.\n\n## Consequences\n\nA new release is decided on the day the feed first prices it.\nThe decision is reviewed in the same diff as its price row.\nEvery model the plugin prices but does not sweep now has a stated reason in the one config file.\n\nA feed that adds a variant spelling of an existing model, such as a dated snapshot, stops curation until someone writes one line.\nThat is deliberate: a snapshot may be a new model behind a familiar name.\n\n## Lens\n\nA boundary that admits a new model on its own is only half the job.\nSomeone still has to decide whether the plugin sweeps it.\nAsk for that decision on the day the feed first names the model, and refuse to go on without it.\n"}}</script>
<script id="token-data" type="application/json">{"$schema": "xharness-report-design-tokens/1", "name": "xharness default", "fonts": {"body": "ui-sans-serif, system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif", "mono": "ui-monospace, SFMono-Regular, Menlo, monospace"}, "themes": {"light": {"bg": "#f7f7fa", "panel": "#ffffff", "ink": "#1b1d23", "muted": "#5b6070", "line": "#e2e4ea", "accent": "#4f46e5", "good": "#046f51", "bad": "#b91c1c", "warn": "#9e4908", "code": "#f1f2f6", "grid": "#e6e8ee", "axis": "#c8ccd6", "plot": "#ffffff", "series": ["#4f46e5", "#d97706", "#059669", "#db2777", "#0284c7", "#7c3aed", "#dc2626", "#0d9488"], "waterfall": {"baseline": "#64748b", "read": "#7d8ba1", "context": "#2563eb", "thinking": "#7c3aed", "output": "#059669", "sub": "#ea580c", "total": "#1b1d23"}, "hljs": "github"}, "dark": {"bg": "#0f1117", "panel": "#171a23", "ink": "#e6e8ef", "muted": "#9aa0b0", "line": "#2a2e3a", "accent": "#a5b4fc", "good": "#34d399", "bad": "#f87171", "warn": "#fbbf24", "code": "#1f2330", "grid": "#262a36", "axis": "#3a3f4e", "plot": "#171a23", "series": ["#a5b4fc", "#fbbf24", "#34d399", "#f9a8d4", "#7dd3fc", "#c4b5fd", "#fca5a5", "#5eead4"], "waterfall": {"baseline": "#94a3b8", "read": "#5f6f86", "context": "#60a5fa", "thinking": "#c4b5fd", "output": "#34d399", "sub": "#fb923c", "total": "#e6e8ef"}, "hljs": "github-dark"}}, "categories": {"prompt": "#1d4ed8", "assistant_text": "#065f46", "thinking": "#6d28d9", "tool_call": "#4338ca", "tool_result": "#0f766e", "tool_exec": "#9a3412", "file_change": "#be185d", "usage": "#b45309", "harness_context": "#3f6212", "harness_meta": "#475569", "session_meta": "#1e3a8a", "lifecycle": "#b91c1c", "unknown": "#374151"}}</script>
<script>
(function () {
  "use strict";
  const read = (id) => JSON.parse(document.getElementById(id).textContent);
  const graph = read("graph-data");
  const RECORDS = read("record-data");
  const TOKENS = read("token-data");
  const pane = document.getElementById("pane");
  // A function declaration, not a const: applyTheme() runs before the graph exists
  // and would otherwise hit the temporal dead zone.
  function css(name) {
    return getComputedStyle(document.documentElement).getPropertyValue("--" + name).trim();
  }
  // Never `window.cy`: an element with id="cy" already claims that name through named
  // access on window, so the theme pass would style a <div> and throw.
  let graphInstance = null;

  if (!window.cytoscape || !window.marked) {
    document.getElementById("cy").innerHTML =
      '<p class="nofx">cytoscape.js and marked.js load from cdnjs.cloudflare.com. ' +
      "This page is otherwise self-contained; with no network the graph cannot draw. " +
      "The same records are readable as markdown in index.md.</p>";
    return;
  }

  // ---- theme -----------------------------------------------------------------
  // The repository's shipped design tokens drive the page, so the graph matches the
  // report. Both themes' values are written as CSS custom properties up front; the
  // toggle only flips which set is live.
  const themes = (TOKENS.themes) || {};
  function applyTheme(name) {
    document.documentElement.setAttribute("data-theme", name);
    const t = themes[name];
    if (t) {
      for (const [k, v] of Object.entries(t)) {
        if (typeof v === "string") document.documentElement.style.setProperty("--" + k, v);
      }
    }
    try { localStorage.setItem("adr-graph-theme", name); } catch (_) { /* opaque file:// origin */ }
    if (graphInstance) style(graphInstance);
  }
  let stored = null;
  try { stored = localStorage.getItem("adr-graph-theme"); } catch (_) { /* opaque file:// origin */ }
  const preferred =
    stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  applyTheme(preferred);
  document.getElementById("theme").onclick = () =>
    applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");

  // ---- elements --------------------------------------------------------------
  // graph.json carries the neutral data, compound parents included: each record
  // declares one `group`, its domain. Presentation is decided here, and both channels
  // are derived rather than assigned: fill is the domain, size is in-degree (how many
  // records refine or supersede this one). Status rides on the border, because only
  // one record is superseded and a whole colour channel would be wasted on it.
  const elements = graph.elements;
  const GROUPS = elements
    .filter((e) => String(e.data.id).startsWith("group-") )
    .map((e) => ({ id: e.data.id, label: e.data.label, colour: e.data.colour }))
    .sort((a, b) => a.label.localeCompare(b.label));

  const indegree = {};
  for (const e of elements) if (e.data.source) indegree[e.data.target] = (indegree[e.data.target] || 0) + 1;
  for (const e of elements) if (!e.data.source) e.data.weight = indegree[e.data.id] || 0;

  function style(cy) {
    cy.style([
      {
        selector: "node",
        style: {
          "background-color": "data(colour)",
          label: "data(label)",
          color: "#ffffff",
          "font-family": "ui-monospace, Menlo, monospace",
          "font-size": 10,
          "text-valign": "center",
          "text-halign": "center",
          width: (n) => 22 + Math.min(n.data("weight"), 10) * 3.4,
          height: (n) => 22 + Math.min(n.data("weight"), 10) * 3.4,
          "border-width": 0,
        },
      },
      {
        // A compound parent is a container, not a node: no fill of its own beyond a
        // wash of its domain colour, and its name sits above the cluster.
        selector: ":parent",
        style: {
          "background-color": "data(colour)",
          "background-opacity": 0.07,
          "border-width": 1,
          "border-color": "data(colour)",
          "border-opacity": 0.45,
          "border-style": "dashed",
          shape: "round-rectangle",
          padding: 14,
          label: "data(label)",
          color: "data(colour)",
          "font-family": "var(--body)",
          "font-size": 12,
          "font-weight": "bold",
          "text-valign": "top",
          "text-halign": "center",
          "text-margin-y": -4,
        },
      },
      {
        // The one status that is not "accepted" earns a ring rather than a hue.
        selector: 'node[status = "superseded"]',
        style: { "border-width": 3, "border-color": css("bad"), "border-opacity": 1 },
      },
      {
        selector: "edge",
        style: {
          width: 1.4,
          "line-color": (e) => (e.data("relation").startsWith("supersede") ? css("bad") : css("accent")),
          "target-arrow-color": (e) => (e.data("relation").startsWith("supersede") ? css("bad") : css("accent")),
          "target-arrow-shape": "triangle",
          "arrow-scale": 0.8,
          "curve-style": "bezier",
          "line-style": (e) => (e.data("relation").startsWith("supersede") ? "solid" : "dashed"),
          opacity: 0.5,
        },
      },
      { selector: "node.sel", style: { "border-width": 4, "border-color": css("ink"), "border-opacity": 1 } },
      { selector: ":parent.dim", style: { "background-opacity": 0.02, "border-opacity": 0.12, "text-opacity": 0.25 } },
      { selector: "node.dim, edge.dim", style: { opacity: 0.15 } },
      { selector: "edge.hot", style: { opacity: 1, width: 2.4 } },
      { selector: "node.hot", style: { opacity: 1 } },
    ]);
  }

  // ---- the grouped layout ------------------------------------------------------
  // Computed here rather than left to a force layout, for two reasons. Cytoscape's
  // built-in `cose` is only nominally compound-aware: records whose edges reach across
  // domains get dragged out of their own cluster, which collapsed several groups to a
  // few pixels. And a force layout is non-deterministic, so a committed generated file
  // would draw a different picture on every rebuild. The purpose-built compound
  // layouts (fcose, cose-bilkent) are not on the CDN this page is allowed to use.
  //
  // Shelf packing: each domain becomes a grid of its records, the grids are laid out
  // left to right and wrapped, and every position is a pure function of the sorted
  // record ids. Same input, same picture, every time.
  const SLOT = 66;          // one record's cell, in graph units
  const GAP = 46;           // between domain boxes

  function groupedPositions() {
    const boxes = GROUPS.map((g) => {
      const kids = elements
        .filter((e) => e.data.parent === g.id)
        .map((e) => e.data.id)
        .sort();
      const cols = Math.max(1, Math.ceil(Math.sqrt(kids.length)));
      const rows = Math.ceil(kids.length / cols);
      return { ...g, kids, cols, rows, w: cols * SLOT, h: rows * SLOT };
    });

    // Wrap width is derived from the total area and the pane's aspect ratio, so the
    // arrangement stays roughly as wide as the space it has to fit into. A fixed width
    // produced a long thin strip that fitted to almost nothing in a tall pane.
    const area = boxes.reduce((a, b) => a + (b.w + GAP) * (b.h + GAP), 0);
    const box = document.getElementById("cy").getBoundingClientRect();
    const aspect = box.width && box.height ? box.width / box.height : 1;
    const shelf = Math.max(
      Math.max(...boxes.map((b) => b.w)),
      Math.sqrt(area * Math.max(aspect, 0.6)),
    );

    const pos = {};
    let x = 0, y = 0, shelfHeight = 0;
    for (const b of boxes) {
      if (x > 0 && x + b.w > shelf) { x = 0; y += shelfHeight + GAP; shelfHeight = 0; }
      b.kids.forEach((id, i) => {
        pos[id] = {
          x: x + (i % b.cols) * SLOT + SLOT / 2,
          y: y + Math.floor(i / b.cols) * SLOT + SLOT / 2,
        };
      });
      x += b.w + GAP;
      shelfHeight = Math.max(shelfHeight, b.h);
    }
    return pos;
  }

  const GROUPED = {
    name: "preset",
    positions: (n) => groupedPositions()[n.id()],
    padding: 40,
    animate: false,
    fit: true,
  };

  const cy = cytoscape({
    container: document.getElementById("cy"),
    elements,
    layout: GROUPED,
    wheelSensitivity: 0.2,
  });
  graphInstance = cy;
  window.__adrGraph = cy;  // the browser check reaches the instance through this
  style(cy);

  // ---- selection -------------------------------------------------------------
  function show(id) {
    const rec = RECORDS[id];
    if (!rec) return;
    cy.batch(() => {
      cy.elements().removeClass("sel hot dim").addClass("dim");
      const node = cy.getElementById(id);
      node.removeClass("dim").addClass("sel hot");
      node.connectedEdges().removeClass("dim").addClass("hot").connectedNodes().removeClass("dim").addClass("hot");
    });
    pane.classList.remove("empty");
    pane.innerHTML =
      '<div class="meta"><span class="chip">' + id + '</span>' +
      '<span class="chip ' + rec.status + '">' + rec.status + "</span>" +
      '<a class="chip" href="' + rec.file + '">' + rec.file + "</a></div>" +
      '<div id="doc">' + marked.parse(rec.markdown) + "</div>";
    // A link to another record navigates the graph instead of leaving the page. Scoped to
    // the rendered body: the chip above links to this record's own file and must keep its
    // native behaviour, or it would rewire into a no-op that reselects the current record.
    for (const a of pane.querySelectorAll('#doc a[href$=".md"]')) {
      const target = Object.keys(RECORDS).find((k) => RECORDS[k].file === a.getAttribute("href"));
      if (!target) continue;
      a.classList.add("adr");
      a.addEventListener("click", (ev) => { ev.preventDefault(); select(target); });
    }
    pane.scrollTop = 0;
  }

  function select(id) {
    show(id);
    history.replaceState(null, "", "#" + id);
    const n = cy.getElementById(id);
    if (n.length) {
      cy.animate({ center: { eles: n }, zoom: Math.max(cy.zoom(), 0.75) }, { duration: 220 });
    }
  }

  cy.on("tap", "node", (ev) => select(ev.target.id()));
  cy.on("tap", (ev) => {
    if (ev.target !== cy) return;
    cy.elements().removeClass("sel hot dim");
    pane.classList.add("empty");
    pane.innerHTML = "<p>Select a record to read it.<br>Links between records navigate the graph.</p>";
    history.replaceState(null, "", "#");
  });

  // ---- controls --------------------------------------------------------------
  // One chip per domain. Clicking isolates that domain; clicking again restores the
  // whole graph. Counts come from the elements, so the legend cannot disagree with them.
  const nav = document.getElementById("groups");
  let isolated = null;
  for (const g of GROUPS) {
    const count = cy.getElementById(g.id).children().length;
    const chip = document.createElement("button");
    chip.className = "gchip";
    chip.type = "button";
    chip.setAttribute("aria-pressed", "false");
    chip.dataset.group = g.id;
    chip.innerHTML =
      '<span class="sw" style="background:' + g.colour + '"></span>' + g.label +
      ' <span class="n">' + count + "</span>";
    chip.onclick = () => {
      isolated = isolated === g.id ? null : g.id;
      for (const c of nav.children) c.setAttribute("aria-pressed", String(c.dataset.group === isolated));
      cy.batch(() => {
        cy.elements().removeClass("dim");
        if (!isolated) return;
        const keep = cy.getElementById(isolated).children();
        cy.elements().addClass("dim");
        keep.removeClass("dim");
        cy.getElementById(isolated).removeClass("dim");
        // Only edges with both ends inside the domain. A cross-domain edge left lit
        // terminates at a node that is no longer drawn, which reads as a stray line.
        keep.edgesWith(keep).removeClass("dim");
      });
    };
    nav.appendChild(chip);
  }

  document.getElementById("fit").onclick = () => cy.fit(undefined, 30);
  document.getElementById("layout").onchange = (ev) => {
    const choice = ev.target.value;
    // The alternates are force- or tree-based and ignore compound containment, so the
    // domain boxes stretch to wherever their records land. That is a fair view of the
    // relation structure; `grouped` is the one that keeps the domains legible.
    cy.layout(
      choice === "grouped"
        ? GROUPED
        : {
            name: choice, animate: false, padding: 30, directed: true, spacingFactor: 1.15,
            nodeRepulsion: 12000, idealEdgeLength: 70, nestingFactor: 1.2, numIter: 1000,
          },
    ).run();
    cy.fit(undefined, 30);
  };

  document.getElementById("q").addEventListener("input", (ev) => {
    const q = ev.target.value.trim().toLowerCase();
    cy.batch(() => {
      if (!q) { cy.elements().removeClass("dim"); return; }
      cy.nodes().forEach((n) => {
        if (n.isParent()) { n.addClass("dim"); return; }
        const hit =
          n.id().toLowerCase().includes(q) ||
          (n.data("title") || "").toLowerCase().includes(q) ||
          (n.data("group") || "").toLowerCase().includes(q);
        n.toggleClass("dim", !hit);
      });
      cy.edges().addClass("dim");
    });
  });

  window.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") { document.getElementById("q").value = ""; cy.elements().removeClass("dim"); }
    if (ev.key === "/" && document.activeElement !== document.getElementById("q")) {
      ev.preventDefault(); document.getElementById("q").focus();
    }
  });

  // The hash is the address. Honour it on load and on every later change, so the browser's
  // back and forward buttons walk the reading history and a pasted link opens its record.
  function fromHash() {
    const id = decodeURIComponent(location.hash.slice(1));
    if (RECORDS[id]) show(id);
  }
  window.addEventListener("hashchange", fromHash);

  // Fit once the first layout has settled, then honour any deep link. Fitting before
  // the layout runs measures an empty extent and leaves the graph off-screen.
  cy.ready(() => {
    cy.fit(undefined, 30);
    const deep = decodeURIComponent(location.hash.slice(1));
    if (RECORDS[deep]) select(deep);
  });
  window.addEventListener("resize", () => cy.fit(undefined, 30));
})();
</script>
</body>
</html>
