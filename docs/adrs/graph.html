chart components over Recharts, replacing Plotly.\nUntil parity, `assets/report.html` stays the legacy page and `ui-promote` is not run.\n\n## Consequences\n\nA contributor changing the page needs bun; one changing the plugin does not.\nThe built page is a ~330 kB committed artifact that changes on every UI change, which is the price of a dependency-free wheel.\nCI type-checks, lints, tests and builds the workspace on every push now.\nOnce the page is promoted, the same job rebuilds it and fails on a difference from the committed asset, so the two cannot drift.\n`src/components/ui/` is shadcn's generated code and is excluded from lint and format.\nThe root `.gitignore`'s Python patterns (`lib/`, `dist/`) are carved out for `report-ui/src/lib/`.\nWhile the move is in progress the two pages coexist; nothing a user sees changes until promotion.\n\n## Lens\n\nHold a user-facing page to the tooling a page of that quality is built with, and let the build, not the runtime, carry the dependencies.\n"}, "ADR-0029": {"file": "0029-the-billed-sum-is-named-accumulative-billed-tokens.md", "title": "The billed sum is named `accumulative_billed_tokens`", "status": "accepted", "status_note": "accepted, 2026-08-23.\nSupersedes one row of [0021](0021-metric-names-carry-unit-and-provenance.md) (`billed_tokens` → `total_tokens`); refines [0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md).", "markdown": "# 0029: The billed sum is named `accumulative_billed_tokens`\n\nStatus: accepted, 2026-08-23.\nSupersedes one row of [0021](0021-metric-names-carry-unit-and-provenance.md) (`billed_tokens` → `total_tokens`); refines [0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md).\n\n## Context\n\n0019 recorded the run's billed sum as `billed_tokens`. 0021 renamed it `total_tokens` on the grounds that \"`billed` did not say billed what\".\nThat rename was made inside a working session and was not put to the project's owner as a decision.\nIt was noticed when a report row read as \"1,504,090 tokens consumed of a 1M context window, 12%\".\n\n`total_tokens` says neither what is totalled nor over what.\nBeside a context percentage it invites exactly the misreading that occurred.\nThe billed sum across sixteen calls looked like a single quantity to compare with the window.\n[docs/token-accounting.md](../token-accounting.md) works through why the two figures differ by an order of magnitude for an ordinary run.\n\n## Decision\n\nThe billed sum is `accumulative_billed_tokens`.\nIt is the four priced tiers (`input`, `output`, `cache_read`, `cache_write`) summed over every model call of the run.\nThe name states the unit (tokens), the source (what was billed) and the aggregation (accumulated over calls), which is 0021's own rule applied fully.\nThese all use the one name:\n\n- the property on `Usage`\n- the key in `.result.json` `usage`\n- the history line\n- `index.json`\n- the verbose status word\n- both report pages\n- the glossary\n\nThe per-call prompt size keeps its name, `context_tokens`, and its headline `peak_context_tokens`.\n\nTwo things keep the old spelling because they are not this metric:\n\n- the Claude Code record kind `claude/attachment/total_tokens_reminder`\n- the vendors' own `total_tokens` fields in raw usage objects (`reported_usage`, Codex `token_count` events, any record JSON).\n  The reconciliation panel shows them under the vendor's name beside the plugin's figure.\n\n## Consequences\n\n`run.usage.total_tokens` no longer exists.\nGraders that asserted it assert `run.usage.accumulative_billed_tokens > 0` instead (the two eval suites in the first consuming repository are updated in the same change).\nResults and history lines written before this record carry the old key until replayed; `make evals-replay` rewrites them.\nThe status word is longer by one long word, which is the point.\n\n## Lens\n\nA name that can be read two ways will be; name the aggregation, not just the unit.\n"}, "ADR-0030": {"file": "0030-price-rows-live-in-the-pytest-config.md", "title": "Project price rows live in the pytest config, not in a prices.toml beside it", "status": "accepted", "status_note": "accepted, 2026-08-24.\nRefines [0006](0006-local-price-table-is-authoritative.md), [0014](0014-register-through-the-pytest11-entry-point.md) and [0026](0026-skill-ignore-lives-in-the-pytest-config.md); ADR 0007's stop-before-spend rule is unchanged.\nRefined by [0050](0050-prices-are-dated-records-in-usd-per-mtok-grouped-by-harness.md): a line's selector is `<harness>/<model>` and may carry `from=`/`to=` bounds.\nThe bundled table is now dated records in USD per MTok.", "markdown": "# 0030: Project price rows live in the pytest config, not in a prices.toml beside it\n\nStatus: accepted, 2026-08-24.\nRefines [0006](0006-local-price-table-is-authoritative.md), [0014](0014-register-through-the-pytest11-entry-point.md) and [0026](0026-skill-ignore-lives-in-the-pytest-config.md); ADR 0007's stop-before-spend rule is unchanged.\nRefined by [0050](0050-prices-are-dated-records-in-usd-per-mtok-grouped-by-harness.md): a line's selector is `<harness>/<model>` and may carry `from=`/`to=` bounds.\nThe bundled table is now dated records in USD per MTok.\n\n## Context\n\n0026 moved skill-ignore rules out of a dotfile beside the skill and into the `xharness_skill_ignore` ini key.\nIt did so on the grounds that a pytest plugin's permanent, file-based configuration belongs where pytest keeps its own.\nPrice overrides had the same shape left over.\nThe `xharness_prices` ini key named a *file* (`prices.toml` at the rootdir) whose TOML rows layered over the bundled table.\nSame objection:\n\n- a second configuration file in a second format that nothing in `pytest --help` reveals the contents of\n- one more thing to discover\n- a unit trap inside it: rows were USD **per token** (`5.0e-6`), while every provider publishes USD per million tokens\n\n## Decision\n\n`xharness_prices` becomes a linelist of price rows, in the way pytest's own `markers` lines pair a name with its text:\n\n```toml\n[tool.pytest.ini_options]\nxharness_prices = [\n    \"gpt-5.6-terra: input=1.25 output=10.00 cache_read=0.125\",\n    \"claude-sonnet-5: input=2.00 output=10.00 cache_read=0.20 cache_write=2.50 cache_write_1h=4.00\",\n]\n```\n\nValues are **USD per million tokens**, the unit providers publish; the plugin divides by 1e6.\n\n- `input` and `output` are required.\n- `cache_read` and `cache_write` default to `input`.\n- `cache_write_1h` defaults to `cache_write` × 1.6 (Anthropic's 2.0/1.25 TTL ratio).\n\nThis is the same defaulting the bundled table has always had.\nThe selector before the colon is the model key, prefix-matched by `resolve` like any bundled row.\n\nBecause the bundled table stays per-token, a row pasted from it into the ini would under-price by a factor of a million.\nA value below $0.001/MTok is therefore rejected as \"looks like a per-token rate\".\nA malformed line, an unknown tier, or a missing required tier stops the session at configure time, before any cell is collected.\nIt is the same never-price-as-zero posture as 0007.\n\nThe bundled `prices.toml` inside the package is unchanged.\nIt is the plugin's own versioned data file, not project configuration, and remains the one `__file__` exception of 0014.\nThe replay command resolves `xharness_prices` from the project's pytest config the way it already resolves `xharness_skill_ignore`.\nThe reader is now `config_lines_of(captured, key)`.\nIts `--prices FILE` flag becomes `--price LINE` (repeatable, same grammar).\n`rates_applied.source` records `xharness_prices` for ini rows and the bundled file's path for bundled rows.\n\n## Consequences\n\nA project that had a rootdir `prices.toml` moves each row onto one line, multiplying by 1e6, and deletes the file.\nUntil it does, its overrides are silently gone.\nA model priced only there stops the sweep at collection: loudly, per 0007.\nA project whose ini still says `xharness_prices = \"prices.toml\"` now fails at configure time with the line-grammar error, which is the migration signal.\nDated overrides (an introductory price) become one commented line in the pytest config instead of a block in a side file.\nSo their expiry note sits where the reviewer of the config change will see it.\n\n## Lens\n\nThe second file a tool asks a project to maintain should have to argue for itself harder than the first.\nAnd state prices in the unit the price tag uses.\n"}, "ADR-0031": {"file": "0031-plotly-tamagui-and-a-deeplink-permutation-matrix.md", "title": "The report draws with Plotly on a Tamagui base, every state deeplinks, and a Playwright matrix sweeps them all", "status": "accepted", "status_note": "accepted, 2026-08-27.\nRefines [0020](0020-captured-report-is-a-static-microsite.md), [0024](0024-context-window-metrics-injected-messages-and-design-tokens.md), [0025](0025-results-name-their-case-and-charts-have-a-log-line-axis.md) and [0028](0028-report-is-built-from-a-component-workspace.md); supersedes 0028's shadcn/recharts component stack and 0024's fold-onto-the-last-colour series rule.", "markdown": "# 0031: The report draws with Plotly on a Tamagui base, every state deeplinks, and a Playwright matrix sweeps them all\n\nStatus: accepted, 2026-08-27.\nRefines [0020](0020-captured-report-is-a-static-microsite.md), [0024](0024-context-window-metrics-injected-messages-and-design-tokens.md), [0025](0025-results-name-their-case-and-charts-have-a-log-line-axis.md) and [0028](0028-report-is-built-from-a-component-workspace.md); supersedes 0028's shadcn/recharts component stack and 0024's fold-onto-the-last-colour series rule.\n\n## Context\n\n0028 built the report page from a Vite workspace on shadcn/ui (radix) with recharts, smoke-tested by rendering the bundle in jsdom.\nThree pressures outgrew that stack:\n\n- The charts are the product.\n  recharts composes primitives well but tops out early.\n  Its legends overflowed the card on sweeps with many sessions.\n  Unified hover, SI ticks and step-stacked areas each needed hand-rolling.\n- The page's quality bar is \"AAA for every permutation of the results data\".\n  That bar is only checkable if every state is addressable by URL and something sweeps them all.\n  jsdom cannot render the real page (no layout, no canvas), so the smoke proved boot, not behaviour.\n- Two component systems (radix primitives styled by Tailwind classes) meant every interactive state was styled twice and animated nowhere.\n\n## Decision\n\nThree moves, one per pressure.\n\n**Plotly.js draws every chart.** `plotly.js-basic-dist-min` (scatter, bar: all the page needs) through one mount point, `components/charts/Plot.tsx`.\nLayouts are built from `useChartTheme()`, which resolves the `--xh-*` custom properties to concrete values and re-resolves when the theme flips.\nSo 0024's design tokens still own every colour.\nLegends are DOM (`ChartLegend`): flexbox chips that wrap instead of overflowing and toggle a trace by re-rendering it as `legendonly`.\nSeries past the eight-colour token palette cycle through it with a different line dash per lap.\nThis supersedes 0024's rule that a ninth session folds onto the last colour, which made nine of sixteen lines identical.\n\n**Tamagui is the base UI and animation framework.** `components/ui/*` are hand-written Tamagui components now, not shadcn output; radix and Tailwind are both gone.\nLayout, chrome and interactivity are Tamagui components with props.\nThe Tamagui themes hold `var(--xh-*)` references: both light and dark on purpose.\nThat is because 0024's `.dark` class flip on the root already swaps the underlying values.\nDocument content (tables, record cards, code blocks, key/value grids) is semantic HTML styled by one hand-written stylesheet (`index.css`), token-driven like everything else.\nOne trap is load-bearing: Tamagui injects its atomic classes at runtime, after the stylesheet.\nSo chrome that must overrule it (the segmented control) is pinned with `!important`.\nPositioning on Tamagui components is set through props, never classes.\n\n**Every state deeplinks, and one Playwright test sweeps the matrix.** The URL is the single source of truth: real History-API routes as query strings.\nIt uses no fragment router; query, not path segments, because the one static file must route with zero server rewrites and over `file://`.\n`session`, `turn`, `view` keep their 0020 meanings, and these join them:\n\n- `axis` (0025's log-line axis)\n- `rec` (raw/nice records)\n- `line` (a record-level permalink that opens its owning turn and flashes the card)\n- `sort`/`dir` (overview table)\n- `theme`\n\nA param absent from the URL means its default: state never sticks across navigations.\nNavigations push history entries, and legacy `#…` links upgrade to their query form on load.\n`lib/permutations.ts` enumerates the covering matrix from the captured data itself.\nIt covers every turn of every session in both views, plus one permutation per remaining param per view type.\nIt gives each state a deterministic filesystem-safe slug.\nThe matrix is tiered:\n\n- `small` constrains every dimension to one representative value (one session per harness, one mid turn, detailed view only)\n- `medium` to a few (one session per harness×model, first/middle/last turns, every variant)\n- `large` to all\n\nSo the inner loop stays seconds long and the full-cost sweep is absorbed less frequently.\nTiers nest by slug, so a faster run refreshes a subset of the same artifact tree.\nThe singular `e2e/matrix.spec.ts` full-loads each permutation in a real browser and asserts zero console errors.\nIt saves screenshot, console transcript and network timings under `tmp/e2e/matrix/<slug>/`.\nThat is the shared, precise language for \"this exact state is broken\".\nThe jsdom smoke is replaced by `e2e/inline.spec.ts`, which opens the inline-populated build over `file://` and checks the glossary-id parity list in a real browser.\n\n## Consequences\n\n- `make ui-e2e CAPTURED=<dir> TIER=small|medium|large` sweeps the matrix (`SAMPLE=<n>` for an evenly spaced sample, `E2E_TARGET=dev` against the dev server); `make ui-smoke` needs a browser, not jsdom.\n  Playwright's chromium must be installed once (`bunx playwright install chromium`).\n- The bundle grows to ~1.7 MB (Plotly basic inlined); still one file, still offline.\n- A new route param must be added to `lib/permutations.ts` in the same change, or the matrix silently stops covering it.\n- `window.__XH_PENDING__` (in-flight loads) and `[data-xh-loading]` markers are the page's settledness contract with the e2e suite.\n"}, "ADR-0032": {"file": "0032-all-run-output-consolidates-under-a-cache-dir.md", "title": "All run output consolidates under `.xharness_eval_cache/`, and the report is one combine step", "status": "accepted", "status_note": "accepted, 2026-08-27.\nRefines [0014](0014-register-through-the-pytest11-entry-point.md) (path resolution), [0018](0018-fixtures-directory-and-metrics-history.md) (history) and [0020](0020-captured-report-is-a-static-microsite.md) (the microsite); supersedes 0018's `captured/` location, 0020's one-report-per-captured-directory rule, and the `xharness_workdir` ini key.", "markdown": "# 0032: All run output consolidates under `.xharness_eval_cache/`, and the report is one combine step\n\nStatus: accepted, 2026-08-27.\nRefines [0014](0014-register-through-the-pytest11-entry-point.md) (path resolution), [0018](0018-fixtures-directory-and-metrics-history.md) (history) and [0020](0020-captured-report-is-a-static-microsite.md) (the microsite); supersedes 0018's `captured/` location, 0020's one-report-per-captured-directory rule, and the `xharness_workdir` ini key.\n\n## Context\n\nRun output used to land in two conventions at once.\nPer-cell workspaces and `report.json` went under `tmp/evals/` (`xharness_workdir`).\nEvidence went under each skill's own tree at `<skill>/evals/captured/<case>/`, with a shared, appended `history.jsonl` beside it.\nThree pressures broke that shape:\n\n- A sweep across several skills produced several disconnected reports and no page over the whole run.\n  The SPA had grown multi-skill affordances with no index that ever exercised them.\n- Build artifacts accumulated inside `skills/` (the source tree), and every consuming repo needed its own git-ignore lines for them.\n- The shared `history.jsonl` was the one file two parallel writers could contend on.\n  That is exactly the problem pytest-cov solves with suffix files.\n  Every writer owns a unique path, and a single combine step aggregates.\n\n## Decision\n\nOne git-ignored root, resolved against the pytest rootdir through the new `xharness_cache_dir` ini key (default `.xharness_eval_cache`, matching the common `.*_cache/` ignore convention). `xharness_workdir` is gone.\n\n```text\n.xharness_eval_cache/\n  build/                                   # per-cell isolated workspaces\n  results/{skill}/{harness}/{model}/{run_ts}/{session_id}/\n    log.jsonl                              # the session log, verbatim\n    result.json                            # the derived RunResult (replayable)\n    history.json                           # one metrics record\n  report/\n    report.json                            # the last run's summary\n    history.jsonl                          # aggregated from results/**/history.json\n    index.json, report.html, report.tokens.json, XHARNESS-REPORT-GLOSSARY.md\n```\n\n- **Suffix convention.** A cell writes only inside its own `{run_ts}/{session_id}/` directory: no shared file, no lock, full parallelisation under xdist.\n  `run_ts` is one UTC stamp per pytest session (`YYYYMMDDTHHMMSSZ`, exported as `XHARNESS_EVAL_RUN_TS` so xdist workers agree).\n  So repeated runs accumulate side by side instead of overwriting.\n- **One combine step.** At session end (and on every replay) the report step walks everything under `results/` (every skill, every run).\n  It aggregates the per-session `history.json` records into `report/history.jsonl`, and writes one `index.json` and one `report.html` into `report/`.\n  Index rows point at evidence by relative path (`../results/…`), so serving the cache root serves the whole report: `python3 -m http.server --directory .xharness_eval_cache` → `/report/report.html`.\n- **Replay is also the migrator.** `python -m pytest_xharness_eval.replay <cache>` rebuilds every result under `results/` as before.\n  Pointed at a legacy `<skill>/evals/captured` directory, it migrates that evidence into the project's cache (the original is left untouched) and then rebuilds.\n- **Plain files stay.** Everything remains human-readable `.json`/`.jsonl`; a database or columnar format is complexity to adopt when scale demands it, not before.\n\n## Consequences\n\n- Skills directories no longer accumulate run output, and one `.*_cache/` ignore line covers everything.\n- The report is a sweep-level page: multiple skills, multiple runs, one index.\n  The SPA needed no data-contract change: index rows were always opaque relative paths.\n- `report.json` moves from `tmp/evals/` to `.xharness_eval_cache/report/`.\n- Consuming repos drop `xharness_workdir` from their pytest config; `xharness_cache_dir` exists for the rare override.\n"}, "ADR-0033": {"file": "0033-subagent-transcripts-are-captured-and-billed.md", "title": "Subagent transcripts are captured evidence, and their tokens are billed", "status": "accepted", "status_note": "accepted, 2026-08-28.\nRefines [0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md) (the ledger), [0021](0021-metric-names-carry-unit-and-provenance.md) (nothing is truncated) and [0032](0032-all-run-output-consolidates-under-a-cache-dir.md) (the session directory layout).", "markdown": "# 0033: Subagent transcripts are captured evidence, and their tokens are billed\n\nStatus: accepted, 2026-08-28.\nRefines [0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md) (the ledger), [0021](0021-metric-names-carry-unit-and-provenance.md) (nothing is truncated) and [0032](0032-all-run-output-consolidates-under-a-cache-dir.md) (the session directory layout).\n\n## Context\n\nSkills that instruct the agent to parallelise (the discovery skill spawns research subagents) produce more than one transcript per session:\n\n- Claude Code writes each spawned agent to `projects/<slug>/<session-id>/subagents/agent-<id>.jsonl`.\n  Beside it sits an `agent-<id>.meta.json` sidecar carrying the agent type, the spawn description and the `toolUseId` of the Agent tool call that spawned it.\n  The primary session log holds no sidechain records at all.\n- Codex forks one rollout file per spawned thread under the same `CODEX_HOME`.\n  Its `session_meta` carries `source.subagent.thread_spawn` (nickname, agent path, depth) and `forked_from_id` naming the primary.\n  [0005](0005-private-codex-home-per-run.md) already made the private home the place they can all be found.\n  `primary_rollout()` already tells them apart.\n\nBefore this decision those transcripts were dropped:\n\n- The tokens the spawned threads spent were invisible to the ledger.\n- The estimate under-billed the run (a discovery session's real bill was ~1.5–2x what the report said).\n- The evidence contract (the verdict is tied to what the agent actually did) had a hole the size of every parallel thread.\n\n## Decision\n\n- **Capture.** Every subagent transcript is copied into `<session dir>/subagents/` beside `log.jsonl` (Claude's `.meta.json` sidecars included).\n  The runner passes Codex's forked rollouts explicitly; a captured session (and therefore replay) discovers them from the directory alone.\n- **Normalise.** Each transcript folds through the same ledger machinery as the primary (`claude_ledger` / the Codex fold).\n  `RunResult.subagents` lists one `Subagent` per thread: agent name, id, captured log path, its own `Call` ledger and `Usage`, and `parent_turn`.\n  `parent_turn` is the primary turn that spawned it (matched by tool-use id on Claude, by spawn timestamp on Codex).\n- **Bill.** A subagent's usage folds into the run's `usage`: `usage` is the whole bill, priced at the run's own rates, and `accumulative_billed_tokens` covers every thread. `turns` and `calls` stay the primary thread's own.\n- **Render.** The report attributes each thread's bill to its spawning turn:\n  - The token waterfall carries a `sub` category (its own design token).\n  - The running cost line includes it.\n  - The turn table shows a `SubagentBand` (each spawned thread's own per-call ledger) beneath the turn that spawned it.\n\n## Consequences\n\n- A discovery-style session's estimate now matches what the provider will actually charge.\n  Sweeps re-price historical runs on replay, so cached totals rise once and stay honest.\n- A subagent is priced at the primary run's rates.\n  If a harness ever spawns subagents on a *different* model, the estimate mis-prices those threads.\n  The rates row a thread was priced with is `rates_applied`, so the drift is explainable.\n  Revisit when a harness reports per-thread models worth splitting.\n- Replay derives identical subagent ledgers from the captured directory, so the session directory remains the complete unit of evidence (0032).\n"}, "ADR-0034": {"file": "0034-a-harness-is-a-class-and-the-registry-is-the-only-dispatch.md", "title": "A harness is a class, the registry is the only dispatch, and the layers are named", "status": "accepted", "status_note": "accepted, 2026-08-28.\nRefines [0002](0002-every-cell-invokes-the-real-cli.md) (the real CLI), [0014](0014-register-through-the-pytest11-entry-point.md) (locations are ini keys), [0015](0015-harness-is-the-axis-and-the-project-owns-the-matrix.md) (harness is the axis) and [0023](0023-turn-boundaries-skill-ignore-and-replay.md) (replay).\nStructural only: no record's shape and no metric's value changes.", "markdown": "# 0034: A harness is a class, the registry is the only dispatch, and the layers are named\n\nStatus: accepted, 2026-08-28.\nRefines [0002](0002-every-cell-invokes-the-real-cli.md) (the real CLI), [0014](0014-register-through-the-pytest11-entry-point.md) (locations are ini keys), [0015](0015-harness-is-the-axis-and-the-project-owns-the-matrix.md) (harness is the axis) and [0023](0023-turn-boundaries-skill-ignore-and-replay.md) (replay).\nStructural only: no record's shape and no metric's value changes.\n\n## Context\n\n0015 named *harness* as the first matrix axis, but the axis stayed a bare string.\nThe behaviour behind it had accumulated across six modules in four unrelated dispatch idioms:\n\n| Site | Idiom | What a third harness did |\n| --- | --- | --- |\n| `matrix.KNOWN_HARNESSES` | tuple literal | failed loudly |\n| `runner.RUNNERS` | dict lookup | failed loudly |\n| `normalise.from_claude` / `from_codex` | no dispatch; different signatures | failed loudly |\n| `records.classify` | `if harness == \"claude\" else _classify_codex` | **read as Codex, silently** |\n| `replay.rebuild_result` | `if old[\"harness\"] == \"claude\": ... else:` | **read as Codex, silently** |\n| `skillcov._SHELL_TOOLS` | one set unioning both providers' tool names | mis-attributed coverage, silently |\n\nTwo of the six defaulted rather than failing.\nThat is the opposite of the evidence contract this plugin is built on (0002: never grade a run whose evidence is missing or ambiguous).\n\nThe signature asymmetry was the load-bearing defect.\nA Claude session log is *incomplete*: the session id, `total_cost_usd` and the aggregate usage exist only on the `-p --output-format json` stdout envelope.\nA Codex rollout, by contrast, is self-contained but records no process exit code.\nThat asymmetry was exposed through the interface rather than encapsulated.\nSo `replay.py` had to fabricate a synthetic Claude envelope out of a stored `result.json`.\nThat was eight lines of Claude-specific knowledge in the module that otherwise knows nothing about Claude.\n\nSeparately, three layers were interleaved.\n`plugin.py` was simultaneously the pytest interface, the config resolver, the cell execution sequence and the evidence writer.\n`replay.py` independently reimplemented the config resolver (a second pytest-rootdir walker, with `configparser`).\nIt also reimplemented the execution sequence (price, annotate, name the case, write the metrics record).\nNothing failed when those two copies drifted: a replay would simply produce a record a live run never would.\n\n## Decision\n\n**A harness is a class.** `Harness` (in `harness/base.py`) is the extension point.\nA provider implements five members: `name`, `run`, `session_from_capture`, `classify_record`, and the `shell_tools` / `persistent_shells` its coverage attribution needs.\n`register()` puts it in the registry.\n`get(name)` is the only way to reach one, and an unregistered name raises `UnknownHarness` rather than falling through to a default.\n\n**A session log is a class.** `SessionLog` holds the log *plus the side-channel its dialect needs*.\n`ClaudeSessionLog` carries the stdout envelope, `CodexSessionLog` the exit code and the forked rollouts.\nSo every caller gets one uniform `to_result(workspace, files_written)` and none has to know which dialect needs what.\nThe Claude envelope reconstruction moves to `ClaudeHarness.session_from_capture`, beside the dialect that requires it.\n\n**The layers are named modules.** `settings.py` resolves configuration once, for both entry points:\n\n- `Settings.from_config` for a live sweep\n- `Settings.from_cache` for a replay running outside any pytest session\n\n`pipeline.py` owns the sequence that both paths run over a `RunResult`:\n\n- derive (price, annotate coverage, name the case)\n- capture (log, subagent transcripts, result)\n- record metrics\n\n`plugin.py` keeps only pytest hooks and collection; `report.py` and `replay.py` keep only curation.\n`normalise.py` keeps the shared folding primitives and knows about no provider at all.\n\n**The boundary is enforced, not just documented.** A ruff `TID251` banned-api rule fails the build if anything outside the harness package imports `harness.claude` or `harness.codex` by name.\nIt carries an owner and a 2027-08-28 review date in `pyproject.toml`.\nIf the registry is ever abandoned the rule is deleted rather than left to mislead.\n\n`runner.py` is gone.\nIts shared half (`RunError`, `spawn`, the default timeout) is `harness/base.py`; each provider's half is its own module.\nThe `pragma: no cover` markers move with the code they justify: spawning a CLI is still never mocked or faked (0002).\n\n## Consequences\n\nAdding a third CLI is one new module under `harness/` and one `register()` call. `matrix.known_harnesses()` reads the registry, so a harness cannot be runnable but unmatrixable.\nThe two silent Codex defaults are now `UnknownHarness`.\n\nBehaviour is unchanged, and that is checked rather than asserted.\n`tests/test_characterization.py` pins the whole serialised `RunResult` for a rich capture of each dialect against a golden.\nIt also pins that a replay reproduces the live result from the captured directory alone.\nThose goldens did not move across any step of this change.\nThey normalise out the tmp path and the `rates_applied` wall-clock stamp: pinning either would pin noise.\n\nTwo coverage cases had been sharing one fixture that put Claude's `Bash` and Codex's `exec` on a single run.\nThat only type-checked because `_SHELL_TOOLS` unioned both vocabularies.\nA result comes from exactly one harness, so that test is now two.\n\nExtraction made previously unreachable code testable.\nThe evidence-capture and metrics-record steps used to sit inside `plugin.EvalItem._run_live`, behind the `pragma: no cover` that the paid CLI call requires.\nIn `pipeline.py` they are ordinary functions, tested without invoking anything.\n\n`report.py` and the report UI are untouched: no key of `result.json`, `index.json` or `history.jsonl` changes, so `report-ui/src/lib/types.ts` and the glossary stay valid.\n\n## Lens\n\nWhen one axis is named but stays a string, its behaviour spreads into every module that has to ask what it is.\nAnd the branches that *default* are worse than the ones that fail.\nGive the axis a type, make the registry the only way to reach an implementation, and let a linter keep the boundary you just drew.\n"}, "ADR-0035": {"file": "0035-the-nouns-carry-their-own-invariants.md", "title": "The nouns carry their own invariants", "status": "accepted", "status_note": "accepted, 2026-08-28.\nRefines [0003](0003-runresult-is-a-stdlib-dataclass.md) (RunResult is a stdlib dataclass), [0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md) (the per-call ledger) and [0021](0021-metric-names-carry-unit-and-provenance.md) (rates travel with the estimate).\nIt also refines [0022](0022-record-kind-catalogue-and-skill-coverage.md) (skill coverage), [0025](0025-results-name-their-case-and-charts-have-a-log-line-axis.md) (a result names its case) and [0033](0033-subagent-transcripts-are-captured-and-billed.md) (subagents are billed).\nStructural only: no serialised key and no metric's value changes.\nThe folding constructors' keyword fields are declared and type-checked by [0036](0036-a-folding-constructor-declares-its-keyword-fields.md).", "markdown": "# 0035: The nouns carry their own invariants\n\nStatus: accepted, 2026-08-28.\nRefines [0003](0003-runresult-is-a-stdlib-dataclass.md) (RunResult is a stdlib dataclass), [0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md) (the per-call ledger) and [0021](0021-metric-names-carry-unit-and-provenance.md) (rates travel with the estimate).\nIt also refines [0022](0022-record-kind-catalogue-and-skill-coverage.md) (skill coverage), [0025](0025-results-name-their-case-and-charts-have-a-log-line-axis.md) (a result names its case) and [0033](0033-subagent-transcripts-are-captured-and-billed.md) (subagents are billed).\nStructural only: no serialised key and no metric's value changes.\nThe folding constructors' keyword fields are declared and type-checked by [0036](0036-a-folding-constructor-declares-its-keyword-fields.md).\n\n## Context\n\n0034 gave the *harness* axis a type and ended four dispatch idioms.\nEverything downstream of `SessionLog.to_result` was still dict-and-string plumbing, and four of this plugin's load-bearing rules survived only as prose repeated in docstrings:\n\n| Rule | How it was held | How it could break |\n| --- | --- | --- |\n| A run's `usage` is its whole bill: the primary ledger plus every subagent | `normalise.sum_usage` + `normalise.attach_subagents`, called by each adapter by hand | `attach_subagents` mutated `result.usage` in place, so calling it twice silently doubled the bill of every spawned thread |\n| An estimate never exists without the rates behind it (0021) | `pricing.price` assigning four `RunResult` fields in order, from a foreign module | any one of the four could be written, or left, alone |\n| `cost_status` is `priced` or `unpriced` | a `str` field with two string literals in two modules | a third spelling type-checked |\n| The case and the coverage records have fixed shapes | `dict[str, Any]`, hand-built in `pipeline.case_record`, `replay.case_meta` and `skillcov.annotate`/`catalog` | three hand-built copies of one key set, and `history.metrics_of` `.get()`-ing keys nothing guaranteed |\n\nTwo of those are not stylistic.\n`Usage.add` was the only mutable accumulator in the model.\nAnd the one thing that must be summed exactly once is the number every verdict's cost is computed from.\nAnd the four cost fields written in sequence by another module is the same shape of defect 0034 removed from classification.\nThe invariant lived in the caller, so every caller had to be trusted with it.\n\nEach harness adapter also still exposed a `from_<provider>` module function that its `SessionLog.to_result` forwarded to in one line.\nIt was the last remnant of the pre-0034 signatures, and the reason the fold sat outside the class that owns it.\n\n## Decision\n\n**A total is a value, not an accumulator.** `Usage` is frozen and gains `__add__` and `Usage.total(...)`. `Usage.add` is gone, and with it `normalise.sum_usage` and `normalise.attach_subagents`.\n\n**One folding constructor computes the bill once.** `RunResult.folded(calls, subagents, **fields)` sets `turns = len(calls)` and `usage = Σ calls + Σ subagents`, and sorts the subagents.\n`Subagent.folded(calls, ...)` is its counterpart for one spawned thread.\nBoth adapters build their result through it, so a second fold cannot bill a subagent twice.\nThe failure mode is now unrepresentable rather than merely undocumented.\n\n**A price is applied atomically.** `pricing.CostEstimate` (total, per-tier split, `AppliedRates` provenance) is built by `CostEstimate.of(usage, rates)` and applied by the single method `RunResult.apply_cost`. `Rates` owns the arithmetic that prices a `Usage`.\nNo module outside `runresult.py` writes a cost field. `cost_status` is a `StrEnum`: a `str` subclass, so `asdict` keeps the member and `json.dumps` writes the same word the wire format has always carried.\n\n**The two hand-built records become types.** `CaseRef` (`of` from a live case, `stored` from a capture) replaces `pipeline.case_record` and the mapping `replay.case_meta` returned.\n`SkillFile`, `FileCoverage`, `CoverageSummary` and `SkillCoverage` replace the mappings `skillcov.catalog` and `annotate` built.\n`SkillCoverage.over` derives the four path sets and the summary from the annotated rows in one place, so they cannot disagree with each other.\n`FileKind` and `Access` are `StrEnum`s.\n\n**The fold belongs to the session log.** `from_claude` and `from_codex` are gone; their bodies are `ClaudeSessionLog.to_result` and `CodexSessionLog.to_result`.\nThe paid `run_claude` / `run_codex` spawn functions stay module-level.\nThey are `pragma: no cover` by 0002, so a motion bug in them would be discovered only by spending money.\n\n**`ignorerules.py` is its own module.** The `xharness_skill_ignore` line selection and the gitignore-pattern subset know nothing about skills, runs or harnesses.\n`IgnoreRules.for_skill(skill, lines)` compiles them once and `.matches(rel)` is the only question asked of them.\n`skillcov.py` is now about coverage alone.\n\n**`asdict` stays the serialiser.** `RunResult.to_dict` is still `asdict(self)` plus derived keys, and never a per-field `.to_dict()` walk.\nThat is what renders the typed records into the exact key sets they declare while passing a plain mapping straight through.\nIt is also why `usage` stays a field rather than becoming a computed property.\n`asdict` drops properties, and `usage` is a key of `result.json`.\nThe three optional records (`case`, `skill_coverage`, `rates_applied`) serialise as `{}` when absent, as they always have.\n\n## Consequences\n\nEvery serialised contract is unchanged, and that is checked rather than claimed.\n`tests/test_characterization.py` pins the whole `RunResult` of a rich capture per dialect.\nIt also pins that a replay reproduces the live result from the captured directory alone.\nBoth goldens are byte-identical across this change, so `report.py`, `report-ui/src/lib/types.ts` and the glossary stay valid.\n\n`history.metrics_of` reads attributes instead of `.get()`-ing keys, but still emits a flat mapping of builtins.\nThat record travels to the xdist controller on `TestReport.user_properties`, which serialises builtins only (0016).\nThe dict boundary is deliberate and now stated where it is crossed.\n\n`skillcov.py` drops from 491 to 397 lines; `runresult.py` grows to 382 as the invariants move next to the data they constrain.\n\nThe unit tests changed shape with the API (mapping subscripts became attribute access, the two `from_<provider>` call sites became their session-log classes).\nNo assertion was weakened to accommodate the move.\n\n## Lens\n\nA rule that lives in a docstring is enforced by whoever read it last.\nPut the sum on the type that owns it, make the multi-field write a single method, and give the record a name.\nThen the illegal state stops being something reviewers have to watch for.\n"}, "ADR-0036": {"file": "0036-a-folding-constructor-declares-its-keyword-fields.md", "title": "A folding constructor declares its keyword fields", "status": "accepted", "status_note": "accepted, 2026-08-28.\nRefines [0035](0035-the-nouns-carry-their-own-invariants.md) (the nouns carry their own invariants) and [0003](0003-runresult-is-a-stdlib-dataclass.md) (RunResult is a stdlib dataclass).\nStructural only: no serialised key and no metric's value changes.", "markdown": "# 0036: A folding constructor declares its keyword fields\n\nStatus: accepted, 2026-08-28.\nRefines [0035](0035-the-nouns-carry-their-own-invariants.md) (the nouns carry their own invariants) and [0003](0003-runresult-is-a-stdlib-dataclass.md) (RunResult is a stdlib dataclass).\nStructural only: no serialised key and no metric's value changes.\n\n## Context\n\n0035 replaced two per-adapter constructions of `RunResult` with one folding constructor, so that the run's whole bill is summed exactly once.\nIt spelled the remaining dialect fields `**fields: Any`, and that spelling gave back more than the fold won.\n`Any` erases the keyword names and their types.\nSo at the only two construction sites in the codebase the type checker stopped seeing the fields it had been checking:\n\n| Written at an adapter | Before 0035 (`RunResult(...)`) | After 0035 (`**fields: Any`) |\n| --- | --- | --- |\n| `harnes=\"claude\"` | `Unexpected keyword argument` | accepted |\n| `model=123` | `incompatible type \"int\"` | accepted |\n| omitting `duration_ms` | `Missing named argument` | accepted |\n\nAll three verified against this repository's pinned mypy under `--strict`.\nThe regression sat at exactly the seam 0035 existed to harden.\nIt made \"build one with `folded`\" a rule held by a docstring (the prose enforcement that ADR set out to end).\nThat was because nothing distinguished a correct call from a wrong one.\n\nThe keyword caravan also hid a second thing.\n`RunResult` has four groups of fields with four different owners, and `**fields: Any` let a harness adapter reach all of them.\nIt could have set `estimated_cost_usd` without the rates that justify it, bypassing `apply_cost`, or written `skill_coverage` before the run was graded.\n\n## Decision\n\n**The keyword fields are a TypedDict, unpacked.** `RunResultFields` and `SubagentFields` declare, key by key with its exact type, what a harness adapter supplies.\n`folded` takes `**fields: Unpack[RunResultFields]` (PEP 692, stdlib since 3.12, and this package targets 3.12).\nRequired keys are the dataclass fields that have no default, so a missing one is a type error too.\nUnpacking the TypedDict into the dataclass call is what checks each key's *type* against the field it lands on.\nThe two declarations cannot disagree without failing the gate.\n\n**A field's owner is visible in what the TypedDict omits.** Four groups partition `RunResult`, and only the last is reachable through the constructor:\n\n| Group | Owner | Fields |\n| --- | --- | --- |\n| derived | `RunResult.folded` | `turns`, `usage`, `calls`, `subagents` |\n| priced | `RunResult.apply_cost` (0021) | `estimated_cost_usd`, `cost_status`, `cost_by_tier`, `rates_applied` |\n| attached | `pipeline.derive` after grading (0022, 0025) | `case`, `skill_coverage` |\n| supplied | the harness adapter, via `RunResultFields` | everything else |\n\n`tests/test_units.py` asserts those four groups tile the dataclass exactly.\nThat is the one drift a type checker cannot see.\nA *new* field would be silently unreachable through `folded` rather than an error, and a stale key would fail first at a paid call site.\n\n## Consequences\n\nBoth adapters are unchanged (the calls they already wrote type-check as they are) and so is every serialised key.\nThe characterization goldens are byte-identical, which is the evidence that this is a declaration and not a change.\n\n`__required_keys__` is not the checker's view at runtime: this package uses `from __future__ import annotations`, so `NotRequired` is never unwrapped and every key reports as required.\nThe partition test unions required with optional and says why, so the caveat is recorded where someone would otherwise \"fix\" it.\n\n## Lens\n\n`**kwargs: Any` on a constructor is a hole in the type system shaped exactly like the constructor it is meant to protect.\nDeclare the keywords as a TypedDict and unpack them.\nThen the set of fields a caller may set (and, by omission, the ones that belong to another owner) is checked rather than described.\n"}, "ADR-0037": {"file": "0037-the-emitted-records-are-types-and-the-cache-tree-has-one-owner.md", "title": "The emitted records are types, and the cache tree has one owner", "status": "accepted", "status_note": "accepted, 2026-08-28.\nRefines [0016](0016-results-travel-on-the-test-report.md) (results travel on the test report) and [0018](0018-fixtures-directory-and-metrics-history.md) (the metrics record).\nIt also refines [0020](0020-captured-report-is-a-static-microsite.md) (the report is a static microsite) and [0032](0032-all-run-output-consolidates-under-a-cache-dir.md) (all run output consolidates under a cache dir).\nIt also refines [0035](0035-the-nouns-carry-their-own-invariants.md) (the nouns carry their own invariants).\nStructural only: no serialised key and no metric's value changes, and the characterization goldens are byte-identical.", "markdown": "# 0037: The emitted records are types, and the cache tree has one owner\n\nStatus: accepted, 2026-08-28.\nRefines [0016](0016-results-travel-on-the-test-report.md) (results travel on the test report) and [0018](0018-fixtures-directory-and-metrics-history.md) (the metrics record).\nIt also refines [0020](0020-captured-report-is-a-static-microsite.md) (the report is a static microsite) and [0032](0032-all-run-output-consolidates-under-a-cache-dir.md) (all run output consolidates under a cache dir).\nIt also refines [0035](0035-the-nouns-carry-their-own-invariants.md) (the nouns carry their own invariants).\nStructural only: no serialised key and no metric's value changes, and the characterization goldens are byte-identical.\n\n## Context\n\n0035 and 0036 gave the run record and its parts real types.\nEverything the product *emits* was still a mapping assembled by hand:\n\n| Emitted document | How it was built | What that cost |\n| --- | --- | --- |\n| `history.json` (one per session) | `history.metrics_of`, a 41-key dict literal | no type, no key set, `.get()` at every reader |\n| `report/index.json` rows | `report._row`, a 35-key dict literal | the same, plus the row's derivation buried in it |\n| `report.json` cells | the same records, plus a *fourth* shape for `--dry-run` | five keys where readers expected 41 |\n\nThese are wire formats. `report-ui/src/lib/types.ts` mirrors them, the glossary names them, and nothing in this repository failed when one drifted.\n\nThree further consequences of not having the types:\n\n- **`cache` was stamped on afterwards.** `pipeline.record_metrics` called `history.metrics_of` and then wrote `record[\"cache\"] = str(cache)` onto the mapping a different module had just built.\n  The record's own definition did not mention the field the controller depends on to find the cache root (0032).\n- **The dry-run record was a different document.** Five keys with the same `verdict` field, written onto `report.json` beside full ones.\n- **A replay read `history.json` twice, by hand.** `replay.rebuild` and `replay.case_meta` each opened it, each caught `JSONDecodeError`, and each `.get()`-ed the keys it wanted.\n\nThe cache tree had the same problem one level down.\nThe five-level layout of 0032 is a published contract (the page fetches `../results/{skill}/{harness}/{model}/{run}/{session}/log.jsonl` by that exact shape) and it was spelled out in five modules:\n\n| Spelling | Where |\n| --- | --- |\n| `HISTORY_NAME` = `history.json` | `pipeline.py` |\n| `HISTORY_NAME` = `history.jsonl` | `report.py` (the same name, a different file) |\n| `glob(\"*/*/*/*/*/result.json\")` | `report.cells`, `report.aggregate_history`, `replay.rebuild` |\n| `session_dir / \"log.jsonl\"` | both harness adapters and `report._row` |\n| `<cache>/results` | `Settings.results_root`, a third spelling |\n\n## Decision\n\n**The two emitted documents are types.** `metrics.CellMetrics` is the `history.json` record, with `status_word()` as a method on it and `cache` as a declared field.\n`report.IndexRow` is one `index.json` row, with the derivation from a stored `result.json` in its `of()` constructor.\nBoth serialise through `asdict`, as `RunResult` does (0035), so the field names remain the wire format. `history.py` becomes `metrics.py`: it holds the record, not an append-only file.\n\n**The dict boundary is explicit and singular.** `TestReport.user_properties` is serialised by execnet, which handles builtins only (0016).\nSo a dataclass there fails at runtime during a paid sweep and never at type-check time.\nThe record is therefore `to_dict()`-ed at the `pytest_runtest_makereport` hook and `from_dict()`-ed on the controller, and it is a type everywhere else. `from_dict` drops unknown keys and defaults absent ones, which is also what makes a capture written by an older version readable rather than fatal.\n\n**A dry run emits the same document.** `CellMetrics.dry_run(node=, cell=)` builds a full record with nothing measured and an empty `cache`.\nEmpty `cache` is what already means \"combine nothing\", so a dry run still writes no evidence (0018).\n\n**The cache tree has one owner.** `layout.CacheLayout` is a value object over the cache root. It owns:\n\n- `build/`, `results/`, `report/`\n- every file name under them\n- the `session(skill=, harness=, model=, run=, session=)` constructor\n- the `sessions()` walk\n\n`layout.SessionDir` is one session's evidence directory and addresses its four members by property.\n`Settings.cache` *is* a `CacheLayout`, so no caller reassembles a path under it.\n`SessionDir.at(path)` serves the callers handed a directory rather than finding one: a replay, a harness adapter re-reading its own captured log.\n\n**The key sets are pinned by a test, against literal lists.** `tests/test_units.py` asserts the exact keys of `history.json` and of an `index.json` row against spelled-out lists, and `tests/test_plugin.py` asserts `report.json` is `{cells, total_usd}`.\nA field added, renamed or dropped without the matching edit to `types.ts` and the glossary fails the gate here.\nThis is the only place in this repository that could ever have caught it.\n\n`history.append` is deleted.\nIt had no production caller after 0032 moved the metrics record beside its evidence, and its only exercise was its own test.\n\n## Consequences\n\n`pricing` no longer imports `history` for a timestamp: `now_iso` moves to `normalise`, beside `ms_between`, with the other dialect-free primitives.\nThat removes the one edge from the pricing layer up into the metrics layer.\n\nReading a `history.json` that exists but is missing keys now yields `\"\"` and `0` where it yielded `None`.\nOnly a hand-truncated or pre-0021 record reaches that path.\nA session with no record at all still indexes as `null`, which is the case the tests pin.\n\n`report.py` keeps `INDEX_NAME`, `TOKENS_NAME` and `REPORT_DIR` in its namespace (re-exported from `layout` and listed in `__all__`) because `report-ui/scripts/inline.py` builds the page through them.\n\n## Lens\n\nA document a program emits is part of its interface.\nAn interface assembled as a dict literal has no definition anywhere: only the union of what its readers happen to ask for.\nGive it a type, and put the one serialisation boundary where the transport actually requires it.\nThen pin its key set against a list a human wrote.\nThen the same rule holds for the tree those documents live in.\nA path shape that appears in five modules is not a layout, it is five layouts that currently agree.\n"}, "ADR-0038": {"file": "0038-a-tolerant-reader-still-honours-its-declaration.md", "title": "A tolerant reader still honours its declaration", "status": "accepted", "status_note": "accepted, 2026-08-28.\nRefines [0032](0032-all-run-output-consolidates-under-a-cache-dir.md) (all run output consolidates under a cache dir) and [0037](0037-the-emitted-records-are-types-and-the-cache-tree-has-one-owner.md) (the emitted records are types, and the cache tree has one owner).\nStructural only: no serialised key and no metric's value changes, and the characterization goldens are byte-identical.", "markdown": "# 0038: A tolerant reader still honours its declaration\n\nStatus: accepted, 2026-08-28.\nRefines [0032](0032-all-run-output-consolidates-under-a-cache-dir.md) (all run output consolidates under a cache dir) and [0037](0037-the-emitted-records-are-types-and-the-cache-tree-has-one-owner.md) (the emitted records are types, and the cache tree has one owner).\nStructural only: no serialised key and no metric's value changes, and the characterization goldens are byte-identical.\n\n## Context\n\n0037 turned the two emitted documents into types and gave the cache tree one owner.\nBoth of its boundary constructors were tolerant in a way that produced a value its own declaration did not describe.\n\n**`CellMetrics.from_dict` dropped unknown keys but kept mistyped ones.** It existed so that a capture written by an older version reads as a partial record rather than as a failed rebuild.\nAbsent keys correctly fell back to the field defaults.\nA key that was *present and null* did not: `at: str = \"\"` could hold `None`.\nBefore 0037 every reader spelled its own `str(r.get(\"at\") or \"\")` and tolerated that.\nAfterwards the readers trusted the declaration, so the same stored record that used to sort last now aborted the whole combine step:\n\n| Reader | Before 0037 | After 0037, on `{\"at\": null}` |\n| --- | --- | --- |\n| `report.aggregate_history` | `sorted(key=str(r.get(\"at\") or \"\"))` | `TypeError: '<' not supported between 'str' and 'NoneType'` |\n| `replay.migrate_legacy` | `_run_ts_of(str(hist.get(\"at\") or \"\"))` → `00000000T000000Z` | `AttributeError` on `None` |\n\nA type promises to survive a foreign document, and a test is named for that promise.\nNeither may turn a tolerated document into a crash one layer up.\n\n**`SessionDir` made an illegal state representable.** One type carried both a path and the five coordinates of `results/{skill}/{harness}/{model}/{run}/{session}`.\nThe coordinates defaulted to `\"\"` for the callers handed a directory rather than finding one (a replay, a harness adapter re-reading its own log).\nThose callers could still ask for the published key and the published link.\nThey got `\"////sid\"` and `\"../results/////sid/log.jsonl\"` back: no error, a garbage URL on the report page.\nBoth constructors were documented as ordinary usage and the type is public, so \"no caller does that today\" was not an invariant.\n\n## Decision\n\n**A value that does not match its field's declared type is dropped, exactly as an unknown key is.** `CellMetrics.from_dict` resolves what each field admits once, from the field annotations themselves (`int | None` → `(int, NoneType)`).\nIt keeps a stored value only when it is one of them; anything else leaves the field at its default.\nJSON's single number type is the one widening: an `int` where a `float` is declared is read as a float.\nThe defaults story now covers *present-but-null* as well as absent.\nThat is what makes the declaration true for every reader downstream.\nThis includes the two above, which stay written as if the type were honest, because it is.\n\n**The two ways to hold a session directory are two types.** `layout.SessionDir` is a directory addressed by path: `log.jsonl`, `result.json`, `history.json`, `subagents/` and `mkdir()`.\nIt has no report link, because a bare path does not know where it sits in a cache.\n`layout.LocatedSession` extends it with the five coordinates and *therefore* with `rel` and `report_link()`.\nOnly `CacheLayout` builds one: `session(...)` is handed the coordinates, and `sessions()` reads them off the walk.\nSo a located session always has all five, and the empty-string coordinate is gone rather than merely undocumented.\n`report.IndexRow.of` takes a `LocatedSession`, which is now checked rather than hoped for; `pipeline`, the harness adapters and `replay.rebuild_result` take the narrow type.\n\nBoth rules are pinned.\nA `\"at\": null` record sits in the metrics-record test, in the report's tolerance test and in the legacy-migration test.\nThe absence of the link surface on the narrow type is pinned in the layout test.\n\n## Consequences\n\n`SessionDir.at(path)` is gone; the type has one field, so `SessionDir(path)` is the constructor.\n0037 named `at` as the entry point for a caller handed a directory.\nThat caller now names the type itself, and cannot reach the link surface at all.\n\nReading a `history.json` whose value is null yields the same `\"\"` and `0` that a missing key yields (0037's consequence, now extended to nulls).\nA record with no `at` at all still sorts first and still stamps `00000000T000000Z`.\n\n## Lens\n\nTolerance at a boundary is a promise to the callers *inside* it: whatever the document says, what comes out is what the type declares.\nA reader that forgives an unknown key but forwards a `None` into a field typed `str` has not been tolerant.\nIt has moved the failure somewhere the document is no longer in hand.\nThe same rule shapes the types themselves.\nA field that is optional only because one constructor cannot fill it is two types wearing one name.\nThe empty default is the bug waiting for a caller.\n"}, "ADR-0039": {"file": "0039-the-package-listing-is-the-architecture.md", "title": "The package listing is the architecture", "status": "accepted", "status_note": "accepted, 2026-08-28.\nRefines [0014](0014-register-through-the-pytest11-entry-point.md) (register through the pytest11 entry point) and [0027](0027-coverage-follows-the-shells-working-directory.md) (coverage follows the shell's working directory).\nIt also refines [0034](0034-a-harness-is-a-class-and-the-registry-is-the-only-dispatch.md) (a harness is a class and the registry is the only dispatch) and [0037](0037-the-emitted-records-are-types-and-the-cache-tree-has-one-owner.md) (the emitted records are types).\nStructural only: no serialised key, no ini key, no CLI option and no metric's value changes, and the characterization goldens are byte-identical.", "markdown": "# 0039: The package listing is the architecture\n\nStatus: accepted, 2026-08-28.\nRefines [0014](0014-register-through-the-pytest11-entry-point.md) (register through the pytest11 entry point) and [0027](0027-coverage-follows-the-shells-working-directory.md) (coverage follows the shell's working directory).\nIt also refines [0034](0034-a-harness-is-a-class-and-the-registry-is-the-only-dispatch.md) (a harness is a class and the registry is the only dispatch) and [0037](0037-the-emitted-records-are-types-and-the-cache-tree-has-one-owner.md) (the emitted records are types).\nStructural only: no serialised key, no ini key, no CLI option and no metric's value changes, and the characterization goldens are byte-identical.\n\n## Context\n\nTwenty modules sat flat in `src/pytest_xharness_eval/`, in one alphabetical list, after 0034 pulled `harness/` out of it.\nA reader opening the package could not tell from the listing that:\n\n- `case.py` is a declaration a user writes\n- `codex.py` folds a foreign log\n- `pricing.py` is arithmetic over a folded one\n- `report.py` publishes\n- `plugin.py` drives all four\n\nThey are the same size, at the same level, in the same column.\nThe listing named the parts and said nothing about the shape, which is the complaint this refactoring campaign opened with.\n\nFlatness is not only a reading problem: with no declared direction, three imports had quietly turned upside down, and nothing failed when they did.\n\n| Inversion | What it meant |\n| --- | --- |\n| `pricing` → `normalise.now_iso`, `report` → `normalise.now_iso` | Pricing an estimate and stamping an index both depended on the *harness dialect toolkit* for a wall clock. |\n| `skillcov.annotate` → `harness.get(result.harness)` | A derivation reached into the adapter registry mid-walk, so annotating a ledger (pure arithmetic) could not be done for a result whose harness nobody had registered. |\n| `matrix` → `harness` | Deliberate and correct (the `--harness` choices must be whatever is registered, 0034), but indistinguishable from the other two. |\n\nTwo names in the package are resolved by *importlib*, not by Python code, and they bound any re-layering.\n`pytest_xharness_eval.plugin` is the `pytest11` entry point (0014) and `pytest_xharness_eval.replay` is what `uv run -m pytest_xharness_eval.replay` executes.\nVerified: a package with no `__main__.py` fails `-m` outright.\nAn attribute re-exported from a parent `__init__` does not satisfy importlib for either; only a real module does.\n\n## Decision\n\n**The layers are folders, and the folder listing is the dependency order.**\n\n```text\npytest_xharness_eval/\n    plugin.py     the pytest11 entry point (0014)\n    replay.py     the `python -m` entry point (0023, 0032)\n    model/        the nouns: run, case, cell, workspace, cache tree, clock\n    harness/      one adapter class per agent CLI, and the toolkit they fold with\n    derive/       what a folded run cost, and which of the skill it reached\n    emit/         the documents that leave: the metrics record and the microsite\n    runtime/      how a sweep is wired: settings, and the steps after the CLI returns\n```\n\nEach layer depends only on the ones above it in that list, entry points last.\nThe two entry-point modules stay real modules at the root because importlib resolves them.\nThat placement narrates too: what the outside world calls at the top, the layers it calls through underneath.\n\n**Each `__init__` declares its layer's surface.** A layer's `__init__` is the one place its public names are listed, and reading five of them is reading the architecture.\nSubmodules still import each other by full dotted path (`from pytest_xharness_eval.derive import pricing`), never through a layer's `__init__`.\nImporting the matrix reaches the harness registry.\nSo a name bound in an `__init__` is not yet available to everything that loads during it.\n\n**The three inversions are resolved, not merely noted.** `now_iso` and `ms_between` are `model/clock.py`, a leaf that depends on nothing.\nSo pricing and the report stop naming the adapter toolkit for a timestamp.\nThe tolerant reader for this package's own stored documents is `model/documents.py` for the same reason.\n`skillcov.annotate` takes the harness's shell vocabulary as an optional fourth argument.\nIt is a `model.registry.Shells` value of the tool names that run a shell and the ones that keep their cwd (0027).\nSo annotating a ledger is arithmetic over a value it was handed.\nAnd the one edge that must point up, because the registry is the only dispatch (0034), is now a single module that says so.\n`model/registry.py` answers \"which harnesses exist\" and \"what is this one's shell vocabulary\".\nIt is the only module below `harness/` that names `harness`.\n`annotate` still resolves through it when the argument is omitted, which is what the pipeline and the pinned characterization call.\n\n**A fourth inversion fails the build.** The ruff `TID251` rule that has kept provider modules unreachable since 0034 is joined by three more.\nNothing may name `pytest_xharness_eval.harness`, `.emit` or `.runtime` except the layers above it.\nThe exceptions are the per-file-ignore list in `pyproject.toml`: the two entry points, each layer itself, `model/registry.py`, and the tests.\n\n**`report.py` becomes the layer it always was.** It held four jobs at once: the `index.json` row type, the design-tokens reader, the page assembly, and the combine step.\nThey are `emit/index.py`, `emit/tokens.py` and `emit/page.py` beside `emit/metrics.py`, which is the same split the microsite already has on disk.\n`pytest_xharness_eval.emit` is re-exported from the root package as `report`, which is the name `report-ui/scripts/inline.py` builds a page through.\n\n## Consequences\n\n`import pytest_xharness_eval.pricing` (the dotted form) stops resolving for an outside caller.\nThe from-import form `from pytest_xharness_eval import pricing` still does, and so do `normalise`, `records`, `skillcov` and `report`.\nThey are re-exported from the root `__init__` in `as` form (mypy's `no_implicit_reexport` requires it).\nThey are listed in `__all__` as the declared public API.\nEvery internal caller and both test modules use the from-import form, and the pinned characterization test imports exactly that way, unchanged.\n\nThe bundled `prices.toml` moves to `derive/prices.toml`, beside the only module that reads it.\n0014's rule is unchanged: it is still the one path derived from `__file__`, and `pricing.py` still spells it `Path(__file__).parent`.\n\n`model/` is where `layout.py` and `workspace.py` live, not `runtime/`.\nBoth are value-level (one names paths under a cache, the other copies a fixture tree and hashes it).\nBoth are used *by* the harness adapters.\nSo putting them in the top layer would have made the adapter layer import the top layer.\nIt would also have left the `runtime` ban with a hole big enough to walk through.\n\nOne edge points up that the rules cannot express.\n`model/runresult.py` names `derive.pricing` and `derive.skillcov` under `TYPE_CHECKING`, to declare the two derived documents a result carries.\nIt is annotations only, so there is no runtime dependency and no cycle.\nIt is the reason `derive` is not in the ban list.\nA rule with a documented exception in the file it exists to constrain is worse than no rule.\n\n## Lens\n\nA package listing is the first documentation anyone reads and the only one that cannot go stale.\nWhen it is a flat alphabetical column, every module claims equal standing and the reader learns nothing.\nWhen the folders are the layers, the question \"may this import that?\" has an answer before the import is written.\nAnd the answer can be checked by a linter rather than by whoever reviews the diff.\nThe names that resolve outside the language, though, are load-bearing in a way no layering may break.\nAn entry point is a contract with a tool that does not read your architecture.\nIt stays a real module at the root no matter how the rest is arranged.\n"}, "ADR-0040": {"file": "0040-the-plugin-is-a-hook-manifest.md", "title": "The plugin is a hook manifest, and each job behind it is a module", "status": "accepted", "status_note": "accepted, 2026-08-28.\nRefines [0008](0008-evals-are-eval-prefixed-modules.md) (evals are `eval_*.py` modules) and [0014](0014-register-through-the-pytest11-entry-point.md) (register through the pytest11 entry point).\nIt also refines [0016](0016-results-travel-on-the-test-report.md) (results travel on the test report) and [0032](0032-all-run-output-consolidates-under-a-cache-dir.md) (all run output consolidates under a cache dir).\nIt also refines [0037](0037-the-emitted-records-are-types-and-the-cache-tree-has-one-owner.md) (the emitted records are types) and [0039](0039-the-package-listing-is-the-architecture.md) (the package listing is the architecture).\nIts placement of `Verdict` in `plugin/verdict.py`, and the exports its manifest widened to, are superseded by [0041](0041-the-vocabulary-is-a-domain-noun-and-the-manifest-is-a-manifest.md).\nStructural only: no serialised key, no ini key, no CLI option and no metric's value changes.\nEvery hook keeps its name and its signature, and the characterization goldens are byte-identical.", "markdown": "# 0040: The plugin is a hook manifest, and each job behind it is a module\n\nStatus: accepted, 2026-08-28.\nRefines [0008](0008-evals-are-eval-prefixed-modules.md) (evals are `eval_*.py` modules) and [0014](0014-register-through-the-pytest11-entry-point.md) (register through the pytest11 entry point).\nIt also refines [0016](0016-results-travel-on-the-test-report.md) (results travel on the test report) and [0032](0032-all-run-output-consolidates-under-a-cache-dir.md) (all run output consolidates under a cache dir).\nIt also refines [0037](0037-the-emitted-records-are-types-and-the-cache-tree-has-one-owner.md) (the emitted records are types) and [0039](0039-the-package-listing-is-the-architecture.md) (the package listing is the architecture).\nIts placement of `Verdict` in `plugin/verdict.py`, and the exports its manifest widened to, are superseded by [0041](0041-the-vocabulary-is-a-domain-noun-and-the-manifest-is-a-manifest.md).\nStructural only: no serialised key, no ini key, no CLI option and no metric's value changes.\nEvery hook keeps its name and its signature, and the characterization goldens are byte-identical.\n\n## Context\n\n0039 turned the layers into folders and left the two entry points at the root, where importlib resolves them.\n`plugin.py` was then the last module in the package doing five unrelated jobs at once, at 478 lines. It did all of these:\n\n- registered the options and ini keys\n- decided what pytest collects\n- ran a cell end to end\n- carried the record across the xdist boundary\n- wrote `report.json` and the combine step\n\nThree consequences, none of them stylistic:\n\n| Symptom | What it cost |\n| --- | --- |\n| Two serialised contracts authored inside pytest hooks | `report.json` was a dict literal in `pytest_terminal_summary`. 0037 gave every other emitted document a type; this one had no definition to point a reader (or `report-ui/src/lib/types.ts`) at. |\n| One `# pragma: no cover` over the whole per-cell sequence | `_run_live` was forty lines of which *one* spends money. Materialise, derive, capture, grade and record were excluded from coverage along with the spawn, so the ordering a replay is pinned against could not be exercised at all without paying. |\n| The suite loader written twice | `plugin._load_module` and `replay._load_suite` were the same eight lines of `spec_from_file_location`, differing in whether the module was registered in `sys.modules` while it executed: a difference nobody had decided. \"Find the `EvalCase` called X\" was written twice as well. |\n\nThe last one is the drift class 0034 removed for the settings and 0037 for the cache tree.\nIt is two implementations of one idea, each correct, neither aware of the other.\n\n## Decision\n\n**`plugin` is a package whose `__init__` is a manifest.** Pluggy discovers a hook as an attribute of the imported plugin module.\nImportlib resolves `pytest_xharness_eval.plugin` to the package.\nSo the `pytest11` entry point of 0014 is unchanged and every hook is re-exported by name from `__init__`:\n\n```text\nplugin/\n    __init__.py   the hook manifest: seven hooks, bound to the modules below\n    options.py    every option and ini key, configure-time validation, the header\n    collect.py    the collection rule, EvalFile, EvalItem\n    cell.py       CellRun: the seven steps of one live cell, and the run stamp\n    verdict.py    Verdict: the words a cell may grade to\n    results.py    the record's one crossing to the controller, and its status word\n    summary.py    the terminal table, report.json, and the combine step\n```\n\n**The paid step is one method, and the pragma stops there.** `CellRun` is the cell's run as a small state machine.\nIts steps are `materialise`, `invoke`, `store`, `grade`, `record`, and an `execute` that sequences them.\n`execute` leaves the record in the item's stash whether the grader passed or raised.\nOnly `invoke` (and the five-line `execute` that calls it) carries `# pragma: no cover`.\nEvery other step is now exercised from captured logs in `tests/test_units.py`.\nNothing is mocked to achieve that, which is the constraint 0002 actually imposes.\nThe workspace is really copied, the grader really runs, the record is really written, and no CLI is spawned.\n\n**`report.json` is a type.** `emit/summary.py` holds `RunSummary`: the graded cells and `total_usd`, plus `cache_roots()`.\n`cache_roots()` is the roots this session wrote evidence into.\nIt is the one place the combine step's trigger is decided and the reason a dry run stays free (0018, 0032).\nThe hook decides *when* to write; the type decides *what* the file is.\n\n**One `EvalSuite` loads every suite, for both entry points.** `model/suite.py` imports an `eval_*.py` by path under a name derived from that path.\nIt registers it in `sys.modules` before executing it, and answers `cases` and `case_named(name)`.\nCollection asks it for every case; a replay asks `find_case(evals_dir, name)`.\nThat skips an unimportable suite with a warning, so one broken file cannot stop the others being rebuilt (0023).\n\n**The pre-0032 migration is its own module.** `runtime/legacy.py` holds `LegacyCapture`, built only by `found_at`.\n`found_at` recognises a legacy `captured/` directory by shape and returns `None` for anything else.\nSo a migration cannot be started against a cache root, and the entry point has no \"is it legacy?\" question left to ask twice.\nIt is transitional code with a known end, and it is now deletable in one file.\n`replay.py` keeps the rebuild and the command line that drives it.\n`main` takes its `argv` so the entry point can be exercised without touching the process.\n\n## Consequences\n\n`from pytest_xharness_eval.plugin import EvalItem` still resolves (a consuming repository's `conftest.py` uses it to inspect collected cells) as do `PROPERTY`, `RESULTS_KEY` and `RECORD_KEY`.\nWhat changes is that `pytest_xharness_eval.plugin` is now a package.\n`plugin.py` no longer exists as a file, and the per-file-ignore that exempts the entry points from 0039's layer rules is `plugin/*`.\n\nCoverage of the plugin's own code went from 89% to 93–100% per module.\nThat is not because tests were added around the old shape but because the shape stopped hiding six free steps behind one paid one.\n\n`Verdict` is a `StrEnum`, and its `.value` (never the member) is what reaches an `Outcome`.\nThe record it becomes crosses to the xdist controller through execnet, which serialises builtins only (0016).\nA test pins that the stored verdict is a plain `str`.\n\nOne thing deliberately did *not* move: the `run_*` functions that spawn each CLI stay module-level in their adapters.\nRelocating uncovered paid code buys style and costs an unverifiable diff.\n\n## Lens\n\nA plugin's entry-point module is a manifest, not a place to work.\nEvery job it accumulates is a job with no name, no test seam and no type.\nAnd the two most expensive symptoms are always the same:\n\n- a serialised format authored inside a hook, where no reader can find its definition\n- a `pragma: no cover` drawn around a whole sequence because one line of it is expensive\n\nPush the expensive line down until the pragma fits it exactly.\nWhat is left above is free, ordinary code that can be tested like any other.\n"}, "ADR-0041": {"file": "0041-the-vocabulary-is-a-domain-noun-and-the-manifest-is-a-manifest.md", "title": "A shared vocabulary is a domain noun, and a manifest exports nothing of its own", "status": "accepted", "status_note": "accepted, 2026-08-28.\nRefines [0016](0016-results-travel-on-the-test-report.md) (results travel on the test report) and [0037](0037-the-emitted-records-are-types-and-the-cache-tree-has-one-owner.md) (the emitted records are types).\nIt also refines [0038](0038-a-tolerant-reader-still-honours-its-declaration.md) (a tolerant reader still honours its declaration) and [0039](0039-the-package-listing-is-the-architecture.md) (the package listing is the architecture).\nAnd it refines [0040](0040-the-plugin-is-a-hook-manifest.md) (the plugin is a hook manifest).\n**Supersedes 0040's placement of `Verdict` in `plugin/verdict.py`, and the justification given there for it.** Structural only: no serialised key, no ini key, no CLI option and no metric's value changes.\nEvery hook keeps its name and its signature, and the characterization goldens are byte-identical.", "markdown": "# 0041: A shared vocabulary is a domain noun, and a manifest exports nothing of its own\n\nStatus: accepted, 2026-08-28.\nRefines [0016](0016-results-travel-on-the-test-report.md) (results travel on the test report) and [0037](0037-the-emitted-records-are-types-and-the-cache-tree-has-one-owner.md) (the emitted records are types).\nIt also refines [0038](0038-a-tolerant-reader-still-honours-its-declaration.md) (a tolerant reader still honours its declaration) and [0039](0039-the-package-listing-is-the-architecture.md) (the package listing is the architecture).\nAnd it refines [0040](0040-the-plugin-is-a-hook-manifest.md) (the plugin is a hook manifest).\n**Supersedes 0040's placement of `Verdict` in `plugin/verdict.py`, and the justification given there for it.** Structural only: no serialised key, no ini key, no CLI option and no metric's value changes.\nEvery hook keeps its name and its signature, and the characterization goldens are byte-identical.\n\n## Context\n\n0040 introduced `Verdict` (`pass`, `fail`, `error`, `dry-run`) and put it in `plugin/verdict.py`, claiming a vocabulary the whole package shares.\nIt was neither, for three reasons that only show up when the layer rule of 0039 is taken seriously:\n\n| Symptom | What it cost |\n| --- | --- |\n| `plugin/` is the entry-point layer, above every other | `emit/` structurally *cannot* import from it: the ruff `TID251` rule fails the build. So `CellMetrics.dry_run`, the only producer of the fourth word, still wrote the bare literal `verdict=\"dry-run\"`. The vocabulary was duplicated, not centralised. |\n| The enum typed no field | `Outcome.verdict`, `CellMetrics.verdict` and `IndexRow.verdict` were all `str`. An enum that nothing is declared as is a naming convention with a class statement around it. |\n| The module's own docstring was untrue | It said the two ends of a cell's life \"neither may import the other\", but `plugin/cell.py` imports `plugin/results.py` directly. A docstring that states a false constraint is worse than no docstring: the next reader preserves a shape for a reason that does not exist. |\n\nThe repository already had the right answer in it.\n`CostStatus` (`priced` or `unpriced`, with no third state) lives in `model/runresult.py`, beside `cost_status: CostStatus`, the field it types.\n\n0040 also widened the manifest it had just declared to be \"a manifest and nothing else\".\n`__init__` re-exported `CellRun`, `Attempt`, `run_stamp`, `Verdict` and a `_ResultCollector` renamed public on the way out.\nNone of those is named by 0040's own compatibility list, and every one of them is API the moment it is exported.\n\n## Decision\n\n**A word two layers share is a domain noun.** `Verdict` moves to `model/verdict.py`, the bottom layer, which every layer above may name.\nIts producers then all use it: `plugin/cell.py` decides one, `emit/metrics.py` records it.\n`CellMetrics.dry_run` is included, which is why the move is what removes the literal rather than a lint that forbids it.\n\n**The vocabulary types the observation, and the wire keeps the word.** `Outcome.verdict` is declared `Verdict | None`.\nThe `.value` (never the member) is what reaches `CellMetrics.verdict`, which stays `str`.\nThat record crosses to the xdist controller through execnet, which serialises builtins only (0016).\nA `StrEnum` member is not a builtin.\nTyping the *record* field would have shipped a member over that wire.\n\n**A stored word that names no member is no verdict, not a fabricated one.** `Verdict.stored(word)` returns `None` for anything outside the four, which is what `CellMetrics.outcome` reads a replayed record back through.\nA capture written before the field existed, or truncated by hand, carries its empty verdict forward exactly as it did before.\nThe alternative (mapping the unknown onto `error`) would have a rebuild assert a grade the run was never given.\n0038's tolerance is about degrading to the default, never about inventing a value.\n\n**A manifest exports the hooks and the compatibility surface, and nothing else.** `plugin/__init__` binds the seven `pytest_*` hooks pluggy discovers as attributes of the imported module.\nIt also binds the four names a consuming repository's `conftest.py` already reaches for: `EvalFile`, `EvalItem`, `PROPERTY`, `RESULTS_KEY`, `RECORD_KEY`.\nInternals stay addressable where they are implemented (`plugin.cell.CellRun`, `plugin.results.ResultCollector`), which is where the tests already reach them.\n\n## Consequences\n\n`tests/test_units.py` gains a fitness function over the manifest:\n\n- the bound hooks are exactly the hooks the package implements (a hook not bound here silently stops firing)\n- the rest of `__all__` is exactly the compatibility surface\n- the `pytest11` entry point still names `pytest_xharness_eval.plugin`\n\nA new hook that is implemented and not bound now fails the suite instead of the next sweep.\n\n`from pytest_xharness_eval.plugin import Verdict` no longer resolves; the import is `from pytest_xharness_eval.model.verdict import Verdict`, or `pytest_xharness_eval.model`.\nThe name was one commit old and unreleased.\n\n## Lens\n\nTwo questions decide where a shared name lives, and neither is \"who uses it most\".\n*Which layer may everyone that needs it import?* That is the only placement that can be enforced rather than agreed.\n*Which field is declared as it?* A vocabulary that types nothing is decoration, and its duplicate literals survive the refactor that was supposed to remove them.\nAnd a module that advertises itself as a manifest must be audited as one: every convenience export is a public API nobody decided to publish.\n"}, "ADR-0042
