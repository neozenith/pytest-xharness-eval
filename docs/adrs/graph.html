me lives, and neither is \"who uses it\nmost\". *Which layer may everyone that needs it import?* — that is the only\nplacement that can be enforced rather than agreed. *Which field is declared as\nit?* — a vocabulary that types nothing is decoration, and its duplicate literals\nsurvive the refactor that was supposed to remove them. And a module that\nadvertises itself as a manifest must be audited as one: every convenience export\nis a public API nobody decided to publish.\n"}, "ADR-0042": {"file": "0042-the-overview-is-filtered-by-the-url.md", "title": "The overview is filtered by the URL, and the summary aggregates the chart's own groups", "status": "accepted", "status_note": "accepted, 2026-08-29. Refines\n[0020](0020-captured-report-is-a-static-microsite.md) (the captured report is a static microsite),\n[0021](0021-metric-names-carry-unit-and-provenance.md) (a metric name\ncarries its unit and its source),\n[0028](0028-report-is-built-from-a-component-workspace.md) (the report page is\nbuilt from a component workspace) and\n[0031](0031-plotly-tamagui-and-a-deeplink-permutation-matrix.md) (every state\ndeeplinks, and a Playwright matrix sweeps them all). Nothing the Python side\nemits changes: no new JSON key, no ini key, no CLI option, no metric's value.", "markdown": "# 0042: The overview is filtered by the URL, and the summary aggregates the chart's own groups\n\nStatus: accepted, 2026-08-29. Refines\n[0020](0020-captured-report-is-a-static-microsite.md) (the captured report is a static microsite),\n[0021](0021-metric-names-carry-unit-and-provenance.md) (a metric name\ncarries its unit and its source),\n[0028](0028-report-is-built-from-a-component-workspace.md) (the report page is\nbuilt from a component workspace) and\n[0031](0031-plotly-tamagui-and-a-deeplink-permutation-matrix.md) (every state\ndeeplinks, and a Playwright matrix sweeps them all). Nothing the Python side\nemits changes: no new JSON key, no ini key, no CLI option, no metric's value.\n\n## Context\n\nThe sweep grew to 24 sessions across 2 skills × 2 harnesses × 4 models, and both\noverview consumers stopped scaling with it. `TokenAccumulationChart` draws 16\nlines whose legend already overflows its card, and `SessionTable` is 24 rows of\n18 columns. There was no way to ask \"just claude\" or \"just this skill\", and no\naggregate view at all: every comparison between two harnesses was done by eye,\nacross 24 rows.\n\n## Decision\n\nThree binding parts.\n\n### 1. The overview's filter state is URL state, like every other interactive state of this page\n\nThree params — `skill`, `harness`, `model` — on the overview route only. They are\nmulti-select, because a reader compares two harnesses far more often than one, so\na facet serialises as a comma-separated list: **OR within a facet, AND across\nfacets**. An absent param means every value, which keeps `?`, `?sort=…` and\n`?theme=dark` byte-identical to what they were, and a present-but-empty param\nstill means every value, never none. A value the data does not contain is kept in\nroute state and matches nothing, so a stale deeplink lands in a visible empty\nstate rather than silently widening.\n\nChanging a facet **replaces** the history entry rather than pushing one, because a\nfilter refines the page you are already on — the same rule the neighbouring `sort`\ncontrol follows; `OverviewFiltersClear` is the undo. Per 0031 the params are\nenumerated in `lib/permutations.ts` in this same change, including one permutation\n(`overview--filter-none`) that deliberately selects zero sessions.\n\n### 2. `SweepOverview` owns the filtering; its children are presentational\n\nThe view derives the visible `Cell[]` once and passes it down.\n`TokenAccumulationChart`, `SessionSummaryTable` and `SessionTable` take the cells\nthey are given and know nothing about facets. The only concession is a shared\n`NO_MATCH` sentence all three print when handed nothing, so a filtered-to-nothing\noverview says so three times in one voice instead of rendering three empty boxes.\n\n`OverviewFilters` is the producer, not a consumer, so it alone reads and writes the\nroute. It derives its option lists from the whole sweep, never from the filtered\nsubset, so the control never moves under the reader's hand, and a value that would\nselect nothing is dimmed rather than removed.\n\n### 3. `SessionSummaryTable` aggregates the chart's own groups, by mean\n\nIts grouping key — skill × case × harness × model — is deliberately the same\npartition `accumulationGroups` draws with, so one summary row is one line of the\nchart above it and the two read as a pair. Every aggregate is named `mean <field>`\nin full, per 0021: the name carries the operation as well as the unit.\n\nMean, not median, because the chart beside it already draws a mean line with a\nmin–max envelope and a median row would disagree with the picture by construction;\nbecause cost and tokens are additive, so `mean × runs` is the group's total; and\nbecause a median over the group sizes this data produces (1–2) is either the single\nvalue or the mean of the two. A missing value is skipped, never zero-filled, and an\naggregate over nothing is null, never zero — a sparse column must read as sparse.\nThe pass rate's denominator is the runs that carry a verdict, so an ungraded run is\nnever counted as a failure.\n\n## Consequences\n\nThe three params join the deeplink matrix and the tiered sweep. `lib/facets.ts` and\n`lib/summary.ts` join `lib/series.ts` as pure, unit-tested derivations over `Cell[]`.\n`coverageShare` and the fixed-decimal formatter move into `lib/format.ts`, so the\ntable and the summary compute one number from one place. Nothing the Python side\nemits changes.\n\n## Lens\n\n**An interactive state that changes what the reader is looking at belongs in the\nURL, and a derived view names its own arithmetic.** If two views of the same data\nsit on one page, they group it the same way, or they are not a pair.\n"}, "ADR-0043": {"file": "0043-the-overview-tables-are-budgeted-to-one-screen.md", "title": "The overview's tables are budgeted to one screen, and the aggregate has a decomposition as well as an accumulation", "status": "accepted", "status_note": "accepted, 2026-08-30. Refines\n[0020](0020-captured-report-is-a-static-microsite.md) (the captured report is a static microsite),\n[0021](0021-metric-names-carry-unit-and-provenance.md) (a metric name carries its unit and its source),\n[0025](0025-results-name-their-case-and-charts-have-a-log-line-axis.md) (a result names its case),\n[0031](0031-plotly-tamagui-and-a-deeplink-permutation-matrix.md) (every state deeplinks, and a\nPlaywright matrix sweeps them all) and\n[0042](0042-the-overview-is-filtered-by-the-url.md) (the overview is filtered by the URL).\nNothing the Python side emits changes: no new JSON key, no ini key, no CLI\noption, no metric's value.", "markdown": "# 0043: The overview's tables are budgeted to one screen, and the aggregate has a decomposition as well as an accumulation\n\nStatus: accepted, 2026-08-30. Refines\n[0020](0020-captured-report-is-a-static-microsite.md) (the captured report is a static microsite),\n[0021](0021-metric-names-carry-unit-and-provenance.md) (a metric name carries its unit and its source),\n[0025](0025-results-name-their-case-and-charts-have-a-log-line-axis.md) (a result names its case),\n[0031](0031-plotly-tamagui-and-a-deeplink-permutation-matrix.md) (every state deeplinks, and a\nPlaywright matrix sweeps them all) and\n[0042](0042-the-overview-is-filtered-by-the-url.md) (the overview is filtered by the URL).\nNothing the Python side emits changes: no new JSON key, no ini key, no CLI\noption, no metric's value.\n\n## Context\n\n0042 gave the overview a filter, a `SessionSummaryTable` and three consumers that\nanswer to it. Three things were left unresolved by it.\n\n`SessionTable` did not fit. Eighteen columns measured ~1600px against the 1086px\na card gives it at a 1440px viewport, so a third of the metrics were permanently\nbehind a horizontal scrollbar; the table's own auto-scroll-the-sorted-head effect\nexisted only to paper over that. A metric a reader cannot see is a metric that\ndoes not exist, and the metrics off the right edge were not the unimportant ones —\nthey were whichever ones happened to be declared last.\n\n`SessionSummaryTable` was declared unsortable, on the reasoning that a second\nsort param would double the route surface for a sixteen-row table. That reasoning\nholds for the *route*, not for the reader: the whole point of an aggregate is to\nrank groups — by mean cost, by pass rate, by mean wall — and a fixed key order\nanswers none of those questions.\n\nAnd the overview had an *accumulation* of tokens (how fast the bill grows) with\nno *decomposition* (where it went). The per-session `TokenWaterfallChart` answers\nthe second question for one run and there was no way to ask it of many.\n\n## Decision\n\nFour binding parts.\n\n### 1. The second table sorts on its own param pair\n\n`ssort` / `sdir` on the overview route, parsed and serialised by the same\n`sortState` helper as `sort` / `dir`. **Not** a shared pair: a reader ranks groups\nby mean cost while ranking sessions by when they ran, so a shared pair would make\nevery click on one table silently reorder the other, and no single URL could\nexpress the pair of orders the reader is actually looking at. Both pairs are\nenumerated in `lib/permutations.ts` in this same change, including the permutation\nthat carries both at once.\n\nThe fixed `skill|case|harness|model` key order stays the default, and it remains\nthe only order in which `SessionSummaryTable`'s skill banding and its repeated-value\nmuting tell the truth — so **both switch off whenever a column is sorted**. Under\nany other order \"the row above\" is whatever the reader last clicked, and a band\ndrawn then is describing a grouping the table is no longer in.\n\n### 2. Every control on the overview writes through one patch function\n\n`overviewWith(route, patch)` spreads the current overview state and applies one\nchange. Controls no longer respell the route. This is not tidiness: the filter\nchips had already been caught clearing `sort`, the sort heads clearing `facets`,\nand each new param makes every control that predates it wrong by default. One\nfunction is wrong in one place or in none.\n\n### 3. `SessionTable` is budgeted to one screen, and width is taken from spelling rather than from data\n\nEvery metric stays. The width comes back from how figures are *written*, and from\none column that was not a metric:\n\n- the session id is not a column — it identified a row without telling you\n  anything about it, the row opens the `SessionView` that prints it beside a\n  `CopyId`, and `data-sid` still carries it;\n- `estimated_cost_usd` and `harness_reported_cost_usd` are one column: the\n  estimate is the value and the harness's own figure is a signed **drift** from\n  it. Two four-decimal figures side by side were being subtracted by eye, and the\n  subtraction is the whole question;\n- token counts are abbreviated (`1.5M`, `29.4k`) with the exact figure on the\n  cell's `title`, and cost drops to three decimals here (a tenth of a cent is\n  below the resolution anyone ranks a sweep by; `ReconciliationPanel` and\n  `CostByTierPanel`, which exist to reconcile, keep four);\n- `model` drops its vendor prefix and `case` the `eval_` every case shares —\n  and shortening is abandoned for the *whole* sweep if any two models would\n  collide, because a partial map reads as an inconsistency rather than a rule;\n- `baseline_tokens` loses its column to the `peak ctx` cell's title: it is the\n  harness's own prompt before the agent acted, near-constant within a harness,\n  and the one figure here nobody ranks a sweep by;\n- the heads print the shortest form that reads, and the eight `mean …` labels in\n  `SessionSummaryTable` say the word once in a caption instead of eight times in\n  eight heads. The canonical field name stays in every head's tooltip and\n  accessible name (WCAG 2.5.3), so nothing is renamed — only abbreviated;\n- the pair steps down to a 5px cell inset and bleeds to the card's edge. Fifteen\n  columns at the kit's 10px inset spent 300px on gutter, and `CardContent`'s 20px\n  frames prose, not a table that is the card's subject.\n\n**An identity column whose value is the same on every visible row is stated once\nin the table's `<caption>` and dropped.** Under a filter — which 0042 made the\nnormal way to read this page — that is where most of the width comes back: filter\nto one harness and the harness column stops existing rather than repeating twelve\ntimes. Only the four identity columns may collapse; a *measure* that happens to be\nequal on every row is a finding, and must stay visible as a column.\n\nThe measurement, not the column count, is the contract: `e2e/inline.spec.ts`\nasserts the box does not overflow. At 1440px both tables fit exactly; below\n~1350px `SessionTable` scrolls again, and the scroll box, its edge fade and its\nsticky head handle that as they did before.\n\n### 4. The aggregate waterfall aggregates the filtered population, not one group per line\n\n`TokenWaterfallAggregateChart` sits below `TokenAccumulationChart` and draws the\nsame six categories and total, averaged over every run in view. One waterfall,\nnot one per group: the filters are how a reader narrows to a group, which is what\nmakes the pair drillable rather than decorative, and sixteen small-multiple\nwaterfalls would answer no question the accumulation chart above does not already.\n\nEach column is the arithmetic mean over the runs that **reached** that turn — a\nshort run is missing from a late turn, never zero in it, and the divisor is that\ncount, never the run total. Because the mean base and the mean segments are taken\nover the same subset, the stack's top is the mean running total, which is what the\nmin–max whisker brackets.\n\nThat makes the late columns a mean of fewer and fewer runs, so **a column's\nopacity is the share of runs that reached it**: a turn one run of twenty-four\nsurvived to fades almost out rather than reading as a rising trend. The `total`\ncolumn is each run's own final figure, so it can sit *below* a late turn averaged\nover the one run that got there. That is survivorship, it is the honest reading of\n\"these runs, on average\", and it is shown rather than smoothed away.\n\n## Consequences\n\n- A reader sees every metric of every session without scrolling sideways at\n  1440px, and a filtered read fits a 1280px laptop.\n- Two figures whose difference is the interesting quantity are printed as that\n  difference. The real capture immediately showed drifts of +14% to +29% between\n  the plugin's estimate and Claude's own reported cost — visible at a glance, and\n  previously two columns apart.\n- `SessionSummaryTable` can be ranked, and doing so honestly costs it the banding\n  that only a fixed order justifies.\n- Abbreviation moves precision to a `title`. Exactness is one hover away, and\n  never on screen — a deliberate trade, and the reason the exact figure is on\n  every abbreviated cell rather than on some of them.\n- A new overview param is now a one-line change at each control instead of a\n  silent omission at every control that predates it.\n"}, "ADR-0044": {"file": "0044-a-skill-is-invoked-the-way-its-user-invokes-it.md", "title": "A skill is invoked the way its user invokes it, in each harness's own syntax", "status": "accepted", "status_note": "accepted, 2026-08-31. Refines\n[0011](0011-inject-skill-through-each-cli-path.md) (the skill loads through each\nCLI's own path) and\n[0034](0034-a-harness-is-a-class-and-the-registry-is-the-only-dispatch.md) (a\nharness is a class and the registry is the only dispatch). **Supersedes the\n`prompt=` field of `@evalcase` established by\n[0008](0008-evals-are-eval-prefixed-modules.md).** Breaking: `EvalCase.prompt`\nbecomes `EvalCase.task`, and `result.json`'s `case` record gains `task` beside\n`prompt`.", "markdown": "# 0044: A skill is invoked the way its user invokes it, in each harness's own syntax\n\nStatus: accepted, 2026-08-31. Refines\n[0011](0011-inject-skill-through-each-cli-path.md) (the skill loads through each\nCLI's own path) and\n[0034](0034-a-harness-is-a-class-and-the-registry-is-the-only-dispatch.md) (a\nharness is a class and the registry is the only dispatch). **Supersedes the\n`prompt=` field of `@evalcase` established by\n[0008](0008-evals-are-eval-prefixed-modules.md).** Breaking: `EvalCase.prompt`\nbecomes `EvalCase.task`, and `result.json`'s `case` record gains `task` beside\n`prompt`.\n\n## Context\n\n0011 settled that a skill reaches the agent through each CLI's own loading path,\nand the two adapters implemented it: Claude got `--add-dir <skill dir>`, Codex\ngot a copy into the private `CODEX_HOME/skills/`. Two different mechanisms, as\n0011 intended.\n\nBut the *prompt* stayed one string, shared by every cell of the case, and it had\nto paper over the difference the adapters had just introduced. Every case in\nevery consuming repository opened the same way:\n\n> Use the mermaidjs-diagrams skill (its SKILL.md is in the extra allowed\n> directory / your skills).\n\nThat sentence is the tell. \"The extra allowed directory / your skills\" is a\nprompt written to survive two loading paths at once, and it names neither\nmechanism correctly:\n\n| What the prompt asked for | What actually happens |\n| --- | --- |\n| Claude: \"its SKILL.md is in the extra allowed directory\" | `--add-dir` grants *tool access* to a path. It does not register a skill. The agent has to be told a path, then read it as a file, then decide to follow it — three steps a real user never performs. |\n| Codex: \"/ your skills\" | The skill *is* registered, and Codex's own instructions say the trigger is `$SkillName`. The prompt never used it, so the skill was reached by description-match at best. |\n\nSo the matrix's two arms were not running the same experiment. One arm graded a\nskill loaded as a document; the other graded a skill loaded as a skill. Neither\narm graded what a user does, which is the only invocation whose failure anybody\nwould care about. A skill whose `SKILL.md` frontmatter is malformed — the single\nmost common way a skill breaks for its users — passed both arms, because being\ntold to read a file does not require the file to be registered.\n\nBoth CLIs have a documented, verified invocation, and they are not the same:\n\n| Harness | Registration | Invocation a user types | Verified |\n| --- | --- | --- | --- |\n| `claude` | `--plugin-dir <dir>`, where the dir carries `.claude-plugin/plugin.json` and `skills/<skill>/` | `/<skill> <task>` | claude 2.1.251, against `--setting-sources \"\"` |\n| `codex` | a copy under the private `CODEX_HOME/skills/<skill>/` | `$<skill> <task>` | codex-cli 0.151.0, against `--ignore-user-config` |\n\nClaude's `--add-dir` was never a registration; `--plugin-dir` is, and it is the\nonly one that keeps 0005's isolation intact — a private `CLAUDE_CONFIG_DIR` would\ntake the credentials with it, and `--setting-sources user` needs them.\n\n## Decision\n\n**A case declares a task, not a prompt.** `@evalcase(task=...)` is the sentence a\nuser would type *after* naming the skill: \"Apply the palette mandate to\nARCHITECTURE.md.\" It never names the skill, never names a loading path, and never\nmentions a CLI.\n\n**The harness renders the invocation.** `Harness.invoke(skill=, task=)` is a new\nabstract member beside the four 0034 already requires, and it is the only place\neither syntax is spelled: `claude` renders `/<skill> <task>`, `codex` renders\n`$<skill> <task>`. Nothing outside `harness/` composes an invocation, so a third\nCLI with a third syntax is still the one-file job 0034 promises. The one lookup\nfrom underneath goes through `model/registry.py`, 0039's declared edge.\n\n**Registration is the adapter's job, and it is real registration.** The Claude\nadapter builds a wrapper plugin — `.claude-plugin/plugin.json` plus a copy of the\nskill under `skills/` — beside the workspace, and passes `--plugin-dir`. A skill\nwhose frontmatter Claude rejects now fails the cell, which is the point.\n\n**The rendered prompt is evidence.** `CaseRef` carries both: `task`, the case's\ndeclaration, and `prompt`, the exact string that reached the CLI. A reader of one\n`result.json` can see what was asked without holding the suite file, and two\ncells of one case can be compared knowing precisely how their asks differed.\n\n## Consequences\n\nEvery existing suite is a breaking change, and deliberately so: a `prompt=` that\nstill carries \"use the X skill (its SKILL.md is in ...)\" is exactly the text this\nrecord exists to delete. `@evalcase` raises on `prompt=` with a message naming\n`task=`, rather than accepting it as an alias — an alias would let the old\nsentence survive the upgrade.\n\nA cell can now fail for a reason it previously could not: the skill did not\nresolve. That is a true negative. `/nosuchskill` comes back as \"Unknown command\"\nwith zero billed tokens, so the evidence gate of\n[0045](0045-the-verifiers-ship-with-the-plugin.md) catches it before any grader\nreads a workspace.\n\nCaptured runs from before this record carry `case.prompt` and no `case.task`; a\nreplay reads the task back as empty rather than re-deriving it, per\n[0038](0038-a-tolerant-reader-still-honours-its-declaration.md).\n\nTwo things showed up only once the first live cell ran under a real invocation, and\nboth are consequences of registering the skill properly rather than describing it:\n\n**The skill's own `evals/` tree was being handed to the agent under test.** Both\nloading paths copy the skill directory, and since 0046 that directory contains the\ngoldens. The exclusion is now in the shared spawn contract (`harness/base.py`), not\nin either adapter, so a third provider cannot reintroduce it.\n\n**The dialects disagree about whether `SKILL.md` is ever *read*.** Same task, same\nfixture: `claude` resolves `/<skill>` by injecting the file, so it never appears in\nskill coverage, while `codex` is instructed to read it and so it does. An eval that\nasserts `SKILL.md` was loaded therefore passes on one arm and fails on the other for\na reason that is not about the skill — which is precisely the failure this record\nexists to end, reappearing one level down. `check_skill_was_loaded` has no default\nand refuses an empty call; what a case names is the `resources/` and `scripts/`\nmaterial the entry point points at, which both dialects reach when they follow it.\n\n## Lens\n\nAn eval that has to explain the harness to the agent is measuring the harness.\nThe prompt is not a place to reconcile two loading mechanisms — the reconciliation\nbelongs behind the interface that already exists to hold the difference, and what\nthe case declares is the part a user would actually say.\n"}, "ADR-0045": {"file": "0045-the-verifiers-ship-with-the-plugin.md", "title": "The verifiers ship with the plugin, and a rollout has one documented surface", "status": "accepted", "status_note": "accepted, 2026-08-31. Delivers the \"primitives pending\" of\n[0012](0012-grading-is-composable-not-prescribed.md) (grading is composable, not\nprescribed) and the \"helper pending\" of\n[0013](0013-verifiers-are-python-beside-the-case.md) (custom verifiers are Python\nbeside the case). Refines\n[0039](0039-the-package-listing-is-the-architecture.md) (the package listing is\nthe architecture) with a sixth layer. Breaking: a grader takes one `CaseOutput`\nin place of `(RunResult, Path)`.", "markdown": "# 0045: The verifiers ship with the plugin, and a rollout has one documented surface\n\nStatus: accepted, 2026-08-31. Delivers the \"primitives pending\" of\n[0012](0012-grading-is-composable-not-prescribed.md) (grading is composable, not\nprescribed) and the \"helper pending\" of\n[0013](0013-verifiers-are-python-beside-the-case.md) (custom verifiers are Python\nbeside the case). Refines\n[0039](0039-the-package-listing-is-the-architecture.md) (the package listing is\nthe architecture) with a sixth layer. Breaking: a grader takes one `CaseOutput`\nin place of `(RunResult, Path)`.\n\n## Context\n\n0012 declined to prescribe a grading DSL and 0013 kept verifiers as plain Python\nbeside the case. Both were right, and both left a helper library pending for two\nyears of records. What arrived instead was copy-paste. Four suites in one\nconsuming repository, and all four opened with the same block:\n\n```python\ndef check_run_is_real(run: RunResult) -> None:\n    assert run.session_id, \"no session id - ...\"\n    assert Path(run.session_log).is_file(), ...\n    assert run.exit_code == 0, ...\n    assert run.usage.accumulative_billed_tokens > 0, ...\n    assert run.cost_status == \"priced\", ...\n```\n\nFour copies drift, and these had. Two of the four had gone stale against the\nplugin's own types and were asserting nothing at all:\n\n| Written | Why it always passed |\n| --- | --- |\n| `run.skill_coverage.get(\"run\")` | `SkillCoverage` has been a dataclass since 0035. On a dataclass this raises `AttributeError` — the cell errored rather than graded, and an error is not a red check. |\n| `run.rates_applied.get(\"source\")` | Same: `AppliedRates` is a typed record. |\n| `run.cost_status == \"priced\"` | True by luck. `CostStatus` is a `StrEnum`, so this compares equal — but it is a comparison against a literal the vocabulary rule of 0041 forbids. |\n\nThe deeper cause is that nothing told a suite author what a rollout *is*. A\ngrader is handed `(RunResult, Path)` and `RunResult` has 27 fields, five of them\ntyped records with their own fields, two of them lists of further records. Every\nauthor reached for `.get()` because a mapping is what an undocumented payload\nlooks like.\n\n## Decision\n\n**`verify/` is a layer, between `derive/` and `emit/`.** It depends on `model/`\nand nothing else, and the ruff `TID251` rule of 0039 is extended to it in both\ndirections: `verify/` may not name `emit/` or `runtime/`, and `derive/`,\n`harness/` and `model/` may not name `verify/`. A verifier reads a finished\nrollout; it never participates in producing one.\n\n**A verifier is a function that raises `AssertionError` or returns.** No\nregistry, no result object, no DSL — 0012's decision stands. What ships is the\nvocabulary, not a framework: `check_run_is_real`, `check_run_is_priced`,\n`check_files_written`, `check_no_files_added`, `check_skill_was_loaded`,\n`check_skill_scripts_ran`, `check_subagents_spawned`, `check_tools_used`,\n`check_turns_within`, `check_no_tool_errors`. Each is importable alone, each says\nwhat went wrong in the agent's terms, and a suite that wants something else still\nwrites a plain function beside the case, exactly as 0013 says.\n\n**`check_rollout` is the gate every case owes.** It is `check_run_is_real` plus\n`check_run_is_priced`, and it is the first line of every shipped case: a verdict\nuntied to a session that happened and was billed is not a verdict. Making it one\nnamed call rather than five assertions is what stops the fifth from being dropped\nin the sixth copy.\n\n**The rollout has one named surface, and a grader takes it.** `CaseOutput` — in\n`model/output.py`, beside the other nouns — is the pair a grader has always been\nhanded, given a name and the accessors the copy-paste kept re-deriving:\n`output.run` (the `RunResult`), `output.workspace`, `output.read(rel)`,\n`output.exists(rel)`, `output.wrote(rel)`, `output.added` and `output.changed`.\nA grader's signature becomes `def eval_x(output: CaseOutput) -> None`. Two\npositional arguments were never two things — they were one rollout that had no\nnoun, which is why every suite re-opened the same file with the same four lines\nof `pathlib` around it.\n\n`docs/rollout.md` documents that surface field by field, against the dataclasses\nrather than beside them. It is the answer to \"what can I assert\", and it is what\na suite author reads instead of guessing at `.get()`.\n\n## Consequences\n\n`pytest_xharness_eval.verify` is public API and versioned as such. A check whose\nassertion tightens is a breaking change for consuming suites, which is the\ncorrect pressure: a shared gate that can be silently loosened is worse than four\ncopies.\n\nEvery grader's signature changes. A two-parameter grader raises at collection\nwith a message naming `CaseOutput`, rather than being adapted by arity sniffing:\na suite that still expects `(run, workspace)` is a suite written against the\nundocumented surface this record replaces, and the four stale checks above are\nwhat silent adaptation would have carried forward.\n\nThe four stale suites fail loudly on upgrade rather than passing vacuously.\n`SkillCoverage` and `AppliedRates` are reached as attributes because\n`check_skill_scripts_ran` reaches them that way once, in typed code that\n`mypy --strict` checks.\n\nVerifiers are unit-tested against captured logs in `tests/test_units.py` — real\n`result.json` files folded by the real adapters, never a fabricated `RunResult`,\nwhich 0002 forbids for the same reason it forbids a mocked CLI.\n\n## Lens\n\n\"Composable, not prescribed\" is a decision about the *shape* of grading, not a\nreason to ship nothing. The library that composition needs is a vocabulary of\nnamed checks with one documented noun beneath them; withhold it and every\nconsuming repository writes the vocabulary anyway, four times, and two of the\ncopies rot into assertions that cannot fail.\n"}, "ADR-0046": {"file": "0046-a-golden-is-compared-facet-by-facet-within-a-declared-tolerance.md", "title": "A golden is compared facet by facet, and every facet declares its tolerance", "status": "accepted", "status_note": "accepted, 2026-08-31. Refines\n[0012](0012-grading-is-composable-not-prescribed.md) (grading is composable, not\nprescribed),\n[0018](0018-fixtures-directory-and-metrics-history.md) (fixtures live under\n`evals/fixtures/`) and\n[0045](0045-the-verifiers-ship-with-the-plugin.md) (the verifiers ship with the\nplugin).", "markdown": "# 0046: A golden is compared facet by facet, and every facet declares its tolerance\n\nStatus: accepted, 2026-08-31. Refines\n[0012](0012-grading-is-composable-not-prescribed.md) (grading is composable, not\nprescribed),\n[0018](0018-fixtures-directory-and-metrics-history.md) (fixtures live under\n`evals/fixtures/`) and\n[0045](0045-the-verifiers-ship-with-the-plugin.md) (the verifiers ship with the\nplugin).\n\n## Context\n\nThe palette-mandate case is the harness's reference eval, and its grading is five\nsubstring searches:\n\n```python\nassert \"```mermaid\" in doc\nassert \"classDef\" in doc\nassert \"fill:#\" in doc\nassert \"color:\" in doc\n```\n\nGiven the fixture — one unstyled flowchart — a correct answer is very nearly\ndetermined. The skill mandates an explicit `classDef` per node group, with fill\nand text colour drawn from its own palette, and the diagram's node set is fixed\nby the fixture. We can write down what right looks like. The substring searches\ndo not: `classDef x fill:#000,color:#000` passes all four, and so does a\ndocument that styled one node of nine and left the rest on Mermaid's defaults.\n\nThe obvious repair — check the output against a stored correct file — fails in\nthe other direction. Two valid answers differ in whitespace, in the order the\n`classDef` lines appear, in whether a node group is called `service` or `svc`, in\none hex value being a legitimate neighbour on the same palette ramp. An exact\ncomparison would be red on every run and would teach its reader to ignore it.\n\nSo a golden needs to be neither a substring nor a file, and the missing piece is\nnot a smarter diff. It is *saying which parts of the answer are determined and\nwhich are free*, per part, and being able to read the failure.\n\n## Decision\n\n**A golden is a real, complete, correct artifact**, stored at\n`evals/goldens/<name>/<path>` — mirroring `evals/fixtures/<name>/<path>`, so the\npairing between a seed and its known-good output is the directory layout and not\na convention anyone has to remember. It is committed, readable, and rendered by\nthe same tools as the real thing: a golden nobody can open is a hash.\n\n**A `GoldenCase` is that artifact plus a facet list.** A facet is a named\nextraction from the text — node ids, fence count, `classDef` selectors, fill\ncolours, headings, a numeric measure — paired with the tolerance under which the\ncandidate's value must match the golden's. Facets are ordinary functions\n`str -> object`, so a project extracts whatever its artifact has; `verify/facets.py`\nships the markdown and mermaid extractors the shipped cases need.\n\n**Tolerance is declared, never inferred.** Six kinds, and each answers one\nquestion about how much freedom this facet has:\n\n| Tolerance | Holds when | Protects |\n| --- | --- | --- |\n| `Exact()` | candidate == golden | the part with one right answer |\n| `Superset()` | candidate ⊇ golden | a required floor, additions allowed |\n| `Jaccard(at_least=)` | set overlap ≥ threshold | naming freedom within a fixed concept set |\n| `Ratio(at_least=)` | `difflib` similarity ≥ threshold | prose that must stay recognisable |\n| `Count(delta=)` / `Count(lo, hi)` | a count near the golden's, or in a range | structure with legitimate slack |\n| `Within(lo, hi)` | a number in a closed range | a measure with a defensible band |\n\nA facet with no tolerance is a type error, not a default to `Exact` — the whole\npoint is that the author states how free each part is.\n\n**A mismatch reports the delta, not the diff.** `GoldenMismatch` is an\n`AssertionError` whose message is one row per facet: its name, its tolerance, the\ngolden's value, the candidate's value, and — for the set tolerances — what was\nmissing and what was extra, truncated to a readable width. Passing facets are\nlisted too, because a report that shows only failures cannot distinguish \"one\nfacet failed\" from \"one facet ran\".\n\n## Consequences\n\nA golden must be regenerated when the skill's own contract changes, and that is a\nvisible commit against a readable file. `GoldenCase.record()` writes a candidate\ninto the golden path for exactly that purpose; it is never called during grading,\nso a run can never launder its own output into the reference.\n\nA tolerance is a claim about the skill under test and belongs in review. A\n`Jaccard(at_least=0.5)` says half the concepts may be renamed and the case still\npasses, which is usually a sign the facet is the wrong extraction rather than a\nsign the threshold is right.\n\nFacet extraction is pure and free, so a golden comparison is exercised in\n`tests/test_units.py` against committed text, with no rollout and no spend.\n\n## Lens\n\nBetween \"contains the word\" and \"equals the file\" there is one honest position:\nname the parts of the answer, and say for each how much variation is still\ncorrect. The tolerance is the interesting content of the eval — it is the\nauthor's actual claim about the skill — so it must be written down where a\nreviewer reads it, not hidden inside a similarity threshold on the whole file.\n"}, "ADR-0047": {"file": "0047-adrs-are-authored-as-data-and-their-markdown-is-generated.md", "title": "ADRs are authored as data, and the argument travels verbatim", "status": "accepted", "status_note": "accepted, 2026-08-31. Refines\n[0032](0032-all-run-output-consolidates-under-a-cache-dir.md) (generated output\nhas one owner). Structural only: no record's argument changes, every id, slug,\nanchor and inbound citation still resolves, and each generated `.md` is\nbyte-identical to the file it replaced from its `# NNNN:` heading down.", "markdown": "# 0047: ADRs are authored as data, and the argument travels verbatim\n\nStatus: accepted, 2026-08-31. Refines\n[0032](0032-all-run-output-consolidates-under-a-cache-dir.md) (generated output\nhas one owner). Structural only: no record's argument changes, every id, slug,\nanchor and inbound citation still resolves, and each generated `.md` is\nbyte-identical to the file it replaced from its `# NNNN:` heading down.\n\n## Context\n\nThe index at `docs/adrs/README.md` carried the relation graph as prose in a\nhand-maintained Status column -- \"refines 0016, 0037, 0038 and 0039; supersedes\n0040's placement of `Verdict`\". Forty-six records, 109 cross-references, and one\ntable a human had to update by hand on every addition. It had already drifted, and\nthe drift is invisible: a missing row reads exactly like a record with no relations.\n\nThe librarian's `okf-yaml` convention exists for this, and its trigger fired. Its\nrecord schema, however, decomposes an argument into `problem.symptom` +\n`problem.pain_point` as two scalars, and `decision` into `given` / `we_prefer` /\n`because` / `unless`. Measured against this corpus that shape does not fit:\n\n| Section | median words | max | with tables | with code fences |\n| --- | --- | --- | --- | --- |\n| `## Context` | 117 | 416 | 10 | 2 |\n| `## Decision` | 210 | 919 | 3 | 6 |\n| `## Consequences` | 72 | 319 | 0 | 0 |\n\nA 919-word Decision carrying six code fences has nowhere to go in four scalar\nclauses. `consequences.cons` carries `minItems: 1`, while these records argue in\nnarrative rather than in pros and cons -- so adopting the shipped schema unchanged\nwould have meant writing 46 new `cons` lists. That is authoring decisions, not\nrecording them, and a requirement invented during a migration is a requirement\nnobody agreed to.\n\n## Decision\n\n**The record is the source of truth, and the argument is cargo.** Each ADR is\nauthored as `NNNN-slug.yml`; `body.context`, `body.decision` and\n`body.consequences` hold their sections as verbatim markdown block scalars, tables\nand fenced code included. The generator emits them unchanged, which is what makes\nevery generated `.md` byte-identical to the file it replaced from the `# NNNN:`\nheading down. Nothing was reformatted in transit.\n\n**The schema is tightened to the corpus, not the corpus to the schema.** The\nlibrarian's own instruction is to copy the schema and tighten it to the adopting\nrepository's dialect, so `docs/adrs/record.schema.json` requires exactly what all\n46 records demonstrably carry -- id, slug, title, status, the verbatim status\nsentence, both dates, relations, body -- and makes optional what none of them do:\n`description`, `tags`, `provenance`, `enforced_in`. An absent field is a fact about\nthe corpus. Four records have no `## Lens`; `lens` is therefore optional, and those\nfour keep no Lens rather than gaining an invented one.\n\n**Typed edges are inferred from the sentence, and the sentence is kept.** The\nstatus line's own vocabulary maps onto the closed relation set -- \"refines\" to\n`extends`, \"refined by\" to `extended_by`, \"supersedes\" / \"superseded by\" to their\nown pair -- and each edge's `note` records which verb produced it. The full\noriginal sentence stays verbatim in `status_note` and is what the generated index\nrenders, so typing the relations adds a queryable graph without costing the\nphrasing. This is the one-way conversion the convention warns about, declined:\nboth forms are kept.\n\n**The title stays in an H1.** OKF's own preference is a frontmatter title with no\nheading above the body, but the observed dialect of this repository puts it in\n`# NNNN: Title`, every inbound citation resolves against that, and templates own\npresentation while the schema owns structure. The generated frontmatter carries the\ntitle as well, so a query reaches it without parsing the heading.\n\n## Consequences\n\n`docs/adrs/*.md` becomes build output. Editing one is lost on the next `make adrs`;\nthe banner in each file's frontmatter says so, and CI fails when a generated file\ndiffers from a fresh build.\n\n`docs/adrs/README.md` is replaced by the generated `index.md`, because OKF reserves\n`index.md` for the directory listing and requires any other `.md` in the bundle to\ncarry frontmatter. GitHub therefore no longer renders a landing page for\n`docs/adrs/`; the ten inbound links that named `README.md` now name `index.md`.\n\nThe first symmetry run reports 109 one-way edges. That is the expected finding on a\ncorpus whose cross-references were only ever written in one direction, and it is\nreported rather than failed: closing an edge is a decision about the record set,\nwhich is the maintainer's, not the migration's.\n\nA record is now edited in two files' worth of discipline -- the `.yml` and a rebuild\n-- where it used to be one. That cost buys the schema gate, the typed graph, and an\nindex that cannot drift from the records it lists.\n\n## Lens\n\nA schema earns its keep on the metadata a corpus actually carries, never on the\nshape a template wishes it had. Where the source supplies a field, extract it;\nwhere it does not, leave the field absent and say why -- filling it is authoring\nnew requirements under the cover of a migration, and nobody reviews a migration\nthe way they review a decision.\n"}}</script>
<script id="token-data" type="application/json">{"$schema": "xharness-report-design-tokens/1", "name": "xharness default", "fonts": {"body": "ui-sans-serif, system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif", "mono": "ui-monospace, SFMono-Regular, Menlo, monospace"}, "themes": {"light": {"bg": "#f7f7fa", "panel": "#ffffff", "ink": "#1b1d23", "muted": "#5b6070", "line": "#e2e4ea", "accent": "#4f46e5", "good": "#047857", "bad": "#b91c1c", "warn": "#b45309", "code": "#f1f2f6", "grid": "#e6e8ee", "axis": "#c8ccd6", "plot": "#ffffff", "series": ["#4f46e5", "#d97706", "#059669", "#db2777", "#0284c7", "#7c3aed", "#dc2626", "#0d9488"], "waterfall": {"baseline": "#64748b", "read": "#94a3b8", "context": "#2563eb", "thinking": "#7c3aed", "output": "#059669", "sub": "#ea580c", "total": "#1b1d23"}, "hljs": "github"}, "dark": {"bg": "#0f1117", "panel": "#171a23", "ink": "#e6e8ef", "muted": "#9aa0b0", "line": "#2a2e3a", "accent": "#a5b4fc", "good": "#34d399", "bad": "#f87171", "warn": "#fbbf24", "code": "#1f2330", "grid": "#262a36", "axis": "#3a3f4e", "plot": "#171a23", "series": ["#a5b4fc", "#fbbf24", "#34d399", "#f9a8d4", "#7dd3fc", "#c4b5fd", "#fca5a5", "#5eead4"], "waterfall": {"baseline": "#94a3b8", "read": "#475569", "context": "#60a5fa", "thinking": "#c4b5fd", "output": "#34d399", "sub": "#fb923c", "total": "#e6e8ef"}, "hljs": "github-dark"}}, "categories": {"prompt": "#1d4ed8", "assistant_text": "#065f46", "thinking": "#6d28d9", "tool_call": "#4338ca", "tool_result": "#0f766e", "tool_exec": "#9a3412", "file_change": "#be185d", "usage": "#b45309", "harness_context": "#3f6212", "harness_meta": "#475569", "session_meta": "#1e3a8a", "lifecycle": "#b91c1c", "unknown": "#374151"}}</script>
<script>
(function () {
  "use strict";
  const read = (id) => JSON.parse(document.getElementById(id).textContent);
  const graph = read("graph-data");
  const RECORDS = read("record-data");
  const TOKENS = read("token-data");
  const pane = document.getElementById("pane");
  // A function declaration, not a const: applyTheme() runs before the graph exists
  // and would otherwise hit the temporal dead zone.
  function css(name) {
    return getComputedStyle(document.documentElement).getPropertyValue("--" + name).trim();
  }
  // Never `window.cy`: an element with id="cy" already claims that name through named
  // access on window, so the theme pass would style a <div> and throw.
  let graphInstance = null;

  if (!window.cytoscape || !window.marked) {
    document.getElementById("cy").innerHTML =
      '<p class="nofx">cytoscape.js and marked.js load from cdnjs.cloudflare.com. ' +
      "This page is otherwise self-contained; with no network the graph cannot draw. " +
      "The same records are readable as markdown in index.md.</p>";
    return;
  }

  // ---- theme -----------------------------------------------------------------
  // The repository's shipped design tokens drive the page, so the graph matches the
  // report. Both themes' values are written as CSS custom properties up front; the
  // toggle only flips which set is live.
  const themes = (TOKENS.themes) || {};
  function applyTheme(name) {
    document.documentElement.setAttribute("data-theme", name);
    const t = themes[name];
    if (t) {
      for (const [k, v] of Object.entries(t)) {
        if (typeof v === "string") document.documentElement.style.setProperty("--" + k, v);
      }
    }
    try { localStorage.setItem("adr-graph-theme", name); } catch (_) { /* opaque file:// origin */ }
    if (graphInstance) style(graphInstance);
  }
  let stored = null;
  try { stored = localStorage.getItem("adr-graph-theme"); } catch (_) { /* opaque file:// origin */ }
  const preferred =
    stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  applyTheme(preferred);
  document.getElementById("theme").onclick = () =>
    applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");

  // ---- elements --------------------------------------------------------------
  // graph.json carries the neutral data, compound parents included: each record
  // declares one `group`, its domain. Presentation is decided here, and both channels
  // are derived rather than assigned: fill is the domain, size is in-degree (how many
  // records refine or supersede this one). Status rides on the border, because only
  // one record is superseded and a whole colour channel would be wasted on it.
  const elements = graph.elements;
  const GROUPS = elements
    .filter((e) => String(e.data.id).startsWith("group-") )
    .map((e) => ({ id: e.data.id, label: e.data.label, colour: e.data.colour }))
    .sort((a, b) => a.label.localeCompare(b.label));

  const indegree = {};
  for (const e of elements) if (e.data.source) indegree[e.data.target] = (indegree[e.data.target] || 0) + 1;
  for (const e of elements) if (!e.data.source) e.data.weight = indegree[e.data.id] || 0;

  function style(cy) {
    cy.style([
      {
        selector: "node",
        style: {
          "background-color": "data(colour)",
          label: "data(label)",
          color: "#ffffff",
          "font-family": "ui-monospace, Menlo, monospace",
          "font-size": 10,
          "text-valign": "center",
          "text-halign": "center",
          width: (n) => 22 + Math.min(n.data("weight"), 10) * 3.4,
          height: (n) => 22 + Math.min(n.data("weight"), 10) * 3.4,
          "border-width": 0,
        },
      },
      {
        // A compound parent is a container, not a node: no fill of its own beyond a
        // wash of its domain colour, and its name sits above the cluster.
        selector: ":parent",
        style: {
          "background-color": "data(colour)",
          "background-opacity": 0.07,
          "border-width": 1,
          "border-color": "data(colour)",
          "border-opacity": 0.45,
          "border-style": "dashed",
          shape: "round-rectangle",
          padding: 14,
          label: "data(label)",
          color: "data(colour)",
          "font-family": "var(--body)",
          "font-size": 12,
          "font-weight": "bold",
          "text-valign": "top",
          "text-halign": "center",
          "text-margin-y": -4,
        },
      },
      {
        // The one status that is not "accepted" earns a ring rather than a hue.
        selector: 'node[status = "superseded"]',
        style: { "border-width": 3, "border-color": css("bad"), "border-opacity": 1 },
      },
      {
        selector: "edge",
        style: {
          width: 1.4,
          "line-color": (e) => (e.data("relation").startsWith("supersede") ? css("bad") : css("accent")),
          "target-arrow-color": (e) => (e.data("relation").startsWith("supersede") ? css("bad") : css("accent")),
          "target-arrow-shape": "triangle",
          "arrow-scale": 0.8,
          "curve-style": "bezier",
          "line-style": (e) => (e.data("relation").startsWith("supersede") ? "solid" : "dashed"),
          opacity: 0.5,
        },
      },
      { selector: "node.sel", style: { "border-width": 4, "border-color": css("ink"), "border-opacity": 1 } },
      { selector: ":parent.dim", style: { "background-opacity": 0.02, "border-opacity": 0.12, "text-opacity": 0.25 } },
      { selector: "node.dim, edge.dim", style: { opacity: 0.15 } },
      { selector: "edge.hot", style: { opacity: 1, width: 2.4 } },
      { selector: "node.hot", style: { opacity: 1 } },
    ]);
  }

  // ---- the grouped layout ------------------------------------------------------
  // Computed here rather than left to a force layout, for two reasons. Cytoscape's
  // built-in `cose` is only nominally compound-aware: records whose edges reach across
  // domains get dragged out of their own cluster, which collapsed several groups to a
  // few pixels. And a force layout is non-deterministic, so a committed generated file
  // would draw a different picture on every rebuild. The purpose-built compound
  // layouts (fcose, cose-bilkent) are not on the CDN this page is allowed to use.
  //
  // Shelf packing: each domain becomes a grid of its records, the grids are laid out
  // left to right and wrapped, and every position is a pure function of the sorted
  // record ids. Same input, same picture, every time.
  const SLOT = 66;          // one record's cell, in graph units
  const GAP = 46;           // between domain boxes

  function groupedPositions() {
    const boxes = GROUPS.map((g) => {
      const kids = elements
        .filter((e) => e.data.parent === g.id)
        .map((e) => e.data.id)
        .sort();
      const cols = Math.max(1, Math.ceil(Math.sqrt(kids.length)));
      const rows = Math.ceil(kids.length / cols);
      return { ...g, kids, cols, rows, w: cols * SLOT, h: rows * SLOT };
    });

    // Wrap width is derived from the total area and the pane's aspect ratio, so the
    // arrangement stays roughly as wide as the space it has to fit into. A fixed width
    // produced a long thin strip that fitted to almost nothing in a tall pane.
    const area = boxes.reduce((a, b) => a + (b.w + GAP) * (b.h + GAP), 0);
    const box = document.getElementById("cy").getBoundingClientRect();
    const aspect = box.width && box.height ? box.width / box.height : 1;
    const shelf = Math.max(
      Math.max(...boxes.map((b) => b.w)),
      Math.sqrt(area * Math.max(aspect, 0.6)),
    );

    const pos = {};
    let x = 0, y = 0, shelfHeight = 0;
    for (const b of boxes) {
      if (x > 0 && x + b.w > shelf) { x = 0; y += shelfHeight + GAP; shelfHeight = 0; }
      b.kids.forEach((id, i) => {
        pos[id] = {
          x: x + (i % b.cols) * SLOT + SLOT / 2,
          y: y + Math.floor(i / b.cols) * SLOT + SLOT / 2,
        };
      });
      x += b.w + GAP;
      shelfHeight = Math.max(shelfHeight, b.h);
    }
    return pos;
  }

  const GROUPED = {
    name: "preset",
    positions: (n) => groupedPositions()[n.id()],
    padding: 40,
    animate: false,
    fit: true,
  };

  const cy = cytoscape({
    container: document.getElementById("cy"),
    elements,
    layout: GROUPED,
    wheelSensitivity: 0.2,
  });
  graphInstance = cy;
  window.__adrGraph = cy;  // the browser check reaches the instance through this
  style(cy);

  // ---- selection -------------------------------------------------------------
  function show(id) {
    const rec = RECORDS[id];
    if (!rec) return;
    cy.batch(() => {
      cy.elements().removeClass("sel hot dim").addClass("dim");
      const node = cy.getElementById(id);
      node.removeClass("dim").addClass("sel hot");
      node.connectedEdges().removeClass("dim").addClass("hot").connectedNodes().removeClass("dim").addClass("hot");
    });
    pane.classList.remove("empty");
    pane.innerHTML =
      '<div class="meta"><span class="chip">' + id + '</span>' +
      '<span class="chip ' + rec.status + '">' + rec.status + "</span>" +
      '<a class="chip" href="' + rec.file + '">' + rec.file + "</a></div>" +
      '<div id="doc">' + marked.parse(rec.markdown) + "</div>";
    // A link to another record navigates the graph instead of leaving the page. Scoped to
    // the rendered body: the chip above links to this record's own file and must keep its
    // native behaviour, or it would rewire into a no-op that reselects the current record.
    for (const a of pane.querySelectorAll('#doc a[href$=".md"]')) {
      const target = Object.keys(RECORDS).find((k) => RECORDS[k].file === a.getAttribute("href"));
      if (!target) continue;
      a.classList.add("adr");
      a.addEventListener("click", (ev) => { ev.preventDefault(); select(target); });
    }
    pane.scrollTop = 0;
  }

  function select(id) {
    show(id);
    history.replaceState(null, "", "#" + id);
    const n = cy.getElementById(id);
    if (n.length) {
      cy.animate({ center: { eles: n }, zoom: Math.max(cy.zoom(), 0.75) }, { duration: 220 });
    }
  }

  cy.on("tap", "node", (ev) => select(ev.target.id()));
  cy.on("tap", (ev) => {
    if (ev.target !== cy) return;
    cy.elements().removeClass("sel hot dim");
    pane.classList.add("empty");
    pane.innerHTML = "<p>Select a record to read it.<br>Links between records navigate the graph.</p>";
    history.replaceState(null, "", "#");
  });

  // ---- controls --------------------------------------------------------------
  // One chip per domain. Clicking isolates that domain; clicking again restores the
  // whole graph. Counts come from the elements, so the legend cannot disagree with them.
  const nav = document.getElementById("groups");
  let isolated = null;
  for (const g of GROUPS) {
    const count = cy.getElementById(g.id).children().length;
    const chip = document.createElement("button");
    chip.className = "gchip";
    chip.type = "button";
    chip.setAttribute("aria-pressed", "false");
    chip.dataset.group = g.id;
    chip.innerHTML =
      '<span class="sw" style="background:' + g.colour + '"></span>' + g.label +
      ' <span class="n">' + count + "</span>";
    chip.onclick = () => {
      isolated = isolated === g.id ? null : g.id;
      for (const c of nav.children) c.setAttribute("aria-pressed", String(c.dataset.group === isolated));
      cy.batch(() => {
        cy.elements().removeClass("dim");
        if (!isolated) return;
        const keep = cy.getElementById(isolated).children();
        cy.elements().addClass("dim");
        keep.removeClass("dim");
        cy.getElementById(isolated).removeClass("dim");
        // Only edges with both ends inside the domain. A cross-domain edge left lit
        // terminates at a node that is no longer drawn, which reads as a stray line.
        keep.edgesWith(keep).removeClass("dim");
      });
    };
    nav.appendChild(chip);
  }

  document.getElementById("fit").onclick = () => cy.fit(undefined, 30);
  document.getElementById("layout").onchange = (ev) => {
    const choice = ev.target.value;
    // The alternates are force- or tree-based and ignore compound containment, so the
    // domain boxes stretch to wherever their records land. That is a fair view of the
    // relation structure; `grouped` is the one that keeps the domains legible.
    cy.layout(
      choice === "grouped"
        ? GROUPED
        : {
            name: choice, animate: false, padding: 30, directed: true, spacingFactor: 1.15,
            nodeRepulsion: 12000, idealEdgeLength: 70, nestingFactor: 1.2, numIter: 1000,
          },
    ).run();
    cy.fit(undefined, 30);
  };

  document.getElementById("q").addEventListener("input", (ev) => {
    const q = ev.target.value.trim().toLowerCase();
    cy.batch(() => {
      if (!q) { cy.elements().removeClass("dim"); return; }
      cy.nodes().forEach((n) => {
        if (n.isParent()) { n.addClass("dim"); return; }
        const hit =
          n.id().toLowerCase().includes(q) ||
          (n.data("title") || "").toLowerCase().includes(q) ||
          (n.data("group") || "").toLowerCase().includes(q);
        n.toggleClass("dim", !hit);
      });
      cy.edges().addClass("dim");
    });
  });

  window.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") { document.getElementById("q").value = ""; cy.elements().removeClass("dim"); }
    if (ev.key === "/" && document.activeElement !== document.getElementById("q")) {
      ev.preventDefault(); document.getElementById("q").focus();
    }
  });

  // The hash is the address. Honour it on load and on every later change, so the browser's
  // back and forward buttons walk the reading history and a pasted link opens its record.
  function fromHash() {
    const id = decodeURIComponent(location.hash.slice(1));
    if (RECORDS[id]) show(id);
  }
  window.addEventListener("hashchange", fromHash);

  // Fit once the first layout has settled, then honour any deep link. Fitting before
  // the layout runs measures an empty extent and leaves the graph off-screen.
  cy.ready(() => {
    cy.fit(undefined, 30);
    const deep = decodeURIComponent(location.hash.slice(1));
    if (RECORDS[deep]) select(deep);
  });
  window.addEventListener("resize", () => cy.fit(undefined, 30));
})();
</script>
</body>
</html>
