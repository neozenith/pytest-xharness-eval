ta": {"id": "ADR-0040-superseded_by-ADR-0041", "source": "ADR-0040", "target": "ADR-0041", "label": "superseded by", "relation": "superseded_by", "note": "the record's status line says \"superseded by\""}}, {"data": {"id": "ADR-0041-extends-ADR-0016", "source": "ADR-0041", "target": "ADR-0016", "label": "extends", "relation": "extends", "note": "the record's status line says \"refines\""}}, {"data": {"id": "ADR-0041-extends-ADR-0037", "source": "ADR-0041", "target": "ADR-0037", "label": "extends", "relation": "extends", "note": "the record's status line says \"refines\""}}, {"data": {"id": "ADR-0041-extends-ADR-0038", "source": "ADR-0041", "target": "ADR-0038", "label": "extends", "relation": "extends", "note": "the record's status line says \"refines\""}}, {"data": {"id": "ADR-0041-extends-ADR-0039", "source": "ADR-0041", "target": "ADR-0039", "label": "extends", "relation": "extends", "note": "the record's status line says \"refines\""}}, {"data": {"id": "ADR-0041-extends-ADR-0040", "source": "ADR-0041", "target": "ADR-0040", "label": "extends", "relation": "extends", "note": "the record's status line says \"refines\""}}, {"data": {"id": "ADR-0042-extends-ADR-0020", "source": "ADR-0042", "target": "ADR-0020", "label": "extends", "relation": "extends", "note": "the record's status line says \"refines\""}}, {"data": {"id": "ADR-0042-extends-ADR-0021", "source": "ADR-0042", "target": "ADR-0021", "label": "extends", "relation": "extends", "note": "the record's status line says \"refines\""}}, {"data": {"id": "ADR-0042-extends-ADR-0028", "source": "ADR-0042", "target": "ADR-0028", "label": "extends", "relation": "extends", "note": "the record's status line says \"refines\""}}, {"data": {"id": "ADR-0042-extends-ADR-0031", "source": "ADR-0042", "target": "ADR-0031", "label": "extends", "relation": "extends", "note": "the record's status line says \"refines\""}}, {"data": {"id": "ADR-0043-extends-ADR-0020", "source": "ADR-0043", "target": "ADR-0020", "label": "extends", "relation": "extends", "note": "the record's status line says \"refines\""}}, {"data": {"id": "ADR-0043-extends-ADR-0021", "source": "ADR-0043", "target": "ADR-0021", "label": "extends", "relation": "extends", "note": "the record's status line says \"refines\""}}, {"data": {"id": "ADR-0043-extends-ADR-0025", "source": "ADR-0043", "target": "ADR-0025", "label": "extends", "relation": "extends", "note": "the record's status line says \"refines\""}}, {"data": {"id": "ADR-0043-extends-ADR-0031", "source": "ADR-0043", "target": "ADR-0031", "label": "extends", "relation": "extends", "note": "the record's status line says \"refines\""}}, {"data": {"id": "ADR-0043-extends-ADR-0042", "source": "ADR-0043", "target": "ADR-0042", "label": "extends", "relation": "extends", "note": "the record's status line says \"refines\""}}, {"data": {"id": "ADR-0044-extends-ADR-0011", "source": "ADR-0044", "target": "ADR-0011", "label": "extends", "relation": "extends", "note": "the record's status line says \"refines\""}}, {"data": {"id": "ADR-0044-extends-ADR-0034", "source": "ADR-0044", "target": "ADR-0034", "label": "extends", "relation": "extends", "note": "the record's status line says \"refines\""}}, {"data": {"id": "ADR-0044-supersedes-ADR-0008", "source": "ADR-0044", "target": "ADR-0008", "label": "supersedes", "relation": "supersedes", "note": "the record's status line says \"supersedes\""}}, {"data": {"id": "ADR-0045-extends-ADR-0012", "source": "ADR-0045", "target": "ADR-0012", "label": "extends", "relation": "extends", "note": "the record's status line says \"delivers\""}}, {"data": {"id": "ADR-0045-extends-ADR-0013", "source": "ADR-0045", "target": "ADR-0013", "label": "extends", "relation": "extends", "note": "the record's status line says \"delivers\""}}, {"data": {"id": "ADR-0045-extends-ADR-0039", "source": "ADR-0045", "target": "ADR-0039", "label": "extends", "relation": "extends", "note": "the record's status line says \"refines\""}}, {"data": {"id": "ADR-0046-extends-ADR-0012", "source": "ADR-0046", "target": "ADR-0012", "label": "extends", "relation": "extends", "note": "the record's status line says \"refines\""}}, {"data": {"id": "ADR-0046-extends-ADR-0018", "source": "ADR-0046", "target": "ADR-0018", "label": "extends", "relation": "extends", "note": "the record's status line says \"refines\""}}, {"data": {"id": "ADR-0046-extends-ADR-0045", "source": "ADR-0046", "target": "ADR-0045", "label": "extends", "relation": "extends", "note": "the record's status line says \"refines\""}}, {"data": {"id": "ADR-0047-extends-ADR-0032", "source": "ADR-0047", "target": "ADR-0032", "label": "extends", "relation": "extends", "note": "the record's status line says \"refines\""}}], "layout": {"name": "cose"}, "height": 620}</script>
<script id="record-data" type="application/json">{"ADR-0001": {"file": "0001-ship-as-a-pytest-plugin.md", "title": "Ship as a pytest plugin with per-skill opt-in evals", "status": "accepted", "status_note": "accepted, 2026-08-20. The in-repository package location named in the\nDecision is superseded by [0014](0014-register-through-the-pytest11-entry-point.md);\nthe choice of a pytest plugin over a standalone CLI stands.", "markdown": "# 0001: Ship as a pytest plugin with per-skill opt-in evals\n\nStatus: accepted, 2026-08-20. The in-repository package location named in the\nDecision is superseded by [0014](0014-register-through-the-pytest11-entry-point.md);\nthe choice of a pytest plugin over a standalone CLI stands.\n\n## Context\n\nThe brief asked for a lightweight, portable harness that runs both agent CLIs\nheadlessly, across a model matrix, with fixtures, goldens, and custom verifiers.\nA standalone CLI would re-implement discovery, selection, and reporting that pytest\nalready provides. The surrounding toolchain and test conventions were Python-first,\nwith `uv` already the package manager in use.\n\n## Decision\n\nThe harness is a custom pytest plugin, first housed as a package inside the\nrepository whose skills it evaluated. It supplies shared fixtures and extends\ncollection to find eval structures under `skills/<skill>/evals/`. A skill opts in by adopting that layout and nothing else.\n\n## Consequences\n\nBare pytest mechanics work unmodified: path arguments target one skill, `-k` and\nnode ids select cells, the terminal report is pytest's. The cost is that the\nharness inherits pytest's collection rules, which forced ADR 0008 and ADR 0009.\nRejected: a standalone argparse CLI (second surface to keep in step), TypeScript\nwith bun and Go (neither had test conventions to lean on for a pytest-shaped matrix).\n\n## Lens\n\nWhen a capability already lives in pytest, reuse it; add a plugin option only when\npytest has no equivalent.\n"}, "ADR-0002": {"file": "0002-every-cell-invokes-the-real-cli.md", "title": "Every eval cell always invokes the real CLI", "status": "accepted", "status_note": "accepted, 2026-08-20. Inside this package the boundary is the\n`pragma: no cover` on every function that spawns a CLI\n([0014](0014-register-through-the-pytest11-entry-point.md)).", "markdown": "# 0002: Every eval cell always invokes the real CLI\n\nStatus: accepted, 2026-08-20. Inside this package the boundary is the\n`pragma: no cover` on every function that spawns a CLI\n([0014](0014-register-through-the-pytest11-entry-point.md)).\n\n## Context\n\nTwo project rules appeared to conflict: tests never mock, and paid agent runs are\nnever a dependency of the free `ci` target. A record-and-replay tier was the first\nidea for reconciling them.\n\n## Decision\n\nThere is no replay layer, no recorded-fixture tier, and no `--live` flag. A cell\nalways runs the real `claude` or `codex` process and always costs money. The eval\nsuite is a declared exception to the `ci` rule, recorded as a carve-out in the\nconsuming project's rules. The free `ci` target covers only `test_*.py` unit tests.\n\n## Consequences\n\nThe only signal the harness produces is real agent behaviour; a cell that did not\ninvoke an agent has measured nothing. The rules are reconciled by scoping, not by\nrecording: unit tests are free and mock-free, evals are paid and mock-free. Every\nsweep spends money, so the matrix became an explicit spend dial (ADR 0010).\n\n## Lens\n\nNever let a cell report a verdict without a real session log behind it. If a run\ncannot be real, fail the cell; do not fake it.\n"}, "ADR-0003": {"file": "0003-runresult-is-a-stdlib-dataclass.md", "title": "RunResult is a stdlib dataclass serialised to JSON", "status": "accepted", "status_note": "accepted, 2026-08-20; JSON Schema file not yet written.", "markdown": "# 0003: RunResult is a stdlib dataclass serialised to JSON\n\nStatus: accepted, 2026-08-20; JSON Schema file not yet written.\n\n## Context\n\nTwo adapters produce one record. Without a shared contract their shapes drift and\nparity becomes an assertion nobody can check. Pydantic would validate but adds a\ndependency to a harness whose brief is minimal.\n\n## Decision\n\n`RunResult` is a `dataclasses.dataclass` serialised to flat JSON, with a committed\n`runresult.schema.json` that both adapters validate against.\n\n## Consequences\n\nThe plugin has no runtime dependency beyond pytest. The schema is the single\nsource of truth for parity. Until the schema file ships, parity rests on both\nadapters returning the same dataclass, which the type checker enforces but a\nmismatched JSON artefact would not reveal.\n\n## Lens\n\nPrefer a committed schema over a validation library; a schema is diffable and\nlanguage-neutral, and it costs nothing at runtime.\n"}, "ADR-0004": {"file": "0004-workspace-is-a-plain-copy.md", "title": "A workspace is a plain copy of the fixture tree, with no git context", "status": "accepted", "status_note": "accepted, 2026-08-20. The project `tmp/` location is now\nthe `xharness_workdir` ini key, default `tmp/evals`\n([0014](0014-register-through-the-pytest11-entry-point.md)).", "markdown": "# 0004: A workspace is a plain copy of the fixture tree, with no git context\n\nStatus: accepted, 2026-08-20. The project `tmp/` location is now\nthe `xharness_workdir` ini key, default `tmp/evals`\n([0014](0014-register-through-the-pytest11-entry-point.md)).\n\n## Context\n\nSeveral skills a consuming project may want to evaluate reason about diffs and\nhistory. Giving every\nworkspace a git repository costs setup time and forces fixtures to be committed\nsubtrees. The user ruled git-dependent skills out of scope for this iteration.\n\n## Decision\n\nEach cell's workspace is `shutil.copytree` of the fixture into the project `tmp/`,\ndiscarded and rebuilt per cell. No `git init`, no worktree. A case that needs git\nmust fail loudly rather than run in a git-less workspace and report a score.\n\n## Consequences\n\nMaterialisation is fast and trivially resettable, and keeps run artefacts under\nthe project's `tmp/`. Code-review, change-walkthrough, refactoring and similar\ndiff-reading skills cannot be evaluated yet. The `workspace` fixture is the seam where a git strategy is added\nlater, without a rewrite.\n\n## Lens\n\nDo not give a workspace capabilities no in-scope skill reads; add them at the\nworkspace seam when a skill that needs them enters scope.\n"}, "ADR-0005": {"file": "0005-private-codex-home-per-run.md", "title": "A private per-run CODEX_HOME, seeded with the credential files", "status": "accepted", "status_note": "accepted, 2026-08-20; verified live 2026-08-21.", "markdown": "# 0005: A private per-run CODEX_HOME, seeded with the credential files\n\nStatus: accepted, 2026-08-20; verified live 2026-08-21.\n\n## Context\n\n`codex exec` has no caller-chosen session id. Rollouts land under\n`$CODEX_HOME/sessions/YYYY/MM/DD/`. Picking the newest file by modification time\nraces any concurrent Codex session, which is exactly the grading-the-wrong-\ntranscript failure this harness exists to prevent.\n\n## Decision\n\nEach Codex cell runs with `CODEX_HOME` pointed at a private directory into which\nthe harness first copies `auth.json` and `.credentials.json` from the real home.\nExactly one rollout can then exist under that directory, so correlation is\nstructural. The `session_meta` id in the rollout is the cell's session id.\n\n## Consequences\n\nOne mechanism serves three needs: log correlation, ambient-config isolation, and\nthe skill-injection path (`$CODEX_HOME/skills`). The accepted risk is that\n`CODEX_HOME` is also the credential store; the first live run proved seeding\nworks. Rejected: newest-by-mtime (races), stdout id alone (depends on flush order).\n\n## Lens\n\nWhen a tool offers no identity lever, isolate its whole state store so only one\nartefact can exist; never search for the newest one.\n"}, "ADR-0006": {"file": "0006-local-price-table-is-authoritative.md", "title": "A local prices.toml is authoritative, with an optional upstream seed", "status": "accepted", "status_note": "accepted, 2026-08-21; `--seed-prices` not yet built. The table is now\nbundled inside the package and layered with the consumer's optional\n`xharness_prices` file ([0014](0014-register-through-the-pytest11-entry-point.md)).\nThe project-level override moved from a rootdir `prices.toml` into `xharness_prices`\nini lines with [0030](0030-price-rows-live-in-the-pytest-config.md); the bundled\ntable is unchanged.", "markdown": "# 0006: A local prices.toml is authoritative, with an optional upstream seed\n\nStatus: accepted, 2026-08-21; `--seed-prices` not yet built. The table is now\nbundled inside the package and layered with the consumer's optional\n`xharness_prices` file ([0014](0014-register-through-the-pytest11-entry-point.md)).\nThe project-level override moved from a rootdir `prices.toml` into `xharness_prices`\nini lines with [0030](0030-price-rows-live-in-the-pytest-config.md); the bundled\ntable is unchanged.\n\n## Context\n\nNeither CLI's session log carries cost, and Codex reports none anywhere. The\nLiteLLM feed was fetched and carries per-token input, output, cache-read, and\ncache-write rates for Anthropic models. Its coverage of Codex's aliased model\nnames (for example `gpt-5.6-sol`) is unconfirmed.\n\n## Decision\n\nA committed `prices.toml` is the single authority for rates. A `--seed-prices`\ncommand will populate and refresh rows from upstream, never overwrite a row\nmarked as a local override, and report every model it could not match.\n\n## Consequences\n\nClaude rates can be refreshed from a real upstream; Codex aliases stay\nhand-entered. Until the seed command exists, every row is maintained by hand, and\nabsolute USD figures lag provider changes. Relative comparison across cells stays\nrobust regardless.\n\n## Lens\n\nKeep the price table owned, not generated. An upstream is a convenience for\nfilling it, never the thing the harness reads.\n"}, "ADR-0007": {"file": "0007-unpriced-model-aborts-before-spend.md", "title": "An unpriced model aborts at matrix expansion and never prices as zero", "status": "accepted", "status_note": "accepted, 2026-08-20.", "markdown": "# 0007: An unpriced model aborts at matrix expansion and never prices as zero\n\nStatus: accepted, 2026-08-20.\n\n## Context\n\nA model missing from the price table could be priced at zero with a warning,\nrecorded as `null`, or treated as an error. Zero makes an expensive sweep look\nfree; `null` pushes the obligation onto every consumer of the report.\n\n## Decision\n\nPrice coverage is validated when the matrix expands, before any cell runs. An\nunpriced model stops the sweep with the model named. `--dry-run` surfaces the\nsame gap without spending.\n\n## Consequences\n\nA new model blocks a sweep until a row is added, which is the intended friction.\nThe failure lands before money is spent, so fail-loud costs nothing here.\n\n## Lens\n\nValidate anything that gates spend before the first paid call, and make the\nfailure name the fix.\n"}, "ADR-0008": {"file": "0008-evals-are-eval-prefixed-modules.md", "title": "Evals are `eval_*.py` modules collected by a directory-scoped hook", "status": "accepted", "status_note": "accepted, 2026-08-20. Refined by\n[0016](0016-results-travel-on-the-test-report.md): the `eval_` prefix also applies\nto case functions. The `skills/` root is now the `xharness_skills_dir` ini key\n([0014](0014-register-through-the-pytest11-entry-point.md)).", "markdown": "# 0008: Evals are `eval_*.py` modules collected by a directory-scoped hook\n\nStatus: accepted, 2026-08-20. Refined by\n[0016](0016-results-travel-on-the-test-report.md): the `eval_` prefix also applies\nto case functions. The `skills/` root is now the `xharness_skills_dir` ini key\n([0014](0014-register-through-the-pytest11-entry-point.md)).\n\n## Context\n\nPaid eval cells must never be triggered by an ordinary unit-test run. pytest's\n`python_files` option is a single rootdir-level setting, so changing it to\n`eval_*.py` would stop `test_*.py` collecting across the whole repository.\n\n## Decision\n\nAn eval case is a Python module named `eval_*.py` under `skills/<skill>/evals/`,\nbeside its `fixture/` and `captured/` directories. The plugin collects it through\nits own `pytest_collect_file` hook scoped to that path shape. `python_files` is\nleft at its default.\n\n## Consequences\n\nThe `eval_*` prefix separates paid cells from unit tests by name. Because a case\nis an executable module, custom verifiers are ordinary functions and need no\nsecond mechanism (ADR 0013). A directory that matches the layout but defines no\ncase fails collection loudly rather than contributing zero cells.\n\n## Lens\n\nSeparate paid work from free work by collection scope and name, never by a skip\nmarker that exits green.\n"}, "ADR-0009": {"file": "0009-register-via-rootdir-conftest.md", "title": "Register the plugin from the rootdir conftest.py", "status": "superseded", "status_note": "superseded by\n[0014](0014-register-through-the-pytest11-entry-point.md) on 2026-08-21, the day it\nwas accepted. Replaced an earlier draft that chose `addopts = -p <package>.plugin`.\nKept because its Lens still applies to any uninstalled plugin.", "markdown": "# 0009: Register the plugin from the rootdir conftest.py\n\nStatus: superseded by\n[0014](0014-register-through-the-pytest11-entry-point.md) on 2026-08-21, the day it\nwas accepted. Replaced an earlier draft that chose `addopts = -p <package>.plugin`.\nKept because its Lens still applies to any uninstalled plugin.\n\n## Context\n\nA `conftest.py` inside the plugin's own package directory cannot hook collection\nunder `skills/*/evals/`: conftest hooks apply only to their own subtree.\n`addopts = -p <package>.plugin` was tried next. Verified 2026-08-21, it is\ninvocation-dependent for an uninstalled package: `python -m pytest` puts the cwd\non `sys.path` and it works; the bare `pytest` console script does not, and it\nfails with `ImportError: No module named '<package>'`.\n\n## Decision\n\nA one-line repository-root `conftest.py` declares\n`pytest_plugins = [\"<package>.plugin\"]`. Importing that file is what puts the root\non `sys.path`, so it works under every invocation, and since pytest 7 the rootdir\nconftest is the one place `pytest_plugins` is honoured. The eventual target is a\nPyPI package registering the same module through a `pytest11` entry point.\n\n## Consequences\n\nOne file lives outside the plugin package. The package keeps an importable,\npackage-shaped layout so extraction later is a packaging change. `pytest.ini` carries only a comment\nexplaining why it does not register the plugin.\n\n## Lens\n\nTest a registration mechanism under both `python -m pytest` and the console\nscript before adopting it; the two differ in what is importable.\n"}, "ADR-0010": {"file": "0010-matrix-options-and-dry-run.md", "title": "Global default matrix, per-case override, and --model / --cli / --dry-run", "status": "accepted", "status_note": "accepted, 2026-08-20. Refined by\n[0015](0015-harness-is-the-axis-and-the-project-owns-the-matrix.md): `--cli` is\n`--harness`, and a project-scope `xharness_matrix` sits between the case and the\nplugin default.", "markdown": "# 0010: Global default matrix, per-case override, and --model / --cli / --dry-run\n\nStatus: accepted, 2026-08-20. Refined by\n[0015](0015-harness-is-the-axis-and-the-project-owns-the-matrix.md): `--cli` is\n`--harness`, and a project-scope `xharness_matrix` sits between the case and the\nplugin default.\n\n## Context\n\nEvery cell is paid (ADR 0002), so the matrix is the spend dial. `-k` string\nmatching against node ids can narrow a run but cannot price one in advance, and\nhides the cost control behind a substring.\n\n## Decision\n\nA default matrix lives in `matrix.py`; a case may override it. The plugin adds\nthree options: `--model` and `--cli` narrow the sweep, and `--dry-run` enumerates\nthe cells that would run, with estimated USD, without invoking anything.\n\n## Consequences\n\nWidening the repository-wide sweep is a single edit. A sweep can be priced before\nit is paid for, which stock pytest cannot do. The plugin owns three options\nbeyond stock pytest, against the spirit of ADR 0001; each exists because pytest\nhas no equivalent.\n\n## Lens\n\nExpose spend controls as explicit, discoverable options; never make the cost of\na run depend on remembering a substring.\n"}, "ADR-0011": {"file": "0011-inject-skill-through-each-cli-path.md", "title": "The skill under test loads through each CLI's own skill path", "status": "accepted", "status_note": "accepted, 2026-08-20.", "markdown": "# 0011: The skill under test loads through each CLI's own skill path\n\nStatus: accepted, 2026-08-20.\n\n## Context\n\nThe deliverable being evaluated is a skill. Inlining its body into the prompt\nwould grade a prompt while still attributing the score to the skill. Copying it\ninto the workspace as `.claude/skills/` only takes effect when settings sources\nare loaded, which fights the isolation goal.\n\n## Decision\n\nClaude receives the skill directory through `--add-dir`; Codex loads it from\n`$CODEX_HOME/skills/<skill>`. Two mechanisms, each the path a real user's skill\ntravels.\n\n## Consequences\n\nThe eval exercises skill loading, not just skill text. Two injection paths must\nbe kept in step in `runner.py`.\n\n## Lens\n\nEvaluate a deliverable through the loading path its real users take; a shortcut\nthat bypasses loading changes what is being measured.\n"}, "ADR-0012": {"file": "0012-grading-is-composable-not-prescribed.md", "title": "Grading semantics are not prescribed; the plugin supplies primitives", "status": "accepted", "status_note": "accepted, 2026-08-21; golden-tree and projection\nprimitives not yet shipped.", "markdown": "# 0012: Grading semantics are not prescribed; the plugin supplies primitives\n\nStatus: accepted, 2026-08-21; golden-tree and projection\nprimitives not yet shipped.\n\n## Context\n\nAgent prose is non-deterministic, so byte-exact comparison of transcripts always\nfails, while loosening comparison too far produces a grader that cannot fail. What\ncounts as a correct run differs per skill and is not knowable up front.\n\n## Decision\n\nNo single comparison semantic is mandated. A case is an ordinary function that\ncomposes checks with plain `assert` over the `RunResult` and the workspace. The\nplugin's set of grading primitives is curated over time; an LLM judge may join it\nlater as one optional primitive, never as the house rule.\n\n## Consequences\n\nNew primitives are added without touching existing cases. The one invariant that\nsurvives: a check that cannot evaluate raises; it never passes. Today only plain\nassertions are shipped; the reference case shows the intended layering.\n\n## Lens\n\nGive case authors tools, not a policy; enforce only that no check can silently\npass.\n"}, "ADR-0013": {"file": "0013-verifiers-are-python-beside-the-case.md", "title": "Custom verifiers are Python modules beside the case", "status": "accepted", "status_note": "accepted, 2026-08-21; dynamic import helper not yet built.", "markdown": "# 0013: Custom verifiers are Python modules beside the case\n\nStatus: accepted, 2026-08-21; dynamic import helper not yet built.\n\n## Context\n\nSkills need checks the plugin did not anticipate. A shell command per verifier is\nportable but loses structured detail on failure. Declarative assertions in a\nmanifest only cover checks anticipated when the schema was written.\n\n## Decision\n\nA verifier is a plain Python callable. It lives in `skills/<skill>/evals/`, is\nversioned with the cases that use it, and is imported by the case module like any\nother code. A verifier that fails to import fails the case loudly.\n\n## Consequences\n\nExtensibility uses a mechanism every Python developer already knows. No registry,\nno DSL, no new file format. Until a dedicated import helper exists, a case imports\nits verifiers directly.\n\n## Lens\n\nWhen extensibility is the goal, prefer the host language's own import mechanism\nover a plug-in registry.\n"}, "ADR-0014": {"file": "0014-register-through-the-pytest11-entry-point.md", "title": "Register through the pytest11 entry point of an extracted package", "status": "accepted", "status_note": "accepted, 2026-08-21. Supersedes\n[0009](0009-register-via-rootdir-conftest.md). Refined by\n[0017](0017-distributed-through-pypi-with-trusted-publishing.md): distribution moved\nfrom an editable path dependency to PyPI; and by\n[0026](0026-skill-ignore-lives-in-the-pytest-config.md): the per-skill `.skillignore`,\nthe one location read outside the ini keys, is gone.", "markdown": "# 0014: Register through the pytest11 entry point of an extracted package\n\nStatus: accepted, 2026-08-21. Supersedes\n[0009](0009-register-via-rootdir-conftest.md). Refined by\n[0017](0017-distributed-through-pypi-with-trusted-publishing.md): distribution moved\nfrom an editable path dependency to PyPI; and by\n[0026](0026-skill-ignore-lives-in-the-pytest-config.md): the per-skill `.skillignore`,\nthe one location read outside the ini keys, is gone.\n\n## Context\n\nThe harness began as an uninstalled package inside the repository whose skills it\nevaluated, registered by a rootdir `conftest.py` (ADR 0009). That made the plugin and\nthe evals it runs one undifferentiated change set, and tied three paths to\n`__file__`: the skills root found by walking up the tree, the `tmp/evals` work\ndirectory, and the `report.json` path inside the package. The brief\nalways named extraction as the end state; the trigger was wanting to review plugin\nchanges apart from eval changes.\n\n## Decision\n\nThe plugin is its own distribution, `pytest-xharness-eval`, with the module\n`pytest_xharness_eval`. Its `pyproject.toml` declares\n`[project.entry-points.pytest11] xharness_eval = \"pytest_xharness_eval.plugin\"`, and\ninstalling the package is the whole registration. During development the consuming\nrepository installs it as an editable path dependency.\n\nEvery location the plugin needs is an ini key resolved against pytest's `rootpath`:\n`xharness_skills_dir` (default `skills`), `xharness_workdir` (default `tmp/evals`),\nand `xharness_prices` (default `prices.toml`, optional, layered over the bundled\ntable). The single `__file__`-relative path that remains is the bundled\n`prices.toml`.\n\n## Consequences\n\nConsumers carry no `conftest.py` or `pytest.ini` for the plugin. They do need a\nconfig file at the repository root (an empty `[tool.pytest.ini_options]` suffices) so\nthe rootdir is the repository and not the common ancestor of the arguments; the\nreport header names the resolved skills root and marks it missing when it is not\nthere. The plugin's own test suite runs through `pytester` as real nested sessions,\nand the functions that spawn a CLI are excluded from coverage with a stated reason\nrather than faked, which keeps ADR 0002 intact inside the package.\n\n## Lens\n\nWhen a plugin leaves its birthplace, every path it derived from `__file__` becomes a\nrootdir-relative option, and the registration becomes the entry point.\n"}, "ADR-0015": {"file": "0015-harness-is-the-axis-and-the-project-owns-the-matrix.md", "title": "Harness is the axis name, and the project owns the default matrix", "status": "accepted", "status_note": "accepted, 2026-08-21. Refines\n[0010](0010-matrix-options-and-dry-run.md).", "markdown": "# 0015: Harness is the axis name, and the project owns the default matrix\n\nStatus: accepted, 2026-08-21. Refines\n[0010](0010-matrix-options-and-dry-run.md).\n\n## Context\n\nThe first design named the first matrix axis \"cli\" (`--cli`, `Cell.cli`, `RunResult.cli`),\nwhile the package is named for cross-*harness* evaluation. Two words for one axis\nis the kind of drift the vocabulary table exists to prevent. Separately, the only\nway to change a repository's sweep was to edit the plugin's `DEFAULT_MATRIX` or to\nrepeat `models=` on every case; there was no project scope between the two.\n\nVisibility was also thin: a six-cell sweep printed as dots, and the verbose line\nsaid only `PASSED`, hiding the cost that had just been incurred.\n\n## Decision\n\nThe axis is called **harness** everywhere: the `--harness` option, `Cell.harness`,\n`RunResult.harness`, `KNOWN_HARNESSES`, and the `harness` key in `report.json`.\nMatrix entries stay `harness/model`.\n\nThe matrix has three scopes, highest precedence first: a case's `models=`, the\nproject's `xharness_matrix` ini key, and the plugin's `DEFAULT_MATRIX`. A case that\nomits `models=` inherits; `EvalCase.models` is `None` in that state so inheritance\nis distinguishable from an explicit choice.\n\nTwo hooks carry the itemised view inside ordinary pytest output. Before the first\ncell runs, `pytest_report_collectionfinish` lists every permutation grouped by case.\nAs each cell lands, `pytest_report_teststatus` replaces the verbose status word with\nthe verdict, USD, token count, and duration, and shows `DRY-RUN` for a dry-run skip.\n\n## Consequences\n\nCaptured `.result.json` files written before this change carry a `cli` key; they are\ngit-ignored run artefacts and are not migrated. Consumers see `--cli` rejected as an\nunknown option, which is the loud failure wanted. The report header names which\nmatrix scope applied, so a surprising cell count is diagnosable from the first two\nlines of output. A pivot report was considered and deferred: the requirement was\nvisibility inside pytest's own output, not a second report.\n\n## Lens\n\nName an axis once, in the word the package is named for, and give every\nconfigurable default a project scope between the case and the plugin.\n"}, "ADR-0016": {"file": "0016-results-travel-on-the-test-report.md", "title": "Results travel on the test report, and cells group by harness", "status": "accepted", "status_note": "accepted, 2026-08-21. Refines\n[0008](0008-evals-are-eval-prefixed-modules.md).", "markdown": "# 0016: Results travel on the test report, and cells group by harness\n\nStatus: accepted, 2026-08-21. Refines\n[0008](0008-evals-are-eval-prefixed-modules.md).\n\n## Context\n\nPer-cell records (verdict, USD, tokens, duration) were kept on `config.stash`,\nwhich is per process. Under `pytest-xdist` the workers run the cells and the\ncontroller renders the output, so the verbose status words fell back to plain\n`PASSED` and `report.json` was empty. The cells themselves were already isolated:\neach has its own workspace, its own private `CODEX_HOME`, and its own minted\nClaude session id.\n\nA second rule was missing: pytest's collection convention applies the `test_`\nprefix to files and functions alike, and this plugin pivoted that prefix to\n`eval_` for files only. Any function name was accepted.\n\n## Decision\n\nThe worker copies a cell's record onto its call `TestReport.user_properties`, the\none channel xdist serialises to the controller. The controller reads it there for\nthe status word and accumulates it in `pytest_runtest_logreport` for the summary and\n`report.json`. The single-process path is the same code.\n\nEvery cell carries `xdist_group=<harness>`, so `-n 2 --dist loadgroup` runs the\nharnesses in parallel and each harness's cells serially. That respects per-provider\nrate limits and avoids concurrent copies of Codex credentials refreshing against\neach other, a risk not yet measured.\n\n`@evalcase` functions must be named `eval_*`; any other name is a `UsageError` at\ncollection. The `eval_` prefix is the collection rule for files and functions, as\n`test_` is for pytest.\n\n## Consequences\n\n`-v -n N` output is as itemised as a serial run. The pre-run permutation summary is\nnot printed under xdist because its controller does not call\n`pytest_report_collectionfinish`; `--collect-only -q` shows the plan instead. Full\nfan-out (`-n 6` without `--dist loadgroup`) is possible but is a deliberate choice,\nnot the documented default.\n\n## Lens\n\nState that must reach the controller rides on the report; state that stays in a\nprocess belongs to that process only.\n"}, "ADR-0017": {"file": "0017-distributed-through-pypi-with-trusted-publishing.md", "title": "Distribute through PyPI with trusted publishing, released from a GitHub Release", "status": "accepted", "status_note": "accepted, 2026-08-21; first release (0.1.0) published to PyPI the same\nday from GitHub Release `v0.1.0`. Refines [0014](0014-register-through-the-pytest11-entry-point.md).", "markdown": "# 0017: Distribute through PyPI with trusted publishing, released from a GitHub Release\n\nStatus: accepted, 2026-08-21; first release (0.1.0) published to PyPI the same\nday from GitHub Release `v0.1.0`. Refines [0014](0014-register-through-the-pytest11-entry-point.md).\n\n## Context\n\nADR 0014 made the plugin its own distribution but left installation at \"an editable\npath dependency during development\". That works only on a machine that holds both\nrepositories side by side; it is not something a consumer's `pyproject.toml` can\nrecord, and the README already instructs `uv add --dev pytest-xharness-eval`, which\nresolves only against an index. The package follows the maintainer's standard packaging\nconventions: a `uv_build` wheel, a `Makefile` as the command surface,\nand publishing driven by CI rather than by a laptop.\n\nA PyPI API token would work but is a long-lived secret to store and rotate. PyPI's\ntrusted publishing instead issues a short-lived upload token against an OpenID\nConnect claim set that names the repository, the workflow file, and the environment.\n\n## Decision\n\nPyPI is the distribution channel and the only one a consumer is told about. A release\nis a GitHub Release: publishing it triggers `.github/workflows/publish.yml`, which\nbuilds the wheel with `uv build --wheel` and uploads with `uv publish` under the\n`pypi` environment with `id-token: write`. The trusted publisher registered on PyPI\nfor `pytest-xharness-eval` names exactly that owner, repository, workflow filename,\nand environment. No publishing token is stored anywhere.\n\nThe version is declared twice, `version` in `pyproject.toml` and `__version__` in the\npackage, and a unit test pins them equal, so a bump to one without the other fails\n`make test` before a tag can be cut. Tags are `vX.Y.Z` and match the wheel's version.\n\nThe editable path dependency remains a development convenience for working on the\nplugin against a live consumer; it is never what a consumer commits. `make\npublish-test` against TestPyPI and `make publish` stay as the manual, token-based\nfallback for when the OIDC path is unavailable.\n\n## Consequences\n\nA consumer pins a version from PyPI and gets the `pytest11` registration of ADR 0014\nby installing it; the consuming repository no longer needs to know where the plugin's\nsource lives. Until the first release is cut, `uv add --dev pytest-xharness-eval`\nfails with no matching version rather than installing something stale, which is the\nloud failure this project prefers. Publishing has one silent coupling: if the\nenvironment name on PyPI's publisher differs from the workflow's `pypi` environment,\nthe token exchange fails with a claims mismatch that is visible only in the Actions\nlog. Every release is a GitHub Release, which is also where the changelog lives\n(`project.urls.Changelog`).\n\n## Lens\n\nMake the release path one trigger with one identity: a single event starts it, OIDC\nproves who is publishing, and nothing long-lived has to be stored or rotated.\n"}, "ADR-0018": {"file": "0018-fixtures-directory-and-metrics-history.md", "title": "Fixtures live under evals/fixtures/, and every live cell appends to a metrics history", "status": "accepted", "status_note": "accepted, 2026-08-21; revised the same day: `history.jsonl` lives under `captured/` and is not version-controlled. Refines [0004](0004-workspace-is-a-plain-copy.md)\nand [0016](0016-results-travel-on-the-test-report.md).", "markdown": "# 0018: Fixtures live under evals/fixtures/, and every live cell appends to a metrics history\n\nStatus: accepted, 2026-08-21; revised the same day: `history.jsonl` lives under `captured/` and is not version-controlled. Refines [0004](0004-workspace-is-a-plain-copy.md)\nand [0016](0016-results-travel-on-the-test-report.md).\n\n## Context\n\nA fixture was addressed by a path relative to `evals/` and conventionally placed\nbeside a `captured/` directory named for the case, which tied seed trees to single\ncases although several scenarios can start from one seed. Per-run metrics existed\nonly inside each git-ignored `.result.json`, so there was no history of a skill's\nevals over time. The pre-run permutation summary added in 0015 was not needed and\nxdist's controller never printed it anyway.\n\n## Decision\n\nThe layout under `<skill>/evals/` is:\n\n```text\neval_<suite>.py            # eval_* functions\nfixtures/<name>/           # seed workspaces; @evalcase(fixture=\"<name>\")\ncaptured/<case>/           # each run's session log and .result.json; git-ignored\nhistory.jsonl              # one metrics line per live cell; committed\n```\n\nEach live cell appends one flat JSON record to `history.jsonl`: timestamp, node,\nharness, model, session id, verdict, turns, tool calls (total and by name), the\nagent-reported duration, the harness wall clock, USD, tokens by tier, and files\nwritten. The same record rides on `TestReport.user_properties`, with its scalars\nas individual `xharness_*` properties so `--junitxml` carries them, and feeds the\nverbose status word (`PASSED  $0.1261  573,213 tok  71.0s  12 turns  9 tools`).\n\nThe pre-run permutation summary is removed. `--dist loadgroup` is an option, not\na requirement: plain `-n N` is supported; `loadgroup` keeps one harness per\nworker.\n\n## Consequences\n\nA dry run touches neither `captured/` nor `history.jsonl`. `history.jsonl` grows\nby one line per paid cell and is the committed record of a skill's eval history;\nanything richer is derived from it or from the captured results.\n\n## Lens\n\nSeed data is a pool, evidence is keyed by what produced it, and the metrics worth\nkeeping are the ones small enough to commit.\n"}, "ADR-0019": {"file": "0019-per-call-ledger-and-ttl-priced-cache-writes.md", "title": "Every run carries a per-call ledger; tokens are reported as context and billed; cache writes price by TTL", "status": "accepted", "status_note": "accepted, 2026-08-22. Refines [0003](0003-runresult-is-a-stdlib-dataclass.md),\n[0006](0006-local-price-table-is-authoritative.md) and [0018](0018-fixtures-directory-and-metrics-history.md).", "markdown": "# 0019: Every run carries a per-call ledger; tokens are reported as context and billed; cache writes price by TTL\n\nStatus: accepted, 2026-08-22. Refines [0003](0003-runresult-is-a-stdlib-dataclass.md),\n[0006](0006-local-price-table-is-authoritative.md) and [0018](0018-fixtures-directory-and-metrics-history.md).\n\n## Context\n\nAn audit of six captured cells (2026-08-22) found every figure the plugin reported\nwas arithmetically exact and still misleading on three counts:\n\n- `tokens` summed the four billed tiers over every model call. The cached prefix is\n  re-read on each call, so a 13-call opus run with a 51k peak context reported\n  526k \"tokens\", ten times what the model ever held. The number was right as a\n  billing quantity and wrong as the quantity readers took it for.\n- `turns` meant two different things. For Claude it was the envelope's `num_turns`,\n  which equals tool calls plus one; for Codex it counted `task_complete` events,\n  which is always one for `codex exec`. Neither was the number of model calls,\n  although `_claude_usage` computed that number and discarded it.\n- Claude's own `total_cost_usd` sat 15% to 23% above `cost_usd`. The price table\n  carried one cache-write rate, the 5-minute TTL (1.25x input), while every write in\n  every log was `ephemeral_1h` (2x input). The remainder, $0.00107 per session, is\n  Claude Code's `ai-title` side call, present in the envelope cost and absent from\n  the main model's usage.\n\nThe per-call detail that explained all three was in the session logs the plugin\nalready captures, and was thrown away during normalisation.\n\n## Decision\n\n`RunResult` carries a per-call ledger, `calls: list[Call]`. One `Call` per model API\ncall holds its `Usage`, its stop reason, the tool calls it issued, the tool results\nthat entered its context since the previous call, and its text. Both adapters build\nit: Claude keys on `message.id`; Codex keys on `token_count` events using\n`last_token_usage`, with the outputs that precede a count attributed to the next\ncall's context (that is the order the rollout records them in).\n\nFrom the ledger:\n\n- `turns` is the number of model calls on both harnesses. The CLI's own figure is\n  kept as `reported_turns`.\n- `usage` is the ledger's sum. The CLI's own aggregate is kept as `reported_usage`.\n- `baseline_tokens` is the first call's context; `context_tokens` is the largest\n  context any call processed. `Usage.total_tokens` remains the billed sum and is\n  recorded as `billed_tokens`; the bare word `tokens` is retired from the history\n  record and the status word.\n\n`Usage` gains `cache_write_1h_tokens` and `cache_write_5m_tokens` from Claude's\n`usage.cache_creation`. `Rates` gains `cache_write_1h`; a row that omits it gets\n`cache_write x 1.6`, the Anthropic ratio. `price()` bills tagged writes at their TTL\nrate and untagged writes at `cache_write`, and records `cost_by_tier`.\n\nThe status word becomes\n`PASSED  $0.6604 (cli $0.6615)  51,110 ctx  526,467 billed  87.1s  13 turns  12 tools`:\nthe CLI's own cost beside the plugin's whenever one exists, so drift is visible on\nevery cell rather than rediscovered by audit.\n\n## Consequences\n\n`history.jsonl` records written before this decision carry `tokens` and no\n`billed_tokens`; readers treat the two as the same quantity. Old `.result.json`\nfiles have no `calls`; the report (ADR 0020) says so and offers nothing for them.\n`Usage` keeps its positional field order and `total_tokens`, so graders that assert\n`run.usage.total_tokens > 0` are unchanged. The $0.00107 title-call residue stays\noutside `cost_usd` on purpose: it is not the model under test.\n\n## Lens\n\nKeep the per-call evidence; a sum is a view of it, and a sum without its parts\ncannot be audited.\n"}, "ADR-0020": {"file": "0020-captured-report-is-a-static-microsite.md", "title": "`captured/report.html` is a static microsite over the captured JSON", "status": "accepted", "status_note": "accepted, 2026-08-22. Refines [0018](0018-fixtures-directory-and-metrics-history.md).", "markdown": "# 0020: `captured/report.html` is a static microsite over the captured JSON\n\nStatus: accepted, 2026-08-22. Refines [0018](0018-fixtures-directory-and-metrics-history.md).\n\n## Context\n\nA sweep leaves `<skill>/evals/captured/` holding one `.result.json` and one session\nlog per cell, plus `history.jsonl`. Reading them meant a terminal and `jq`, and the\nper-call ledger introduced by [0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md)\nis too wide for a status word. The first token audit was built as a one-off page\nby hand; the shape it needed is the shape every sweep needs.\n\n## Decision\n\nAfter every sweep that captured at least one cell, the plugin writes into each\ntouched `captured/` directory:\n\n- `index.json`: one summary row per captured cell (case, harness, model, session,\n  verdict and timestamp from `history.jsonl`, cost, baseline / context / billed\n  tokens, turns, tool calls, and the relative paths of its `.result.json` and log).\n- `report.html`: one static page that fetches `index.json`, renders the sweep (cost\n  and token charts, a sortable cell table), and drills into a cell's `.result.json`\n  to show its reconciliation against the CLI's own aggregate, cost by tier, and the\n  per-call ledger with each call's tools, tool results, and text.\n\nThe page is vanilla JavaScript with one pinned CDN chart library and no build step,\nin the manner of the richdocs skill: templated HTML plus relative-path JSON is a\nmicrosite. It reads its theme from the OS, remembers a toggle in `localStorage`,\nand cache-busts every fetch. It never embeds data: the JSON files beside it are the\nsource, so re-running a cell and refreshing the page is the whole loop.\n\nThe template ships inside the package under `assets/` and is read with\n`importlib.resources`, the same way the bundled `prices.toml` is found; it is the\nsecond and last bundled resource.\n\nBecause the page fetches relative paths it is served over HTTP, never opened from\n`file://`. The terminal summary prints the page path and the one-line\n`python3 -m http.server` command that serves it.\n\n## Consequences\n\nA dry run writes nothing under `captured/`, so no report appears for it. A result\nwritten before 0019 lists in the index with its totals and no ledger; the page says\nso rather than drawing an empty chart. The plugin's runtime dependencies are still\npytest and the standard library (ADR 0003); the chart library loads in the browser.\n\n## Lens\n\nEvidence that is already JSON on disk needs a reader, not a database: a static\npage over relative paths is the cheapest reader that survives the next run.\n"}, "ADR-0021": {"file": "0021-metric-names-carry-unit-and-provenance.md", "title": "Metric names carry their unit and their source; the report has a named vocabulary and addressable ids", "status": "accepted", "status_note": "accepted, 2026-08-22. Refines [0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md)\nand [0020](0020-captured-report-is-a-static-microsite.md). The `total_tokens` row is\nsuperseded by [0029](0029-the-billed-sum-is-named-accumulative-billed-tokens.md):\nthe billed sum is `accumulative_billed_tokens`.", "markdown": "# 0021: Metric names carry their unit and their source; the report has a named vocabulary and addressable ids\n\nStatus: accepted, 2026-08-22. Refines [0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md)\nand [0020](0020-captured-report-is-a-static-microsite.md). The `total_tokens` row is\nsuperseded by [0029](0029-the-billed-sum-is-named-accumulative-billed-tokens.md):\nthe billed sum is `accumulative_billed_tokens`.\n\n## Context\n\nThe first report built on 0019 showed a `cost` and a `cli cost` column, a\n`baseline` and a `context` and a `billed` column. Read cold, `cost` did not say\nwhose cost, `billed` did not say billed what, and `context` needed a paragraph to\njustify. When the two cost columns disagreed, nothing recorded which price row had\nproduced the estimate, so a reader could not tell a stale table from a wrong\nformula without re-deriving both. Feedback on the report had no shared names for\nits parts, and no way to point at one turn of one session.\n\n## Decision\n\nMetric names state the unit and, where two sources exist, the source:\n\n| Was | Is | Meaning |\n|-----|----|---------|\n| `cost_usd` | `estimated_cost_usd` | this plugin's price-table estimate |\n| `reported_cost_usd` | `harness_reported_cost_usd` | the harness CLI's own figure |\n| `billed_tokens` / `tokens` | `total_tokens` | every billed token summed over turns |\n| `baseline` | `baseline_tokens` | the first turn's context |\n| `context_tokens` (headline) | removed | stays only per turn, inside the ledger |\n\nEvery priced result records `rates_applied`: the per-tier USD-per-token rates, the\n`prices.toml` row key, the file the row came from, and when it was applied. The\nsame block rides on the history line, so a decision made on a bad rate has a\nsource to point at.\n\nThe ledger keeps everything: tool inputs, tool results and assistant text are\nstored whole, thinking text is captured, and each turn lists the 1-based line\nnumbers of the captured session log it was built from. The report's detailed view\nrenders all of it, including the raw records.\n\nThe report's parts have CamelCase names, carried as element ids and listed in a\nglossary shipped beside the page (`XHARNESS-REPORT-GLOSSARY.md`). A session is\naddressed by its harness-minted `SessionId` (a unique prefix is accepted); a turn\nby `SessionTurnId` = `<SessionId>/t<N>`. Both are shown as click-to-copy badges and\nboth appear in the URL fragment (`#session=…&turn=…&view=…`), which the page\nkeeps current as the reader navigates.\n\n## Consequences\n\n`history.jsonl` lines written under 0019 carry the old keys; readers that merge\nhistories treat `cost_usd` as `estimated_cost_usd`, `reported_cost_usd` as\n`harness_reported_cost_usd`, and `billed_tokens` (or `tokens`) as `total_tokens`.\n`RunResult.cost_usd` is gone: graders assert `run.estimated_cost_usd`. Result\nfiles grow to roughly the size of the session log they summarise; that is the\nprice of a view that cuts nothing.\n\n## Lens\n\nA metric name is read without its definition beside it, so the name must carry\nthe unit and the source; and a number nobody can trace to its inputs is an\nopinion.\n"}, "ADR-0022": {"file": "0022-record-kind-catalogue-and-skill-coverage.md", "title": "A catalogued record kind per log line, and skill file coverage per run", "status": "accepted", "status_note": "accepted, 2026-08-22. Refines [0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md)\nand [0021](0021-metric-names-carry-unit-and-provenance.md). The detection rule\nis refined by [0027](0027-coverage-follows-the-shells-working-directory.md):\nshell commands are read at the working directory the shell actually had.", "markdown": "# 0022: A catalogued record kind per log line, and skill file coverage per run\n\nStatus: accepted, 2026-08-22. Refines [0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md)\nand [0021](0021-metric-names-carry-unit-and-provenance.md). The detection rule\nis refined by [0027](0027-coverage-follows-the-shells-working-directory.md):\nshell commands are read at the working directory the shell actually had.\n\n## Context\n\nThe detailed view from 0021 rendered every raw session-log line as pretty JSON,\nwhich proved to be the part of the report worth keeping: the summaries beside it\n(tool calls, results, text, thinking) were re-renderings of the same lines with\nless information. Raw JSON, though, gives no visual cue when the kind of\ninformation changes from one line to the next: a 23k-character tool result, a\nfive-token usage event and the user's prompt all look the same.\n\nSeparately, a skill is a tree of files an agent loads hierarchically (`SKILL.md`,\nthen the resources it points at, then the scripts it is told to run), and nothing\nmeasured which of those files a run actually touched. Whether a skill's decision\npaths fork the way its author intended was unobservable.\n\n## Decision\n\n**Record kinds.** `records.py` is the catalogue: `classify(harness, record)` maps a\nlog line to a kind (`harness/type[/subtype]`, 33 seen in the 2026-08-22 census of\n21 logs across claude 2.1.237-2.1.239 and codex 0.148-0.149) and every kind has a\ncategory (prompt, assistant text, thinking, tool call, tool result, tool execution,\nfile change, usage, harness context, harness meta, session meta, lifecycle). Each\ncategory has one pill colour, chosen so white text passes WCAG AA on it. An unseen\nshape classifies as `<harness>/unknown` rather than failing. Every result carries\n`record_kinds`, a census of its log, so a new kind appearing after a CLI upgrade is\nvisible in the next sweep. The report mirrors the catalogue in JavaScript: one\ncomponent per kind that flips between its rendered view and the raw JSON, the\npill coloured by category, and the turn detail is those components and nothing\nelse.\n\n**Skill coverage.** `skillcov.py` catalogues the skill's files at collection time\n(path, kind, size, hash; `evals/`, `node_modules/`, caches and dotfiles excluded;\nkinds `doc`, `script`, `test`, `asset`), so every cell of a sweep is measured\nagainst the same inventory. After a run it walks the per-turn ledger: a tool call\nwhose arguments contain `<skill>/<path>` loads that file, a shell call that runs a\nscript through an interpreter runs it, and a `Skill` tool invocation loads\n`SKILL.md`. The result carries `skill_coverage` with per-file `loaded` and `run`\nturns and the derived `not_loaded` and `not_run` sets; the history line and the\nstatus word carry the counts.\n\n## Consequences\n\nDetection is textual. A file read through an alias the harness resolves itself,\nor a script run by a wrapper that never names the path, is a miss; the raw records\nare beside the coverage table so such a miss can be seen and the detector\nextended. `not_run` excludes tests by construction. The census and the coverage\nare per run, so sweeps over several models can be diffed: a resource that one\nmodel loads and another never does is a decision fork worth a case of its own.\n\n## Lens\n\nColour the kind of information, not the information; and measure which paths were\ntaken before arguing about which should have been.\n"}, "ADR-0023": {"file": "0023-turn-boundaries-skill-ignore-and-replay.md", "title": "A turn owns its tools' results; skills declare what is not decision surface; captures replay without spend", "status": "accepted", "status_note": "accepted, 2026-08-22. Refines [0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md)\nand [0022](0022-record-kind-catalogue-and-skill-coverage.md). The skill-ignore\ndecision is refined by [0026](0026-skill-ignore-lives-in-the-pytest-config.md):\n`.skillignore` is no longer read. Replay re-annotates coverage under\n[0027](0027-coverage-follows-the-shells-working-directory.md), which follows\nthe shell's working directory.", "markdown": "# 0023: A turn owns its tools' results; skills declare what is not decision surface; captures replay without spend\n\nStatus: accepted, 2026-08-22. Refines [0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md)\nand [0022](0022-record-kind-catalogue-and-skill-coverage.md). The skill-ignore\ndecision is refined by [0026](0026-skill-ignore-lives-in-the-pytest-config.md):\n`.skillignore` is no longer read. Replay re-annotates coverage under\n[0027](0027-coverage-follows-the-shells-working-directory.md), which follows\nthe shell's working directory.\n\n## Context\n\nThree things surfaced from reading the first reports built on 0022.\n\nThe per-turn line ranges in a Claude session interleaved (turn 2: lines 12-18, 20,\n22; turn 3: 19, 21, 23-29). Claude Code writes each content block of a message as\nits own record and appends a tool's result record the moment that tool finishes,\nso the results of a turn's early tools land between that turn's later blocks. The\nledger attributed every non-assistant record to the *next* call, which was a rule\nabout file order, not about what happened.\n\nThe skill coverage table listed 56 files for a skill whose decision surface is a\ndozen: example galleries, lockfiles, linter configs and the skill's own unit tests\nwere all \"not loaded\". Which files matter is the skill author's call, and there was\nnowhere to say it.\n\nEvery report change so far was verified by re-running the paid matrix, although a\ncaptured cell already holds everything a result is derived from: its session log\nand the CLI's envelope.\n\n## Decision\n\n**Turn boundaries.** A record belongs to the turn that caused it. A tool result\nbelongs to the turn whose `tool_use` it answers (matched by `tool_use_id`); any\nother record belongs to the turn in progress; records before the first call belong\nto the first call. Each turn's `records` is therefore one contiguous, monotonic\nline range. `results_in` is unchanged: it still names the results that entered a\ncall's context, which are the previous turn's results. Codex rollouts already\nsatisfy the rule (a call's items, then its outputs, then its `token_count`).\n\n**Skill ignore.** A skill may carry a `.skillignore` at its root and a project may\nset `xharness_skill_ignore` in its pytest config; both are gitignore-style globs\n(`**`, `*`, `?`, `{a,b}`, trailing `/` for a directory, no-slash patterns match at\nany depth). Ignored files stay in the catalogue flagged `ignored` and are excluded\nfrom every coverage denominator and from `not_loaded` / `not_run`. The hard\nexclusions of 0022 (`evals/`, `node_modules/`, caches, dotfiles) still apply first.\n\n**Replay.** `uv run -m pytest_xharness_eval.replay <captured dir>` rebuilds every\n`.result.json` from its log and stored envelope, re-prices with the current tables,\nre-annotates coverage against the skill's current tree and ignore rules, rewrites\nthe matching `history.jsonl` lines (verdict, timestamps and wall clock kept; metrics\nrecomputed), and regenerates the report. It invokes no CLI. A result whose log is\nmissing is an error, not a skip.\n\nThe report's record cards show the kind pill, the log line number, the record's\ntimestamp and its size in every header; each renders through one component\nlibrary built bottom-up (values, blocks, tool payloads, messages, records), so a\ncommand is a highlighted shell block whether it came from Claude's `Bash` tool or\nCodex's `exec` wrapper, an edit is a diff, and a JSON payload is JSON.\n\n## Consequences\n\nOld results are not rewritten by a sweep; run the replay once after upgrading to\nbring them onto the current schema. Replay re-prices with *today's* table, so a\ndated override (an introductory price) changes historical estimates when it is\nremoved; `rates_applied` records which table each estimate used. `.skillignore`\nsemantics are a subset of gitignore: no negation, no nested braces.\n\n## Lens\n\nAttribute evidence by cause, not by position; let the owner of a surface declare\nits edges; and never pay to recompute what is already on disk.\n"}, "ADR-0024": {"file": "0024-context-window-metrics-injected-messages-and-design-tokens.md", "title": "Context window consumption and timing are first-class metrics; injected messages are not prompts; the report is themed by design tokens and can be written standalone", "status": "accepted", "status_note": "accepted, 2026-08-23. Refines [0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md),\n[0020](0020-captured-report-is-a-static-microsite.md) and [0022](0022-record-kind-catalogue-and-skill-coverage.md).", "markdown": "# 0024: Context window consumption and timing are first-class metrics; injected messages are not prompts; the report is themed by design tokens and can be written standalone\n\nStatus: accepted, 2026-08-23. Refines [0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md),\n[0020](0020-captured-report-is-a-static-microsite.md) and [0022](0022-record-kind-catalogue-and-skill-coverage.md).\n\n## Context\n\nThree gaps in the report after 0023.\n\nNothing said how close a run came to its model's context window, although both\nharnesses report the window (Claude: `modelUsage[<model>].contextWindow`; Codex:\n`model_context_window` on `task_started` and every `token_count`) and both time\ntheir runs (Claude: `ttft_ms`, `duration_api_ms`; Codex:\n`time_to_first_token_ms`, `duration_ms`). Thinking complicates the question of\n\"how full is the context\": the provider withholds thinking text server-side and\nmay drop earlier turns' thinking from later prompts, so a reader cannot add up\nwhat they see.\n\nCodex writes its environment and plugin notes as *user*-role messages\n(`<environment_context>`, `<recommended_plugins>`) and its policies as developer\nmessages (`<permissions>`, `<skills_instructions>`, ...). The catalogue of 0022\ncoloured the user-role ones as the prompt under test; they are harness context.\n\nThe page's colours lived in its CSS; there was no way to brand a report, and no\nway to hand one file to someone without a web server.\n\n## Decision\n\n**Context window.** `RunResult.context_window` is the window the harness reported\nfor the model. Per turn, `context_tokens` (`input + cache_read + cache_write`) is\nthe prompt the provider says it processed, and `context_pct` is that over the\nwindow. These are *measured*: whatever the server retained or dropped of earlier\nthinking is already inside the provider's count, so no estimate is layered on\ntop. `context_window_pct` (peak turn) and `final_context_pct` (last prompt plus\nits output) are top-level metrics, always qualified by the window size, on the\nhistory line, the status word (`ctx 7.2%`), the session table and\n`SessionMetaTable`. A line of the log is annotated with the measured figure of the\nturn it belongs to; a tool result is annotated with the next turn's figure,\nbecause that is the prompt it became part of. When the harness reports no\nwindow, percentages are `null`, never guessed.\n\n**Timing.** `ttft_ms` and `api_duration_ms` come from the harness;\n`output_tokens_per_sec` is output tokens over API time (else agent time). Per\nturn, `latency_ms` is the wall time from the previous log record to the turn's\nfirst record (request plus generation) and `output_tokens_per_sec` follows.\n\n**Injected messages.** A user-role message whose text opens with an XML-style tag\nclassifies as `.../injected` (category `harness_context`):\n`codex/response_item/message/user/injected`,\n`codex/event_msg/item_completed/UserMessage/injected`, `claude/user/injected`.\nThe report renders every tagged message, whatever its role, as titled blocks per\ntop-level element rather than as prose.\n\n**Design tokens.** The page's palette (per-theme colours, chart series, waterfall\ncolours, category pill colours, fonts, highlight style) lives in\n`report.tokens.json`, bundled with the package and copied beside every report so\nit can be edited in place and refreshed. A project points at its own file with\nthe ini key `xharness_report_design_tokens` or the flag\n`--xharness-report-design-tokens FILE` (the replay command takes\n`--design-tokens`); a missing or malformed file is an error, not a fallback. The\nCSS keeps a fallback palette only for the moment before the tokens load.\n\n**Standalone report.** `xharness_report_inline` / `--xharness-report-inline`\n(replay: `--inline`) writes `report.html` with the index, every result, every\nsession log and the tokens embedded on `window.__XH_DATA__`, so the one file opens\nover `file://` and can be attached or mailed. `<\/` inside embedded data is written\n`<\\/` so a log cannot terminate the script.\n\n## Consequences\n\nResults and history written before this decision have no window or timing\nfields; the replay command fills them from the captured logs and envelopes.\nInline reports are large (they carry every log) and go stale the moment a cell\nre-runs; the fetching form stays the default. Per-turn latency on Claude includes\nthe harness's own time between receiving a tool result and sending the next\nrequest; it is an upper bound on model time, which is why the session-level\nfigure uses the harness's `duration_api_ms` where available.\n\n## Lens\n\nReport what the provider measured, qualify every percentage by its denominator,\nand let the owner of the report own its palette.\n"}, "ADR-0025": {"file": "0025-results-name-their-case-and-charts-have-a-log-line-axis.md", "title": "A result names the case that produced it, and the per-turn charts have a session-log-line axis", "status": "accepted", "status_note": "accepted, 2026-08-23. Refines [0018](0018-fixtures-directory-and-metrics-history.md)\nand [0024](0024-context-window-metrics-injected-messages-and-design-tokens.md).", "markdown": "# 0025: A result names the case that produced it, and the per-turn charts have a session-log-line axis\n\nStatus: accepted, 2026-08-23. Refines [0018](0018-fixtures-directory-and-metrics-history.md)\nand [0024](0024-context-window-metrics-injected-messages-and-design-tokens.md).\n\n## Context\n\nA `SessionView` showed the harness, the model and the node id, but not which suite\nfile and case produced the run, which fixture it started from, or the prompt that\nwas sent; with one case per skill that was implicit, with a second suite it is not.\nThe four per-turn charts answered \"what happened on turn 3\" but not \"what was the\nstate at line 27 of the log\", which is the question a reader has while scrolling\nthe turn's records.\n\n## Decision\n\n`RunResult.case` records `suite` (the `eval_*.py` path relative to the rootdir),\n`name`, `skill`, `fixture` and `prompt`; the plugin fills it after a run and the\nreplay command carries it forward from the previous result, since the log does not\nknow it. The history line carries `suite`, `case`, `skill` and `fixture` (not the\nprompt); the index and `SessionMetaTable` carry all five, and `SessionTable` gains\na `suite` column.\n\nEvery per-turn chart can be drawn against the session-log line instead of the turn\n(`ChartAxisToggle`). A value holds from the line that measured it (the turn's first\nassistant record on Claude, its `token_count` on Codex) until the next measurement,\ndrawn as a step; turn starts are marked. The waterfall becomes a stacked step area\nof cumulative tokens by category; the output and tier bars sit at their measuring\nline. Nothing is interpolated between measurements.\n\n## Consequences\n\nResults written before this decision show \"not recorded\" for the suite until\nreplayed, and replay can only carry what an earlier result stored. The per-line\ncharts are honest about granularity: a flat segment means \"no new measurement\",\nnot \"nothing happened\".\n\n## Lens\n\nSay which question produced the evidence, and draw a measurement where it was\ntaken rather than where it would look smoother.\n"}, "ADR-0026": {"file": "0026-skill-ignore-lives-in-the-pytest-config.md", "title": "What is not decision surface is declared in the project's pytest config, not in a dotfile beside the skill", "status": "accepted", "status_note": "accepted, 2026-08-23. Refines [0023](0023-turn-boundaries-skill-ignore-and-replay.md)\n(its skill-ignore decision) and [0014](0014-register-through-the-pytest11-entry-point.md).", "markdown": "# 0026: What is not decision surface is declared in the project's pytest config, not in a dotfile beside the skill\n\nStatus: accepted, 2026-08-23. Refines [0023](0023-turn-boundaries-skill-ignore-and-replay.md)\n(its skill-ignore decision) and [0014](0014-register-through-the-pytest11-entry-point.md).\n\n## Context\n\n0023 let a skill carry a `.skillignore` at its root and, separately, let a project\nset `xharness_skill_ignore` in its pytest config; the two lists were concatenated.\nIn practice the dotfile was the one that got used, because only it could say\nsomething about *one* skill: the ini key had no way to scope a pattern.\n\nA dotfile beside the skill is a new convention with nothing to anchor it. A pytest\nuser expects a plugin's permanent, file-based configuration in the place pytest\nkeeps its own: `[tool.pytest.ini_options]` in `pyproject.toml` (or `pytest.ini`,\n`tox.ini`, `setup.cfg`). Nothing in `pytest --help` or in the project's config\nhinted that a second file, in a directory pytest never looks in, was also being\nread; and the skill directory is shipped to agents as-is, so the dotfile rode along\ninto every `--add-dir` and `$CODEX_HOME/skills` copy as a file the agent could see\nbut that described a tool it had never heard of. 0014 already settled that every\nlocation the plugin reads is an ini key resolved against the rootdir; the dotfile\nwas the one exception.\n\n## Decision\n\n`xharness_skill_ignore` is the only source of ignore patterns. The `.skillignore`\nfile is not read; a leftover one is just another dotfile, which 0022 never\ncatalogues.\n\nEach line of the key is either a bare gitignore-style pattern, which applies to\nevery skill, or `<selector>: <pattern>`, which applies to the skills whose\ndirectory name matches the `fnmatch` selector (`mermaidjs-diagrams: README.md`\nnames one skill, `*-diagrams: README.md` a family). This is the form pytest's own\n`markers` lines use (`name: description`), so it reads as pytest config rather than\nas a new grammar. A selector with nothing after the colon is a usage error that\nstops the session at configure time, before any cell is collected, since it would\nignore nothing and is almost certainly a typo. The pattern grammar is unchanged\nfrom 0023.\n\n```toml\n[tool.pytest.ini_options]\nxharness_skill_ignore = [\n    \"README.md\",                                # every skill\n    \"mermaidjs-diagrams: resources/examples/**\",\n    \"mermaidjs-diagrams: scripts/{Makefile,CLAUDE.md}\",\n    \"mermaidjs-diagrams: scripts/*.json\",\n]\n```\n\nThe replay command runs outside a pytest session, so it resolves the key the way\npytest would: the first ancestor of the captured directory holding a `pytest.ini`,\na `pyproject.toml` with `[tool.pytest.ini_options]`, a `tox.ini` or a `setup.cfg`\nwith a pytest section. Its `--ignore` flag takes extra lines in the same form. A\nreplay and a live sweep therefore always agree on what is decision surface.\n\n## Consequences\n\nA project that had a `.skillignore` moves its lines into the ini key, prefixed with\nthe skill's name, and deletes the file; until it does, every file of that skill is\ndecision surface again and `not_loaded` grows. Patterns whose path contains `:`\ncannot be written as bare lines (the first colon is the selector boundary); such\nfiles are not portable anyway. Skill authors who do not own the project's\n`pyproject.toml` no longer have a place to declare their skill's edges; that is\ndeliberate: which files count is a decision of whoever pays for the sweep.\n\n## Lens\n\nA plugin's configuration lives where its host keeps configuration; a convention\nthe host's users have never seen needs a stronger reason than convenience.\n"}, "ADR-0027": {"file": "0027-coverage-follows-the-shells-working-directory.md", "title": "Skill coverage follows the shell's working directory", "status": "accepted", "status_note": "accepted, 2026-08-23. Refines [0022](0022-record-kind-catalogue-and-skill-coverage.md)\n(its detection rule) and [0023](0023-turn-boundaries-skill-ignore-and-replay.md)\n(replay re-annotates under the new rule).", "markdown": "# 0027: Skill coverage follows the shell's working directory\n\nStatus: accepted, 2026-08-23. Refines [0022](0022-record-kind-catalogue-and-skill-coverage.md)\n(its detection rule) and [0023](0023-turn-boundaries-skill-ignore-and-replay.md)\n(replay re-annotates under the new rule).\n\n## Context\n\n0022 detects that a tool call touched a skill file when the call's arguments\ncontain `<skill>/<path>`, and 0022's consequences already named the blind spot:\na file reached through something the harness resolves itself is a miss. The\nfirst paid run of the second suite (`eval_dual_density`, Claude Opus 5,\n2026-08-23) hit that blind spot squarely. The agent did\n`cd …/skills/mermaidjs-diagrams && cat SKILL.md`, then `cat\nresources/diagram_organization.md`, then `bun run scripts/mermaid_complexity.ts\n…`, relying on the one thing Claude Code's `Bash` tool promises and Codex's\n`exec` does not: the shell is persistent, so a `cd` in one call is the working\ndirectory of the next. None of those commands contains the literal\n`mermaidjs-diagrams/SKILL.md`. The run was scored `skill 0/18 loaded 0/4 run`,\nthe grader's \"did the agent run the gates it was told are mandatory\" check\nfailed, and $1.95 bought a wrong verdict. Replaying the same log under a detector\nthat follows the shell gives `7/18 loaded 3/4 run`, and re-grading the unchanged\nworkspace passes every check.\n\nThe session log holds everything needed to do better. The harness announces\nwhen it moves the shell back (`Shell cwd was reset to <dir>` inside the tool\nresult), Codex carries an explicit `workdir` on every exec, and the result\nrecords the workspace the run started in.\n\n## Decision\n\n`annotate` models the shell per result. The working directory starts at the\nrun's workspace; a `cd` segment in a persistent-shell tool call (`Bash`) moves it\nfor the rest of that command and for the calls after it; a `Shell cwd was reset\nto <dir>` in a tool result moves it back; a `cd` whose target cannot be known\n(`~`, `$VAR`, a bare `cd`) makes it unknown until the next absolute `cd` or\nreset. Codex's exec tools run each call at their own `workdir` and a `cd` there\ndoes not persist.\n\nDetection itself is unchanged. A shell command is split at `&&`, `||`, `;`, `|`\nand newlines; in every segment whose working directory is the skill's root or a\ndirectory under it, each relative token that looks like a file (it contains a\n`.` or a `/`, does not start with `/`, `-`, `$` or a redirection, and is not\nalready qualified) is rewritten to `<skill>/<sub>/<token>`, and the rewritten\ncommand is matched by 0022's rule. `bun run scripts/gate.ts` after `cd <skill>`\nbecomes `bun run <skill>/scripts/gate.ts` and is a run; `cat SKILL.md` becomes\n`cat <skill>/SKILL.md` and is a load; `echo done` stays a word.\n\nThe shell state lives inside `annotate`, derived from `result.calls` in order,\nso the plugin's live path and replay produce the same coverage from the same\nlog, and nothing is shared between results.\n\n## Consequences\n\nCoverage from a captured log can change when the detector improves; that is\nwhat replay is for, and it is why a verdict that depends on coverage should be\nre-graded rather than re-bought. Replay keeps the verdict a cell was given at\nthe time, so a run scored under the old rule still reads `fail` in the history\nuntil it is re-run or a regrade step exists; the report's raw records beside\nthe coverage table show the difference.\n\nThe model is a heuristic over text: a `cd` inside a subshell or a function is\ntaken as persisting, a heredoc's body is split like a command (its tokens are\nrewritten but match no file), and a token with a `.` in a segment under the\nskill that happens to name a real skill file is counted. Each of those errs\ntoward counting a file, which is the cheaper error for a tool whose purpose is\nto show the decision paths an agent never took.\n\n## Lens\n\nRead the log the way the harness executed it, not the way it was typed: state\nthat the tool keeps between calls is part of every call's meaning.\n"}, "ADR-0028": {"file": "0028-report-is-built-from-a-component-workspace.md", "title": "The report page is built from a component workspace and shipped as one file", "status": "accepted", "status_note": "accepted, 2026-08-23. Refines [0020](0020-captured-report-is-a-static-microsite.md),\n[0021](0021-metric-names-carry-unit-and-provenance.md) and\n[0024](0024-context-window-metrics-injected-messages-and-design-tokens.md); keeps\n[0003](0003-runresult-is-a-stdlib-dataclass.md).", "markdown": "# 0028: The report page is built from a component workspace and shipped as one file\n\nStatus: accepted, 2026-08-23. Refines [0020](0020-captured-report-is-a-static-microsite.md),\n[0021](0021-metric-names-carry-unit-and-provenance.md) and\n[0024](0024-context-window-metrics-injected-messages-and-design-tokens.md); keeps\n[0003](0003-runresult-is-a-stdlib-dataclass.md).\n\n## Context\n\n`assets/report.html` grew to 870 lines of hand-written HTML, CSS and vanilla\nJavaScript in one file: a component library built from template strings, a hash\nrouter, two chart axes, a record-card renderer and the theme plumbing, with Plotly\nand highlight.js pulled from a CDN at view time. It works, and 0021's named ids and\nglossary keep it legible, but every change is made without types, without a test\nrunner that can mount a component, without a formatter, and without any way to see\nthe page against real data short of re-running a sweep or a replay. Composing a\ntable by concatenating strings is how the `total_tokens` / `context %` columns came\nto sit beside each other and read as one quantity.\n\nThe bar the report is held to is a polished single-page application, and the tools\nthat produce those are well known: a typed component model, a design-system\ncomponent library, a bundler, a unit-test runner that renders components, a linter\nand a formatter. None of them may become a runtime dependency of the Python package\n(0003), and the page must still be one static file that `report.py` copies beside\nthe captured JSON, fetches from there or is populated inline, and is themed by\n`report.tokens.json` (0020, 0024).\n\n## Decision\n\nThe page is authored in `report-ui/`, a bun workspace: Vite, React, TypeScript in\nstrict mode, Tailwind and shadcn/ui components, Vitest with Testing Library, ESLint\nand Prettier. `bun run build` emits **one** self-contained `dist/index.html` with\nevery script, style and font inlined (`vite-plugin-singlefile`); nothing is fetched\nfrom a CDN at view time any more. The built file is promoted into\n`src/pytest_xharness_eval/assets/report.html` with `make ui-promote` and committed,\nso the Python package ships a plain asset and keeps zero runtime dependencies;\nbun is needed to change the page, never to use the plugin.\n\nThree contracts from the first microsite are kept, so `report.py` does not change:\nthe `<!--XHARNESS_INLINE_DATA-->` marker at the top of `<head>`, the\n`window.__XH_DATA__` inline payload as the alternative to fetching `index.json`,\n`*.result.json`, `*.jsonl` and `report.tokens.json` from beside the page, and the\n`#session/<id>[/turn/<n>]` hash routes. The element ids and names of 0021's glossary\nare the component names: `SessionTable` is `<SessionTable>`, and a new panel gets\nits id, its glossary row and its component in the same change.\n\nDesign tokens theme shadcn: `applyTokens` writes every token as an `--xh-*` custom\nproperty at runtime, and `index.css` aliases shadcn's semantic variables\n(`--background`, `--primary`, `--chart-1`, …) to them, so a project's\n`xharness_report_design_tokens` file restyles every compo
