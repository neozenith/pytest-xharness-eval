lens: |-
  A metric name is read without its definition beside it, so the name must carry the unit and the source.
  A number nobody can trace to its inputs is an opinion.
provenance: |-
  Read cold, the first report built on 0019 showed a `cost` that did not say whose.
  It showed a `billed` that did not say billed what, and a `context` that needed a paragraph to justify.
