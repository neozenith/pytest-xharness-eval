id: ADR-0021
slug: metric-names-carry-unit-and-provenance
plan_id: null
title: Metric names carry their unit and their source; the report has a named vocabulary and addressable
  ids
description: a metric name is read without its definition beside it, so it must carry unit and source
status: accepted
accepted_on: '2026-08-22'
last_changed_on: '2026-08-22'
group: accounting
tags:
