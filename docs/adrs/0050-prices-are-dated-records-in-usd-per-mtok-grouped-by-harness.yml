id: ADR-0050
slug: prices-are-dated-records-in-usd-per-mtok-grouped-by-harness
title: Prices are dated records in USD per MTok, grouped by harness, and a run is priced on the day it ran
status: accepted
status_note: |-
  accepted, 2026-09-28.
  Refines [0006](0006-local-price-table-is-authoritative.md) (a local price table is authoritative) from one table into a series of dated records.
  Refines [0030](0030-price-rows-live-in-the-pytest-config.md) (project price rows live in the pytest config) with a `harness/model` selector and optional `from=`/`to=` bounds.
  Refines [0021](0021-metric-names-carry-unit-and-provenance.md) (rates travel with the estimate) with the unit and the interval.
  Extends [0007](0007-unpriced-model-aborts-before-spend.md)'s stop-before-spend rule to a date no record covers.
  Breaking: an `xharness_prices` line must name its harness.
  Breaking: `result.json`'s `rates_applied` is stated in USD per MTok and gains `unit`, `harness`, `effective_from` and `effective_to`.
  Refined by [0051](0051-long-context-is-a-tier-priced-per-call-and-records-are-curated.md): a row may carry a long-context tier, and pricing is per call.
  Under it, the backfilled records were replaced by a curated record effective 2026-09-29.
accepted_on: '2026-09-28'
last_changed_on: '2026-09-28'
group: pricing
