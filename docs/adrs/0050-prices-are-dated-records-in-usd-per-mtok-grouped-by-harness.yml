body:
  context: |-
    The bundled `derive/prices.toml` was one flat table: one row per model, keyed by the model id alone, stated in USD **per token** (`4.0e-6`).
    Three things about that shape started to cost more than it saved.

    *It has no memory.* A price change was an edit of the row in place.
    So the moment a provider changed a rate every replay of an older capture silently re-priced that run at today's rate.
    Replay exists to re-derive a result after the plugin changes (ADR 0023).
    It was also re-deriving it after the *market* changed, which is not a plugin change and should not move a historic bill.

    *Its unit is not the published one.* Every provider publishes USD per million tokens.
    Dividing each published figure by 1e6 before storing it put a representation error into every rate.
    `2.0e-6` is stored as `2.0000000000000003e-06` once it has passed through `1.25 * 1.6`.
    It also made the table the one place in the project's configuration whose unit differed from the price tag.
    ADR 0030 already had to guard its ini lines against a row pasted from it.

    *Its key is ambiguous.* A row was found by model id and prefix, with no notion of which harness ran the model.
    The matrix axis is `harness/model` (ADR 0015); the table was the one place the first half of that pair was dropped.
  decision: |-
    **Records, not a table.** The bundled prices live in `derive/prices/prices-YYYYMMDD.toml`, one file per interval.
    Each file declares `effective_from` (a TOML date, required) and `effective_to` (optional; absent on the one record still in effect).
    The interval is half-open, `[from, to)`, so a record's `effective_to` is the next record's `effective_from` and a boundary day belongs to exactly one of them.
    The file's name must carry its own `effective_from`.
    Any of these stops the session:
    - a record whose name and body disagree
    - two records whose intervals overlap
    - a record naming an unregistered harness

    Gaps between records are allowed, and a run dated inside one is unpriced -- never priced from a neighbour.

    Curating a price change is: set `effective_to` on the open record to the change date, and add `prices-<that date>.toml` with the new rows.
    The old record is never edited again, so the directory is the price history.

    **Grouped by harness.** Each top-level table in a record is a registered harness name, and a row is keyed by the pair: `[claude."claude-opus-5-5"]`, `[codex."gpt-6-sol"]`.
    Lookup is `(harness, model, day)`; prefix tolerance (`claude-opus-5[1m]`) applies within the harness only.
    Keying rows by the harness's registered name is data, not dispatch: nothing branches on it.
    It is validated against `model.registry.names()` rather than against a second list (ADR 0034).

    **USD per MTok everywhere.** Records, `xharness_prices` lines and the wire record all state rates per million tokens.
    `Rates.breakdown` multiplies tokens by the rate and divides by 1e6 once, per tier.
    This removes most representation error rather than all of it.
    `3_000_000 * 0.10 / 1e6` is `0.3` where `3_000_000 * 1e-7` was `0.30000000000000004`.
    The six-decimal rounding of the estimate is unchanged.
    A rate below $0.001/MTok is still refused as "looks per-token", now in records as well as in lines.

    **Priced on the day it ran.** The day comes from the session's `{run}` stamp (`20260928T101500Z`), which both a live cell and a replay already hold.
    So the two paths still choose the same row (ADR 0034).
    Collection validates the matrix against the rows in effect on today's stamp.
    A capture whose stamp names no day (the all-zero stamp a legacy migration writes) is priced from the record still open.
    Its `rates_applied` says which interval that was.

    **Project lines follow the same shape.** An `xharness_prices` line is `<harness>/<model>: input=<n> output=<n> [cache_read=..] [cache_write=..] [cache_write_1h=..] [from=YYYY-MM-DD] [to=YYYY-MM-DD]`.
    A line with neither bound applies on every date; a bounded one only inside `[from, to)`.
    Project lines are consulted before the bundled records wherever they cover the day.
    Two lines for one pair whose intervals overlap is an error.
    A bare `<model>:` selector is an error whose message shows the new form.

    **The wire record says what it is.** `rates_applied` is `AppliedRates`:
    - the five tiers in USD per MTok
    - `unit: "usd_per_mtok"`
    - `harness`
    - `model`
    - `source`
    - `effective_from`, `effective_to` (ISO dates, `null` when open)
    - `applied_at`

    `unit` is what lets the report page read a result written before this record without guessing from magnitudes.
    Such a result's rates are per token, and it carries no `unit`.
  consequences: |-
    Every replay now reproduces the bill a run had when it ran.
    A price change is an additive file rather than an edit that rewrites history.
    The first record, `prices-20260820.toml`, is backfilled to the plugin's first run (ADR 0001) because no earlier rate was curated.
    Its rows are the 2026-09-24 verification.

    A consuming project must prefix each `xharness_prices` line with its harness (`gpt-house: ...` becomes `codex/gpt-house: ...`).
    Until it does, the session stops at configure time with the new grammar in the message -- loud, per 0007.
    Code that read `rates_applied` as per-token rates must read `unit` first; the bundled report page does.
    A replay rewrites old results into the new shape.

    One golden estimate moved by one micro-dollar: its exact cost was `$0.0023325`, a rounding tie.
    The per-token floats landed just above it, and the per-MTok sum lands on it.
    Neither is wrong; the characterization golden pins the new figure.

    Keeping the module-relative path exception of ADR 0014, it now names the bundled `derive/prices/` directory rather than one file inside `derive/`.
