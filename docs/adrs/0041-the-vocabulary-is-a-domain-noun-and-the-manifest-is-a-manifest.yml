id: ADR-0041
slug: the-vocabulary-is-a-domain-noun-and-the-manifest-is-a-manifest
plan_id: null
title: A shared vocabulary is a domain noun, and a manifest exports nothing of its own
description: a vocabulary belongs in the layer everyone may import, and it must type a field
status: accepted
accepted_on: '2026-08-28'
last_changed_on: '2026-08-28'
group: architecture
tags:
- architecture
lens: |-
  Two questions decide where a shared name lives, and neither is "who uses it most".
  *Which layer may everyone that needs it import?* That is the only placement that can be enforced rather than agreed.
  *Which field is declared as it*?
  A vocabulary that types nothing is decoration, and its duplicate literals survive the refactor that was supposed to remove them.
  And a module that advertises itself as a manifest must be audited as one: every convenience export is a public API nobody decided to publish.
provenance: |-
  The repository already had the right answer in it.
  `CostStatus`, which is `priced` or `unpriced` with no third state, lives in `model/runresult.py`, beside `cost_status: CostStatus`, the field it types.
enforced_in:
- src/pytest_xharness_eval/model/verdict.py
- src/pytest_xharness_eval/plugin/__init__.py (the manifest)
- tests/test_units.py (the manifest fitness function)
