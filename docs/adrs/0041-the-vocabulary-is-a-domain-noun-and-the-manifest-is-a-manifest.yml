problem:
  symptom: |-
    0040 introduced `Verdict`, which is `pass`, `fail`, `error` or `dry-run`.
    It put the enum in `plugin/verdict.py`, claiming a vocabulary the whole package shares.
    It was neither, for three reasons that only show up when the layer rule of 0039 is taken seriously:

    | Symptom | What it cost |
    | --- | --- |
    | `plugin/` is the entry-point layer, above every other | `emit/` structurally *cannot* import from it, because the ruff `TID251` rule fails the build. So `CellMetrics.dry_run`, the only producer of the fourth word, still wrote the bare literal `verdict="dry-run"`. The vocabulary was duplicated, not centralised. |
    | The enum typed no field | `Outcome.verdict`, `CellMetrics.verdict` and `IndexRow.verdict` were all `str`. An enum that nothing is declared as is a naming convention with a class statement around it. |
    | The module's own docstring was untrue | It said the two ends of a cell's life "neither may import the other", but `plugin/cell.py` imports `plugin/results.py` directly. A docstring that states a false constraint is worse than no docstring: the next reader preserves a shape for a reason that does not exist. |
  pain_point: |-
    0040 also widened the manifest it had just declared to be "a manifest and nothing else".
    `__init__` re-exported `CellRun`, `Attempt`, `run_stamp`, `Verdict` and a `_ResultCollector` renamed public on the way out.
    None of those is named by 0040's own compatibility list, and every one of them is API the moment it is exported.
decision:
  given: |-
    `plugin/` is the entry-point layer, above every other, so `emit/` structurally cannot import from it.
    The ruff `TID251` rule fails the build.
  we_prefer: |-
    `Verdict` in `model/verdict.py`, the bottom layer every layer above may name, over `plugin/verdict.py`.
  because: |-
    The move is what removes the duplicate literal, rather than a lint that forbids it.
    A vocabulary that types no field is a naming convention with a class statement around it.
  unless: |-
    the word is crossing execnet: `CellMetrics.verdict` stays `str`, because execnet serialises builtins only (0016) and a `StrEnum` member is not one.
  in_practice:
  - |-
    **A word two layers share is a domain noun.** `Verdict` moves to `model/verdict.py`, the bottom layer, which every layer above may name.
    Its producers then all use it: `plugin/cell.py` decides one, and `emit/metrics.py` records it.
    `CellMetrics.dry_run` is included, which is why the move is what removes the literal rather than a lint that forbids it.
  - |-
    **The vocabulary types the observation, and the wire keeps the word.** `Outcome.verdict` is declared `Verdict | None`.
    The `.value`, never the member, is what reaches `CellMetrics.verdict`, which stays `str`.
    That record crosses to the xdist controller through execnet, which serialises builtins only (0016).
    A `StrEnum` member is not a builtin.
    Typing the *record* field would have shipped a member over that wire.
  - |-
    **A stored word that names no member is no verdict, not a fabricated one**.
    `Verdict.stored(word)` returns `None` for anything outside the four, which is what `CellMetrics.outcome` reads a replayed record back through.
    A capture written before the field existed, or truncated by hand, carries its empty verdict forward exactly as it did before.
    The alternative, mapping the unknown onto `error`, would have a rebuild assert a grade the run was never given.
    0038's tolerance is about degrading to the default, never about inventing a value.
  - |-
    **A manifest exports the hooks and the compatibility surface, and nothing else**.
    `plugin/__init__` binds the seven `pytest_*` hooks pluggy discovers as attributes of the imported module.
    It also binds the four names a consuming repository's `conftest.py` already reaches for: `EvalFile`, `EvalItem`, `PROPERTY`, `RESULTS_KEY`, `RECORD_KEY`.
    Internals stay addressable where they are implemented, as `plugin.cell.CellRun` and `plugin.results.ResultCollector`, which is where the tests already reach them.
consequences:
  pros:
  - |-
    `tests/test_units.py` gains a fitness function over the manifest.
    The bound hooks are exactly the hooks the package implements, and a hook not bound here silently stops firing.
    The rest of `__all__` is exactly the compatibility surface, and the `pytest11` entry point still names `pytest_xharness_eval.plugin`.
    A new hook that is implemented and not bound now fails the suite instead of the next sweep.
  cons:
  - |-
    `from pytest_xharness_eval.plugin import Verdict` no longer resolves; the import is `from pytest_xharness_eval.model.verdict import Verdict`, or `pytest_xharness_eval.model`.
    The name was one commit old and unreleased.
