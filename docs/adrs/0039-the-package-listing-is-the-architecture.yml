id: ADR-0039
slug: the-package-listing-is-the-architecture
plan_id: null
title: The package listing is the architecture
description: when the folders are the layers, "may this import that" has an answer a linter can check
status: accepted
accepted_on: '2026-08-28'
last_changed_on: '2026-08-28'
group: architecture
tags:
- architecture
lens: |-
  A package listing is the first documentation anyone reads and the only one that cannot go stale.
  When it is a flat alphabetical column, every module claims equal standing and the reader learns nothing.
  When the folders are the layers, the question "may this import that?" has an answer before the import is written.
  The answer can be checked by a linter rather than by whoever reviews the diff.
  The names that resolve outside the language, though, are load-bearing in a way no layering may break.
  An entry point is a contract with a tool that does not read your architecture.
  It stays a real module at the root, no matter how the rest is arranged.
provenance: |-
  Verified during the change: a package with no `__main__.py` fails `-m` outright.
  An attribute re-exported from a parent `__init__` does not satisfy importlib for either entry point, and only a real module does.
enforced_in:
- src/pytest_xharness_eval/ (the layer folders)
- pyproject.toml (the ruff `TID251` rules and their per-file-ignore list)
- CLAUDE.md ("Layout by purpose")
