problem:
  symptom: |-
    Twenty modules sat flat in `src/pytest_xharness_eval/`, in one alphabetical list, after 0034 pulled `harness/` out of it.
    A reader opening the package could not tell the modules apart from the listing.
    Five of them do quite different jobs:

    - `case.py` is a declaration a user writes.
    - `codex.py` folds a foreign log.
    - `pricing.py` is arithmetic over a folded one.
    - `report.py` publishes.
    - `plugin.py` drives all four.

    They are the same size, at the same level, in the same column.
    The listing named the parts and said nothing about the shape, which is the complaint this refactoring campaign opened with.
  pain_point: |-
    Flatness is not only a reading problem: with no declared direction, three imports had quietly turned upside down, and nothing failed when they did.

    | Inversion | What it meant |
    | --- | --- |
    | `pricing` → `normalise.now_iso`, `report` → `normalise.now_iso` | Pricing an estimate and stamping an index both depended on the *harness dialect toolkit* for a wall clock. |
    | `skillcov.annotate` → `harness.get(result.harness)` | A derivation reached into the adapter registry mid-walk, so annotating a ledger (pure arithmetic) could not be done for a result whose harness nobody had registered. |
    | `matrix` → `harness` | Deliberate and correct (the `--harness` choices must be whatever is registered, 0034), but indistinguishable from the other two. |
decision:
  given: |-
    Two names in the package are resolved by *importlib*, not by Python code, and they bound any re-layering.
    `pytest_xharness_eval.plugin` is the `pytest11` entry point (0014).
    `pytest_xharness_eval.replay` is what `uv run -m pytest_xharness_eval.replay` executes.
    Verified: a package with no `__main__.py` fails `-m` outright.
    An attribute re-exported from a parent `__init__` does not satisfy importlib for either, and only a real module does.
  we_prefer: |-
    Layer folders whose listing order is the dependency order, over twenty modules flat in one alphabetical column.
  because: |-
    The question "may this import that?" then has an answer before the import is written.
    A linter can check it, rather than whoever reviews the diff.
  unless: |-
    importlib resolves the name: the two entry-point modules stay real modules at the root no matter how the rest is arranged.
  in_practice:
  - |-
    **The layers are folders, and the folder listing is the dependency order.**

    ```text
    pytest_xharness_eval/
        plugin.py     the pytest11 entry point (0014)
        replay.py     the `python -m` entry point (0023, 0032)
        model/        the nouns: run, case, cell, workspace, cache tree, clock
        harness/      one adapter class per agent CLI, and the toolkit they fold with
        derive/       what a folded run cost, and which of the skill it reached
        emit/         the documents that leave: the metrics record and the microsite
        runtime/      how a sweep is wired: settings, and the steps after the CLI returns
    ```

    Each layer depends only on the ones above it in that list, entry points last.
    The two entry-point modules stay real modules at the root, because importlib resolves them.
    That placement narrates too: what the outside world calls sits at the top, and the layers it calls through underneath.
  - |-
    **Each `__init__` declares its layer's surface**.
    A layer's `__init__` is the one place its public names are listed, and reading five of them is reading the architecture.
    Submodules still import each other by full dotted path (`from pytest_xharness_eval.derive import pricing`), never through a layer's `__init__`.
    Importing the matrix reaches the harness registry.
    A name bound in an `__init__` is therefore not yet available to everything that loads during it.
  - |-
    **The three inversions are resolved, not merely noted**.
    `now_iso` and `ms_between` are `model/clock.py`, a leaf that depends on nothing.
    Pricing and the report therefore stop naming the adapter toolkit for a timestamp.
    The tolerant reader for this package's own stored documents is `model/documents.py`, for the same reason.
    `skillcov.annotate` takes the harness's shell vocabulary as an optional fourth argument.
    That is a `model.registry.Shells` value of the tool names that run a shell, and the ones that keep their cwd (0027).
    Annotating a ledger is therefore arithmetic over a value it was handed.
    And the one edge that must point up, because the registry is the only dispatch (0034), is now a single module that says so.
    `model/registry.py` answers "which harnesses exist" and "what is this one's shell vocabulary".
    It is the only module below `harness/` that names `harness`.
    `annotate` still resolves through it when the argument is omitted, which is what the pipeline and the pinned characterization call.
  - |-
    **A fourth inversion fails the build.** The ruff `TID251` rule that has kept provider modules unreachable since 0034 is joined by three more.
    Nothing may name `pytest_xharness_eval.harness`, `.emit` or `.runtime` except the layers above it.
    The exceptions are the per-file-ignore list in `pyproject.toml`: the two entry points, each layer itself, `model/registry.py`, and the tests.
  - |-
    **`report.py` becomes the layer it always was**.
    It held four jobs at once: the `index.json` row type, the design-tokens reader, the page assembly, and the combine step.
    They are `emit/index.py`, `emit/tokens.py` and `emit/page.py` beside `emit/metrics.py`, which is the same split the microsite already has on disk.
    `pytest_xharness_eval.emit` is re-exported from the root package as `report`, which is the name `report-ui/scripts/inline.py` builds a page through.
consequences:
  pros:
  - |-
    The from-import form `from pytest_xharness_eval import pricing` still resolves, and so do `normalise`, `records`, `skillcov` and `report`.
    They are re-exported from the root `__init__` in `as` form, which mypy's `no_implicit_reexport` requires.
    They are listed in `__all__` as the declared public API.
    Every internal caller and both test modules use the from-import form, and the pinned characterization test imports exactly that way, unchanged.
  - |-
    The bundled `prices.toml` moves to `derive/prices.toml`, beside the only module that reads it.
    0014's rule is unchanged: it is still the one path derived from `__file__`, and `pricing.py` still spells it `Path(__file__).parent`.
  cons:
  - |-
    `import pytest_xharness_eval.pricing`, the dotted form, stops resolving for an outside caller.
  - |-
    `model/` is where `layout.py` and `workspace.py` live, not `runtime/`.
    Both are value-level: one names paths under a cache, the other copies a fixture tree and hashes it.
    Both are used *by* the harness adapters.
    Putting them in the top layer would have made the adapter layer import the top layer.
    That would leave the `runtime` ban with a hole big enough to walk through.
  - |-
    One edge points up that the rules cannot express.
    `model/runresult.py` names `derive.pricing` and `derive.skillcov` under `TYPE_CHECKING`, to declare the two derived documents a result carries.
    It is annotations only, so there is no runtime dependency and no cycle.
    It is also the reason `derive` is not in the ban list.
    A rule with a documented exception in the file it exists to constrain is worse than no rule.
