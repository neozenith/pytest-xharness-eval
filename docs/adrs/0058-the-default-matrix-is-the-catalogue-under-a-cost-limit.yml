id: ADR-0058
slug: the-default-matrix-is-the-catalogue-under-a-cost-limit
title: The default matrix is the catalogue under an output-rate limit that a project raises to opt in
status: accepted
status_note: |-
  accepted, 2026-10-06.
  Refines [0015](0015-harness-is-the-axis-and-the-project-owns-the-matrix.md) (the project owns the matrix) and [0010](0010-matrix-options-and-dry-run.md) (the matrix is the spend dial) with how the plugin default is chosen.
accepted_on: '2026-10-06'
last_changed_on: '2026-10-06'
group: collection
tags:
- collection
- pricing
lens: |-
  A default that names models will go stale, and a default that names every model will one day cost too much.
  Name a rule instead, and make the costly side of the rule something a reader opts in to.
relates_to:
- relation: extends
  target: ADR-0015
  note: the record's status line says "refines"
- relation: extends
  target: ADR-0010
  note: the record's status line says "refines"
body:
  context: |-
    The plugin default matrix was a hand-kept list of six models that had to move with the price records.
    With a model catalogue (ADR 0057) it can be derived instead.
    But every catalogued model is the expensive reading of "the whole axis", and the apex models bill ten times a small one.
    The person who owns the first consuming project had been leaving the newest frontier models out of every sweep by hand, for cost.
  decision: |-
    **The plugin default is every catalogued model whose output rate is below a limit.** The rate is read from the price record in effect on the run's day, in USD per million output tokens.

    **The limit is the `xharness_output_rate_limit` ini key, and it defaults to 50.** Today that leaves out Fable and Astra, which bill $50, and keeps every other catalogued model.
    A project raises the limit to opt in to the cost, and the report header names how many catalogued models it kept.

    **The limit shapes only the plugin default.** A case's `models=` or a project's `xharness_matrix` that names an apex model has already opted in, so it is never filtered.

    **A catalogued model with no price row is kept, not dropped.** The price check that follows then refuses it by name (ADR 0007), rather than the sweep quietly shrinking.
  consequences: |-
    A new catalogued model joins every default sweep below the limit with no other edit.
    A new apex model stays out until a project raises the limit, so a release does not silently raise everyone's bill.

    The default grows from six cells per case to eleven.
    `DEFAULT_MATRIX` is removed from the public names, because no list exists to export.
