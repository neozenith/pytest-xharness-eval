id: ADR-0009
slug: register-via-rootdir-conftest
plan_id: null
title: Register the plugin from the rootdir conftest.py
description: the rootdir conftest is the one place pytest honours `pytest_plugins` for an uninstalled package
status: superseded
accepted_on: '2026-08-21'
last_changed_on: '2026-08-21'
group: packaging
tags:
- packaging
lens: |-
  Test a registration mechanism under both `python -m pytest` and the console script before adopting it; the two differ in what is importable.
provenance: |-
  Verified on 2026-08-21: `addopts = -p <package>.plugin` works under `python -m pytest`, which puts the cwd on `sys.path`.
  It fails under the bare `pytest` console script with `ImportError: No module named '<package>'`.
enforced_in:
- nothing while superseded; the concern now lives in pyproject.toml's `pytest11` entry point (ADR 0014)
relates_to:
- relation: superseded_by
  target: ADR-0014
  note: >-
    superseded on 2026-08-21, the day it was accepted; kept because its Lens still
    applies to any uninstalled plugin
problem:
  symptom: |-
    A `conftest.py` inside the plugin's own package directory cannot hook collection under `skills/*/evals/`: conftest hooks apply only to their own subtree.
  pain_point: |-
    `addopts = -p <package>.plugin` was tried next.
    Verified 2026-08-21, it is invocation-dependent for an uninstalled package.
    `python -m pytest` puts the cwd on `sys.path`, so it works.
    The bare `pytest` console script does not, and it fails with `ImportError: No module named '<package>'`.
decision:
  given: |-
    Since pytest 7 the rootdir conftest is the one place `pytest_plugins` is honoured.
  we_prefer: |-
    A one-line repository-root `conftest.py` declaring `pytest_plugins = ["<package>.plugin"]`, over `addopts = -p <package>.plugin` or a conftest inside the package directory.
  because: |-
    Importing that file is what puts the root on `sys.path`, so it works under every invocation.
  unless: |-
    the plugin ships as an installed distribution, in which case a `pytest11` entry point registers the same module.
  in_practice:
  - |-
    The eventual target is a PyPI package registering the same module through a `pytest11` entry point.
consequences:
  pros:
  - |-
    The package keeps an importable, package-shaped layout so extraction later is a packaging change.
  cons:
  - One file lives outside the plugin package.
  - '`pytest.ini` carries only a comment explaining why it does not register the plugin.'
