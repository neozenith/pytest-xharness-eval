body:
  context: |-
    A verifier answers one question about one rollout: did this run do the task?
    The questions that steer a subject's next edit are asked across runs.
    Which harness, model, effort or treatment does this skill do best under, and at what cost?
    Did the tool's new version beat the old one, cell by matched cell?
    Which generated scenarios keep breaking it?
    No hook asked them, so each was a one-off script over `history.jsonl` that nobody reran.

    The first real hill-climb showed the problem with one sample per question.
    A wrapper tool for a prose linter was edited from v1 to v2 and swept three times per cell on each version.
    The analyzer compared ten matched cells per metric, and every comparison was inconclusive.
    Some effects were large: a cost difference whose bootstrap interval excluded zero, with P(better) at 1.0.
    Its q-value was still 0.667.
    With three samples per arm, the smallest two-sided p-value Fisher's exact test or a permutation test can reach is 0.1.
    No change at n = 3 can clear a 0.05 bar, however large it is.

    Prior art shaped each part.
    DSPy optimises a program against a metric function, so the metric is code the author writes.
    GEPA keeps a Pareto front per instance rather than one best score, so a candidate that wins on a few inputs survives.
    inspect_ai separates a scorer, which grades one sample, from a reducer over epochs and a metric over the run.
    Anthropic's "Adding error bars to evals" asks for a standard error on every score, clustered where questions are related.
    It also asks for a paired comparison between models on the same questions rather than two independent means.
    Braintrust diffs two experiments row by row on matched inputs.
    Bencher alerts on a regression only past a statistical threshold.
    tau-bench reports pass^k, the chance that all of k tries pass, because one lucky run is not reliability.
  decision: |-
    **An analyzer is a checker over every sample.** A suite declares one with `@analyzer` on a function named `analyze_*`.
    It takes one `Analysis` and returns nothing.
    It fails by raising `AssertionError`, and each `expect_*` helper raises one carrying its evidence.
    `@analyzer(cases=[...])` narrows it to some of the suite's cases.

    **An analyzer sees its own suite's records.** Records are matched by the suite's path relative to the project root, the key the scenario store uses.
    Two skills' `eval_main.py` never share an analysis.
    Each finding is named `<suite path>::<analyzer>`, so two suites may each declare `analyze_cost`.

    **The analysis is a layer of its own.** `analyze/` sits below `emit/`, whose `CellMetrics` records it reads, and above `runtime/`.
    A ruff `TID251` rule keeps every layer above it from naming it.
    Its nouns, `Change`, `Direction`, `Estimate`, `Comparison`, `ParetoPoint`, `Finding` and `AnalyzerSpec`, are `model/analysis.py`, so `emit/` can serialise them.
    `report/analysis.json` is `emit/analysis.py`'s `AnalysisReport`.

    **It runs once a sweep ends, on the controller only.** `plugin/analysis.py` implements `pytest_sessionfinish`.
    The suites it analyses are the ones this session graded a live cell of, found from the records because the xdist controller never collects.
    An xdist worker returns at once, or it would race the controller's `analysis.json` mid-sweep.
    The analyzers see the cache's history plus this session's records, each session once.
    A failed analyzer turns an otherwise green session's exit status to failed.
    An analyzer that raises anything but an assertion is broken, not failed.
    It becomes a failed finding whose message starts `ERROR` and names the exception.
    It never becomes an `INTERNALERROR`, so a paid sweep never loses its combine step to it.
    The terminal summary prints one line per finding, with a failure's message beneath it.

    **It reruns for free.** `uv run -m pytest_xharness_eval.analysis <cache>` runs every suite's analyzers over the stored records with nothing current.
    `--suite` narrows it to named suite files, and `--seed` sets the seed every resample draws from.
    It writes `report/analysis.json` and exits 1 when an analyzer failed, so a hill-climbing loop can branch on it.
    The loop is: edit the subject, sweep the cells that matter, ask the CLI what changed.

    **An `Analysis` asks three families of question.**

    | Variable | Methods | Question |
    | --- | --- | --- |
    | the environment | `summarise`, `effects`, `best`, `pareto`, `tiers` | Where does a fixed subject do best, and at what cost? |
    | the subject | `versions`, `compare`, `trend`, `regressions` | Did a new subject version improve or regress, cell by matched cell? |
    | the scenario | `fragile`, `failures` | Which inputs break it, and with what failure? |

    The subject's versions are the `subject_version` values `tracks=` records, in the order they were first measured.
    `effects` is a main effect over balanced slices, and an unbalanced design raises `Unbalanced` rather than averaging over missing cells.
    `tiers` pools a family tier across harnesses, which multiplies the samples behind each answer.
    `pareto` places each group at its pessimistic bounds, so a group earns the front with evidence.

    **The statistics are standard-library, seeded and conservative.** A pass rate's interval is Wilson.
    Any other metric is a percentile bootstrap of its kind's centre.
    A comparison is made only between matched cells, and a scenario whose bytes changed is not matched.
    Each cell is tested two-sided, by Fisher's exact test for a rate or a permutation test otherwise.
    The p-values are Benjamini-Hochberg adjusted together.
    A cell has `improved` or `regressed` only when its q-value is within `1 - confidence` and the bootstrap interval of its difference excludes zero.
    A cell with fewer than `min_n` samples, three by default, on either side is `insufficient`, with no statistics.
    Everything else is `inconclusive`.
    An expectation never passes on zero evidence: a bound asked of no samples fails.
    Every resample takes the analysis seed, so a rerun over the same cache reaches the same numbers.

    **Errors are not attempts.** A sample graded `error` is left out of every pass rate an analyzer reads.
    It is counted by the error rate instead, as the report's Important Metrics count it.

    **An analyzer publishes what it found, pass or fail.** `Analysis.note(key, value)` stores a value on the analyzer's finding.
    It converts an `Estimate` or a `Comparison` to its dict.
    A hill-climbing loop reads the front and the estimates, not just the verdict.

    **A cell may be sampled many times in one sweep.** `--xharness-repeat N` collects every cell N times, as node ids suffixed `#1` to `#N`.
    Each repeat is another sample of the same cell, so its record keys the cell exactly as a single run does.
    At four samples per arm the smallest two-sided p-value is 0.029, and at five it is 0.008.
    Five is the least that leaves room for the correction across cells, and the option's help says so.

    **Two counts earlier records pinned change.** [0039](0039-the-package-listing-is-the-architecture.md) named two entry-point modules at the package root.
    There are now four: `plugin/`, `replay.py`, `promote.py` from [0074](0074-a-case-may-be-a-scenario-and-its-fixtures-may-be-generated.md), and `analysis.py`.
    The layer list gains `analyze/` between `emit/` and `runtime/`.
    [0041](0041-the-vocabulary-is-a-domain-noun-and-the-manifest-is-a-manifest.md) bound seven hooks in the manifest, and `pytest_sessionfinish` makes it eight.
    Every other rule of both records stands.
  consequences: |-
    A question across runs is code in the suite beside the cases it asks about, and it reruns for free.
    A regression in a subject version fails the sweep that measured it.
    An analyzer that breaks reports itself without taking the session down.

    Most first answers are `insufficient` or `inconclusive`, because three samples per arm cannot reach significance.
    Getting a decision costs repeats, and five per cell multiplies a sweep's spend by five.
    Pooling by tier or by harness buys samples at the price of a coarser question.
    The analysis reads every stored record each time, so its cost grows with the cache, though it is never billed.
