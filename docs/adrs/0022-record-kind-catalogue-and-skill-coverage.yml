id: ADR-0022
slug: record-kind-catalogue-and-skill-coverage
plan_id: null
title: A catalogued record kind per log line, and skill file coverage per run
description: colour the kind of information, and measure which skill files a run actually touched
status: accepted
accepted_on: '2026-08-22'
last_changed_on: '2026-08-22'
group: accounting
tags:
- accounting
- grading
lens: |-
  Colour the kind of information, not the information; and measure which paths were taken before arguing about which should have been.
provenance: |-
  A census on 2026-08-22 of 21 logs across claude 2.1.237-2.1.239 and codex 0.148-0.149 found 33 distinct record kinds.
enforced_in:
