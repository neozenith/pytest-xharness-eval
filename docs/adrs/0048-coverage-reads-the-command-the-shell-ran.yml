lens: |-
  Attribution belongs at the last point the name is still written down. A tool call
  records an intention, and an agent is free to express it through a variable, a
  template literal or a wrapper language; the shell's own record of what it ran is
  the one string that has survived every indirection. Read that where the harness
  offers it, and reconstruct only what it does not.
