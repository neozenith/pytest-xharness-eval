id: ADR-0048
slug: coverage-reads-the-command-the-shell-ran
title: Coverage reads the command the shell ran, and expands what only the shell knew
status: accepted
status_note: |-
  accepted, 2026-09-18. Refines
  [0027](0027-coverage-follows-the-shells-working-directory.md) (coverage follows the
  shell's working directory) with the second half of the same problem, and
  [0022](0022-record-kind-catalogue-and-skill-coverage.md) (its detection rule).
  Extends the per-call ledger of
  [0019](0019-per-call-ledger-and-ttl-priced-cache-writes.md) with one field,
  `call.executed`: a new key of `result.json`.
accepted_on: '2026-09-18'
