[build-system]
requires = ["uv_build >= 0.7.19, <0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[project]
requires-python = ">=3.12"
name = "pytest-xharness-eval"
version = "0.5.0"
description = "pytest plugin for running the same evaluation suite across AI agent harnesses (cross-harness eval)."
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [
  {name = "Josh Peak", email = "neozenith.dev@gmail.com"},
]
maintainers = [
  {name = "Josh Peak", email = "neozenith.dev@gmail.com"}
]
classifiers = [
  # How mature is this project? Common values are
  #   3 - Alpha
  #   4 - Beta
  #   5 - Production/Stable
  "Development Status :: 3 - Alpha",

  # Indicate who your project is intended for
  "Intended Audience :: Developers",
  "Framework :: Pytest",
  "Topic :: Software Development :: Testing",

  # Specify the Python versions you support here.
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pytest>=8.3",
]

[project.urls]
Homepage = "https://github.com/neozenith/pytest-xharness-eval"
Documentation = "https://github.com/neozenith/pytest-xharness-eval"
Repository = "https://github.com/neozenith/pytest-xharness-eval.git"
Issues = "https://github.com/neozenith/pytest-xharness-eval/issues"
Changelog = "https://github.com/neozenith/pytest-xharness-eval/releases"

# The pytest11 entry point is what makes this a *plugin*: pytest discovers every
# distribution advertising this group at startup and imports the named module, so
# no conftest.py or `-p` flag is needed by consumers.
[project.entry-points.pytest11]
xharness_eval = "pytest_xharness_eval.plugin"

[dependency-groups]
dev = [
    "isort>=5.13.2",
    "md-toc>=9.0.0",
    "mypy>=1.14.1",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.1",
    "ruff>=0.9.2",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "TCH", # flake8-type-checking
    "C90", # mccabe
    "TID", # flake8-tidy-imports (the harness-boundary fitness function below)
]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Architecture fitness function for ADR 0034. A provider module is reachable only through
# the registry: nothing outside the harness package may name one, or the string-dispatch
# this replaced grows back one import at a time. Adding a harness must stay a one-file job.
# Owner: the maintainer of src/pytest_xharness_eval/harness/. Review by: 2027-08-28 --
# delete this rule if the registry has been abandoned, rather than leaving it to mislead.
"pytest_xharness_eval.harness.claude".msg = "import pytest_xharness_eval.harness and use harness.get(name); ADR 0034"
"pytest_xharness_eval.harness.codex".msg = "import pytest_xharness_eval.harness and use harness.get(name); ADR 0034"
# Architecture fitness function for ADR 0039: the layers only depend downward, and these
# three are the ones with something beneath them to invert. The listed layer may be named
# only by the layers above it, which are named in per-file-ignores below and nowhere else,
# so an import that turns the stack upside down fails `make check` rather than review.
# Owner: the maintainer of src/pytest_xharness_eval/. Review by: 2027-08-28 -- delete these
# rules if the package is flattened again, rather than leaving them to mislead. `verify/`
# joined the stack in ADR 0045, above `derive/` and below `emit/`.
"pytest_xharness_eval.harness".msg = "the adapter layer is above the domain; resolve a harness through model.registry (ADR 0039)"
"pytest_xharness_eval.verify".msg = "verify is above derive, harness and model; a check reads a finished rollout and never helps produce one (ADR 0045)"
"pytest_xharness_eval.emit".msg = "emit is above derive, harness and model; a document must not be named from beneath it (ADR 0039)"
"pytest_xharness_eval.runtime".msg = "runtime is the top layer below the entry points; nothing beneath it may name it (ADR 0039)"

[tool.ruff.lint.per-file-ignores]
# Everything above a banned layer, and nothing else. The two entry points sit at the root
# above every layer (`plugin/` is a package of hook modules, all of them entry-point code,
# ADR 0040); each layer names itself; `model/registry.py` is the one declared edge
# from the domain up to the adapters (ADR 0039); the harness package's own __init__ is what
# registers the providers; and the unit tests exercise each dialect's folding directly.
"src/pytest_xharness_eval/__init__.py" = ["TID251"]
"src/pytest_xharness_eval/plugin/*" = ["TID251"]
"src/pytest_xharness_eval/replay.py" = ["TID251"]
"src/pytest_xharness_eval/model/registry.py" = ["TID251"]
"src/pytest_xharness_eval/harness/*" = ["TID251"]
"src/pytest_xharness_eval/verify/*" = ["TID251"]
"src/pytest_xharness_eval/emit/*" = ["TID251"]
"src/pytest_xharness_eval/runtime/*" = ["TID251"]
"tests/*" = ["TID251"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 120
import_heading_stdlib = "Standard Library"
import_heading_firstparty = "Our Libraries"
import_heading_thirdparty = "Third Party"
known_first_party = ["pytest_xharness_eval"]

[tool.coverage.run]
# pytester spawns in-process pytest sessions; measure the plugin package, not the test harness.
source = ["pytest_xharness_eval"]
branch = true
# pytest-cov >= 7 dropped its own subprocess hook; coverage.py (>= 7.10) patches
# subprocess.Popen so the pytester children started by --runpytest=subprocess
# are measured too (that is where plugin import-time lines actually execute).
patch = ["subprocess"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# --runpytest=subprocess: pytester spawns real interpreters so pytest-cov's .pth hook
# measures plugin import-time code, which an in-process run misses (imported pre-coverage).
addopts = "-vv --color=yes -n auto --runpytest=subprocess --cov --cov-report=html --cov-report=term --cov-report=json --cov-fail-under=90"

[tool.mypy]
pretty = true
exclude = [
  'tests/',
  '.venv/',
]
follow_imports = 'silent'
ignore_missing_imports = true
strict = true
