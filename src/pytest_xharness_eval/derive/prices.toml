# Per-model USD rates per token. The bundled table; a prices.toml at the consuming
# repository's pytest rootdir adds to or overrides these rows (ADR 0006).
# An unpriced model aborts the sweep before any spend; it never prices as zero (ADR 0007).
# Rates sourced from public per-MTok pricing, divided by 1e6. Verify before
# trusting a sweep's absolute USD; relative comparison is robust regardless.
#
# cache_write is the 5-minute TTL rate (1.25x input on Anthropic); cache_write_1h is
# the 1-hour TTL rate (2x input). Claude Code writes 1-hour entries and the log says
# which (ADR 0019). A row that omits cache_write_1h gets cache_write x 1.6.
#
# Verified 2026-09-24 against platform.claude.com/docs/en/about-claude/pricing and
# developers.openai.com/api/docs/pricing (standard tier, short context). OpenAI now
# publishes a cache-write rate (1.25x input) but no 1-hour tier, so every OpenAI row's
# cache_write_1h repeats its cache_write: an assumption, stated, never a zero.
# OpenAI bills prompts past its long-context threshold (272K on gpt-6-sol) at a higher
# rate that this flat table does not model.

["claude-opus-5-5"]
# Released 2026-09-22. Dateless id; the alias is the same string. Cache read is 0.05x
# input, not the usual 0.1x: stated on the pricing page, not derived.
input          = 4.0e-6
output         = 2.0e-5
cache_read     = 2.0e-7
cache_write    = 5.0e-6
cache_write_1h = 8.0e-6

["claude-opus-5"]
input          = 5.0e-6
