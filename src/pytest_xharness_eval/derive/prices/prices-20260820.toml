# One dated price record (ADR 0050). Rates are USD per million tokens, the unit every
# provider publishes; the arithmetic divides by 1e6 once, per tier, at pricing time.
#
# The interval is half-open: a run whose stamp falls on or after `effective_from` and
# before `effective_to` prices from this file. `effective_to` is omitted on the one file
# still in effect. When prices change, set `effective_to` here to the change date and add
# a `prices-YYYYMMDD.toml` whose name and `effective_from` are that same date. A run date
# no file covers stops the sweep; it never prices as zero (ADR 0007).
#
# Rows are grouped by the harness that runs the model: each top-level table is a
# registered harness name, and a project's `xharness_prices` lines name the same pair as
# `<harness>/<model>` (ADR 0050, refining ADR 0030).
#
# cache_write is the 5-minute TTL rate (1.25x input on Anthropic); cache_write_1h is
# the 1-hour TTL rate (2x input). Claude Code writes 1-hour entries and the log says
# which (ADR 0019). A row that omits cache_write_1h gets cache_write x 1.6.
#
# Verified 2026-09-24 against platform.claude.com/docs/en/about-claude/pricing and
# developers.openai.com/api/docs/pricing (standard tier, short context). OpenAI now
# publishes a cache-write rate (1.25x input) but no 1-hour tier, so every OpenAI row's
# cache_write_1h repeats its cache_write: an assumption, stated, never a zero.
# OpenAI bills prompts past its long-context threshold (272K on gpt-6-sol) at a higher
# rate that this flat table does not model.
#
# Backfilled: this is the first dated record, so it reaches back to the plugin's first
# run (ADR 0001, 2026-08-20) rather than leave every earlier capture unreplayable. No
# earlier rate was curated; the rows are the 2026-09-24 verification.
effective_from = 2026-08-20
# Closed when prices-20260929.toml opened; this record is never edited again.
effective_to = 2026-09-29

[claude."claude-opus-5-5"]
# Released 2026-09-22. Dateless id; the alias is the same string. Cache read is 0.05x
# input, not the usual 0.1x: stated on the pricing page, not derived.
input          = 4.00
output         = 20.00
cache_read     = 0.20
cache_write    = 5.00
cache_write_1h = 8.00

[claude."claude-opus-5"]
input          = 5.00
output         = 25.00
cache_read     = 0.50
cache_write    = 6.25
cache_write_1h = 10.00

