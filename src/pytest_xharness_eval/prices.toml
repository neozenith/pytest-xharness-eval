# Per-model USD rates per token. The bundled table; a prices.toml at the consuming
# repository's pytest rootdir adds to or overrides these rows (ADR 0006).
# An unpriced model aborts the sweep before any spend; it never prices as zero (ADR 0007).
# Rates sourced from public per-MTok pricing, divided by 1e6. Verify before
# trusting a sweep's absolute USD; relative comparison is robust regardless.

