name: CICD Checks
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.event.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  basic-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run checks
        run: make check

      - name: Run tests
        run: make test

  adrs:
    # Decision records (ADR 0047, ADR 0054): the generated markdown matches the authored
    # .yml, and every record passes the pinned prose gates. A finding is fixed in the .yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Generated records match their .yml
        run: make adrs-check
      - name: Records pass the prose gates
        run: make adrs-prose

  report-ui:
    # The captured/report.html SPA (ADR 0028): types, lint, format, component tests, and a
    # single-file build. bun is build-time only; the Python package never needs it.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: report-ui
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      # Playwright Component Testing: every component mounted alone in Chromium, fed by
      # ct/fixtures.ts, so it needs no captured cache and runs on every push.
      - run: bunx playwright install --with-deps chromium
      - run: bun run ct
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ct-results
          path: report-ui/test-results/ct
      - run: bun run build
      # The committed asset is the build (ADR 0028); a stale promotion fails here.
      - run: cmp dist/index.html ../src/pytest_xharness_eval/assets/report.html
